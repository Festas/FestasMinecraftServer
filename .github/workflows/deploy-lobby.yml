name: Deploy lobby Server Configs

on:
  push:
    branches: [main]
    paths: ['lobby/**']
  workflow_dispatch:
    inputs:
      replace_folder:
        description: 'Plugin-Ordner komplett ersetzen (z.B. MMOCore) - leer lassen für normalen Deploy'
        required: false
        default: ''

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 2

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Inject Plan DB credentials
        env:
          PLAN_DB_ENV: ${{ secrets.PLAN_DB_ENV }}
        run: |
          if [ -z "$PLAN_DB_ENV" ]; then
            echo "::error::Missing secret PLAN_DB_ENV"
            exit 1
          fi

          set -a
          . <(printf '%s\n' "$PLAN_DB_ENV")
          set +a

          for required in PLAN_DB_HOST PLAN_DB_PORT PLAN_DB_DATABASE PLAN_DB_USER PLAN_DB_PASSWORD; do
            if [ -z "${!required:-}" ]; then
              echo "::error::Missing $required in PLAN_DB_ENV"
              exit 1
            fi
          done

          python3 - <<'PY'
          from pathlib import Path
          import os

          path = Path("lobby/plugins/Plan/config.yml")
          text = path.read_text()
          for key in ("HOST", "PORT", "DATABASE", "USER", "PASSWORD"):
              text = text.replace(f"__PLAN_DB_{key}__", os.environ[f"PLAN_DB_{key}"])
          path.write_text(text)
          PY

      - name: Get Changed Files
        id: changed_files
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            git diff --name-status HEAD~1 HEAD | grep '^[AMD]' | grep '^.\s*lobby/' > /tmp/changed_files.txt || true
            cat /tmp/changed_files.txt
          else
            echo "Manual trigger - will handle in sync step"
          fi

      - name: Sync Changed Files / Replace Folder
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SERVER_PATH: ${{ secrets.SERVER_PATH_LOBBY }} # Endet auf .../plugins
          REPLACE_FOLDER: ${{ github.event.inputs.replace_folder }}
        run: |
          # Input validation: only allow alphanumeric, hyphens, underscores, and dots
          if [ -n "$REPLACE_FOLDER" ]; then
            if ! echo "$REPLACE_FOLDER" | grep -qE '^[A-Za-z0-9._-]+$'; then
              echo "::error::Invalid folder name: $REPLACE_FOLDER (only alphanumeric, dots, hyphens, underscores allowed)"
              exit 1
            fi
          fi

          EXCLUDE_ARGS=(
            --exclude='*.db' --exclude='*.sqlite' --exclude='*.log'
            --exclude='*.zip' --exclude='*.tar.gz'
            --exclude='playerdata/' --exclude='data/' --exclude='cache/'
            --exclude='.git*'
            --exclude='world/' --exclude='world_nether/' --exclude='world_the_end/'
          )

          if [ -n "$REPLACE_FOLDER" ]; then
            # --- Modus: Ganzen Ordner ersetzen ---
            echo "Replacing folder: $REPLACE_FOLDER"

            if [ ! -d "lobby/plugins/$REPLACE_FOLDER" ]; then
              echo "Error: Folder lobby/plugins/$REPLACE_FOLDER does not exist in repository"
              exit 1
            fi

            ssh -n -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" "rm -rf '$SERVER_PATH/$REPLACE_FOLDER'"

            rsync -avz -e 'ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new' "${EXCLUDE_ARGS[@]}" --delete "lobby/plugins/$REPLACE_FOLDER/" "$SSH_USER@$SSH_HOST:$SERVER_PATH/$REPLACE_FOLDER/"

            echo "Folder $REPLACE_FOLDER replaced successfully"
          else
            # --- Modus: Sync Changed Files ---
            echo "Syncing changed files..."

            if [ "${{ github.event_name }}" = "push" ]; then
              if [ -f /tmp/changed_files.txt ] && [ -s /tmp/changed_files.txt ]; then
                while IFS=$'\t' read -r status file; do
                  # file ist z.B. "lobby/plugins/Ordner/Config.yml"

                  # Berechne den Pfad für den Server (entferne 'lobby/plugins/')
                  # Da SERVER_PATH schon im plugins-Ordner ist, brauchen wir nur "Ordner/Config.yml"
                  if [[ "$file" == lobby/plugins/* ]]; then
                    remote_relative_file="${file#lobby/plugins/}"
                  else
                    # Fallback falls Datei direkt in lobby/ liegt (z.B. lobby/readme.txt)
                    remote_relative_file="${file#lobby/}"
                  fi

                  # Excludes prüfen (auf Basis des Dateinamens)
                  if echo "$remote_relative_file" | grep -qE '\.(db|sqlite|log)$|^(playerdata|data|cache)/|^\.git'; then
                    echo "Skipping excluded file: $remote_relative_file"
                    continue
                  fi

                  if [ "$status" = "D" ]; then
                    echo "Deleting: $remote_relative_file"
                    ssh -n -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new $SSH_USER@$SSH_HOST "rm -f $SERVER_PATH/$remote_relative_file"
                  else
                    echo "Uploading: $remote_relative_file"
                    
                    dir_path=$(dirname "$remote_relative_file")
                    if [ "$dir_path" != "." ]; then
                      ssh -n -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new $SSH_USER@$SSH_HOST "mkdir -p $SERVER_PATH/$dir_path"
                    fi
                    
                    # Nutze $file (lokaler voller Pfad) -> $SERVER_PATH/$remote_relative_file (Server Pfad ohne doppeltes plugins/)
                    scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$file" "$SSH_USER@$SSH_HOST:$SERVER_PATH/$remote_relative_file" < /dev/null
                  fi
                done < /tmp/changed_files.txt
                echo "Sync completed successfully"
              else
                echo "No files changed in lobby/"
              fi
            else
              # --- Manueller Full Sync ---
              echo "Manual sync: uploading all files..."
              # WICHTIG: Hier auch lobby/plugins/ als Quelle nutzen, nicht lobby/
              # Sonst wird der Ordner 'plugins' in den Ordner 'plugins' kopiert -> plugins/plugins
              rsync -avz -e 'ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new' "${EXCLUDE_ARGS[@]}" --delete "lobby/plugins/" "$SSH_USER@$SSH_HOST:$SERVER_PATH/"
              echo "Full sync completed successfully"
            fi
          fi

      - name: Verify Deployment
        if: success()
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SERVER_PATH: ${{ secrets.SERVER_PATH_LOBBY }}
        run: |
          echo "🔍 Verifiziere Deployment..."
          FILE_COUNT=$(ssh -n -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new $SSH_USER@$SSH_HOST "find $SERVER_PATH -name '*.yml' -type f | wc -l")
          echo "📊 $FILE_COUNT Konfigurationsdateien auf dem Server gefunden."
          if [ "$FILE_COUNT" -lt 1 ]; then
            echo "::error::Keine Konfigurationsdateien auf dem Server gefunden! Deployment möglicherweise fehlgeschlagen."
            exit 1
          fi
          echo "✅ Deployment verifiziert."
