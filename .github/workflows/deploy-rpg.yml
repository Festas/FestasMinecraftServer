                  yaml_dq(data[f"XPRISON_DASHBOARD_{key}"])
              )
          path.write_text(text)
          PY

      - name: Inject Plan DB credentials
        env:
          PLAN_DB_ENV: ${{ secrets.PLAN_DB_ENV }}
        run: |
          python3 - <<'PY'
          import os
          import sys
          from pathlib import Path

          # Parse the .env-style secret in Python instead of sourcing it in the
          # shell. "set -a; . <(...)" makes bash interpret $, backticks, \, quotes
          # and spaces in the values, which silently corrupts any password that
          # contains them and breaks the Plan MySQL login ("Access denied"). Here
          # the values are read verbatim; a single layer of surrounding single or
          # double quotes is stripped so both documented secret formats work.
          def parse_env(raw):
              data = {}
              for line in raw.splitlines():
                  line = line.strip()
                  if not line or line.startswith("#") or "=" not in line:
                      continue
                  key, _, value = line.partition("=")
                  key = key.strip()
                  value = value.strip()
                  if len(value) >= 2 and value[0] == value[-1] and value[0] in "\"'":
                      value = value[1:-1]
                  data[key] = value
              return data

          raw = os.environ.get("PLAN_DB_ENV", "")
          if not raw.strip():
              print("::error::Missing secret PLAN_DB_ENV")
              sys.exit(1)

          data = parse_env(raw)
          keys = ("HOST", "PORT", "DATABASE", "USER", "PASSWORD")
          missing = [f"PLAN_DB_{key}" for key in keys if not data.get(f"PLAN_DB_{key}")]
          if missing:
              print(f"::error::Missing {', '.join(missing)} in PLAN_DB_ENV")
              sys.exit(1)

          def yaml_dq(value):
              # Escape for the double-quoted YAML scalar: Password: "__...__".
              return (
                  value.replace("\\", "\\\\")
                  .replace("\n", "\\n")
                  .replace("\r", "\\r")
                  .replace("\t", "\\t")
                  .replace('"', '\\"')
              )

          path = Path("rpg/plugins/Plan/config.yml")
          text = path.read_text()
          for key in keys:
              value = data[f"PLAN_DB_{key}"]
              if key == "PASSWORD":
                  value = yaml_dq(value)
              text = text.replace(f"__PLAN_DB_{key}__", value)
          path.write_text(text)
          print("Injected Plan DB credentials into rpg/plugins/Plan/config.yml")
          PY

      - name: Inject CMI DB credentials
        env:
          CMI_MINING_DB_ENV: ${{ secrets.CMI_MINING_DB_ENV }}
        run: |
          python3 - <<'PY'
          import os
          import sys
          from pathlib import Path

          # Parse the .env-style secret in Python instead of sourcing it in the
          # shell. "set -a; . <(...)" makes bash interpret $, backticks, \, quotes
          # and spaces in the values, which silently corrupts any password that
          # contains them and breaks the CMI MySQL login. Here the values are read
          # verbatim; a single layer of surrounding single or double quotes is
          # stripped so both documented secret formats work.
          def parse_env(raw):
              data = {}
              for line in raw.splitlines():
                  line = line.strip()
                  if not line or line.startswith("#") or "=" not in line:
                      continue
                  key, _, value = line.partition("=")
                  key = key.strip()
                  value = value.strip()
                  if len(value) >= 2 and value[0] == value[-1] and value[0] in "\"'":
                      value = value[1:-1]
                  data[key] = value
              return data

          raw = os.environ.get("CMI_MINING_DB_ENV", "")
          if not raw.strip():
              print("::error::Missing secret CMI_MINING_DB_ENV")
              sys.exit(1)

          data = parse_env(raw)
          keys = ("USER", "PASSWORD")
          missing = [f"CMI_MINING_DB_{key}" for key in keys if not data.get(f"CMI_MINING_DB_{key}")]
          if missing:
              print(f"::error::Missing {', '.join(missing)} in CMI_MINING_DB_ENV")
              sys.exit(1)

          def yaml_sq(value):
              # Escape for the single-quoted YAML scalar: username: '__...__'.
              return value.replace("'", "''")

          path = Path("rpg/plugins/CMI/Settings/DataBaseInfo.yml")
          text = path.read_text()
          for key in keys:
              text = text.replace(f"__CMI_MINING_DB_{key}__", yaml_sq(data[f"CMI_MINING_DB_{key}"]))
          path.write_text(text)
          print("Injected CMI DB credentials into rpg/plugins/CMI/Settings/DataBaseInfo.yml")
          PY

      - name: Get Changed Files
        id: changed_files
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            git diff --name-status HEAD~1 HEAD | grep '^[AMD]' | grep '^.\s*rpg/' > /tmp/changed_files.txt || true
            cat /tmp/changed_files.txt
          else
            echo "Manual trigger - will handle in sync step"
          fi

      - name: Sync Changed Files / Replace Folder
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SERVER_PATH: ${{ secrets.SERVER_PATH_RPG }} # Endet auf .../plugins
          REPLACE_FOLDER: ${{ github.event.inputs.replace_folder }}
        run: |
          # Input validation: reject path traversal and only allow a single safe
          # folder name (must start with an alphanumeric/underscore; no '/', no '..',
          # no leading '.' or '-'). This prevents REPLACE_FOLDER values like '.' or
          # '..' from escaping the plugins directory in the paths used below.
          if [ -n "$REPLACE_FOLDER" ]; then
            case "$REPLACE_FOLDER" in
              */*|.|..)
                echo "::error::Invalid folder name: $REPLACE_FOLDER (path traversal is not allowed)"
                exit 1
                ;;
            esac
            if ! printf '%s' "$REPLACE_FOLDER" | grep -qE '^[A-Za-z0-9_][A-Za-z0-9._-]*$'; then
              echo "::error::Invalid folder name: $REPLACE_FOLDER (only alphanumeric, dots, hyphens, underscores allowed; must not start with '.' or '-')"
              exit 1
            fi
          fi

          EXCLUDE_ARGS=(
            --exclude='*.jar' --exclude='*.jar.disabled'
            --exclude='*.db' --exclude='*.sqlite' --exclude='*.log'
            --exclude='*.zip' --exclude='*.tar.gz'
            --exclude='*.pem' --exclude='*.key' --exclude='*.secret'
            --exclude='playerdata/' --exclude='data/' --exclude='cache/'
            --exclude='.git*'
            --exclude='world/' --exclude='world_nether/' --exclude='world_the_end/'
          )

          if [ -n "$REPLACE_FOLDER" ]; then
            # --- Modus: Einzelnen Ordner gezielt hochladen/überschreiben ---
            # WICHTIG: Es werden ausschließlich die im Repo vorhandenen Dateien
            # hochgeladen/überschrieben. KEIN 'rm -rf' und KEIN '--delete', damit auf
            # dem Server liegende (nicht im Repo vorhandene) Dateien/Ordner sowie
            # Plugin-JARs niemals gelöscht werden.
            echo "Uploading folder: $REPLACE_FOLDER"

            if [ ! -d "rpg/plugins/$REPLACE_FOLDER" ]; then
              echo "Error: Folder rpg/plugins/$REPLACE_FOLDER does not exist in repository"
              exit 1
            fi

            rsync -avz -e 'ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new' "${EXCLUDE_ARGS[@]}" --backup --backup-dir="/tmp/festas-rsync-backup-$(date +%Y%m%d-%H%M%S)" "rpg/plugins/$REPLACE_FOLDER/" "$SSH_USER@$SSH_HOST:$SERVER_PATH/$REPLACE_FOLDER/"

            echo "Folder $REPLACE_FOLDER uploaded successfully (no server files deleted)"
          else
            # --- Modus: Sync Changed Files ---
            echo "Syncing changed files..."

            if [ "${{ github.event_name }}" = "push" ]; then
              if [ -f /tmp/changed_files.txt ] && [ -s /tmp/changed_files.txt ]; then
                while IFS=$'\t' read -r status file; do
                  # file ist z.B. "rpg/plugins/Ordner/Config.yml"

                  # Berechne den Pfad für den Server (entferne 'rpg/plugins/')
                  # Da SERVER_PATH schon im plugins-Ordner ist, brauchen wir nur "Ordner/Config.yml"
                  if [[ "$file" == rpg/plugins/* ]]; then
                    remote_relative_file="${file#rpg/plugins/}"
                  else
                    # Fallback falls Datei direkt in rpg/ liegt (z.B. rpg/readme.txt)
                    remote_relative_file="${file#rpg/}"
                  fi

                  # Excludes prüfen (auf Basis des Dateinamens)
                  if echo "$remote_relative_file" | grep -qE '\.(db|sqlite|log|pem|key|secret|jar)$|\.jar\.disabled$|^(playerdata|data|cache)/|^\.git'; then
                    echo "Skipping excluded file: $remote_relative_file"
                    continue
                  fi

                  if [ "$status" = "D" ]; then
                    # Aus Sicherheitsgründen werden Dateien auf dem Server NICHT
                    # automatisch gelöscht. Die Richtung repo -> server ist rein
                    # additiv (nur Hochladen/Überschreiben). Im Repo entfernte
                    # Dateien müssen bei Bedarf manuell auf dem Server entfernt
                    # werden - so kann ein versehentliches Entfernen im Repo keine
                    # Server-Dateien (z.B. Plugin-Daten) zerstören.
                    echo "::warning::$remote_relative_file wurde im Repo gelöscht - auf dem Server bleibt die Datei erhalten (keine automatische Löschung)."
                  else
                    echo "Uploading: $remote_relative_file"
                    
                    dir_path=$(dirname "$remote_relative_file")
                    if [ "$dir_path" != "." ]; then
                      ssh -n -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" "mkdir -p '$SERVER_PATH/$dir_path'"
                    fi
                    
                    # Nutze $file (lokaler voller Pfad) -> $SERVER_PATH/$remote_relative_file (Server Pfad ohne doppeltes plugins/)
                    scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$file" "$SSH_USER@$SSH_HOST:$SERVER_PATH/$remote_relative_file" < /dev/null
                  fi
                done < /tmp/changed_files.txt
                echo "Sync completed successfully"
              else
                echo "No files changed in rpg/"
              fi
            else
              # --- Manueller Full Sync ---
              echo "Manual sync: uploading all files..."
              # WICHTIG: Hier auch rpg/plugins/ als Quelle nutzen, nicht rpg/
              # Sonst wird der Ordner 'plugins' in den Ordner 'plugins' kopiert -> plugins/plugins
              # WICHTIG: KEIN '--delete'! Es werden ausschließlich die im Repo
              # vorhandenen Dateien hochgeladen/überschrieben. Auf dem Server
              # liegende (nicht im Repo vorhandene) Dateien/Ordner - insbesondere
              # Plugin-JARs - bleiben unangetastet.
              rsync -avz -e 'ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new' "${EXCLUDE_ARGS[@]}" --backup --backup-dir="/tmp/festas-rsync-backup-$(date +%Y%m%d-%H%M%S)" "rpg/plugins/" "$SSH_USER@$SSH_HOST:$SERVER_PATH/"
              echo "Full sync completed successfully (no server files deleted)"
            fi
          fi

      - name: Verify Deployment
        if: success()
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SERVER_PATH: ${{ secrets.SERVER_PATH_RPG }}
        run: |
          echo "🔍 Verifiziere Deployment..."
          FILE_COUNT=$(ssh -n -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" "find '$SERVER_PATH' -name '*.yml' -type f | wc -l")
          echo "📊 $FILE_COUNT Konfigurationsdateien auf dem Server gefunden."
          if [ "$FILE_COUNT" -lt 1 ]; then
            echo "::error::Keine Konfigurationsdateien auf dem Server gefunden! Deployment möglicherweise fehlgeschlagen."
            exit 1
          fi
          echo "✅ Deployment verifiziert."
