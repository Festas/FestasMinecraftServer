name: Deploy rpg Server Configs

on:
  push:
    branches: [main]
    paths: ['rpg/plugins/**']
  workflow_dispatch:
    inputs:
      replace_folder:
        description: 'Einzelnen Plugin-Ordner gezielt hochladen/überschreiben (z.B. MMOCore) - leer lassen für normalen Deploy. Es werden NIE Dateien auf dem Server gelöscht.'
        required: false
        default: ''

concurrency:
  group: deploy-rpg
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 2

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Inject LuckPerms DB credentials
        env:
          LUCKPERMS_DB_ENV: ${{ secrets.LUCKPERMS_DB_ENV }}
        run: |
          python3 - <<'PY'
          import os
          import sys
          from pathlib import Path

          def parse_env(raw):
              data = {}
              for line in raw.splitlines():
                  line = line.strip()
                  if not line or line.startswith("#") or "=" not in line:
                      continue
                  key, _, value = line.partition("=")
                  key = key.strip()
                  value = value.strip()
                  if len(value) >= 2 and value[0] == value[-1] and value[0] in "\"'":
                      value = value[1:-1]
                  data[key] = value
              return data

          raw = os.environ.get("LUCKPERMS_DB_ENV", "")
          if not raw.strip():
              print("::error::Missing secret LUCKPERMS_DB_ENV")
              sys.exit(1)

          data = parse_env(raw)
          keys = ("ADDRESS", "DATABASE", "USER", "PASSWORD")
          missing = [f"LUCKPERMS_DB_{key}" for key in keys if not data.get(f"LUCKPERMS_DB_{key}")]
          if missing:
              print(f"::error::Missing {', '.join(missing)} in LUCKPERMS_DB_ENV")
              sys.exit(1)

          def yaml_dq(value):
              return (
                  value.replace("\\", "\\\\")
                  .replace("\n", "\\n")
                  .replace("\r", "\\r")
                  .replace("\t", "\\t")
                  .replace('"', '\\"')
              )

          path = Path("rpg/plugins/LuckPerms/config.yml")
          text = path.read_text()
          for key in keys:
              value = yaml_dq(data[f"LUCKPERMS_DB_{key}"])
              text = text.replace(f"__LUCKPERMS_DB_{key}__", value)
          path.write_text(text)
          PY

      - name: Inject Redis credentials
        env:
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
        run: |
          if [ -z "$REDIS_PASSWORD" ]; then
            echo "::error::Missing secret REDIS_PASSWORD"
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import os

          path = Path("rpg/plugins/LuckPerms/config.yml")
          text = path.read_text()
          text = text.replace("__REDIS_PASSWORD__", os.environ["REDIS_PASSWORD"])
          path.write_text(text)
          PY

      - name: Inject XPrivateMines Dashboard credentials
        env:
          XPRIVATEMINES_DASHBOARD_ENV: ${{ secrets.XPRIVATEMINES_DASHBOARD_ENV }}
        run: |
          python3 - <<'PY'
          import os
          import sys
          from pathlib import Path

          def parse_env(raw):
              data = {}
              for line in raw.splitlines():
                  line = line.strip()
                  if not line or line.startswith("#") or "=" not in line:
                      continue
                  key, _, value = line.partition("=")
                  key = key.strip()
                  value = value.strip()
                  if len(value) >= 2 and value[0] == value[-1] and value[0] in "\"'":
                      value = value[1:-1]
                  data[key] = value
              return data

          raw = os.environ.get("XPRIVATEMINES_DASHBOARD_ENV", "")
