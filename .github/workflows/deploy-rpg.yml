              print("::error::Missing secret XPRIVATEMINES_DASHBOARD_ENV")
              sys.exit(1)

          data = parse_env(raw)
          keys = ("USER", "PASSWORD", "JWT_SECRET")
          missing = [f"XPRIVATEMINES_DASHBOARD_{key}" for key in keys if not data.get(f"XPRIVATEMINES_DASHBOARD_{key}")]
          if missing:
              print(f"::error::Missing {', '.join(missing)} in XPRIVATEMINES_DASHBOARD_ENV")
              sys.exit(1)

          def yaml_dq(value):
              return (
                  value.replace("\\", "\\\\")
                  .replace("\n", "\\n")
