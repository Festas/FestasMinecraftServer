                  .replace("\t", "\\t")
                  .replace('"', '\\"')
              )

          path = Path("rpg/plugins/XPrivateMines/addons/Dashboard/config.yml")
          text = path.read_text()
          for key in keys:
              text = text.replace(
                  f"__XPRIVATEMINES_DASHBOARD_{key}__",
                  yaml_dq(data[f"XPRIVATEMINES_DASHBOARD_{key}"])
              )
          path.write_text(text)
          PY

      - name: Inject X-Prison Dashboard credentials
        env:
          XPRISON_DASHBOARD_ENV: ${{ secrets.XPRISON_DASHBOARD_ENV }}
        run: |
          python3 - <<'PY'
          import os
          import sys
          from pathlib import Path

          def parse_env(raw):
              data = {}
              for line in raw.splitlines():
                  line = line.strip()
                  if not line or line.startswith("#") or "=" not in line:
