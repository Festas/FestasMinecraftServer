name: Deploy Nginx Configs

on:
  push:
    branches: [main]
    paths:
      - 'nginx/**'
      - '.github/workflows/deploy-nginx-configs.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Nginx configs to Hetzner
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy Nginx configs to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "nginx/sites-available/*.conf,nginx/snippets/*.conf"
          target: "/tmp/nginx-deploy"
          strip_components: 0

      - name: Deploy Nginx configs on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: false
          script: |
            set -euo pipefail
            trap 'rc=$?; echo "✗ ERROR (exit=$rc) at line ${LINENO}: ${BASH_COMMAND}" >&2; exit "$rc"' ERR

            echo "=========================================="
            echo "Deploying Nginx configurations"
            echo "=========================================="

            # -- 1. Ensure dedicated per-subdomain TLS certificates exist --
            # Some vhosts (e.g. survival./mining.festas-builds.com) use their OWN
            # Let's Encrypt certificate whose lineage name equals the hostname, so the
            # served certificate always matches the domain. Without a matching cert the
            # browser reports NET::ERR_CERT_COMMON_NAME_INVALID and iframe embeds of the
            # BlueMap live maps fail with "Verbindung abgelehnt". This provisions any such
            # certificate that is still missing, via the HTTP-01 webroot challenge (served
            # from /var/www/certbot by the acme-challenge snippet). It never touches the
            # shared festas-builds.com certificate used by mc./mc-stats. and is fully
            # non-fatal: a failure here must not block the Nginx reload below (the vhost is
            # then skipped by the cert-presence check in step 2 and retried next deploy).
            echo "[1/3] Ensuring dedicated per-subdomain TLS certificates..."

            provision_dedicated_certs() {
              if ! command -v certbot >/dev/null 2>&1; then
                echo "  ⚠ certbot not found — skipping automatic certificate provisioning"
                return 0
              fi
              if [[ ! -d "/tmp/nginx-deploy/nginx/sites-available" ]]; then
                echo "  ⚠ No deployed vhosts found — skipping"
                return 0
              fi

              shopt -s nullglob
              for conf in /tmp/nginx-deploy/nginx/sites-available/*.festas-builds.com.conf; do
                [[ -e "$conf" ]] || continue

                # server_name hostnames declared in this vhost
                names=$(grep -E '^[[:space:]]*server_name[[:space:]]+' "$conf" \
                  | sed -E 's/^[[:space:]]*server_name[[:space:]]+//; s/;[[:space:]]*$//' \
                  | tr ' ' '\n' | sed '/^[[:space:]]*$/d' | sort -u || true)
                [[ -n "$names" ]] || continue

                # Certbot lineage(s) referenced via ssl_certificate .../live/<lineage>/...
                lineages=$(grep -E '^[[:space:]]*ssl_certificate[[:space:]]+' "$conf" \
                  | awk '{print $2}' | tr -d ';' \
                  | sed -nE 's#.*/live/([^/]+)/.*#\1#p' | sort -u || true)
                [[ -n "$lineages" ]] || continue

                while IFS= read -r lineage; do
                  [[ -n "$lineage" ]] || continue

                  # Only manage DEDICATED certificates: the lineage name must itself be
                  # one of this vhost's server_names. This deliberately skips vhosts that
                  # share the umbrella festas-builds.com certificate (mc./mc-stats.),
                  # which is provisioned elsewhere and must never be modified here.
                  if ! grep -qxF "$lineage" <<< "$names"; then
                    continue
                  fi

                  if sudo test -f "/etc/letsencrypt/live/$lineage/fullchain.pem"; then
                    echo "  ✓ Certificate '$lineage' already present — skipping"
                    continue
                  fi

                  # Request exactly the dedicated hostname (== lineage == cert-name). By
                  # convention each BlueMap subdomain has its own single-host vhost/cert,
                  # so we deliberately do NOT pull in the vhost's other server_names (e.g.
                  # a port-80 redirect alias) as additional SANs.
                  echo "  → Obtaining certificate '$lineage' via webroot..."
                  if sudo certbot certonly --webroot -w /var/www/certbot \
                       --cert-name "$lineage" -d "$lineage" \
                       --non-interactive --agree-tos --keep-until-expiring \
                       --deploy-hook "systemctl reload nginx"; then
                    echo "  ✓ Certificate '$lineage' obtained"
                  else
                    echo "  ⚠ Could not obtain certificate '$lineage' — the vhost will be"
                    echo "    skipped below and retried on the next deploy"
                  fi
                done <<< "$lineages"
              done
              return 0
            }

            # Never let certificate provisioning abort the deploy (set -e is intentionally
            # suppressed for the function body by the "|| true" context).
            provision_dedicated_certs || true

            # -- 2. Deploy configs --
            echo "[2/3] Deploying Nginx configurations..."

            if [[ -d "/tmp/nginx-deploy/nginx/sites-available" ]]; then
              echo "  → Copying sites-available configs..."
              sudo cp /tmp/nginx-deploy/nginx/sites-available/*.conf /etc/nginx/sites-available/

              echo "  → Installing acme-challenge snippet..."
              sudo install -d -o root -g root -m 0755 /etc/nginx/snippets
              sudo install -o root -g root -m 0644 \
                /tmp/nginx-deploy/nginx/snippets/acme-challenge.conf \
                /etc/nginx/snippets/acme-challenge.conf

              echo "  → Enabling/skipping vhosts based on SSL cert presence..."
              ENABLED_COUNT=0
              SKIPPED_COUNT=0
              shopt -s nullglob
              for conf in /etc/nginx/sites-available/festas-builds.com.conf /etc/nginx/sites-available/*.festas-builds.com.conf; do
                [[ -e "$conf" ]] || continue
                confname=$(basename "$conf")

                cert_paths=$(grep -E '^[[:space:]]*ssl_certificate[[:space:]]+' "$conf" | awk '{print $2}' | tr -d ';' | sort -u || true)
                if [[ -z "$cert_paths" ]]; then
                  sudo ln -sf "../sites-available/$confname" "/etc/nginx/sites-enabled/$confname"
                  ENABLED_COUNT=$((ENABLED_COUNT + 1))
                  continue
                fi

                missing=0
                while IFS= read -r p; do
                  [[ -n "$p" ]] || continue
                  if ! sudo test -f "$p"; then
                    echo "  ⚠ $confname references missing cert: $p"
                    missing=1
                  fi
                done <<< "$cert_paths"

                if [[ "$missing" -eq 1 ]]; then
                  echo "  ⚠ Skipping $confname — SSL certificate file not found"
                  sudo rm -f "/etc/nginx/sites-enabled/$confname"
                  SKIPPED_COUNT=$((SKIPPED_COUNT + 1))
                else
                  sudo ln -sf "../sites-available/$confname" "/etc/nginx/sites-enabled/$confname"
                  ENABLED_COUNT=$((ENABLED_COUNT + 1))
                fi
              done

              echo "✓ Nginx configs deployed ($ENABLED_COUNT enabled, $SKIPPED_COUNT skipped)"
            else
              echo "⚠ No Nginx configs found — skipping"
            fi

            rm -rf /tmp/nginx-deploy

            # -- 3. Test and reload Nginx --
            echo "[3/3] Reloading Nginx..."

            if sudo nginx -t 2>&1; then
              if sudo systemctl reload nginx; then
                echo "✓ Nginx reloaded successfully"
              else
                echo "✗ Nginx reload failed despite successful config test"
                sudo systemctl status nginx --no-pager || true
                sudo journalctl -u nginx --no-pager -n 50 || true
                exit 1
              fi
            else
              echo "⚠ Nginx config invalid — attempting to disable sites with missing SSL certs..."
              shopt -s nullglob
              for conf in /etc/nginx/sites-enabled/*.conf; do
                confname=$(basename "$conf")
                cert_paths=$(grep -E '^[[:space:]]*ssl_certificate[[:space:]]+' "$conf" | awk '{print $2}' | tr -d ';' | sort -u || true)
                [[ -z "$cert_paths" ]] && continue

                missing=0
                while IFS= read -r p; do
                  [[ -n "$p" ]] || continue
                  if ! sudo test -f "$p"; then
                    echo "  ⚠ $confname references missing cert: $p"
                    missing=1
                  fi
                done <<< "$cert_paths"

                if [[ "$missing" -eq 1 ]]; then
                  echo "  Disabling $confname (missing SSL cert)"
                  sudo rm -f "/etc/nginx/sites-enabled/$confname"
                fi
              done

              if sudo nginx -t 2>&1; then
                sudo systemctl reload nginx
                echo "✓ Nginx reloaded (some sites disabled due to missing SSL certs)"
              else
                sudo nginx -t || true
                exit 1
              fi
            fi

            echo ""
            echo "=========================================="
            echo "Nginx deployment complete!"
            echo "=========================================="

      - name: Show failure logs
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "=== Nginx Status ==="
            sudo systemctl status nginx || true
            echo ""
            echo "=== Nginx Config Test ==="
            sudo nginx -t || true
            echo ""
            echo "=== Nginx Error Log ==="
            sudo tail -30 /var/log/nginx/error.log || true
            echo ""
            echo "=== Nginx Journal (latest 80) ==="
            sudo journalctl -u nginx --no-pager -n 80 || true
