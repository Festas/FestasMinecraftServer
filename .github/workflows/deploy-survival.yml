name: Deploy survival Server Configs

on:
  push:
    branches: [main]
    paths: ['survival/plugins/**']
  workflow_dispatch:
    inputs:
      replace_folder:
        description: 'Plugin-Ordner komplett ersetzen (z.B. MMOCore) - leer lassen für normalen Deploy'
        required: false
        default: ''

concurrency:
  group: deploy-survival
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 2

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Inject LuckPerms DB credentials
        env:
          LUCKPERMS_DB_ENV: ${{ secrets.LUCKPERMS_DB_ENV }}
        run: |
          if [ -z "$LUCKPERMS_DB_ENV" ]; then
            echo "::error::Missing secret LUCKPERMS_DB_ENV"
            exit 1
          fi

          set -a
          . <(printf '%s\n' "$LUCKPERMS_DB_ENV")
          set +a

          for required in LUCKPERMS_DB_ADDRESS LUCKPERMS_DB_DATABASE LUCKPERMS_DB_USER LUCKPERMS_DB_PASSWORD; do
            if [ -z "${!required:-}" ]; then
              echo "::error::Missing $required in LUCKPERMS_DB_ENV"
              exit 1
            fi
          done

          python3 - <<'PY'
          from pathlib import Path
          import os

          path = Path("survival/plugins/LuckPerms/config.yml")
          text = path.read_text()
          for key in ("ADDRESS", "DATABASE", "USER", "PASSWORD"):
              text = text.replace(f"__LUCKPERMS_DB_{key}__", os.environ[f"LUCKPERMS_DB_{key}"])
          path.write_text(text)
          PY

      - name: Inject Redis credentials
        env:
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
        run: |
          if [ -z "$REDIS_PASSWORD" ]; then
            echo "::error::Missing secret REDIS_PASSWORD"
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import os

          path = Path("survival/plugins/LuckPerms/config.yml")
          text = path.read_text()
          text = text.replace("__REDIS_PASSWORD__", os.environ["REDIS_PASSWORD"])
          path.write_text(text)
          PY

      - name: Inject Plan DB credentials
        env:
          PLAN_DB_ENV: ${{ secrets.PLAN_DB_ENV }}
        run: |
          if [ -z "$PLAN_DB_ENV" ]; then
            echo "::error::Missing secret PLAN_DB_ENV"
            exit 1
          fi

          set -a
          . <(printf '%s\n' "$PLAN_DB_ENV")
          set +a

          for required in PLAN_DB_HOST PLAN_DB_PORT PLAN_DB_DATABASE PLAN_DB_USER PLAN_DB_PASSWORD; do
            if [ -z "${!required:-}" ]; then
              echo "::error::Missing $required in PLAN_DB_ENV"
              exit 1
            fi
          done

          python3 - <<'PY'
          from pathlib import Path
          import os

          path = Path("survival/plugins/Plan/config.yml")
          text = path.read_text()
          for key in ("HOST", "PORT", "DATABASE", "USER", "PASSWORD"):
              text = text.replace(f"__PLAN_DB_{key}__", os.environ[f"PLAN_DB_{key}"])
          path.write_text(text)
          PY

      - name: Get Changed Files
        id: changed_files
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            git diff --name-status HEAD~1 HEAD | grep '^[AMD]' | grep '^.\s*survival/' > /tmp/changed_files.txt || true
            cat /tmp/changed_files.txt
          else
            echo "Manual trigger - will handle in sync step"
          fi

      - name: Sync Changed Files / Replace Folder
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SERVER_PATH: ${{ secrets.SERVER_PATH_SURVIVAL }} # Endet auf .../plugins
          REPLACE_FOLDER: ${{ github.event.inputs.replace_folder }}
        run: |
          # Input validation: only allow alphanumeric, hyphens, underscores, and dots
          if [ -n "$REPLACE_FOLDER" ]; then
            if ! echo "$REPLACE_FOLDER" | grep -qE '^[A-Za-z0-9._-]+$'; then
              echo "::error::Invalid folder name: $REPLACE_FOLDER (only alphanumeric, dots, hyphens, underscores allowed)"
              exit 1
            fi
          fi

          EXCLUDE_ARGS=(
            --exclude='*.db' --exclude='*.sqlite' --exclude='*.log'
            --exclude='*.zip' --exclude='*.tar.gz'
            --exclude='*.pem' --exclude='*.key' --exclude='*.secret'
            --exclude='playerdata/' --exclude='data/' --exclude='cache/'
            --exclude='.git*'
            --exclude='world/' --exclude='world_nether/' --exclude='world_the_end/'
          )

          DEPLOY_BASE_PATH="$(dirname "$SERVER_PATH")"

          if [ -n "$REPLACE_FOLDER" ]; then
            # --- Modus: Ganzen Ordner ersetzen ---
            echo "Replacing folder: $REPLACE_FOLDER"

            if [ ! -d "survival/plugins/$REPLACE_FOLDER" ]; then
              echo "Error: Folder survival/plugins/$REPLACE_FOLDER does not exist in repository"
              exit 1
            fi

            ssh -n -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" "rm -rf '$DEPLOY_BASE_PATH/plugins/$REPLACE_FOLDER'"

            rsync -avz -e 'ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new' "${EXCLUDE_ARGS[@]}" --backup --backup-dir="/tmp/festas-rsync-backup-$(date +%Y%m%d-%H%M%S)" --delete "survival/plugins/$REPLACE_FOLDER/" "$SSH_USER@$SSH_HOST:$DEPLOY_BASE_PATH/plugins/$REPLACE_FOLDER/"

            echo "Folder $REPLACE_FOLDER replaced successfully"
          else
            # --- Modus: Sync Changed Files ---
            echo "Syncing changed files..."

            if [ "${{ github.event_name }}" = "push" ]; then
              if [ -f /tmp/changed_files.txt ] && [ -s /tmp/changed_files.txt ]; then
                while IFS=$'\t' read -r status file; do
                  # file ist z.B. "survival/plugins/Ordner/Config.yml"

                  # Berechne den Pfad relativ zum Server-Root (entferne 'survival/')
                  if [[ "$file" == survival/* ]]; then
                    remote_relative_file="${file#survival/}"
                  else
                    remote_relative_file="$file"
                  fi

                  # Excludes prüfen (auf Basis des Dateinamens)
                  if echo "$remote_relative_file" | grep -qE '\.(db|sqlite|log|pem|key|secret)$|^(playerdata|data|cache)/|^\.git'; then
                    echo "Skipping excluded file: $remote_relative_file"
                    continue
                  fi

                  if [ "$status" = "D" ]; then
                    echo "Deleting: $remote_relative_file"
                    ssh -n -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" "rm -f '$DEPLOY_BASE_PATH/$remote_relative_file'"
                  else
                    echo "Uploading: $remote_relative_file"
                    
                    dir_path=$(dirname "$remote_relative_file")
                    if [ "$dir_path" != "." ]; then
                      ssh -n -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" "mkdir -p '$DEPLOY_BASE_PATH/$dir_path'"
                    fi
                    
                    # Nutze $file (lokaler voller Pfad) -> $DEPLOY_BASE_PATH/$remote_relative_file (relativ zum Server-Root)
                    scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$file" "$SSH_USER@$SSH_HOST:$DEPLOY_BASE_PATH/$remote_relative_file" < /dev/null
                  fi
                done < /tmp/changed_files.txt
                echo "Sync completed successfully"
              else
                echo "No files changed in survival/"
              fi
            else
              # --- Manueller Full Sync ---
              echo "Manual sync: uploading all files..."
              # Vollständiger Server-Ordner-Sync (inkl. plugins/ auf Root-Ebene, ohne Root-Delete)
              rsync -avz -e 'ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new' "${EXCLUDE_ARGS[@]}" --backup --backup-dir="/tmp/festas-rsync-backup-$(date +%Y%m%d-%H%M%S)" "survival/" "$SSH_USER@$SSH_HOST:$DEPLOY_BASE_PATH/"
              echo "Full sync completed successfully"
            fi
          fi

      - name: Verify Deployment
        if: success()
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SERVER_PATH: ${{ secrets.SERVER_PATH_SURVIVAL }}
        run: |
          echo "🔍 Verifiziere Deployment..."
          DEPLOY_BASE_PATH="$(dirname "$SERVER_PATH")"
          FILE_COUNT=$(ssh -n -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" "find '$DEPLOY_BASE_PATH' -name '*.yml' -type f | wc -l")
          echo "📊 $FILE_COUNT Konfigurationsdateien auf dem Server gefunden."
          if [ "$FILE_COUNT" -lt 1 ]; then
            echo "::error::Keine Konfigurationsdateien auf dem Server gefunden! Deployment möglicherweise fehlgeschlagen."
            exit 1
          fi
          echo "✅ Deployment verifiziert."
