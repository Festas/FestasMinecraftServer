name: Sync Plugin Configs

on:
  workflow_dispatch:
    inputs:
      server: 
        description: 'Server auswählen'
        required: true
        type: choice
        options:
          - LOBBY
          - PROXY
          - RPG
          - SKYBLOCK
          - SURVIVAL
      direction:
        description: 'Sync-Richtung'
        required: true
        type: choice
        options:
          - 'Server → Repo'
          - 'Repo → Server'

jobs: 
  sync-plugins:
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.PERSONAL_TOKEN }}

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Sync Plugins
        run: |
          SERVER_NAME="${{ github.event.inputs.server }}"
          DIRECTION="${{ github.event.inputs.direction }}"
          
          # Dynamisch den richtigen Secret-Pfad auswählen
          case $SERVER_NAME in
            LOBBY)
              SERVER_PATH="${{ secrets.SERVER_PATH_LOBBY }}"
              ;;
            PROXY)
              SERVER_PATH="${{ secrets.SERVER_PATH_PROXY }}"
              ;;
            RPG)
              SERVER_PATH="${{ secrets.SERVER_PATH_RPG }}"
              ;;
            SKYBLOCK)
              SERVER_PATH="${{ secrets.SERVER_PATH_SKYBLOCK }}"
              ;;
            SURVIVAL)
              SERVER_PATH="${{ secrets.SERVER_PATH_SURVIVAL }}"
              ;;
          esac
          
          # Lokaler Ordner
          LOCAL_DIR="${SERVER_NAME,,}/plugins"  # lowercase
          
          if [ "$DIRECTION" == "Server → Repo" ]; then
            echo "📥 Kopiere vom Server zum Repository..."
            mkdir -p "$LOCAL_DIR"
            
            # Rsync: Server → Repo
            # Sensitive files/folders are explicitly excluded here so they never
            # reach the GitHub runner. git add -f then commits everything rsync
            # transferred, bypassing .gitignore.
            rsync -avz --delete \
              --exclude='*.jar' \
              --exclude='*.jar.disabled' \
              --exclude='*.db' \
              --exclude='*.mv.db' \
              --exclude='*.sqlite' \
              --exclude='*.lock' \
              --exclude='*.zip' \
              --exclude='security.key' \
              --exclude='security.yml' \
              --exclude='engine.yml' \
              --exclude='forceresourcepacks/key.yml' \
              --exclude='LuckPerms/config.yml' \
              --exclude='HuskSync/config.yml' \
              --exclude='partyandfriends/config.yml' \
              --exclude='libertybans/sql.yml' \
              --exclude='Plan/serverConfiguration/' \
              --exclude='DeluxeBazaar/config.yml' \
              --exclude='GlobalMarketPlus/Config.yml' \
              --exclude='PlayerPoints/config.yml' \
              --exclude='MMOCore/config.yml' \
              --exclude='**/bStats/' \
              --exclude='**/cache/' \
              --exclude='**/Saves/' \
              --exclude='**/internal/' \
              --exclude='**/.hopper/' \
              --exclude='**/DatabaseBackups/' \
              --exclude='Skript/backups/' \
              --exclude='Essentials/userdata/' \
              --exclude='**/playerdata/' \
              --exclude='**/sessions/' \
              --exclude='ProtocolLib/error/' \
              --exclude='punishments-database.*' \
              -e "ssh -o StrictHostKeyChecking=accept-new" \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${SERVER_PATH}/" \
              "$LOCAL_DIR/"
          else
            echo "📤 Kopiere vom Repository zum Server..."
            
            # Rsync: Repo → Server
            rsync -avz --delete \
              --exclude='*.jar' \
              --exclude='*.jar.disabled' \
              -e "ssh -o StrictHostKeyChecking=accept-new" \
              "$LOCAL_DIR/" \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${SERVER_PATH}/"
          fi

      - name: Commit and Push Changes
        if: github.event.inputs.direction == 'Server → Repo'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          SERVER_NAME="${{ github.event.inputs.server }}"
          LOCAL_DIR="${SERVER_NAME,,}/plugins"
          
          git add -f "$LOCAL_DIR"
          
          if git diff --staged --quiet; then
            echo "Keine Änderungen gefunden."
          else
            git commit -m "🔄 Sync $SERVER_NAME plugin configs from server"
            echo "::add-mask::${{ secrets.PERSONAL_TOKEN }}"
            git remote set-url origin https://x-access-token:${{ secrets.PERSONAL_TOKEN }}@github.com/${{ github.repository }}
            
            # Pull remote changes and rebase before pushing
            git pull --rebase origin main || {
              echo "Rebase conflict detected. Aborting and retrying..."
              git rebase --abort
              git pull --rebase origin main
            }
            
            git push
          fi
