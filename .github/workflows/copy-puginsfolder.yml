name: Sync Plugin Configs

on:
  workflow_dispatch:
    inputs:
      server: 
        description: 'Server auswählen'
        required: true
        type: choice
        options:
          - LOBBY
          - PROXY
          - RPG
          - SKYBLOCK
          - SURVIVAL
      direction:
        description: 'Sync-Richtung'
        required: true
        type: choice
        options:
          - 'Server → Repo'
          - 'Repo → Server'

jobs: 
  sync-plugins:
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.PERSONAL_TOKEN }}

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Inject Plan DB credentials for repo-to-server sync
        if: github.event.inputs.direction == 'Repo → Server'
        env:
          PLAN_STATS_DB_ENV: ${{ secrets.PLAN_STATS_DB_ENV }}
        run: |
          if [ -z "$PLAN_STATS_DB_ENV" ]; then
            echo "::error::Missing secret PLAN_STATS_DB_ENV"
            exit 1
          fi

          tmp_env="$(mktemp)"
          printf '%s\n' "$PLAN_STATS_DB_ENV" > "$tmp_env"
          set -a
          . "$tmp_env"
          set +a
          rm -f "$tmp_env"

          for required in PLAN_DB_HOST PLAN_DB_PORT PLAN_DB_DATABASE PLAN_DB_USER PLAN_DB_PASSWORD; do
            if [ -z "${!required:-}" ]; then
              echo "::error::Missing $required in PLAN_STATS_DB_ENV"
              exit 1
            fi
          done

          python3 - <<'PY'
          from pathlib import Path
          import os

          replacements = {
              "__PLAN_DB_HOST__": os.environ["PLAN_DB_HOST"],
              "__PLAN_DB_PORT__": os.environ["PLAN_DB_PORT"],
              "__PLAN_DB_DATABASE__": os.environ["PLAN_DB_DATABASE"],
              "__PLAN_DB_USER__": os.environ["PLAN_DB_USER"],
              "__PLAN_DB_PASSWORD__": os.environ["PLAN_DB_PASSWORD"],
          }
          for path in (
              Path("proxy/plugins/plan/config.yml"),
              Path("lobby/plugins/Plan/config.yml"),
              Path("rpg/plugins/Plan/config.yml"),
              Path("survival/plugins/Plan/config.yml"),
          ):
              if not path.exists():
                  continue
              text = path.read_text()
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text)
          PY

      - name: Sync Plugins
        run: |
          SERVER_NAME="${{ github.event.inputs.server }}"
          DIRECTION="${{ github.event.inputs.direction }}"
          
          # Dynamisch den richtigen Secret-Pfad auswählen
          case $SERVER_NAME in
            LOBBY)
              SERVER_PATH="${{ secrets.SERVER_PATH_LOBBY }}"
              ;;
            PROXY)
              SERVER_PATH="${{ secrets.SERVER_PATH_PROXY }}"
              ;;
            RPG)
              SERVER_PATH="${{ secrets.SERVER_PATH_RPG }}"
              ;;
            SKYBLOCK)
              SERVER_PATH="${{ secrets.SERVER_PATH_SKYBLOCK }}"
              ;;
            SURVIVAL)
              SERVER_PATH="${{ secrets.SERVER_PATH_SURVIVAL }}"
              ;;
          esac
          
          # Lokaler Ordner
          LOCAL_DIR="${SERVER_NAME,,}/plugins"  # lowercase
          
          if [ "$DIRECTION" == "Server → Repo" ]; then
            echo "📥 Kopiere vom Server zum Repository..."
            mkdir -p "$LOCAL_DIR"
            
            # Rsync: Server → Repo
            # Only binary and runtime-generated data is excluded.
            # All config files (including credential files) are transferred
            # so they can be edited in the repo. Ensure the repo stays private.
            rsync -avz --delete \
              --exclude='*.jar' \
              --exclude='*.jar.disabled' \
              --exclude='*.db' \
              --exclude='*.mv.db' \
              --exclude='*.sqlite' \
              --exclude='*.lock' \
              --exclude='*.zip' \
              --exclude='**/bStats/' \
              --exclude='**/cache/' \
              --exclude='**/Saves/' \
              --exclude='**/internal/' \
              --exclude='**/.hopper/' \
              --exclude='**/DatabaseBackups/' \
              --exclude='Skript/backups/' \
              --exclude='Essentials/userdata/' \
              --exclude='**/playerdata/' \
              --exclude='**/sessions/' \
              --exclude='ProtocolLib/error/' \
              --exclude='punishments-database.*' \
              --exclude='**/world/' \
              --exclude='**/world_nether/' \
              --exclude='**/world_the_end/' \
              --exclude='**/crash-reports/' \
              -e "ssh -o StrictHostKeyChecking=accept-new" \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${SERVER_PATH}/" \
              "$LOCAL_DIR/"
          else
            echo "📤 Kopiere vom Repository zum Server..."
            
            # Rsync: Repo → Server
            rsync -avz --delete \
              --exclude='*.jar' \
              --exclude='*.jar.disabled' \
              -e "ssh -o StrictHostKeyChecking=accept-new" \
              "$LOCAL_DIR/" \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${SERVER_PATH}/"
          fi

      - name: Sanitize Plan config after server sync
        if: github.event.inputs.direction == 'Server → Repo'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          mappings = {
              "Host": "__PLAN_DB_HOST__",
              "Port": "__PLAN_DB_PORT__",
              "User": "__PLAN_DB_USER__",
              "Password": '"__PLAN_DB_PASSWORD__"',
              "Database": "__PLAN_DB_DATABASE__",
          }
          for path in (
              Path("proxy/plugins/plan/config.yml"),
              Path("lobby/plugins/Plan/config.yml"),
              Path("rpg/plugins/Plan/config.yml"),
              Path("survival/plugins/Plan/config.yml"),
          ):
              if not path.exists():
                 continue
              lines = path.read_text().splitlines()
              for i, line in enumerate(lines):
                 stripped = line.strip()
                 for field, replacement in mappings.items():
                     prefix = f"{field}:"
                     if stripped.startswith(prefix):
                         indent = line[: len(line) - len(line.lstrip())]
                         lines[i] = f"{indent}{prefix} {replacement}"
                         break
              path.write_text("\n".join(lines) + "\n")
          PY

      - name: Commit and Push Changes
        if: github.event.inputs.direction == 'Server → Repo'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          SERVER_NAME="${{ github.event.inputs.server }}"
          LOCAL_DIR="${SERVER_NAME,,}/plugins"
          
          git add -f "$LOCAL_DIR"
          
          if git diff --staged --quiet; then
            echo "Keine Änderungen gefunden."
          else
            git commit -m "🔄 Sync $SERVER_NAME plugin configs from server"
            echo "::add-mask::${{ secrets.PERSONAL_TOKEN }}"
            git remote set-url origin https://x-access-token:${{ secrets.PERSONAL_TOKEN }}@github.com/${{ github.repository }}
            
            # Pull remote changes and rebase before pushing
            git pull --rebase origin main || {
              echo "Rebase conflict detected. Aborting and retrying..."
              git rebase --abort
              git pull --rebase origin main
            }
            
            git push
          fi
