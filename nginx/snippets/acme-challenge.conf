# Let's Encrypt ACME challenge location
# Included by all HTTP server blocks to allow certificate issuance/renewal
# without redirecting the /.well-known/acme-challenge/ path to HTTPS.
location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
    try_files $uri =404;
}
