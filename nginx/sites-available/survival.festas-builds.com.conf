# BlueMap web map - Survival server
# Port mapping: survival BlueMap integrated webserver -> 127.0.0.1:8102
# (port defined in survival/plugins/BlueMap/webserver.conf)
#
# BlueMap serves its own assets and already gzip-compresses its map tiles, and
# it pushes live player/tile updates over Server-Sent Events (SSE). This vhost
# is therefore a clean reverse proxy with response buffering disabled and a long
# read timeout so the SSE stream stays open.

server {
    listen 80;
    listen [::]:80;
    server_name survival.festas-builds.com;

    # Redirect HTTP to HTTPS (but let ACME challenges be served first)
    include /etc/nginx/snippets/acme-challenge.conf;
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name survival.festas-builds.com;

    # SSL certificates managed by Certbot
    ssl_certificate /etc/letsencrypt/live/festas-builds.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/festas-builds.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Logging
    access_log /var/log/nginx/survival.festas-builds.com.access.log;
    error_log /var/log/nginx/survival.festas-builds.com.error.log;

    # Reverse proxy to the Survival BlueMap webserver. BlueMap sets its own
    # content types and compresses map tiles, so we intentionally do not add
    # gzip or extra headers here (a clean pass-through).
    location / {
        proxy_pass http://127.0.0.1:8102;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Disable buffering and use a long read timeout so BlueMap's
        # Server-Sent Events (live markers / tile updates) keep streaming.
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }
}
