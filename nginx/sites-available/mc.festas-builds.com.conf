# festas_builds website (incl. live /api/players.json)
# Port mapping: minecraft-web container port 80 -> 127.0.0.1:8201
#
# The container's own nginx (website/nginx.conf) already handles caching,
# security headers, gzip and the /api/players.json fallback. This host vhost is a
# clean pass-through so responses (including the JSON) reach the browser unchanged.

server {
    listen 80;
    listen [::]:80;
    server_name mc.festas-builds.com;

    # Redirect HTTP to HTTPS (but let ACME challenges be served first)
    include /etc/nginx/snippets/acme-challenge.conf;
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mc.festas-builds.com;

    # SSL certificates managed by Certbot
    ssl_certificate /etc/letsencrypt/live/festas-builds.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/festas-builds.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Logging
    access_log /var/log/nginx/mc.festas-builds.com.access.log;
    error_log /var/log/nginx/mc.festas-builds.com.error.log;

    # Reverse proxy to the minecraft-web container. The container adds its own
    # security headers, cache-control and gzip, so we intentionally do not
    # duplicate them here (that would emit doubled headers).
    location / {
        proxy_pass http://127.0.0.1:8201;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
