user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject
        image/svg+xml;
    gzip_disable "msie6";

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Security headers (applies to locations that do not set their own add_header)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # Hashed CSS/JS assets (e.g. style.a1b2c3d4.css) – long cache, safe to cache forever.
        # The regex expects exactly 8 hex chars, matching the `cut -c1-8` in the Dockerfile cache-bust step.
        location ~* "\.[0-9a-f]{8}\.(css|js)$" {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Unhashed CSS/JS – no cache (fallback so stale files are never served)
        location ~* \.(css|js)$ {
            expires -1;
            add_header Cache-Control "no-cache, must-revalidate";
            access_log off;
        }

        # Images and fonts rarely change – keep long cache
        location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Live player list JSON – always fetch fresh, never cache. In production the file is
        # provided by the Velocity plugin via a read-only bind mount at /api. If it does not
        # exist yet (e.g. proxy offline) we return an inline empty snapshot instead of the
        # HTML 404 page so the frontend still receives valid JSON.
        location = /api/players.json {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri @players_empty;
        }

        location @players_empty {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            return 200 '{"online":0,"max":0,"updated":0,"showNames":true,"servers":[{"name":"lobby","online":false,"count":0,"max":0,"uptimeSeconds":0,"updated":0,"players":[]},{"name":"survival","online":false,"count":0,"max":0,"uptimeSeconds":0,"updated":0,"players":[]},{"name":"mining","online":false,"count":0,"max":0,"uptimeSeconds":0,"updated":0,"players":[]},{"name":"skyblock","online":false,"count":0,"max":0,"uptimeSeconds":0,"updated":0,"players":[]}]}';
        }

        # HTML files – no cache so browsers always fetch the latest markup
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, must-revalidate";
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "no-referrer-when-downgrade" always;
        }

        # Disable access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Custom error pages (optional)
        error_page 404 /index.html;
        error_page 500 502 503 504 /index.html;
    }
}
