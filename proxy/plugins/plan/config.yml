Database:
  # Type of the database, MySQL is recommended for Velocity
  Type: MySQL
  MySQL:
    Host: localhost
    Port: 3306
    Database: Plan
    User: root
    Password: ''
    SSL_mode: disabled
    Launch_options: "?rewriteBatchedStatements=true&useSSL=false&serverTimezone=UTC"
WebServer:
  # Port to listen on for the webserver
  Port: 8804
  Security:
    SSL_certificate:
      # Path to the keystore file
      KeyStore_path: Cert.jks
      Key_pass: 'default'
      Store_pass: 'default'
      Alias: 'alias'
  Alternative_IP:
    # Enable the alternative IP address for the webserver
    Enabled: true
    # %port% is replaced with the port above
    Address: 'mc-stats.festas-builds.com:%port%'
Data_gathering:
  # Accept GeoLite2 EULA to enable geolocation features
  # https://www.maxmind.com/en/geolite2/eula
  Accept_GeoLite2_EULA: false
