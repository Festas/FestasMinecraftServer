layout:
  enabled: false
ping-spoof:
  enabled: false
  value: 0
global-playerlist:
  enabled: true
  display-others-as-spectators: false
  display-vanished-players-as-spectators: true
  isolate-unlisted-servers: false
  update-latency: false
  spy-servers:
  - lobby
  server-groups:
    lobbies:
    - lobby
    game-servers:
    - survival
    - rpg
placeholders:
  date-format: dd.MM.yyyy
  time-format: 'HH:mm'
  time-offset: 1
  register-tab-expansion: true
placeholder-output-replacements:
  '%essentials_vanished%':
    'yes': '&7| Vanished'
    'no': ''
  '%luckperms_prefix%':
    ? ''
    : '&7User'
  '%statistic_deaths%':
    ? ''
    : '0'
  '%superior_island_level%':
    ? ''
    : '0'
  '%superior_island_worth%':
    ? ''
    : '0'
  '%rankup_next_rank%':
    ? ''
    : '&aMax-Rang'
conditions:
  nick:
    conditions:
    - '%player%=%essentials_nickname%'
    true: '%player%'
    false: ~%essentials_nickname%
  # Faerbt den Ping in 3 Stufen: <80 gruen, <160 gelb, sonst rot.
  ping_c1:
    conditions:
    - '%ping%<80'
    true: '&a%ping%&8ms'
    false: '%condition:ping_c2%'
  ping_c2:
    conditions:
    - '%ping%<160'
    true: '&e%ping%&8ms'
    false: '&c%ping%&8ms'
  # Zeigt den Tode-Zaehler im Tab-Suffix nur auf dem Survival-Server.
  deaths_suffix:
    conditions:
    - '%server%=survival'
    true: ' &8| &c☠ %statistic_deaths%'
    false: ''
placeholder-refresh-intervals:
  default-refresh-interval: 500
  '%server_uptime%': 1000
  '%server_tps_1_colored%': 1000
  '%server_unique_joins%': 5000
  '%player_health%': 200
  '%player_ping%': 1000
  '%vault_prefix%': 1000
  '%rel_factionsuuid_relation_color%': 1000
  '%luckperms_prefix%': 1000
  '%vault_eco_balance_formatted%': 1000
  '%rankup_next_rank%': 2000
  '%rankup_money_left_formatted%': 2000
  '%superior_island_level%': 5000
  '%superior_island_worth%': 5000
  '%statistic_deaths%': 2000
