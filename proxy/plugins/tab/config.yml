header-footer:
  enabled: true
  designs:
    lobby:
      display-condition: '%server%=lobby'
      header:
      - ''
      - '   %animation:brand%'
      - '&8› &bLobby &8• &7Hub, Auswahl & Netzwerkstart'
      - ''
      footer:
      - ''
      - '&8&m                                            '
