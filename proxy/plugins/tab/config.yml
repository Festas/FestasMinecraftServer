      - ' &7Web &8» %animation:web%'
      - ''
    survival:
      display-condition: '%server%=survival'
      header:
      - ''
      - '   %animation:brand%'
      - '&8› &6Survival &8• &7Städte, Freebuild & Rankup'
      - ''
      footer:
      - ''
      - '&8&m                                            '
      - ' &7Rang &8» %luckperms_prefix%    &8|    &7Guthaben &8» &a%vault_eco_balance_formatted%$'
      - ' &7Nächstes Ziel &8» &e%rankup_next_rank%    &8|    &7Fehlt &8» &c%rankup_money_left_formatted%$'
      - ' &7Ping &8» %condition:ping_c1%    &8|    &7Online &8» &a%online%'
      - ' &7Web &8» %animation:web%'
      - ''
    skyblock:
      display-condition: '%server%=skyblock'
      header:
      - ''
      - '   %animation:brand%'
      - '&8› &bSkyblock &8• &7Koop-Inseln mit eigener Economy'
      - ''
      footer:
      - ''
      - '&8&m                                            '
      - ' &7Rang &8» %luckperms_prefix%    &8|    &7Guthaben &8» &a%vault_eco_balance_formatted%$'
      - ' &7Insel-Level &8» &b%superior_island_level%    &8|    &7Wert &8» &a%superior_island_worth%'
