      - ''
      - '   %animation:brand%'
      - '&8› %condition:server_label% &8• &7Festas Netzwerk'
      - ''
      footer:
      - ''
      - '&8&m                                            '
      - ' &7Server &8» %condition:server_label%    &8|    &7Online &8» &a%online%'
      - ' &7Ping &8» %condition:ping_c1%    &8|    &7Zeit &8» &f%time% Uhr'
      - ' &7Web &8» %animation:web%'
