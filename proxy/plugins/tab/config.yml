mysql:
  enabled: false
  host: 127.0.0.1
  port: 3306
  database: tab
  # Dormant unless mysql.enabled is true. Inject via TAB_DB_ENV if enabled.
  username: __TAB_DB_USER__
  password: __TAB_DB_PASSWORD__
  useSSL: true
proxy-support:
