settings:
  # Should Oraxen automatically generate sounds.json according to your settings?
  automatically_generate: true

# Please note due to config limitations,
# block.second.something will
# add empty entries for 'block' and 'block.second'
# The actual sounds will still be under 'block.second.something'
# The above are just empty and side-effect of generating the json file.
sounds:
- id: welcome
  category: records
  sound: welcome.ogg
  stream: true
  subtitle: Welcome Song
  jukebox:
    description: <gold>Welcome <yellow>Song</yellow></gold>
    duration: 180s
    comparator_output: 12
- id: block.wood.step
  replace: true
- id: block.wood.place
  replace: true
- id: block.wood.break
  replace: true
- id: block.wood.fall
  replace: true
- id: block.wood.hit
  replace: true
- id: block.stone.step
  replace: true
- id: block.stone.place
  replace: true
- id: block.stone.break
  replace: true
- id: block.stone.fall
  replace: true
- id: block.stone.hit
  replace: true
