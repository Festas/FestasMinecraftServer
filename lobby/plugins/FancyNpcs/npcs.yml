# FancyNpcs - Server Selector & Info NPCs for Lobby
# Note: NPC locations (x, y, z, yaw, pitch) must be set in-game with /npc teleport <name>
# Skin values must be obtained from https://mineskin.org/ and set in-game

# --- SERVER SELECTOR NPCs ---

rpg_npc:
  displayName: '<gradient:#AA00FF:#FF00AA><bold>⚔ RPG Server</bold></gradient>'
  type: PLAYER
  location:
    world: lobby
    x: 0.5
    y: 65.0
    z: -5.5
    yaw: 180.0
    pitch: 0.0
  showInTab: false
  spawnEntity: true
  collidable: false
  glowing: false
  glowingColor: DARK_PURPLE
  turnToPlayer: true
  messages:
    - '<gray>Tauche ein in eine Welt voller'
    - '<gray>Magie, Dungeons und Abenteuer!'
    - '<yellow>► Klicke erneut zum Verbinden'
  serverCommand: rpg
  interactionCooldown: 1.0

survival_npc:
  displayName: '<gradient:#00AA00:#55FF55><bold>🌳 Survival / Tycoon</bold></gradient>'
  type: PLAYER
  location:
    world: lobby
    x: 5.5
    y: 65.0
    z: -5.5
    yaw: 180.0
    pitch: 0.0
  showInTab: false
  spawnEntity: true
  collidable: false
  glowing: false
  glowingColor: GREEN
  turnToPlayer: true
  messages:
    - '<gray>Klassisches Survival mit Tycoon-Modus,'
    - '<gray>Plots, Generatoren und Wirtschaft!'
    - '<yellow>► Klicke erneut zum Verbinden'
  serverCommand: survival
  interactionCooldown: 1.0

skyblock_npc:
  displayName: '<gradient:#00AAFF:#55FFFF><bold>🏝 Skyblock</bold></gradient>'
  type: PLAYER
  location:
    world: lobby
    x: -5.5
    y: 65.0
    z: -5.5
    yaw: 180.0
    pitch: 0.0
  showInTab: false
  spawnEntity: true
  collidable: false
  glowing: false
  glowingColor: AQUA
  turnToPlayer: true
  messages:
    - '<gray>MMO Skyblock mit Klassen, Skills,'
    - '<gray>Minions und Inseln!'
    - '<yellow>► Klicke erneut zum Verbinden'
  serverCommand: skyblock
  interactionCooldown: 1.0

