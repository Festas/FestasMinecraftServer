# Autorank Paths - Playtime-based rewards
# These are COMPLEMENTARY to the economy-based Rankup system
# Players earn bonuses for playtime milestones, NOT rank promotions

# --- 1 HOUR PLAYTIME REWARD ---
playtime_1h:
  prerequisites:
    in group:
      value: tycoon_erde
  requirements:
    time:
      value: 1h
  results:
    money:
      value: 500
    message:
      value: '&8&m─────────────────────────────────────\n&6&l✦ &eSpielzeit-Belohnung! &6&l✦\n&7Du hast &f1 Stunde &7gespielt!\n&7Belohnung: &a500€\n&8&m─────────────────────────────────────'
    command:
      value: cmi sound ENTITY_PLAYER_LEVELUP:1:1 &p
  options:
    display name: '1 Stunde Spielzeit'
    auto choose: true
    show based on prerequisites: false

