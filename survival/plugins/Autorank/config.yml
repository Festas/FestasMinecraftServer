# Autorank Configuration
# Complementary to the economy-based Rankup plugin
# This handles playtime-based rewards and bonuses (not rank promotions)

# Storage type: flatfile or mysql
storage-type: flatfile

# Whether to use UUIDs for storage
use-uuids: true

# Interval in minutes to check for path completion
interval-check: 5

# Whether to broadcast when a player completes a path
broadcast-completion: true

# MySQL settings (disabled - using flatfile)
mysql:
  enabled: false
  hostname: localhost
  port: 3306
  username: root
  password: ''
  database: autorank

# Time tracking
track-playtime: true
