# CoreProtect Configuration
# IMPORTANT: CoreProtect JAR must be installed first!
# Download from: https://www.spigotmc.org/resources/coreprotect.8631/
#
# CoreProtect provides block logging, rollback, and restore functionality.
# Essential for any server with player building.

# General Settings
verbose: true
default-radius: 10
max-radius: 100
rollback-items: true
rollback-entities: true
skip-generic-data: true

# Logging Settings
# Log everything to track griefing and exploits
use-mixed-container: true
block-place: true
block-break: true
natural-break: false
block-movement: true
pistons: true
block-burn: true
block-ignite: true
explosions: true
entity-change: true
entity-kills: true
sign-text: true
buckets: true
leaf-decay: false
tree-growth: false
mushroom-growth: false
vine-growth: false
sculk-spread: false
dragon-egg-movement: true
cake-slices: true

# Player interactions
player-interactions: true
item-transactions: true
player-commands: true
username-changes: true
worldedit: true

# Database Configuration
# Using MySQL for better performance
use-mysql: false
table-prefix: co_
mysql-host: 172.25.0.1
mysql-port: 3306
mysql-database: s4_coreprotect
mysql-username: CHANGE_ME
mysql-password: CHANGE_ME

# Purge old data after 30 days to save space
default-time: 30

# Check for updates
check-updates: true
