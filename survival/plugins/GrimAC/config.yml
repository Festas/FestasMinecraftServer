# ============================================================
#  GrimAC Konfiguration – Survival-Server
#  Minecraft MMO Netzwerk
#  Standardmäßig strenge Prüfungen für fairen Survival-Betrieb
# ============================================================

# --- Allgemeine Einstellungen ---
prefix: "&c&lAntiCheat &8» &r"
config-version: 9

# Sprache und Nachrichten
alerts:
  # Benachrichtigungen an Staff-Mitglieder
  enable-staff-alerts: true
  # Mindest-Permission für Alarme: grimac.alerts
  alert-permission: "grimac.alerts"
  # Alarme beim Beitreten automatisch aktivieren
  alert-on-join: true
  # Intervall in Ticks zwischen wiederholten Alarmen (Spam-Schutz)
  alert-cooldown-ticks: 40
  # Format der Alert-Nachricht
  alert-format: "&c&lAntiCheat &8» &r&e%player% &7hat &c%check% &7ausgelöst &8(&fVL: %vl%&8)"

# --- Geyser / Floodgate Unterstützung ---
# Bedrock-Spieler über Floodgate automatisch von Prüfungen befreien
exempt-floodgate: true
# Geyser-Spieler erkennen und entsprechend behandeln
exempt-geyser: true

# --- Verbindungseinstellungen ---
connection:
  # Max. Transaktions-Timeout in Millisekunden
  transaction-timeout: 60000
  # Max. Ping bevor Spieler als verdächtig markiert wird
  max-transaction-time: 15000
  # Spieler bei Timeout kicken
  kick-on-timeout: true

# --- Teleport-Handling ---
teleport:
  # Wartezeit nach Teleport bevor Prüfungen wieder greifen (in Ticks)
  exempt-ticks-on-teleport: 60
  # Wartezeit nach Weltenwechsel
  exempt-ticks-on-world-change: 100

# ============================================================
#  Prüfungen (Checks)
# ============================================================

checks:

  # --- Bewegungsprüfungen ---
  movement:
    # Prediction-Engine – Hauptbewegungsprüfung
    prediction:
      enabled: true
      # Max. erlaubte Abweichung von der vorhergesagten Position
      max-advantage: 0.01
      # Unmittelbare Rücksetzung bei offensichtlichem Cheating
      immediate-setback-threshold: 0.1
      # Maximale Abweichung bevor Setback ausgelöst wird
      max-ceiling: 0.075

    # Fahrzeug-Bewegungsprüfung (Boote, Pferde usw.)
    vehicle:
      enabled: true
      max-advantage: 0.025
      immediate-setback-threshold: 0.15

    # Timer-Check – Erkennt Speed-Hacks über Paketfrequenz
    timer:
      enabled: true
      decay: 0.02
      # Max. erlaubte Timer-Balance
      max-violations: 10

    # Phase/NoClip – Spieler bewegt sich durch Blöcke
    phase:
      enabled: true
      setback: true
      decay: 0.005
      max-violations: 5

  # --- Flugprüfungen ---
  fly:
    enabled: true
    setback: true
    # Strenge Flugprüfung für Survival
    max-violations: 8
    decay: 0.05

  # --- Kampfprüfungen ---
  combat:
    # Reichweitenprüfung
    reach:
      enabled: true
      # Max. Angriffsreichweite in Blöcken (Vanilla: 3.0)
      max-reach: 3.1
      # Zusätzlicher Puffer für Latenz
      threshold: 0.0005
      max-violations: 15
      decay: 0.025

    # Killaura / Angriffs-Richtungsprüfung
    killaura:
      enabled: true
      max-violations: 10
      decay: 0.02

    # Auto-Clicker Erkennung
    autoclicker:
      enabled: true
      # Max. Klicks pro Sekunde
      max-cps: 18
      max-violations: 15
      decay: 0.05

    # Kritische Treffer Manipulation
    criticals:
      enabled: true
      max-violations: 8
      decay: 0.02

  # --- Spielerprüfungen ---
  player:
    # BadPackets – Ungültige/manipulierte Pakete
    badpackets:
      enabled: true
      max-violations: 10
      decay: 0.01

    # Inventory-Manipulation (zu schnelle Aktionen)
    inventory:
      enabled: true
      max-violations: 12
      decay: 0.03

    # Scaffold-Check (schnelles Blocksetzen)
    scaffold:
      enabled: true
      max-violations: 10
      decay: 0.02

    # Groundspoof – Falscher Bodenkontakt
    groundspoof:
      enabled: true
      max-violations: 5
      decay: 0.01

    # FastBreak – Zu schneller Blockabbau
    fastbreak:
      enabled: true
      max-violations: 8
      decay: 0.02

    # FastPlace – Zu schnelles Blocksetzen
    fastplace:
      enabled: true
      max-violations: 8
      decay: 0.02

# ============================================================
#  Bestrafungssystem (Eskalation: Warnung → Kick → Tempban)
# ============================================================

punishment:
  # Bestrafungen aktivieren
  enabled: true

  # Eskalationsstufen
  thresholds:
    # Stufe 1: Warnung an den Spieler
    warn:
      violations: 20
      # Nachricht an den Spieler
      message: "&c&lAntiCheat &8» &r&cVerdächtiges Verhalten erkannt. Bitte spiele fair!"
      # Befehl der ausgeführt wird (leer = keiner)
      command: ""

    # Stufe 2: Kick vom Server
    kick:
      violations: 40
      message: "&c&lAntiCheat &8» &r&cDu wurdest wegen verdächtigem Verhalten gekickt."
      command: "kick %player% &cVerdächtiges Verhalten erkannt. Bitte spiele fair!"

    # Stufe 3: Temporärer Bann
    tempban:
      violations: 60
      message: "&c&lAntiCheat &8» &r&4Du wurdest temporär gebannt."
      command: "tempban %player% 1h &cAntiCheat: Wiederholtes verdächtiges Verhalten"

  # Violations-Verfall über Zeit (pro Minute)
  global-decay: 0.5
  # Violations beim Verlassen des Servers zurücksetzen
  reset-on-quit: false
  # Violations-Zähler nach Bestrafung zurücksetzen
  reset-on-punish: true

# ============================================================
#  Setback-Einstellungen (Rücksetzung bei Cheating)
# ============================================================

setback:
  # Spieler bei erkanntem Cheating zurücksetzen
  enabled: true
  # Maximale Setbacks pro Sekunde
  max-per-second: 3
  # Blockierung der Bewegung bei Setback
  block-movement-on-setback: true
  # Dauer der Blockierung in Ticks
  block-duration-ticks: 5

# ============================================================
#  Logging & Debug
# ============================================================

logging:
  # Verstöße in Datei loggen
  log-to-file: true
  log-file: "violations.log"
  # Nur Verstöße über diesem Schwellenwert loggen
  min-violation-log: 5
  # Ausführliches Debug-Logging (nur für Entwicklung!)
  debug: false

# ============================================================
#  Performance-Einstellungen
# ============================================================

performance:
  # Threads für Paketverarbeitung
  max-threads: 2
  # Max. Spieler die gleichzeitig geprüft werden
  max-players-checked: 100
  # Prüfungen für Spieler mit hohem Ping reduzieren
  lenient-high-ping: true
  # Ping-Schwelle in ms für gelockerte Prüfungen
  high-ping-threshold: 250
# GrimAC Anti-Cheat Configuration
# IMPORTANT: GrimAC JAR must be installed first!
# Download from: https://www.spigotmc.org/resources/grimac.99923/
#
# GrimAC is the recommended anti-cheat for this server because:
# - Free and open source
# - Excellent performance
# - Great Geyser/Floodgate (Bedrock) support
# - Accurate movement checks
# - Low false-positive rate

# Prefix for messages
prefix: "&8[&cAnti-Cheat&8]&7 "

# Alert
alerts:
  # How many violations before alerting staff
  minimum-alerts: 5
  # Permission to see alerts
  alert-permission: "grim.alerts"

# Bestrafungen
punishments:
  # Auto
  enabled: true
  # Befehle bei Erkennung. Nutze {player} für den Spielernamen.
  commands:
    - "cmi tempban {player} 1h &cAnti-Cheat: Verdächtige Aktivität erkannt."

# Exemptions
exempt:
  # Creative mode players are exempt
  creative: true
  # Operators are exempt
  operators: true

# Checks Configuration
checks:
  # Movement checks (important for economy servers)
  movement:
    enabled: true
    # Speed check
    speed:
      enabled: true
    # Fly check
    fly:
      enabled: true
    # No-fall check
    no-fall:
      enabled: true

  # Combat checks
  combat:
    enabled: true
    # Reach check
    reach:
      enabled: true
    # Hit-box check
    hitbox:
      enabled: true

  # Player checks
  player:
    enabled: true
    # Timer check (speed-up actions)
    timer:
      enabled: true
    # Scaffold check
    scaffold:
      enabled: true

  # Inventory checks (critical for economy!)
  inventory:
    enabled: true

# Geyser/Floodgate support
# Automatically detects Bedrock players
bedrock:
  # Enable Bedrock player detection
  enabled: true
  # Exempt Bedrock players from certain checks
  # (Bedrock has different physics)
  exempt-movement: true
