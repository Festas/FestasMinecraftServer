# Hier kann die Limits-Datei deaktiviert werden, um stattdessen berechtigungsbasierte Limits zu verwenden.
# Das Deaktivieren wird nicht empfohlen, da einige Funktionen mit berechtigungsbasierten Limits nicht funktionieren.
# HINWEIS: Diese Einstellung erfordert einen Server-Neustart.
enabled: true

# In dieser Datei können nummerierte Limits für alle Spieler konfiguriert werden.
# Es können mehrere Limit-Pakete erstellt werden, wenn Spieler unterschiedliche Limits erhalten sollen. Diese im Abschnitt "packs" hinzufügen.
#
# Ein Paket wird zugewiesen, wenn der Spieler eine bestimmte Berechtigung hat.
# Ein Spieler kann nur ein Paket haben. Bei jedem Beitreten wird das Paket neu ausgewertet.
# Das erste Paket in der Liste, für das der Spieler berechtigt ist, wird zugewiesen.
# Die Reihenfolge könnte z. B. so sein: owner, admin, member usw.
#
# Limits können durch Setzen des Werts auf -1 deaktiviert werden. Allgemein empfohlen ist, Limits zu setzen, um Missbrauch zu verhindern.
# Limits, die nicht in einem Paket vorhanden sind, werden für dieses Paket automatisch auf 0 gesetzt.
#
# Änderungen an dieser Datei können mit dem Befehl "/lands admin reload" auf alle Spieler, Länder und Nationen angewendet werden.
packs:
  # Wenn aktiviert, werden alle Pakete, die ein Spieler hat, zusammengeführt und die Limits addiert.
  # Das Limit jedes Pakets, das der Spieler hat, wird zum Limit der anderen Pakete hinzugefügt.
  # Bei Änderung dieses Werts sollten bereits konfigurierte Pakete entsprechend angepasst werden.
  stack: false
  # Paket für Server-Admins, das fast alle Limits entfernt.
  # Kann entfernt werden, wenn es nicht benötigt wird.
  admin:
    # Erforderliche Berechtigung für die Zuweisung dieses Pakets.
    permission: "lands.admin.no_limits"
    limits:
      player_lands_owned: -1
      player_lands_owned_free: 0
      player_lands_trusted: -1
      player_camps_owned: -1
      player_chunks: -1
      player_chunks_free: 0
      player_rentals: -1
      player_selection_size: -1
      land_size: -1
      land_members: -1
      land_parts: -1
      land_areas: -1
      land_allies: -1
      land_enemies: -1
      area_roles: -1
      nation_lands: -1

  default:
    limits:
      # Anzahl der Länder, die der Spieler besitzen kann.
      player_lands_owned: 1
      # Anzahl der Länder, die kostenlos erstellt werden können (falls Erstellungskosten konfiguriert sind).
      player_lands_owned_free: 0
      # Anzahl der Länder, denen ein Spieler vertraut werden kann (eigene Länder ausgenommen).
      player_lands_trusted: 3
      # Anzahl der temporären Lager, die gleichzeitig vorhanden sein können.
      player_camps_owned: 1
      # Anzahl der Chunks, die ein Spieler über alle Länder hinweg beanspruchen kann (eigene & vertraute).
      # "land_size" begrenzt die Größe einzelner Länder.
      player_chunks: -1
      # Anzahl der Chunks, die der Spieler kostenlos beanspruchen kann (kombiniert für alle eigenen Länder
      # und Länder, denen er vertraut ist), falls Beanspruchungskosten konfiguriert sind.
      player_chunks_free: 0
      # Anzahl der Bereiche, die ein Spieler über alle Länder hinweg mieten kann.
      player_rentals: 1
      # Maximale Chunk-Anzahl, die jedes eigene Land beanspruchen kann. Begrenzt die Landgröße.
      # "player_chunks" steuert, wie viele Chunks jeder Spieler insgesamt beanspruchen kann.
      # Die maximale Größe kann durch Bearbeiten der Option "increase-land_size" pro vertrautem Spieler erhöht werden.
      land_size: 100
      # Anzahl der Spieler, die jedem eigenen Land vertraut werden können.
      land_members: 25
      # Anzahl der Teile, in die eigene Länder aufgeteilt werden können. Ermöglicht die Erstellung von Außenposten.
      # Bei 1 sind keine Aufteilungen erlaubt.
      land_parts: 1
      # Anzahl der Teilbereiche, die für jedes eigene Land erstellt werden können.
      land_areas: 20
      # Anzahl der Verbündeten, die für jedes eigene Land hinzugefügt werden können.
      land_allies: 10
      # Anzahl der Feinde, die für jedes eigene Land hinzugefügt werden können.
      land_enemies: 20
      # Anzahl der Rollen, die für jeden Bereich in eigenen Ländern erstellt werden können.
      area_roles: 20
      # Anzahl der Länder, die der Nation des Spielers hinzugefügt werden können.
      nation_lands: 10


# Erhöht das land_size-Limit des Landes für jeden vertrauten Spieler.
# Beachte, dass dies nur die maximale Größe erhöht. Je nach Konfiguration der Limit-Pakete
# kann dies die tatsächlich beanspruchbaren Chunks nicht erhöhen, da diese auch durch das
# player_chunks-Limit beeinflusst werden. Diese Einstellung beeinflusst nur die theoretische Maximalgröße des Landes,
# wenn das player_chunks-Limit gesetzt ist.
increase-land_size: 5

# Durch die Einrichtung von Zeitbelohnungen kann das Spielerlimit entsprechend seiner Spielzeit erhöht werden.
# Ein Spieler erhält in jedem konfigurierten Zeitraum zusätzliche Limits. Die Spielzeit wird vom Server berechnet.
# Wird die primäre Welt gelöscht, wird die Spielzeit der Spieler wahrscheinlich zurückgesetzt (serverseitig).
time-rewards:
  player_lands_owned:
    # Spieler erhalten ein zusätzliches eigenes Land pro konfiguriertem Zeitraum.
    # Zeiteinheiten: s = Sekunden, m = Minuten, h = Stunden, d = Tage
    # 0s = deaktiviert
    time: 0s
    # Maximale Anzahl eigener Länder, die durch Spielzeit erhalten werden können.
    # -1 = kein Limit
    max: -1
  player_lands_owned_free:
    time: 0s
    max: -1
  player_lands_trusted:
    time: 0s
    max: -1
  player_camps_owned:
    time: 0s
    max: -1
  player_chunks:
    time: 0s
    max: -1
  player_chunks_free:
    time: 0s
    max: -1
  player_rentals:
    time: 0s
    max: -1
  land_size:
    time: 0s
    max: -1
  land_members:
    time: 0s
    max: -1
  land_parts:
    time: 0s
    max: -1
  land_areas:
    time: 0s
    max: -1
  land_allies:
    time: 0s
    max: -1
  land_enemies:
    time: 0s
    max: -1
  area_roles:
    time: 0s
    max: -1
  nation_lands:
    time: 0s
    max: -1
