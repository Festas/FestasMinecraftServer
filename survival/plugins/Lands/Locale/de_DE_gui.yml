            </t><t:regular>Owner'
          - '      <t:decoration>- </t><t:regular_value>%level%</t> <t:decoration>=
            </t><t:regular>Level'
          - '      <t:decoration>- </t><t:entity_nation>%nation%</t> <t:decoration>=
            </t><t:regular>Nation'
          - '      <t:decoration>- </t><t:regular_value>%player%</t> <t:decoration>=
            </t><t:regular>Entering player'
          - ''
          - <action:primary><label>Set Message</label></action>
          - '<action:secondary><label>Display: <v:show></label></action>'
