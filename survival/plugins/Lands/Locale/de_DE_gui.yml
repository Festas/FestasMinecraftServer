          - ' <t:decoration>• </t><t:regular>Interval: <t:time><v:interval></t>'
          - ' <t:decoration>• </t><t:regular>Players are only paying taxes'
          - '   for areas, in which they''re trusted.'
          material: GOLD_INGOT
          slots: 23
        refresh_minus-1:
          name: <t:negative_heading>Remove <!b><v:value>
          material: REDSTONE
          slots: 20
          data:
            modify: 500
        refresh_minus-2:
          name: <t:negative_heading>Remove <!b><v:value>
          material: REDSTONE
          slots: 21
          data:
            modify: 50
        refresh_minus-3:
          name: <t:negative_heading>Remove <!b><v:value>
