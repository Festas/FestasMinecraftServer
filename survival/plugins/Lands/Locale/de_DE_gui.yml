          slots: 15
        object_name:
          slots: 11
        object_tag:
          slots: 13
        object_icon:
          slots: 17
      patches:
        all:
          category:
            slots: 32
          category_members:
            slots: 32
  taxes:
    title: <t:menu_title>Taxes
    items:
      default:
        tax_area:
          name: <t:regular_heading>Tax:</t> <t:regular_value><v:tax></t>
          lore:
          - <t:regular>In<t:time> <v:time></t> your land
          - will receive <t:regular_value><v:revenue></t> <t:regular>in total as taxes
