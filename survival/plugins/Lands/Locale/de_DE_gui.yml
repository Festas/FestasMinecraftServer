physical:
  selection:
    name: <t:regular_heading>Auswahlwerkzeug
    lore:
    - <t:regular>Nutze dieses Werkzeug, um eine Auswahl zu erstellen.
    - 'Auswahlen können genutzt werden für:'
    - ' <t:decoration>• </t><t:regular>Claimen'
    - ' <t:decoration>• </t><t:regular>Freigeben'
    - ' <t:decoration>• </t><t:regular>Bereiche vergrößern/verkleinern'
    material: GOLDEN_HOE
  currency:
    material: GOLD_INGOT
  claim_block_radius:
    name: <t:regular_heading>Radius-Claimblock
    lore:
    - <t:regular>Du kannst einen Radius von
    - Chunks claimen, indem du diesen Block
    - in der Wildnis platzierst.
    - ''
    - ' <t:decoration>• </t><t:regular>Besitzer:<t:regular_value> <v:owner></t>'
    - ' <t:decoration>• </t><t:regular>Radius:<t:regular_value> <v:radius></t> <t:decoration>(</t><t:regular_value>=
      <v:chunks> chunks</t><t:decoration>)</t>'
    material: GRASS_BLOCK
  claim_block:
    name: <t:regular_heading>Claimblock
    lore:
    - <t:regular>Du kannst einen Chunk claimen,
    - indem du diesen Block
    - in der Wildnis platzierst.
    - ''
    - ' <t:decoration>• </t><t:regular>Besitzer:<t:regular_value> <v:owner></t>'
    material: GRASS_BLOCK
  info:
    name: <t:regular_heading>Info-Werkzeug
    lore:
    - <t:regular>Nutze dieses Werkzeug, um
    - Informationen über den Claim
    - anzusehen, den du anvisierst.
    material: FEATHER
  camp:
    name: <t:regular_heading>Lager
    lore:
    - <t:regular>Platziere dieses Item, um ein temporäres
    - Lager zu erstellen, das nach
    - <t:time><v:time></t>.
    - ' <t:decoration>• </t><t:regular>Radius:<t:regular_value> <v:radius></t>'
    - ' <t:decoration>• </t><t:regular>Lager können nicht erweitert werden.'
    material: CAMPFIRE
  capture_flag:
    material: BEACON
  main_block:
    material: BELL
common:
  items:
    default:
      child_failure_message:
        name: <t:error_heading>Fehler
        lore:
        - <t:error><v:message></t>
      child_success_message:
        name: <t:success_heading>Erfolg
        lore:
        - <t:success><v:message></t>
      child_failure_teleport:
        name: <t:error_heading>Teleportation fehlgeschlagen
        lore:
        - <t:error>The teleportation failed because of
        - 'the following cause: <t:error_value><v:result></t>'
      child_failure_player_trusted:
        name: <t:error_heading>Bereits vertraut
        lore:
        - <t:error>You're already part of this land.
      child_failure_permission:
        name: <t:error_heading>Fehlende Berechtigung
        lore:
        - <t:error>Das darfst du nicht tun.
      child_failure_teleport_enter:
        name: <t:error_heading>Zutritt verboten
        lore:
        - <t:error>Du darfst den
        - Bereich nicht betreten, in dem sich das Ziel
        - befindet.
        - ' <t:decoration>• </t><t:regular>The land owner can give you'
        - '   dafür die Berechtigung geben.'
      refresh_page_previous:
        name: <t:regular_heading>Vorherige Seite
        lore:
        - '<t:decoration>✖ </t><t:regular>Aktuell: <t:regular_value><v:current></t>
          / <t:regular_value><v:pages></t>'
        material: ARROW
        slots: 38
      child_failure_no-item:
        name: <t:error_heading>Kein Item am Cursor
        lore:
        - <t:error>Du musst ein Item
        - aus deinem Inventar hierher ziehen.
      child_failure_spawn_cooldown:
        name: <t:error_heading>Abklingzeit aktiv
        lore:
        - <t:error>Du musst noch<t:error_value> <v:time></t> warten
        - bevor du dich erneut zu einem
        - Landspawn teleportieren kannst.
      child_failure_teleport_unsafe:
        name: <t:error_heading>Unsicher
        lore:
        - <t:error>Teleportation zu diesem Ziel fehlgeschlagen,
        - weil es dort nicht sicher ist.
      back:
        name: <t:regular_heading>Zurück
        lore:
        - <t:decoration>✖ </t><t:regular>Zurück zu
        - '   <t:regular_value><v:back></t>.'
        material: RED_STAINED_GLASS_PANE
        slots: 37
      refresh_page_next:
        name: <t:regular_heading>Nächste Seite
        lore:
        - '<t:decoration>✖ </t><t:regular>Aktuell: <t:regular_value><v:current></t>
          / <t:regular_value><v:pages></t>'
        material: ARROW
        slots: 44
      child_failure_cost:
        name: <t:error_heading>Nicht genug Geld
        lore:
        - <t:error>Du benötigst <t:cost><v:cost></t> dafür.
      child_failure_spawn_cost:
        name: <t:error_heading>Nicht genug Geld
        lore:
        - <t:error>Du benötigst <t:cost><v:cost></t> für
        - die Teleportation.
      child_failure_noaccess_owner:
        name: <t:error_heading>Nicht erlaubt
        lore:
        - <t:error>Nur der Besitzer von <t:error_value><v:object></t> kann das tun.
      child_failure_spawn_teleport:
        name: <t:error_heading>Teleportation nicht erlaubt
        lore:
        - <t:error>Du darfst dich nicht teleportieren
        - zu diesem Landspawn.
        - ' <t:decoration>• </t><t:regular>The land owner can give you'
        - '   dafür die Berechtigung geben.'
      child_failure_spawn_war:
        name: <t:error_heading>Aktiver Krieg
        lore:
        - <t:error>You currently can't teleport to
        - this particular land spawn.
        - ' <t:decoration>• </t><t:regular>They''re currently engaged in a war,'
        - '   for another <t:time><v:time></t>.'
      child_failure_membership-request_not-looking:
        name: <t:error_heading>Sucht keine Mitglieder
        lore:
        - <t:error>This land isn't looking for
        - new members.
      child_failure_page_previous:
        name: <t:error_heading>Keine vorherige Seite
      child_success_player_trusted:
        name: <t:success_heading>You're now trusted
        lore:
        - <t:success>Land <t:entity_land><v:land></t> automatically
        - accepted your request.
        - ' <t:decoration>• </t><t:regular>Leave a land: <t:cmd>/<v:cmd></t>'
      child_failure_page_next:
        name: <t:error_heading>Keine nächste Seite
      child_success_membership-request_revoked:
        name: <t:success_heading>Membership Request Revoked
        lore:
        - <t:success>You revoked your membership request.
      child_failure_noaccess:
        name: <t:error_heading>Nicht erlaubt
        lore:
        - <t:error>Das darfst du nicht tun.
        - ' <t:decoration>• </t><t:regular>Der Besitzer von <v:object><t:regular> kann
          deiner'
        - '   Rolle dafür die Berechtigung geben.'
        - '   Flag: <t:regular_value><v:flag></t>'
      child_success_membership-request_sent:
        name: <t:success_heading>Sent Membership Request
        lore:
        - <t:regular>They can now accept your membership request.
      child_failure_spawn_none:
        name: <t:error_heading>Kein Spawnpunkt
        lore:
        - <t:error>This land doesn't have set a spawn yet.
        - ' <t:decoration>• </t><t:regular>Set spawn point:'
        - '   <t:cmd>/<v:cmd></t>'
      category:
        name: '<t:regular_heading>Category: <v:category>'
        lore:
        - <t:decoration>✖ </t><t:regular>Change the category of the land.
        - '    <t:decoration>• </t><t:regular>Others can filter your land in the'
        - '      <t:regular_value>/<v:cmd></t> menu by this category.'
        material: BOOKSHELF
        slots: 40
      category_members:
        name: '<t:regular_heading>Category: <v:category>'
        lore:
        - <t:decoration>✖ </t><t:regular>Change the category of the land.
        - '    <t:decoration>• </t><t:regular>Others can filter your land in the'
        - '      <t:cmd>/<v:cmd></t> menu by this category.'
        - ''
        - '    <t:decoration>• </t><t:regular>They can request membership to'
        - '      this land in the menu'
        - '      <t:regular>as long as the category of'
        - '      your land is set to:'
        - '      <t:regular_value><v:looking></t>'
        material: BOOKSHELF
        slots: 40
      child_failure_global-action:
        name: <t:error_heading>Display all Areas enabled
        lore:
        - <t:error>Can't disable this, if you're viewing entries
        - for all areas. <t:regular>Enable <t:regular_heading>View only area</t>
        - to change this.
      child_failure_nation_none:
        name: <t:error_heading>Role managed by Nation
        lore:
        - <t:error>This role will be partly managed
        - by the nation you may belong to in the future.
        - ' <t:decoration>• </t><t:regular>You''re currently not part of any nation.'
      object_name:
        name: '<t:regular_heading>Name: <t:user_content><v:name></t>'
        lore:
        - <t:decoration>✖ </t><t:regular>Set a new name.
        material: PAPER
      object_tag:
        name: '<t:regular_heading>Tag: <t:user_content><v:tag></t>'
        lore:
        - <t:regular>A short version of the name.
        - <action:primary><label>Set Tag</label></action>
        - <action:remove><label>Remove Tag</label></action>
        material: NAME_TAG
      object_icon:
        name: <t:regular_heading>Icon
        lore:
        - <action:primary><label>Set Icon</label><desc><t:regular>Drag an item here,
          or hold it in your hand on Bedrock.</desc></action>
        - <action:remove><label>Reset to Default</label></action>
        material: INHERIT
      placeholder_1:
        material: GRAY_STAINED_GLASS_PANE
        hide-tooltip: true
        slots: 1-45
  size: 45
  entries: 10-36
  auto-correct: true
gui:
  area_various:
    title: <t:menu_title>Miscellaneous
    items:
      default:
        child_no-item:
          name: <t:error_heading>No Item in Hand
          lore:
          - <t:regular>You need to have an item
          - in your main hand.
        name:
          name: <t:regular_heading>Name
          lore:
          - <t:decoration>✖</t> <t:regular>Rename this area.
          - '   Aktuell: <t:user_content><v:name></t>'
          material: NAME_TAG
          slots: 20
        icon:
          name: <t:regular_heading>Icon
          lore:
          - <t:decoration>✖ </t><t:regular>Drag an item here to change the icon.
          - '    <t:decoration>• </t><t:regular>This helps you to recognize'
          - '      this area in the areas menu.'
          material: INHERIT
          slots: 26
        description:
          name: <t:regular_heading>Description
          lore:
          - <t:decoration>✖ </t><t:regular>Change the description of
          - '   this area.'
          - '   <t:decoration>• </t><t:regular><b>Current:'
          - '     <t:user_content><v:description></t>'
          material: OAK_SIGN
          slots: 23
  role:
    title: <t:menu_title><v:role>
    items:
      default:
        taxes_never:
          name: <t:regular_heading>This role doesn't pay Taxes
          lore:
          - <t:regular>It can't be changed for this role.
          material: GOLD_INGOT
          slots: 15
        settings:
          name: <t:regular_heading>Action Flags
          lore:
          - <t:decoration>✖ </t><t:regular>Toggle action flags like block breaking,
          - '   container opening etc.'
          material: IRON_PICKAXE
          slots: 29
        apply:
          name: '<t:regular_heading>Add to new Areas: <v:apply>'
          lore:
          - <t:decoration>✖ </t><t:regular>Should this role, including
          - '   its members and flags, be added'
          - '   to new area creations?'
          material: OAK_FENCE
          slots: 14
        members_ally:
          name: <t:regular_heading>Role Members
          lore:
          - <t:regular>All players that aren't trusted
          - and are part of an ally land, have
          - this role assigned.
          material: skin:e8b8c6a46d87cf86a55df214cf84bf45cca25edb9a676e96364dd6a6eea235b3
          slots: 11
        icon:
          name: <t:regular_heading>Icon
          lore:
          - <action:primary><label>Set Icon</label><desc><t:regular>Drag an item here
            to change the role icon.</desc></action>
          - <action:remove><label>Reset to Default</label></action>
          material: INHERIT
          slots: 13
          bedrock:
            detail: true
        taxes:
          name: '<t:regular_heading>Pays Taxes: <v:current>'
          lore:
          - <t:decoration>✖ </t><t:regular>Should members of this role
          - '   pay taxes?'
          - '   <t:decoration>• </t><t:regular>The land receives<t:regular_value>
            <v:taxes> <t:regular>in taxes'
          - '     from this role and area in'
          - '     <t:time><v:time></t>.'
          material: GOLD_INGOT
          slots: 15
        apply_always:
          name: <t:regular_heading>Adds Role to new Areas
          lore:
          - <t:regular>This role, including its members
          - and flags, is always added to new
          - area creations. That can't be
          - toggled for this role.
          material: OAK_FENCE
          slots: 14
        members_visitor:
          name: <t:regular_heading>Role Members
          lore:
          - <t:regular>All players that aren't trusted
          - have this role assigned.
          material: skin:e8b8c6a46d87cf86a55df214cf84bf45cca25edb9a676e96364dd6a6eea235b3
          slots: 11
        child_failure_priority:
          name: <t:error_heading>Role Priority
          lore:
          - <t:error>You're not allowed to edit
          - settings of this role.
          - ' <t:decoration>• </t><t:regular>It has a higher priority than'
          - '   yours or you''re a member of'
          - '   this role.'
        members_nation:
          name: <t:regular_heading>Role Members
          lore:
          - <t:regular>All players that aren't trusted
          - and are part of your nation, have
          - this role assigned.
          material: skin:e8b8c6a46d87cf86a55df214cf84bf45cca25edb9a676e96364dd6a6eea235b3
          slots: 11
        child_failure_access:
          name: <t:error_heading>Not Allowed
          lore:
          - <t:error>You're not allowed to edit
          - roles in this area.
          - ' <t:decoration>• </t><t:regular>The land owner can give your'
          - '   role dafür die Berechtigung geben.'
        management:
          name: <t:regular_heading>Management Flags
          lore:
          - <t:decoration>✖ </t><t:regular>Toggle administrative flags like
          - '   trusting players, claiming etc.'
          material: GOLD_INGOT
          slots: 30
        members:
          name: <t:regular_heading>Role Members
          lore:
          - <t:decoration>✖ </t><t:regular>View all role members.
          material: skin:e8b8c6a46d87cf86a55df214cf84bf45cca25edb9a676e96364dd6a6eea235b3
          slots: 11
        name:
          name: <t:regular_heading>Rename
          lore:
          - <t:decoration>✖ </t><t:regular>Rename this role.
          - '   Aktuell: <t:user_content><v:name></t>'
          material: NAME_TAG
          slots: 12
        child_failure_nation:
          name: <t:error_heading>Role managed by Nation
          lore:
          - <t:error>This role is partly managed
          - by your nation.
          - ' <t:decoration>• </t><t:regular>Only the nation''s capital can change'
          - '   this setting: <t:cmd>/<v:cmd></t>'
  list_area_invites:
    title: <t:menu_title>Sent Invites & Requests
    items:
      default:
        entry_object_owner_land:
          name: <t:entry_heading><v:player> <t:decoration>-</t> Ownership Request
          lore:
          - <t:regular>Sets this player as the new owner
          - of land <t:entity_land><v:land></t>.
          - ''
          - <t:regular_heading>Information</t>
          - ' <t:decoration>• </t><t:regular>Sent:<t:time> <v:time></t>'
          - ' <t:decoration>• </t><t:regular>Sender: <v:sender>'
          - ''
          - <action:remove><label>Revoke Invitation</label></action>
        entry_object_merge:
          name: <t:entry_heading><v:merge> <t:decoration>-</t> Merge Request
          lore:
          - <t:regular>Merges the land<t:entity_land> <v:merge></t> into this.
          - ''
          - <t:regular_heading>Information</t>
          - ' <t:decoration>• </t><t:regular>Sent:<t:time> <v:time></t>'
          - ' <t:decoration>• </t><t:regular>Sender: <v:sender>'
          - ' <t:decoration>• </t><t:regular>Receiver: <t:regular_value><v:receiver></t>'
          - ''
          - <action:remove><label>Revoke Invitation</label></action>
          material: INHERIT
        entry_object_trust_area:
          name: <t:entry_heading><v:player> <t:decoration>-</t> <t:regular_heading>Membership
            Invitation
          lore:
          - <t:regular>Adds this player to the area <t:regular_value><v:area></t>.
          - ''
          - <t:regular_heading>Information</t>
          - ' <t:decoration>• </t><t:regular>Sent:<t:time> <v:time></t>'
          - ' <t:decoration>• </t><t:regular>Sender: <v:sender>'
          - ''
          - <action:remove><label>Revoke Invitation</label></action>
          material: INHERIT
        child_failure_access:
          name: <t:error_heading>Nicht erlaubt
          lore:
          - <t:error>You're not allowed to revoke
          - invites in this area.
          - ' <t:decoration>• </t><t:regular>The land owner can give your role'
          - '   permission to remove players.'
        entry_object_trust_land:
          name: <t:entry_heading><v:player> <t:decoration>-</t> Membership Invitation
          lore:
          - <t:regular>Adds this player to the whole
          - land <t:entity_land><v:land></t>.
          - ''
          - <t:regular_heading>Information</t>
          - <t:decoration>• </t><t:regular>Sent:<t:time> <v:time></t>
          - '<t:decoration>✖ </t><t:regular>Sender: <v:sender>'
          - <action:remove><label>Revoke Invitation</label></action>
          material: INHERIT
        entry_object_owner:
          material: INHERIT
