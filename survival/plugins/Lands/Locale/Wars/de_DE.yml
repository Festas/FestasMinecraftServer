general:
  command:
    argument:
      type:
        tribute: tribute
        preparation_time: preparation time
  inbox:
    war:
      shield: <t:regular>Zusätzliche Kriegsschild-Zeit erhalten:<t:time> <v:0></t>.
        Gesamt:<t:time> <v:1></t>
      start: <t:regular>The war against<t:entity_land> <v:0></t> has started. Timeout:<t:time>
        <v:1></t>
      declaration:
        sent: <t:regular>Declared war against<t:entity_land> <v:0></t>. The war will
          start in<t:time> <v:1></t>.
        received: <t:negative_value><v:0></t> <t:negative>declared war against us.
          <t:regular>The war will start in<t:time> <v:1></t>.
        mutual:
          sent: <t:regular>Sent war request to<t:entity_land> <v:0></t>. They need
            to accept it.
          received: '<t:negative_value><v:0></t> <t:negative>hat eine Kriegsanfrage
            gesendet. Annehmen: <t:cmd>/<v:1></t>'
          denied: <t:regular>Mutual war declaration denied by<t:entity_land> <v:0></t>.
      surrender:
        sent: <t:negative>We surrendered to<t:negative_value> <v:0></t> before the
          war started. They robbed<t:cost> <v:1></t> from us.
        received: <t:regular>The enemy<t:entity_land> <v:0></t> surrendered before
          the war started. We robbed<t:cost> <v:1></t> from them.
      end:
        won: <t:regular>We've won the war against the enemy<t:entity_land> <v:0></t>
          with<t:regular_value> <v:1></t> Punkte. They only had<t:regular_value> <v:2></t>
          Punkte. We robbed<t:cost> <v:4></t> from them. The war took <t:time><v:3></t>.
        draw: <t:regular>The war against<t:entity_land> <v:0></t> ended in a draw
          with<t:regular_value> <v:1></t> Punkte.
        lost: <t:regular>We've lost the war against the enemy<t:entity_land> <v:0></t>
          with<t:regular_value> <v:1></t> Punkte. They had<t:regular_value> <v:2></t>
          Punkte. They robbed<t:cost> <v:4></t> from us. The war took <t:time><v:3></t>.
        annex:
          won: <t:regular>We annexed the enemy<t:entity_land> <v:0></t>! Their lands
            were unclaimed. The war took <t:time><v:1></t>.
          lost: <t:negative>We were annexed by<t:negative_value> <v:0></t>! Our lands
            were unclaimed. The war took <t:time><v:1></t>.
        vassal:
          won: <t:regular>We subjugated the enemy<t:entity_land> <v:0></t>! Their
            lands are now our vassals. The war took <t:time><v:1></t>.
          lost: <t:negative>Our land was subjugated by<t:negative_value> <v:0></t>
            <t:negative>and is now their vassal.
          freed: <t:positive>Our land was set free and is now independent after<t:negative_value>
            <v:0></t> <t:positive>won the war.
        independence:
          won: <t:positive>Our land won its independence war against<t:negative_value>
            <v:0></t> <t:positive>and is free!
          lost: <t:negative>Our independence war against<t:negative_value> <v:0></t>
            <t:negative>failed - we are a vassal again.
        raid:
          raided: <t:negative>Our lands are being raided by<t:negative_value> <v:0></t>
            <t:negative>for the next<t:time> <v:1></t>.
  wars:
    object:
      enemy: <t:error_value>Feind</t>
      ally: <t:regular_value>Ally</t>
    nametag:
      enemy: <t:error_value>ENEMY </t><t:decoration>| </t>
      ally: <t:regular_value>ALLY </t><t:decoration>| </t>
    state:
      preparation: <t:positive>Preparation</t>
      fight: <t:negative>Fight</t>
    mode:
      skirmish:
        description: <t:regular>Erreiche<t:regular_value> <v:points></t> Punkte oder
          gewinne by timeout.
    goal:
      skirmish:
        outcome: <t:regular><v:winner> <t:regular>robs<t:cost> <v:robbery></t> from
          <v:loser><t:regular>.
      annex:
        outcome: <t:negative><v:loser><t:regular>'s lands are annexed (unclaimed)
          by <v:winner><t:regular>.
      vassal:
        outcome: <t:negative><v:loser><t:regular>'s lands are subjugated as vassals
          of <v:winner><t:regular>.
      independence:
        outcome: <t:regular><v:winner> <t:regular>wins the independence war against
          <v:loser><t:regular>.
      raid:
        outcome: <t:negative><v:winner> <t:regular>raids <v:loser><t:regular>'s lands
          after the war.

wars:
  mode:
    skirmish:
      description: <t:regular>Erreiche<t:regular_value> <v:points></t> Punkte oder
        gewinne by timeout.
  goal:
    skirmish:
      outcome: <t:regular><v:winner> <t:regular>robs money from <v:loser><t:regular>.
    annex:
      outcome: <t:negative><v:loser><t:regular>'s lands are annexed (unclaimed) by
        <v:winner><t:regular>.
  message:
    noaccess:
      wilderness: '<t:error>You''re not allowed to do this in the wilderness while
        being engaged in a war. <t:decoration>Flag: </t><t:regular_value><v:flag></t>'
      general: '<t:error>You''re not allowed to do this in your current war against
        land<t:error_value> <v:land></t>. <t:decoration>Flag: </t><t:regular_value><v:flag></t>'
      pillage: <t:error>You can't pillage the land<t:error_value> <v:land></t> while
        not enough defenders are online. <t:regular>Please wait until a minimum of<t:limit>
        <v:defenders></t> defender(s) of land<t:entity_land> <v:land></t> are online.
      allies: <t:error>You can only invade the attacker<t:error_value> <v:attacker></t>
        and defender<t:error_value> <v:defender></t> in this war. <t:regular>Allies
        of either team can't be invaded.
    start:
      broadcast: <t:regular>The war between <v:attacker> <t:regular>and <v:defender>
        <t:regular>started. It will be over in<t:time> <v:time></t>.
    end:
      broadcast:
        won: <t:regular><v:winner><t:regular> won the war against <v:loser><t:regular>
          with<t:regular_value> <v:winner_Punkte></t> vs.<t:regular_value> <v:loser_Punkte></t>
          Punkte, robbing<t:cost> <v:robbery></t>. It took<t:time> <v:time></t>.
        surrendered:
          preparation: <v:loser> <t:regular>surrendered to <v:winner><t:regular> before
            the war started, robbed of<t:cost> <v:robbery></t>.
        draw: <t:regular>The war between <v:attacker> <t:regular>and <v:defender>
          <t:regular>endete unentschieden mit<t:regular_value> <v:points></t> Punkten.
          It took<t:time> <v:time></t>.
        annex: <t:regular><v:winner><t:regular> annexed <v:loser><t:regular> and unclaimed
          their lands. It took<t:time> <v:time></t>.
        vassal: <t:regular><v:winner><t:regular> subjugated <v:loser><t:regular> as
          a vassal. It took<t:time> <v:time></t>.
        independence:
          won: <t:positive><v:vassal><t:regular> won its independence from <v:overlord><t:regular>.
          lost: <t:regular><v:overlord><t:regular> crushed the rebellion of <v:vassal><t:regular>.
        raid: <t:regular><v:winner><t:regular> is raiding <v:loser><t:regular>'s lands
          for<t:time> <v:time></t>.
    kill:
      target:
        attackers: <t:regular>Our team mate<t:regular_value> <v:attacker></t> got
          killed by the defender<t:regular_value> <v:defender></t>.
        defenders: <t:regular>Our team mate<t:regular_value> <v:defender></t> got
          killed by the attacker<t:regular_value> <v:attacker></t>.
      killer:
        attackers: '<t:regular>Our team mate<t:regular_value> <v:attacker></t> killed
          the defender<t:regular_value> <v:defender></t>: <t:positive><b>+ <v:points>
          Punkte'
        defenders: '<t:regular>Our team mate<t:regular_value> <v:defender></t> killed
          the attacker<t:regular_value> <v:attacker></t>: <t:positive><b>+ <v:points>
          Punkte'
    capture:
      place:
        wilderness: <t:error>You can't place a capture flag in the wilderness. <t:regular>You
          need to place it inside an enemy land.
        overlap: <t:error>Eroberungsblöcke müssen so platziert werden, dass das Leuchtfeuer
          nicht overlap with the wilderness.
        region: <t:error>Can't place capture flag here. <t:regular>It overlaps with
          a capture region of another capture flag.
        outskirts: <t:error>Can't place capture flag here. <t:regular>You must place
          it in the outskirts of the land.
        state: <t:error>You're currently not at war against land<t:error_value> <v:land></t>
          or the war hasn't started yet.
        y: <t:error>Can't place capture flag here. <t:regular>It must be placed between<t:limit>
          <v:min></t> and<t:limit> <v:max></t> blocks of height.
        already: <t:error>Can't place capture flag here. <t:regular>There's already
          a capture flag placed in this chunk.
        space: <t:error>Can't place capture flag here. <t:regular>There's not enough
          space at this position.
        cooldown: <t:error>You need to wait<t:error_value> <v:time></t> before your
          team can place a capture flag again.
        max: <t:error>Your team already placed the maximum amount of<t:error_value>
          <v:max></t> simultaneously capture flags.
        invader: '<title><t:success>Eroberungspunkt<subtitle><t:success>placed in
          enemy land: <v:land>, <v:x>, <v:y>, <v:z><actionbar><t:success>Join them
          to capture the area.'
        defender: '<title><t:error>Eroberungspunkt<subtitle><t:error>placed in our
          land: <v:land>, <v:x>, <v:y>, <v:z><actionbar><t:error>Go there to join
          the defenders.'
      destroy:
        presence: <t:error>You currently can't break this capture flag. <t:regular>There
          are still<t:regular_value> <v:players></t> enemy players in this area.
        invader: <title><t:error>Eroberungspunkt<subtitle><t:error>in enemy land <v:land>
          has been destroyed
        defender: <title><t:success>Eroberungspunkt<subtitle><t:success>removed from
          our land <v:land><actionbar><t:success><b>+ <v:points> Punkte
        invaders-break: <t:error>Invaders aren't allowed to break their own capture
          flags.
      progress:
        none:
          area: <bossbar:white:solid><t:regular>Capturing paused - <t:regular_value><v:progress>%</t>
            - no team has the majority
          broadcast: '<bossbar:white:solid><t:regular>Capturing paused - <t:regular_value><v:progress>%</t>,
            x: <t:regular_value><v:x></t>, y: <t:regular_value><v:y></t>, z: <t:regular_value><v:z></t>'
        invaders:
          broadcast: '<bossbar:red:solid><t:error>Feind is capturing - <v:progress>%,
            <v:invaders> invader(s), x: <v:x>, y: <v:y>, z: <v:z>'
          invaders: <bossbar:red:solid><t:error>We are capturing - <v:progress>%,
            <v:defenders> defender(s)
          defenders: <bossbar:red:solid><t:error>Feind is capturing - <v:progress>%,
            <v:invaders> invader(s)
        defenders:
          broadcast: '<bossbar:green:solid><t:positive>We are capturing back - <v:progress>%,
            <v:invaders> invader(s), x: <v:x>, y: <v:y>, z: <v:z>'
          invaders: <bossbar:red:solid><t:error>Defenders are capturing back - <v:progress>%,
            <v:defenders> defender(s)
          defenders: <bossbar:green:solid><t:positive>We are capturing back - <v:progress>%,
            <v:invaders> invader(s)
      health:
        status: '<bossbar:white:solid><t:regular>Eroberungsflaggen-Leben: <t:regular_value><v:health>%</t>'
        invaders: <t:positive>Deine Eroberungsflagge ist intakt! <t:positive><b>+<v:points>
          <!b><t:regular>Punkte awarded to your team.
        defenders: <t:positive>Die Eroberungsflagge des Feindes ist geschwächt! <t:positive><b>+<v:points>
          <!b><t:regular>Punkte rewarded.
        damage: '<t:regular>Eroberungsflagge: <t:error_value>-<v:damage></t> hp <t:decoration>|
          </t><t:error_value><v:health>%</t> <t:regular>remaining.'
      online: '<actionbar><t:error>Can''t capture: Min. of<t:error_value> <v:min></t>
        player(s) of land<t:error_value> <v:land></t> need to be online.'
      success:
        invader: <title><t:success>Eroberungspunkt<subtitle><t:success>we captured
          <v:chunks> Chunk(s) von <v:land><actionbar><t:success><b>+ <v:points> Punkte
        defender: <title><t:error>Eroberungspunkt<subtitle><t:error>enemy captured
          <v:chunks> chunk(s) of <v:land>
  command:
    declare:
      not-allowed: <t:error>Du darfst keinen Krieg starten für<t:error_value> <v:object></t>.
        <t:regular>The leader of <v:object> <t:regular>needs to do this.
      hours: '<t:error>You can only declare war during the following hours:<t:error_value>
        <v:hours></t> <t:decoration>(</t><t:regular>current time:<t:time> <v:current></t>,
        time zone: <t:time><v:timezone></t><t:decoration>)</t>'
      enemies: |
        <t:error>You must add<t:error_value> <v:object></t> as an enemy first.
          <hover:show_text:"<t:regular>Klicke hier, um <v:object> <t:regular>als Feind hinzuzufügen, damit du ihnen den Krieg erklären kannst."><click:run_command:"/<v:cmd>"><t:regular>✖ Als Feind hinzufügen: <t:cmd>/<v:cmd> </t><java><t:click>[CLICK]</t></java></click></hover>
      ally: |
        <t:error>Du kannst deinem Verbündeten nicht den Krieg erklären<t:error_value> <v:object></t>.
          <hover:show_text:"<t:regular>Klicke hier, um deine Beziehungen zu verwalten."><click:run_command:"/<v:cmd>"><t:regular>✖ Beziehungen verwalten: <t:cmd>/<v:cmd> </t><java><t:click>[CLICK]</t></java></click></hover>
      nation: <t:error>You can't declare war against<t:error_value> <v:object></t>.
        <t:regular>Sie sind Teil derselben Nation<t:entity_nation> <v:nation></t>.
      min-balance:
        attacker: '<t:error>Diese Kriegserklärung kann nicht gesendet werden. <t:regular>Die
          Angreifer <v:object> <t:regular>benötigen ein Mindestguthaben von<t:limit>
          <v:min></t> in um einen Krieg zu beginnen. Zahle Geld in deine Landbank
          ein: <hover:show_text:"<t:regular>Click hier, um <v:min> in deine Landbank
          einzuzahlen."><click:run_command:"/<v:cmd>"><t:cmd>/<v:cmd> </t><java><t:click>[CLICK]</t></java></click></hover>'
        defender: <t:error>Das Guthaben der Verteidiger <v:object> <t:error>ist zu
          niedrig. <t:regular>Du kannst nur andere angreifen, die ein Mindestguthaben
          von<t:limit> <v:min></t>.
      min-chunks:
        attacker: '<t:error>Diese Kriegserklärung kann nicht gesendet werden. <t:regular>Die
          Angreifer <v:object> <t:regular>benötigen mindestens<t:limit> <v:min></t>
          chunks um einen Krieg zu beginnen. Claime: <hover:show_text:"<t:regular>Klicke
          hier, um zu claimen."><click:run_command:"/<v:cmd>"><t:cmd>/<v:cmd> </t><java><t:click>[CLICK]</t></java></click></hover>'
        defender: <t:error>Die Anzahl der Claims der Verteidiger <v:object> <t:error>ist
          zu niedrig. <t:regular>You can only attack others that have a minimum amount
          of<t:limit> <v:min></t> chunks.
      min-age:
        attacker: <t:error>Can't send this declaration. <t:regular>The attackers <v:object>
          <t:regular>need to be at least<t:time> <v:min></t> old in order to start
          a war.
        defender: <t:error>The age of the defenders <v:object> <t:error>is too low.
          <t:regular>You can only attack others that are at least<t:time> <v:min></t>
          old.
      online: <t:error>Can't send this declaration. <t:regular>At least one player
        of <v:object> <t:regular>need to be online.
      broadcast: <t:regular><v:attacker> <t:regular>declared war against <v:defender><t:regular>.
        Their war will start in<t:time> <v:time></t>.
      success:
        normal: <t:regular>You <t:decoration>(<v:object></t><t:decoration>) </t><t:regular>successfully
          declared war against <v:enemy><t:regular>. The war will start in<t:time>
          <v:time></t>.
        mutual:
          sent: <t:regular>You <t:decoration>(<v:object></t><t:decoration>) </t><t:regular>sent
            a war request to <v:enemy><t:regular>. They need to accept it, before
            this war can start.
      target: <t:regular>The enemy <v:attacker> <t:regular>declared war against <v:defender>
        <t:decoration>(</t><t:regular>YOU<t:decoration>)</t><t:regular>. The war will
        start in<t:time> <v:time></t>.
      already:
        attacker: <t:error>Can't join another war. <t:regular>The current war of <v:object>
          <t:regular>needs to end first.
        defender: <t:error>You currently can't declare war against them. <t:regular>The
          target <v:object> <t:regular>is already engaged in a war.
      min-players:
        attacker: <t:error>You can't engage in a war, because<t:error_value> <v:object></t>
          needs more trusted players. <t:regular>The required minimum for attackers
          to declare war is<t:limit> <v:min></t> players.
        defender: <t:error>You can't declare war against<t:error_value> <v:object></t>,
          because they need more trusted players. <t:regular>The required minimum
          for defenders to receive a war declaration is<t:limit> <v:min></t> players.
      level-difference: <t:error>You can't declare war against<t:error_value> <v:defender></t><t:error>.
        <t:regular>They're too far from <v:attacker><t:regular> in level <t:decoration>(</t><t:regular><v:defender_level>
        <t:regular>vs <v:attacker_level><t:decoration>)</t><t:regular>. You can only
        declare war within<t:limit> <v:max></t> level(s).
    deny:
      attacker: <t:error>Attackers can't deny their own war declaration. <t:regular>Only
        the defender can do that.
      success: <t:regular>You successfully denied the war declaration for <v:object>
        <t:regular>against the enemy <v:enemy><t:regular>.
    menu:
      mutual: <t:error>You can't open the war menu right now. <t:regular>The war declaration
        to <v:object> <t:regular>hasn't been accepted yet.
    info:
      war: |
        <t:regular_heading>Aktueller Krieg:</t>
        <t:decoration>- </t><t:regular>Angreifer <v:attacker><t:regular>:
             <t:decoration>• </t><t:regular>Captures: <t:regular_value><v:att_cap></t>
             <t:decoration>• </t><t:regular>Kills: <t:regular_value><v:att_kills></t>
               <t:decoration>= </t><t:regular_value><v:att_Punkte></t> / <t:regular_value><v:towin></t> <t:regular>Punkte to win
               <v:att_bar>
        <t:decoration>- </t><t:regular>Verteidiger <v:defender><t:regular>:
             <t:decoration>• </t><t:regular>Captures: <t:regular_value><v:def_cap></t>
             <t:decoration>• </t><t:regular>Kills: <t:regular_value><v:def_kills></t>
               <t:decoration>= </t><t:regular_value><v:def_Punkte></t> / <t:regular_value><v:towin></t> <t:regular>Punkte to win
               <v:def_bar>

        <t:regular>Timeout:<t:time> ~<v:time></t>
        <hover:show_text:"<t:regular>Klicke hier, um das war menu."><click:run_command:"/<v:cmd>"><t:regular>Mehr Infos: <t:cmd>/<v:cmd> </t><java><t:click>[CLICK]</t></java></click></hover>
      declaration:
        normal: |
          <t:regular_heading>Kriegserklärung:</t>
            <t:decoration>• </t><t:regular>Angreifer: <v:attacker>
            <t:decoration>• </t><t:regular>Verteidiger: <v:defender>
            <t:decoration>• </t><t:regular>Starts in:
              <t:time>~<v:time></t>

          <hover:show_text:"<t:regular>Klicke hier, um das war menu."><click:run_command:"/<v:cmd>"><t:regular>Mehr Infos: <t:cmd>/<v:cmd> </t><java><t:click>[CLICK]</t></java></click></hover>
        mutual:
          defender: |
            <t:regular_heading>Kriegserklärung:</t>
              <t:decoration>• </t><t:regular>Angreifer: <v:attacker>
              <t:decoration>• </t><t:regular>Verteidiger: <v:defender>

            <hover:show_text:"<t:regular>Klicke hier, um die Kriegserklärung anzunehmen."><click:run_command:"/<v:cmd_accept>"><t:positive>✔ Annehmen: <t:cmd>/<v:cmd_accept> </t><java><t:click>[CLICK]</t></java></click></hover>
            <hover:show_text:"<t:regular>Klicke hier, um die Kriegserklärung abzulehnen."><click:run_command:"/<v:cmd_deny>"><t:negative>✘ Ablehnen: <t:cmd>/<v:cmd_deny> </t><java><t:click>[CLICK]</t></java></click></hover>
          attacker: |
            <t:regular_heading>Kriegserklärung:</t>
              <t:decoration>• </t><t:regular>Angreifer: <v:attacker>
              <t:decoration>• </t><t:regular>Verteidiger: <v:defender>

            <t:regular>The defender hasn't accepted
            the declaration yet.
help:
