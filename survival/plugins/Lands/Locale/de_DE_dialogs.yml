# Wiki: https://wiki.incredibleplugins.com/general/locale-and-config/dialogs

dialogs:
  confirm:
    title: Bestätigen
    bodies:
      info:
        text: <v:message>
    buttons:
      confirm:
        label: <t:positive>Bestätigen
        tooltip: Klicke hier, um zu bestätigen.
      discard:
        label: <t:negative>Abbrechen
        tooltip: Klicke, um abzubrechen.
  input:
    title: Eingabe
    inputs:
      text:
        label: Text
      player:
        label: Spieler
    buttons:
      confirm:
        label: <t:positive>Bestätigen
        tooltip: Klicke hier, um deine Eingabe zu bestätigen.
      discard:
        label: <t:negative>Verwerfen
        tooltip: Klicke, um deine Eingabe zu verwerfen.
  add_member:
    title: Spieler hinzufügen
    inputs:
      name:
        label: Spieler
    buttons:
      add:
        label: <t:positive>Hinzufügen
        tooltip: Vertraue diesem Spieler dauerhaft.
      add-temporary:
        label: <t:regular_value>Temporär hinzufügen
        tooltip: Vertraue diesem Spieler für eine begrenzte Zeit.
      discard:
        label: <t:negative>Verwerfen
        tooltip: Klicke, um zu verwerfen.
  add_member_duration:
    title: Temporäres Vertrauen
    inputs:
      days:
        type: number-range
        label: Tage
        label-format: '<v:label>: <v:value>'
        start: 0
        end: 30
        step: 1
        initial: 0
      hours:
        type: number-range
        label: Stunden
        label-format: '<v:label>: <v:value>'
        start: 0
        end: 23
        step: 1
        initial: 0
    bodies:
      info:
        text: Der Spieler wird nur für die ausgewählte Dauer vertraut. Ein temporär
          vertrauter Spieler zahlt keine Steuern und kann weder claimen noch freigeben,
          außer er ist in einem anderen Bereich dauerhaft vertraut.
    buttons:
      add:
        label: <t:positive>Hinzufügen
        tooltip: Vertraue diesem Spieler für die gewählte Dauer.
      back:
        label: <t:regular>Zurück
        tooltip: Gehe zurück.
  land_create:
    title: Neues Land erstellen
    inputs:
      name:
        label: Name
      tag:
        label: Kürzel
    bodies:
      info:
        text: Das Erstellen dieses Landes kostet dich<t:cost> <v:cost></t>. Für dein
          neues Land werden<t:regular_value> <v:chunks></t> Chunks geclaimt, sofern
          genug Platz vorhanden ist.
      tag:
        text: Das Kürzel ist die Kurzform des Landnamens.
        item:
          material: NAME_TAG
          hide-tooltip: true
    buttons:
      confirm:
        label: <t:positive>Erstellen
        tooltip: Klicke hier, um ein neues Land zu erstellen.
      discard:
        label: <t:negative>Verwerfen
        tooltip: Klicke, um die Landerstellung zu verwerfen.
