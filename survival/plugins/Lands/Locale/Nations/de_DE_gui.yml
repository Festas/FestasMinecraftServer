general:
  nation:
    role:
      capital: <t:entity_land><b>Hauptland</t>
      land: <t:entity_land><b>Land</t>
      vassal: <t:negative><b>Vasall</t>

gui:
  nation:
    title: <t:menu_title><v:level> <v:nation>
    items:
      default:
        role:
          name: <t:regular_heading>Nationsrolle
          lore:
          - <t:decoration>✖ </t><t:regular>Lege fest, was Nationsmitglieder
          - '   in jedem Land tun dürfen, das Teil'
          - '   dieser Nation ist.'
          - ''
          - <t:decoration>✖ </t><t:negative>Vasallenländer erhalten diese Rolle nicht
          - '   und ihre Spieler können sie in deinen Ländern nicht nutzen.'
          material: INHERIT
          slots: 30
        level:
          name: <t:regular_heading>Level
          lore:
          - <t:decoration>✖ </t><t:regular>Sieh Fortschritt und
          - '   Attribute.'
          material: EXPERIENCE_BOTTLE
          slots: 15
        war:
          name: <t:negative_heading>Aktiver Krieg
          lore:
          - <t:decoration>✖ </t><t:regular>Zeige Informationen über
          - '   den aktuellen Krieg.'
          material: IRON_SWORD
          slots: 12
        taxes:
          name: <t:regular_heading>Steuern
          lore:
          - <t:decoration>✖ </t><t:regular>Besteuere Länder, die Teil
          - '   dieser Nation sind, nach ihrer Größe.'
          - ''
          - '   <t:decoration>• </t><t:regular>Mitgliedersteuer:<t:cost> <v:tax></t>'
          - '   <t:decoration>• </t><t:regular>Vasallensteuer:<t:cost> <v:vassal_tax></t>'
          material: GOLD_INGOT
          slots: 29
        child_failure_spawn_teleport:
          name: <t:error_heading>Teleport nicht erlaubt
          lore:
          - <t:error>Du darfst dich nicht zum Spawn
          - des Hauptlands teleportieren.
          - ' <t:decoration>• </t><t:regular>Der Besitzer des Hauptlands kann'
          - '   deiner Rolle die Berechtigung dafür geben.'
        effects:
          name: <t:regular_heading>Effekte
          lore:
          - <t:decoration>✖ </t><t:regular>Lege Effekte fest, die in
          - '   deiner Nation aktiv sind. Effekte werden'
          - '   durch den Nationsfortschritt freigeschaltet.'
          material: POTION
          slots: 31
        spawn:
          name: <t:regular_heading>Spawn
          lore:
          - <t:decoration>✖ </t><t:regular>Teleportiere dich zum Spawn des Hauptlands.
          material: ENDER_PEARL
          slots: 9
        stats:
          name: <t:regular_heading>Statistiken
          lore:
          - '<t:regular>Spieler gesamt: <t:regular_value><v:members></t>'
          - ''
          - <t:regular_heading>Wirtschaft</t>
          - ' <t:decoration>• </t><t:regular>Nation'
          - '   Kontostand: <t:regular_value><v:balance></t>'
          - '   Die Nation zahlt<t:cost> <v:upkeep></t> Unterhalt'
          - '   in <t:time><v:upkeep_next></t>.'
          - ' <t:decoration>• </t><t:regular>Nächste Landsteuer in'
          - <t:time><v:upkeep_next_land></t>.
          material: skin:d01afe973c5482fdc71e6aa10698833c79c437f21308ea9a1a095746ec274a0f
          slots: 16
        lands:
          name: <t:regular_heading>Länder
          lore:
          - <t:decoration>✖ </t><t:regular>Verwalte Länder, die Teil
          - '   dieser Nation sind.'
          material: skin:8449b9318e33158e64a46ab0de121c3d40000e3332c1574932b3c849d8fa0dc2
          slots: 11
        no-war:
          name: <t:positive_heading>Friedlich
          lore:
          - <t:regular>Deine Nation befindet sich in keinem
          - Krieg. Alles ist friedlich.
          material: WOODEN_SWORD
          slots: 12
        relations:
          name: <t:regular_heading>Beziehungen
          lore:
          - <t:decoration>✖ </t><t:regular>Verwalte deine Beziehungen zu
          - '   anderen Ländern und Nationen.'
          material: LIME_BANNER
          slots: 14
        inbox:
          name: <t:regular_heading>Posteingang</t> <t:decoration>(</t><t:regular_value><v:amount></t><t:decoration>)</t>
          lore:
          - <t:decoration>✖ </t><t:regular>Sieh Nachrichten im Posteingang.
          - ''
          - <t:regular_value><v:inbox></t>
          material: skin:6bf3fcdccffd963e4334818108e1e9ae3a80566d0d3d2d4ab3051a2cd811348c
          slots: 13
        various:
          name: <t:regular_heading>Sonstige Einstellungen
          lore:
          - <t:decoration>✖ </t><t:regular>Edit the nation name, tag
          - '   icon etc.'
          material: BEACON
          slots: 32
        child_failure_spawn_none:
          name: <t:error_heading>No Spawnpoint
          lore:
          - <t:error>The capital hasn't set a spawn yet.
          - ' <t:decoration>• </t><t:regular>Set spawn point:'
          - '   <t:cmd>/<v:cmd></t>'
  nation_various:
    title: <t:menu_title>Sonstiges
    items:
      default:
        object_name:
          slots: 20
        object_tag:
          slots: 23
        object_icon:
          slots: 26
  list_nation_effects:
    title: <t:menu_title>Effects
    items:
      default:
        child_failure_max:
          name: <t:error_heading>Max Amount
          lore:
          - <t:error>Your nation reached its maximum
          - amount of<t:error_value> <v:max></t> concurrent
          - active effects.
          - ' <t:decoration>• </t><t:regular>You can have more effects'
          - '   active at the same time, by'
          - '   reaching a higher level.'
        child_failure_locked:
          name: <t:error_heading>Level too low
          lore:
          - <t:error>Your nation needs to reach
          - level<t:error_value> <v:level></t> before you're
          - able to activate this effect.
        entry_object:
          name: '<t:entry_heading><v:effect>: <v:active>'
          lore:
          - <t:decoration>✖ </t><t:regular>Should this effect be active
          - '   within your nation''s lands?'
          material: POTION
        entry_object_locked:
          name: <t:entry_heading><v:effect>
          lore:
          - '<t:regular>Unlocks at level: <t:regular_value><v:level></t>'
          material: POTION
        entry_object_active:
          name: '<t:entry_heading><v:effect>: <v:active>'
          lore:
          - <t:decoration>✖ </t><t:regular>Should this effect be active
          - '   within your nation''s lands?'
          enchanted: true
          material: POTION
  list_nation_lands:
    title: <t:menu_title>Nationsmitglieder
    items:
      default:
        add:
          name: <t:positive_heading>Land hinzufügen
          lore:
          - <t:decoration>✖ </t><t:regular>Invite a land to join your nation.
          - '   Available:<t:regular_value> <v:lands></t> <t:decoration>/</t><t:limit>
            <v:max></t>'
          material: skin:ffec3d25ae0d147c342c45370e0e43300a4e48a5b43f9bb858babff756144dac
          slots: 39
        members_online:
          name: <t:regular_heading>Online-Mitglieder
          lore:
          - <t:decoration>✖ </t><t:regular>View members that are online.
          material: CLOCK
          slots: 41
        entry_object:
          name: <t:entry_heading><v:prefix><v:land>
          lore:
          - '<t:regular>Title:'
          - <t:user_content><v:title></t>
          - ''
          - <action:primary><label>View Information</label></action>
          - <action:remove><label>Remove from Nation</label></action>
          material: INHERIT
          bedrock:
            detail: true
        remove:
          name: <t:negative_heading>Land entfernen
          lore:
          - <t:decoration>✖ </t><t:regular>Remove a land from your nation.
          material: skin:548d7d1e03e1af145b0125ab841285672b421265da2ab915015f9058438ba2d8
          slots: 43
  list_player_nations:
    title: <t:menu_title>Deine Nationen
    items:
      default:
        entry_nation_own:
          name: <t:entry_heading><v:nation>
          lore:
          - <t:regular>You own this nation.
          - ' <t:decoration>• </t><t:regular>Lands: <t:regular_value><v:lands></t>'
          - ' <t:decoration>• </t><t:regular>Chunks: <t:regular_value><v:chunks></t>'
          - ' <t:decoration>• </t><t:regular>Total members: <t:regular_value><v:members></t>'
          - <action:primary><label>Open Nation Menu</label></action>
          - <action:secondary><label>View Information</label></action>
          material: INHERIT
          bedrock:
            detail: true
        entry_nation:
          name: <t:entry_heading><v:nation>
          lore:
          - <t:regular>You're trusted in this nation.
          - ' <t:decoration>• </t><t:regular>Lands: <t:regular_value><v:lands></t>'
          - ' <t:decoration>• </t><t:regular>Total chunks: <t:regular_value><v:chunks></t>'
          - ' <t:decoration>• </t><t:regular>Total members: <t:regular_value><v:members></t>'
          - <action:primary><label>Open Nation Menu</label></action>
          - <action:secondary><label>View Information</label></action>
          material: INHERIT
          bedrock:
            detail: true
        entry_nation_edit:
          material: skin:eef425b4db7d62b200e89c013e421a9e110bfb27f2d8b9f5884d10104d00f4f4
