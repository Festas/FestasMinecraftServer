nations:
  message:
    current-war: <t:error>You can't do this right now. <t:regular>Your nation<t:entity_nation>
      <v:nation></t> is currently engaged in a war. <t:regular>Please try again after
      the war is over.
    untrusted: <t:error>You're not a member of nation<t:error_value> <v:nation></t>.
  command:
    general:
      none: |
        <t:error>Your land<t:error_value> <v:land></t> isn't part of any nation.

          <t:regular>Any nation can invite your land: <t:cmd>/<v:cmd_trust>
          </t><hover:show_text:"<t:regular>Klicke zum Kopieren."><click:suggest_command:"/<v:cmd>"><t:regular>Erstelle deine eigene Nation: <t:cmd>/<v:cmd> </t><java><t:click>[CLICK]</t></java></click></hover>
    create:
      camp: |
        <t:error>You can't create a nation with a camp <t:decoration>(</t><t:error_value><v:land></t>) <t:error>as the capital.
          <hover:show_text:"<t:regular>Create a land. Klicke zum Kopieren."><click:suggest_command:"/<v:cmd_create>"><t:regular>✖ Land erstellen: <t:cmd>/<v:cmd_create> </t><java><t:click>[CLICK]</t></java></click></hover>
      already: <t:error>Your land<t:error_value> <v:land></t> is already part of the
        nation<t:error_value> <v:nation></t>. <t:regular>Your land needs to leave
        it first by executing <t:cmd>/<v:cmd></t><t:regular>.
      war: <t:error>You can't create a nation with land<t:error_value> <v:land></t>
        as the capital while it is engaged in a war against<t:error_value> <v:object></t>.
        <t:regular>Please try again after the war is over.
      level: '<t:error>You currently can''t create a nation. <t:regular>Your land<t:entity_land>
        <v:land></t> needs to be at least level<t:regular_value> <v:level></t> <t:decoration>(</t><t:regular>current:
        <t:regular_value><v:current></t><t:decoration>)</t><t:regular>.'
      success: <t:regular>You successfully created the nation<t:entity_nation> <v:nation></t>
        with the land<t:entity_land> <v:land></t> as the capital. <hover:show_text:"<t:regular>Open
        the menu."><click:run_command:"/<v:cmd>"><t:regular>Klicke hier, um das menu.</click></hover>
    nation:
      chat:
        activated: <t:regular>Activated nation chat. Send a message in public chat
          to chat with your nation.
        deactivated: <t:regular>Successfully deactivated nation chat.
        none: |
          <t:error>No nation found for nation chat.
            <hover:show_text:"<t:regular>Klicke hier, um den Chatmodus zu deaktivieren."><click:run_command:"/<v:cmd>"><t:regular>✖ <t:regular>Chatmodus deaktivieren: <t:cmd>/<v:cmd> </t><java><t:click>[CLICK]</t></java></click></hover>
        format:
          minecraft: <noprefix><t:entity_nation>Nation <v:nation></t> <t:decoration>|
            </t><t:regular_value><v:player_display></t> »<t:user_content> <v:message></t>
          discord: <noprefix><t:entity_nation>Nation <v:nation></t> <t:decoration>|
            </t><t:entity_nation>Discord </t><t:regular_value><v:player_display></t>
            <t:decoration>»</t><t:user_content> <v:message></t>
          spy: <noprefix><t:decoration>[</t><t:negative>Chat-Spion<t:decoration>]
            </t><t:entity_nation>Nation <v:nation> </t>| <t:regular_value><v:player_display>
            </t>»<t:user_content> <v:message></t>
      delete:
        confirm: |
          <t:regular>Please confirm the deletion of nation<t:entity_nation> <v:nation></t> by clicking below:
            <hover:show_text:"<t:regular>Klicke hier, um diese Aktion zu bestätigen."><click:run_command:"/<v:fullcmd>"><t:success>✔ Bestätigen: <t:cmd>/<v:fullcmd> </t><java><t:click>[CLICK]</t></java></click></hover>
        war: <t:error>Du kannst deine Nation aktuell nicht löschen. <t:regular>Nation<t:entity_nation>
          <v:nation></t> is currently engaged in a war against <v:object><t:regular>.
          Please try again when the war is over.
        success: <t:regular>Diese Nation wurde erfolgreich gelöscht <t:decoration>(</t><t:regular>Nation:<t:entity_nation>
          <v:nation></t><t:decoration>)</t><t:regular>.
      rename:
        success: <t:regular>Successfully set the new name<t:regular_value> <v:name></t>
          for this nation <t:decoration>(</t><t:regular>Nation:<t:entity_nation> <v:nation></t><t:decoration>)</t><t:regular>.
          You paid<t:cost> <v:cost></t>.
      member:
        add:
          camp: <t:error>Camps can't be part of nations. <t:regular>The land<t:entity_land>
            <v:land></t> is a camp.
          max-distance: <t:error>The land<t:error_value> <v:land></t> is too far away
            from the capital of nation<t:error_value> <v:nation></t>. <t:regular>Max:<t:limit>
            <v:max> block(s)</t>, actual distance:<t:regular_value> <v:distance> block(s)</t>
          already: <t:error>The land<t:error_value> <v:land></t> is already part of
            the nation<t:error_value> <v:nation></t>. <t:regular>They need to leave
            it first by using <t:cmd>/<v:cmd></t><t:regular>.
          added: <t:regular>You successfully added your land<t:entity_land> <v:land></t>
            as a member of your nation<t:entity_nation> <v:nation></t>.
          success: <t:regular>You successfully invited land<t:entity_land> <v:land></t>
            to join your nation<t:entity_nation> <v:nation></t>.
          target: |
            <t:regular>Nation<t:entity_nation> <v:nation></t> hat dein Land<t:entity_land> <v:land></t> eingeladen, ihnen beizutreten.
              <hover:show_text:"<t:regular>Klicke hier, um diese Einladung anzunehmen."><click:run_command:"/<v:cmd_accept>"><t:success>✔ Annehmen: <t:cmd>/<v:cmd_accept> </t><java><t:click>[CLICK]</t></java></click></hover>
              <hover:show_text:"<t:regular>Klicke hier, um diese Einladung abzulehnen."><click:run_command:"/<v:cmd_deny>"><t:negative>✘ Ablehnen: <t:cmd>/<v:cmd_deny> </t><java><t:click>[CLICK]</t></java></click></hover>
        remove:
          capital: <t:error>You can't remove this land. <t:regular>Land<t:entity_land>
            <v:land></t> is the capital of nation<t:entity_nation> <v:nation></t>.
          already: <t:error>Land<t:error_value> <v:land></t> isn't a member of nation<t:error_value>
            <v:nation></t>.
          success: <t:regular>You successfully removed land<t:entity_land> <v:land></t>
            from nation<t:entity_nation> <v:nation></t>.
          noaccess: '<t:error>You''re not allowed to do this for nation<t:error_value>
            <v:nation></t>. <t:decoration>Flag: </t><t:regular_value><v:flag></t>'
        setcapital:
          confirm: |
            <t:regular>Please confirm that you want to set land<t:entity_land> <v:land></t> as the new capital of nation<t:entity_nation> <v:nation></t>:
              <hover:show_text:"<t:regular>Klicke hier, um diese Aktion zu bestätigen."><click:run_command:"/<v:fullcmd>"><t:success>✔ Bestätigen: <t:cmd>/<v:fullcmd> </t><java><t:click>[CLICK]</t></java></click></hover>
          level: '<t:error>You can''t set the land<t:error_value> <v:land></t> as
            the new capital of nation<t:error_value> <v:nation></t>. <t:regular>It
            needs to be at least level<t:regular_value> <v:level></t> <t:decoration>(</t><t:regular>current:
            <t:regular_value><v:current></t><t:decoration>)</t><t:regular>.'
          success: <t:regular>Successfully set the land<t:entity_land> <v:land></t>
            as the new capital of nation<t:entity_nation> <v:nation></t>.
          not-trusted: <t:error>The land<t:error_value> <v:land></t> isn't a member
            of your nation<t:error_value> <v:nation></t>.
          vassal: <t:error>The land<t:error_value> <v:land></t> is a vassal of nation<t:error_value>
            <v:nation></t> <t:error>and can't be made its capital.

