dialogs:
  nation_create:
    title: Neue Nation erstellen
    inputs:
      name:
        label: Name
      tag:
        label: Kürzel
    bodies:
      info:
        text: Das Erstellen dieser Nation kostet dich<t:cost> <v:cost></t>.
      tag:
        text: Das Kürzel ist die Kurzform des Nationsnamens.
        item:
          material: NAME_TAG
          hide-tooltip: true
    buttons:
      confirm:
        label: <t:positive>Erstellen
        tooltip: Klicke hier, um eine neue Nation zu erstellen.
      discard:
        label: <t:negative>Verwerfen
        tooltip: Klicke, um die Nationserstellung zu verwerfen.
