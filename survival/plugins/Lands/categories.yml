# In dieser Datei können Kategorien konfiguriert werden. Land-Kategorien können
# im Verschiedenes-Optionen-Menü eines Landes gesetzt werden. Damit können Spieler
# z. B. Shop-Länder im /lands list-Menü einfacher finden.
#
# Eigene Kategorien können hinzugefügt und bestehende gelöscht werden.
# HINWEIS: Ein Server-Neustart oder -Reload ist erforderlich, damit Änderungen dieser Datei wirksam werden.

land:
  enabled: true
  categories:
    members:
      enabled: true
      # Allow land owners to enable a option to automatically accept new membership requests.
      # If set to false, the option is also disabled for existing lands, when the server is restarted.
      allow-auto-accept: true
      name: '&eMitglieder gesucht ☺'
      description:
      - '&7Dieses Land sucht aktiv'
      - '&7nach neuen Mitgliedern.'
    shop:
      enabled: true
      name: '&cShop $'
      description:
      - '&7Dieses Land enthält Shops.'
    pvp:
      enabled: true
      name: '&4PvP-Arena ⚔'
      description:
      - '&7Dieses Land verfügt über'
      - '&7eine PvP-Arena.'
    mobfarm:
      enabled: true
      name: '&9Mobfarm'
      description:
      - '&7Dieses Land verfügt über'
      - '&7eine Mobfarm.'
