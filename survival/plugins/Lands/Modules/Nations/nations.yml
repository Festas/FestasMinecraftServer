# Erklärung für Spieler: https://wiki.incredibleplugins.com/lands/players/general/nations

# Nationen aktivieren?
# HINWEIS: Diese Einstellung erfordert einen Server-Neustart.
enabled: true

nation:
  # Erstellung anpassen
  creation:
    # Erstellungskosten festlegen
    costs: 20000.0
    # Eine bestimmte Land-Stufe für die Nationserststellung voraussetzen. 1 = diese Voraussetzung deaktivieren.
    # HINWEIS: Dies muss der Abschnittsname der jeweiligen Stufe sein.
    # Diese Option erfordert einen Server-Neustart.
    capital-level: 5
    # Sollen neue Nationen eine zufällige Farbe für ihren Namen erhalten?
    # HINWEIS: Hat keine Wirkung, wenn nation.name.color auf false gesetzt ist.
    random-color: false

  # Nationsname-Optionen
  name:
    # Sollen Leerzeichen in Nationsnamen erlaubt sein?
    # Leerzeichen werden durch einen Unterstrich ersetzt, wenn der Name als Befehlsparameter angezeigt wird.
    # Wenn diese Option nachträglich deaktiviert wird, werden Leerzeichen aus bestehenden Nationen entfernt.
    spaces: false
    # Mindestlänge des Nationsnamens
    min-length: 5
    # Maximale Namenlänge der Nation
    # Maximale Länge: 80 bei MySQL, 32 bei SQLite (inkl. Farbcodes).
    # Namen filtern: https://wiki.incredibleplugins.com/general/locale-and-config/messages#filter-swear-words-and-forbidden-names
    max-length: 24
    # Sollen Farben in Nationsnamen erlaubt sein?
    # Wenn nachträglich deaktiviert, werden Farben aus bestehenden Nationen entfernt.
    color: true
    # Sollen Formatierungen wie Fett, Unterstrichen usw. in Nationsnamen erlaubt sein?
    format: true
    # Sollen Zahlen in Nationsnamen erlaubt sein?
    numbers: true
    # Nur lateinische Buchstaben für Nationsnamen erlauben?
    # Wenn aktiviert: Keine chinesischen Buchstaben usw.
    only-latin: false

    # Umbenennungseinstellungen
    # Befehl: /nations rename
    rename:
      # Kosten für jede Namensänderung.
      costs_2: 10000.0
      # Die Nation muss x warten, bevor sie den Namen wieder ändern kann.
      # Bypass-Berechtigung: lands.bypass.cooldown.rename_nation
      cooldown_rename_time: 1d

  # Nations-Tag-Optionen
  tag:
    # Tags aktivieren?
    # HINWEIS: Diese Einstellung erfordert einen Server-Neustart.
    enabled_2: false
    # Mindestlänge des Nations-Tags
    min-length_2: 1
    # Maximale Länge des Nations-Tags
    # Maximale Länge: 80 bei MySQL, 32 bei SQLite (inkl. Farbcodes).
    max-length_2: 4
    # Sollen Farben in Nationstags erlaubt sein?
    # Wenn nachträglich deaktiviert, werden Farben aus bestehenden Nationen entfernt.
    color_2: false
    # Sollen Formatierungen in Nationstags erlaubt sein?
    format_2: false
    # Sollen Zahlen in Nationstags erlaubt sein?
    numbers_2: false
    # Nur lateinische Buchstaben für Nationstags erlauben?
    # Wenn aktiviert: Keine chinesischen Buchstaben usw.
    only-latin_2: false

# Land-bezogene Einstellungen
land:
  # Maximale Entfernung zwischen der Hauptstadt und dem einzuladenden Land festlegen.
  # 0 = Option deaktivieren.
  max-distance: 0


# Länder, die Teil einer Nation sind, Steuern zahlen lassen.
# Wenn ein Land Mitglied einer Nation ist, zahlt es keinen Unterhalt mehr an den Server. Stattdessen
# zahlt es Steuern an die Nation. Um Missbrauch zu verhindern, wird empfohlen, den Nationsunterhalt zu aktivieren,
# damit die Nation je nach Größe Unterhalt an den Server zahlt.
# HINWEIS: Diese Option ist an die Unterhalt-Option aus config.yml gebunden. Unterhalt muss in config.yml aktiviert sein.
taxes:
  # Mindest-Steuerwert pro Chunk festlegen.
  min: 0
  # Maximalen Steuerwert festlegen, den die Nation PRO CHUNK ihrer Länder setzen kann.
  # HINWEIS: Gesamtzahlung pro Land = Landgröße (Chunks) * Kosten
  max: 5.0
  # Den konfigurierten Land-Unterhalt als Mindestbetrag verwenden
  # Soll ein Land aus der Nation entfernt werden, wenn es die Steuer nicht zahlen kann?
  remove-land: true
  # Separate Steuerlimits für Vasallenländer (unterworfene Mitglieder, die über das Vasallenkriegsziel hinzugefügt wurden). Der
  # Oberherr setzt die Vasallensteuer mit dem Schalter im Nations-Steuermenü; sie wird auf diese Werte begrenzt.
  vassal:
    min: 0
    max: 5.0


# Eine Nation zahlen lassen, damit sie bestehen bleibt.
upkeep:
  enabled_4: true
  # Unterhaltskosten pro Chunk für eine Nation festlegen.
  per-chunk: 3.0
  # Soll eine Nation gelöscht werden, wenn sie die Unterhaltskosten nicht zahlen kann?
  # HINWEIS: Dadurch werden keine Länder gelöscht.
  delete-nation: true
  # Nation vom Unterhalt ausschließen, wenn sie kürzlich erstellt wurde?
  # Schließt Nationen von ihrer ersten Unterhalts-Zahlung aus, wenn sie jünger als x sind.
  nopay_time: 2d
