# Wiki-Seite (Konfiguration): hhttps://wiki.incredibleplugins.com/lands/configuration/wars
# Erklärung für Spieler: https://wiki.incredibleplugins.com/lands/players/general/wars

# Kriege aktivieren?
# HINWEIS: Diese Einstellung erfordert einen Server-Neustart.
enabled: false

# Sollen Kriege nur zwischen Nationen und nicht einzelnen Ländern möglich sein?
only-nations: false

# Kriegsmodi und -ziele (welcher Modus/Ziel Standard ist, sowie Einstellungen pro Modus/Ziel) sind definiert in
# Modules/Wars/modes.yml.

# Kriegserklärungseinstellungen
declaration:
  # Voraussetzungen, die bestimmen, ob ein Krieg überhaupt erklärt werden darf. Wenn eine nicht erfüllt ist, wird die Erklärung abgelehnt.
  requirements:
    # Mindestanzahl vertrauter Spieler festlegen, die ein Land haben muss, um an einem Krieg teilnehmen zu dürfen.
    min-players:
      # Mindestanzahl vertrauter Spieler für den erklärenden Angreifer.
      # (Das _3-Suffix wird beim Laden entfernt; es hält nur diesen Blattschlüssel textuell unterschiedlich von den
      # anderen 'attacker'-Schlüsseln in dieser Datei, damit keine doppelter-Schlüssel-Warnung entsteht - entspricht defender_3)
      attacker_3: 0
      # Mindestanzahl vertrauter Spieler für den Verteidiger, um eine Kriegserklärung zu erhalten.
      defender_3: 0
    # Mindestanzahl beanspruchter Chunks. 0 = kein Minimum.
    min-chunks:
      attacker: 0
      defender: 0
    min-balance:
      # Mindestguthaben des Landes für Angreifer, um einen Krieg beginnen zu können.
      attacker_2: 5000
      # Mindestguthaben für Verteidiger, damit ihnen direkt der Krieg erklärt werden kann.
      # Sie können trotzdem in einen Krieg verwickelt werden, wenn sie Teil einer Nation mit höherem Guthaben sind.
      defender_2: 0
    min-age:
      # Mindestalter eines Angreifers.
      attacker_time: 0d
      # Mindestalter eines Verteidigers.
      defender_time: 0d
    # Anti-Grief-Stufengrenze: Kriegserklärungen nur zwischen Haltern erlauben, die maximal so viele STUFEN auseinanderliegen,
    # damit ein Halter hoher Stufe keinen viel schwächeren farmen kann. Die Prüfung ist symmetrisch – auch
    # ein Halter niedriger Stufe kann keinen viel stärkeren angreifen. Unabhängigkeitskriege und Admin-Editor sind ausgenommen.
    # -1 = deaktiviert (jede Kombination erlaubt). 0 = nur gleiche Stufe, 1 = eine Stufe rauf oder runter, usw.
    # Hinweis: Land- und Nationsstufen sind getrennte Leitern, daher vergleicht eine gemischte Land-vs-Nation-Begegnung ihre
    # Stufenpositionen nur grob.
    max-level-difference: -1
    # Sollen Angreifer Kriegserklärungen nur an Länder oder Nationen senden können, wo mindestens ein Spieler online ist?
    online: false
    # Definieren, wann eine Erklärung gesendet werden kann.
    send-time:
      # Wochentag. 1 = Montag, 7 = Sonntag.
      # Beispiel: 1,2,3 -> Erlaubt das Senden an Montag, Mittwoch und Donnerstag.
      # Standard: 1-7 -> Alle Tage erlaubt.
      days_range: "1-7"
      # Stunden der oben definierten Tage, in denen eine Erklärung gesendet werden kann.
      # Verwendet das 24-Stunden-Format. Standard ist 0-23, das alle Stunden des Tages einschließt.
      # Weiteres Beispiel: 20-23;0-4 -> 20 Uhr bis 4 Uhr
      hours_range: "0-23"

  # Wie viel Zeit soll den Verteidigerländern zur Kriegsvorbereitung gegeben werden?
  # HINWEIS: Zeiteinheit sind Sekunden
  # Standard ist ein Tag
  preparation_time: 1d
  # Soll eine Broadcast-Nachricht an den ganzen Server gesendet werden?
  # Die Nachricht kann in der Sprachdatei bearbeitet werden.
  broadcast: true
  # Sollen Kriegserklärungen einer gegenseitigen Zustimmung bedürfen?
  # Wenn aktiviert, muss das Verteidigerland die Erklärung bestätigen, bevor der Krieg beginnen kann. Dies geschieht mit /Wars declare <angreifer>
  # Eine Kriegserklärung kann mit /Wars deny abgelehnt werden
  # HINWEIS: Diese Einstellung erfordert einen Server-Neustart.
  mutual:
    enabled_2: false
    # Should the declaration be deleted if the enemy did not accept it during the configured period?
    # You can disable this by setting the value to 0.
    declaration-timeout_time: 5d

# HINWEIS: Aufgeben (während der Vorbereitung oder im aktiven Krieg) wendet einfach das Kriegsziel-Ergebnis für die
# aufgebende Seite an – es gibt keinen festzulegenden Tribut. Was eine Kapitulation kostet, wird pro Ziel in
# modes.yml konfiguriert (z. B. der 'surrender'-Status des Klassischen Ziels, meist milder als eine erkämpfte Niederlage).

# Wann immer ein Feind einen Leuchtturm am Rand eines Landes platziert, wird eine Einnahme-Fahne erstellt.
# Die Angreifer müssen diesen Punkt dann eine Weile halten, um den Chunk einzunehmen.
# HINWEIS: Punktwerte (capture/break/explode) und das Punktziel werden pro Kriegsmodus in modes.yml definiert,
# da sie nur für Modi relevant sind, die durch Punkte gewonnen werden.
capture:
  enabled_3: true
  # Ein Einnahmepunkt muss gecraftet werden. Spieler können das Rezept in ihrem /war-Menü sehen.
  recipe_list:
    - 'AIR,RED_STAINED_GLASS_PANE,AIR'
    - 'AIR,BEACON,AIR'
    - 'IRON_BLOCK,IRON_BLOCK,IRON_BLOCK'
  # Maximale Anzahl gleichzeitig platzierbarer Einnahmepunkte pro Team.
  max: 3
  # Dem Team das Platzieren einer Einnahme-Fahne nur alle x Zeit erlauben.
  place-cooldown_time: 10m
  # Sollen nur Spieler mit dem MANAGE_WAR-Flag Einnahme-Fahnen für ihr Land platzieren können?
  # Wenn aktiviert, können Landbesitzer per Rollensystem einschränken, wer Fahnen platzieren darf.
  restrict-placement: false
  # Chunk-Radius festlegen, der von der Einnahme-Fahne betroffen ist. Invasoren beginnen die Einnahme beim Betreten des beanspruchten Bereichs.
  # Bei 1 ist nur der Chunk betroffen, in dem die Einnahme-Fahne platziert ist.
  # HINWEIS: Sollte nicht größer als die Server-Sichtweite sein.
  radius: 1
  # Soll der eingenommene Bereich freigegeben werden?
  unclaim: true
  # Soll der freigegebene Bereich vom Feind beansprucht werden?
  claim: false
  # Die Invasoren müssen die Einnahme-Fahne so lange halten, um den Chunk einzunehmen.
  hold_time: 10m
  # In regelmäßigen Abständen ein Feuerwerk spawnen, wenn Spieler im Bereich sind.
  firework_time: 30s
  # Soll ein Einnahme-Fahnen-Gegenstand beim Entfernen der Fahne fallen gelassen werden?
  drop: false
  # Spielern des Teams, das die Fahne platziert hat, erlauben, sie auch zu brechen.
  invaders-break: true
  # Y-Ebenen begrenzen, auf denen Einnahme-Fahnen platziert werden können.
  y:
    min: 30
    max_2: 127

  durability:
    # Das Haltbarkeitssystem der Einnahme-Fahne aktivieren.
    enabled_5: false
    # Gesamt-Lebenspunkte einer Einnahme-Fahne beim Platzieren.
    max-health: 100.0
    # Schaden an der Fahne, wenn ein Spieler einen ihrer Blöcke vollständig bricht.
    block-break-damage: 25.0
    # Schaden an der Fahne durch eine Explosion.
    explosion-damage_2: 50.0

    # HINWEIS: Diese Bonuspunkte werden nur in Kriegsmodi vergeben, die durch Punkte gewonnen werden (siehe modes.yml). Modi, die
    # den Sieg anders entscheiden, ignorieren sie.
    health-reward:
      # Wie oft Bonuspunkte für das Invasoren-Team geprüft und vergeben werden. Unterstützt 30s, 1m usw.
      health-interval_time: 1m
      # Ton für das Team, das Punkte erhält.
      reward-sound_sound: "entity.experience_orb.pickup"
      invader:
        # Punkte für das platzierende Team pro Intervall.
        # Deaktivieren: auf 0 setzen
        amount: 0
        # Lebensprozentzahl (0-100), die die Fahne erreichen oder überschreiten muss, um dem platzierenden Team Bonuspunkte zu geben.
        threshold: 75
      defender:
        # Punkte für das gegnerische Team, wenn die Fahnengesundheit erstmals unter den Schwellenwert fällt.
        # Deaktivieren: auf 0 setzen
        amount_2: 0
        # Lebensprozentzahl (0-100), unterhalb derer gegnerische Spieler im Fahnenbereich belohnt werden.
        threshold_2: 25


# Ton-Konfiguration
# Soundnamen können mit /playsound ingame gefunden werden.
# Format: sound,lautstärke,tonhöhe
# Lautstärke und Tonhöhe sind optional.
# Ton deaktivieren: Wert auf '' setzen
sounds:
  capture:
    place_sound: 'block.bell.use'

# Intervall der Kriegsstatus-Nachricht. Diese erscheint während des Krieges und informiert Spieler, die evtl. offline waren, dass ihr Land an einem Krieg teilnimmt.
status-interval_time: 15m

# Sollen Spieler, die an einem Krieg beteiligt sind, auf Dynmap ausgeblendet werden?
# HINWEIS: Mit BlueMap ist das aktuell nicht möglich.
hide-player: true

# Soll Lands ein Feind- oder Verbündeten-Namensschild über Spielern anzeigen, die im Krieg sind?
# Wenn bereits ein Scoreboard- oder Tablist-Plugin vorhanden ist, wird empfohlen, stattdessen den %rel_lands_war_relation% PlaceholderAPI-Platzhalter zu verwenden.
# HINWEIS: Nur Spieler im selben Krieg sehen diese.
# HINWEIS: Bei Folia statt Spigot/Paper: Folia unterstützt Scoreboards derzeit nicht.
nametag: true

# Hier kann eine Liste von Befehlen definiert werden, die nicht ausgeführt werden sollen, während ein Spieler an einem Krieg beteiligt ist.
cmd-blacklist_list: [ ]

# Kampfeinstellungen, die Spieler auch ingame ändern können.
# Spieler benötigen bestimmte Berechtigungen dafür. Diese befinden sich im Wiki.
combat:
  # Teammitgliedern erlauben, sich gegenseitig zu töten. Dies zählt nicht zu den Kriegs-Kill-Statistiken.
  friendly_fire:
    default_2: true

shield:
  # Konfigurieren, wann ein Land einen Kriegsschild erhalten soll.
  # Wenn ein Kriegsschild aktiv ist, können andere Länder das Land nicht angreifen.
  # HINWEIS: Der Schild nach Kriegsende (inkl. Kapitulation) wird pro Ziel in modes.yml konfiguriert.
  activation:
    # Einem neuen Land oder einer neuen Nation einen Kriegsschild geben?
    # 0 = deaktivieren.
    creation_time: 1d

# Konfigurieren, was passiert, wenn ein Krieg beginnt.
start:
  # Soll eine Nachricht an den ganzen Server gesendet werden?
  # Die Nachricht kann in der Sprachdatei bearbeitet werden.
  broadcast_2: true

# Hier können natürliche Flags während eines Krieges aktiviert werden.
# Liste verfügbarer Landflags: https://wiki.incredibleplugins.com/lands/configuration/natural-flags
land-flags_list: [ ]

# Sollen Spieler ihr Inventar behalten, wenn sie während eines Krieges sterben?
keep-inventory:
  enabled_4: false
  mode: false

# Was Feinde IN einem Land tun dürfen, mit dem sie im Krieg sind (Kisten öffnen, bestimmte Blöcke brechen usw.).
# Dies ist das Aktionsset während des Krieges; das separate Nachkriegs-Überfall-Set befindet sich unter goals.raid.actions in modes.yml.
# "role-flags_list", "block-place_list" und "block-break_list" im Abschnitt "actions" unten bearbeiten, um es einzuschränken.
in-land:
  # Einschränken, wann Feinde bestimmte Aktionen ausführen können (bearbeitbar im Abschnitt "actions" unten).
  restrictions:
    # Anzahl der Spieler der Verteidiger festlegen, die online sein müssen, bevor Angreifer im Land interagieren können.
    # Bei Nationen: Dieser Wert gilt für das Land, das gerade invadiert wird. Nicht die gesamte Nation.
    # Diese Option betrifft auch Einnahme-Fahnen.
    # HINWEIS: Um Plünderungen auch ohne Online-Verteidiger zu erlauben, diesen Wert auf 0 setzen.
    # HINWEIS: Diese Einstellung erfordert einen Server-Neustart.
    min-players: 1
    # Zeitraum festlegen, in dem Spieler das Land noch angreifen können, nachdem der letzte Spieler des Ziellandes den Server verlassen hat.
    cooldown_logging_time: 1m

  # Sollen Spieler auch in den Ländern der Verbündeten beider Seiten kämpfen können oder nur
  # in dem Land, das den Krieg erklärt oder gegen das er erklärt wurde?
  allies-war-field: false

  # Einschränken, was Feinde im Land während eines Krieges tun können.
  actions:
    # Spielern erlauben, folgendes im Feindland zu tun (nur während des Krieges).
    # Verfügbare Aktionen: https://wiki.incredibleplugins.com/lands/configuration/roles-and-their-flags#flags
    # HINWEIS: BLOCK_PLACE oder BLOCK_BREAK hinzufügen erlaubt das Brechen/Platzieren ALLER Blöcke. Für spezifische Blöcke die Listen unten verwenden.
    # HINWEIS: Im Krieg haben Angreifer und Verteidiger auch die Flags der nicht-vertrauten Rolle des zu invadierenden Bereichs.
    # HINWEIS: Um das Zünden und Explodieren von TNT zu erlauben, BLOCK_IGNITE zu dieser Liste und TNT_GRIEFING zu land-flags_list oben hinzufügen.
    role-flags_list:
      - ITEM_PICKUP
      - ATTACK_PLAYER
      - LAND_ENTER

    # Platzierung bestimmter Blöcke erlauben, wenn das Land an einem Krieg beteiligt ist.
    # HINWEIS: Wird nur benötigt, wenn BLOCK_PLACE NICHT in role-settings_list oben ist.
    # Werte: https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Material.html
    block-place_list:
      - LADDER
      - VINE
      - SCAFFOLDING

    # Brechen bestimmter Blöcke erlauben, wenn das Land an einem Krieg beteiligt ist.
    # HINWEIS: Wird nur benötigt, wenn BLOCK_BREAK NICHT in role-settings_list oben ist.
    # Werte: https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Material.html
    block-break_list:
      - LADDER
      - VINE
      - SCAFFOLDING
