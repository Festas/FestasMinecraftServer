# Kriegsmodi und -ziele.
# Ein Kriegsmodus bestimmt, wie ein Krieg gewertet und gewonnen wird; ein Kriegsziel bestimmt, was der Gewinner erhält,
# wenn er endet. Jeder Modus/Ziel ist im Code registriert; diese Datei enthält konfigurierbare Einstellungen und markiert
# den Modus und das Ziel, die standardmäßig für neu erklärte Kriege verwendet werden (default: true).
# Pro Eintrag können optionale Eigenschaften hinzugefügt werden – sie haben keine Wirkung, wenn der Modus/das Ziel
# sie nicht liest.

modes:
  # Der integrierte Gefecht-Modus: Punkte durch Kills, Einnahmen und Punkte; endet bei Punktziel oder Zeitüberschreitung.
  skirmish:
    default: true
    # Zusätzliche Ziele, die bei jedem Krieg dieses Modus gelten, zusätzlich zum gewählten Primärziel.
    # Z. B. 'raid' hinzufügen, um den Mitgliedern des Gewinners zu erlauben, die Länder des Verlierers nach dem Krieg zu überfallen.
    add-goals: [ ]
    # Wie lange ein Krieg in diesem Modus dauern kann, bevor er durch Zeitüberschreitung endet (das Team mit mehr Punkten gewinnt,
    # oder Unentschieden bei Gleichstand). 0 = kein Zeitlimit.
    timeout: 36h
    points:
      # Punkte pro Kill.
      kill: 1
      # Punkte für das Einnehmen/Brechen/Explodieren einer Einnahme-Fahne (siehe Abschnitt "capture" in wars.yml).
      capture-flag:
        capture: 5
        break: 3
        explode: 5
      # Wie viele Punkte ein Team zum Gewinnen benötigt. Berechnet als (kleinste Team-Spielerzahl) * per-player,
      # mindestens jedoch min.
      towin:
        per-player: 5
        min: 100

# Kriegsziele. Das Ergebnis jedes Ziels wird pro Kriegsstatus konfiguriert, damit es milder sein kann, wenn eine Seite aufgibt:
#   end        - ein erkämpfter Sieg/Niederlage
#   surrender  - eine Seite hat aufgegeben (während der Vorbereitung oder im aktiven Krieg). Meist milder als 'end'.
#   draw       - kein entscheidender Gewinner. Bei Unentschieden gibt es keinen Gewinner/Verlierer, deshalb haben Befehle und Schilde
#                unten keine Wirkung - füge sie hinzu, wenn ein Unentschieden trotzdem einen Schild vergeben oder einen Befehl ausführen soll.
# Jeder Status (unten) verwendet dieselben Optionen:
#   cmds.winner / cmds.loser - Konsolen-Befehle, die einmalig pro Gewinner-/Verlierer-Land ausgeführt werden.
#     Platzhalter: {winner}/{loser} (Parametername, keine Leerzeichen), {winner_name}/{loser_name} (Anzeigename),
#     {winner_owner}/{loser_owner} (Besitzer). Liste auf [] setzen = deaktivieren.
#   shield.winner / shield.loser - Kriegsschild für den Gewinner/Verlierer nach Kriegsende (0 = keiner).
# Ziele können eigene Optionen hinzufügen (z. B. die 'robbery'-Option des Gefecht-Ziels).
goals:
  # Das Überfall-Ziel: Die Mitglieder des Gewinners können nach dem Krieg für einen Zeitraum in den Ländern des Verlierers agieren
  # (begrenzt auf die Flags/Blöcke in 'actions'). Auch als Zusatz zu einem anderen Ziel verwendbar (modes.<id>.add-goals).
  raid:
    default: true
    duration: 1h
    end:
      cmds:
        winner: [ ]
        loser: [ ]
      shield:
        winner: 0
        loser: 0
    surrender:
      cmds:
        winner: [ ]
        loser: [ ]
      shield:
        winner: 0
        loser: 0
    # Welche Aktionen die Mitglieder des Gewinners in einem überfallenen Land durchführen dürfen. role-flags gewährt ein Flag
    # direkt (z. B. BLOCK_BREAK -> jeden Block brechen); block-break/block-place erlauben stattdessen nur die
    # aufgelisteten Materialien, wenn das Flag nicht gewährt wird – so können Räuber eindringen und plündern, ohne
    # die gesamte Basis zu zerstören. Flag-Namen: siehe Wiki-Seite roles-and-their-flags.
    actions:
      # Behälter plündern, Türen/Luken öffnen, Hebel/Knöpfe umlegen und Drops aufheben – aber nicht frei brechen/platzieren
      # (das ist auf die Materiallisten unten begrenzt).
      role-flags:
        - INTERACT_CONTAINER
        - INTERACT_DOOR
        - INTERACT_TRAPDOOR
        - INTERACT_MECHANISM
        - ITEM_PICKUP
      # Häufige Wand-/Basisblöcke, die ein Räuber brechen darf. Ein gezieltes Set – ausreichend
      # zum Tunneln durch ein typisches Gebäude, aber nicht die ganze Block-Palette, damit Räuber nicht
      # alles zerstören können. Türen, Luken und Tore sind absichtlich NICHT enthalten:
      # die Flags INTERACT_DOOR/INTERACT_TRAPDOOR oben erlauben das Öffnen bereits, daher wäre das Brechen
      # nutzlos. Materialien, die die Server-Version nicht hat, werden ignoriert.
      block-break:
        # Holz (alle Varianten, damit eine Basis Überfälle nicht durch eine andere Holzart umgehen kann)
        - OAK_PLANKS
        - SPRUCE_PLANKS
        - BIRCH_PLANKS
        - JUNGLE_PLANKS
        - ACACIA_PLANKS
        - DARK_OAK_PLANKS
        - MANGROVE_PLANKS
        - CHERRY_PLANKS
        - PALE_OAK_PLANKS
        - BAMBOO_PLANKS
        - CRIMSON_PLANKS
        - WARPED_PLANKS
        - OAK_LOG
        - SPRUCE_LOG
        - BIRCH_LOG
        - JUNGLE_LOG
        - ACACIA_LOG
        - DARK_OAK_LOG
        - MANGROVE_LOG
        - CHERRY_LOG
        - PALE_OAK_LOG
        - BAMBOO_BLOCK
        - CRIMSON_STEM
        - WARPED_STEM
        # Stein
        - COBBLESTONE
        - MOSSY_COBBLESTONE
        - STONE
        - STONE_BRICKS
        - COBBLED_DEEPSLATE
        - DEEPSLATE_BRICKS
        - TUFF
        # Erde
        - DIRT
        - COARSE_DIRT
        - GRASS_BLOCK
        - SAND
        - GRAVEL
        # Glas und Kletterbares
        - GLASS
        - GLASS_PANE
        - LADDER
      # Blöcke, die ein Räuber platzieren darf, um in die Basis zu gelangen.
      block-place:
        - LADDER
        - SCAFFOLDING
        - DIRT
        - COBBLESTONE
        - OAK_PLANKS

  # Das Gefecht-Ziel: ein Krieg mit geringen Konsequenzen – der Gewinner raubt Geld vom Verlierer und führt Befehle aus,
  # aber niemand verliert Ansprüche. 'robbery': % am Ende = Prozent des Bankguthabens des Verlierers (z. B. 75%), eine
  # Zahl = ein fester Betrag (begrenzt auf das, was der Verlierer hat).
  skirmish:
    end:
      robbery: 75%
      cmds:
        winner: [ ]
        loser: [ ]
      shield:
        winner: 7d
        loser: 7d
    surrender:
      robbery: 40%
      cmds:
        winner: [ ]
        loser: [ ]
      shield:
        winner: 7d
        loser: 7d

  # Das Annexionsziel: Der Gewinner gibt alle Kriegsländer des Verlierers frei (der Verlierer erhält die übliche
  # Rückerstattung in seine Bank). Kein Besitzerwechsel.
  annex:
    default: false
    end:
      cmds:
        winner: [ ]
        loser: [ ]
      shield:
        winner: 0
        loser: 3d
    surrender:
      cmds:
        winner: [ ]
        loser: [ ]
      shield:
        winner: 0
        loser: 3d

  # Das Vasallenziel: Die Gewinnersnation unterwirft den Verlierer. Die Länder des Verlierers werden als
  # eingeschränkte VASALLEN-Mitglieder in die Gewinnernation aufgenommen. Nur verwendbar, wenn der Angreifer eine Nation ist.
  vassal:
    default: false
    # Auch das Bankguthaben des Verlierers bei Vasallierung in die Nationbank des Gewinners übertragen.
    seize-treasury: false
    # Der Verlierer wird in die Gewinnernation aufgenommen (bleibt nicht unabhängig), erhält daher standardmäßig keinen Schild –
    # aber winner.shield und loser.shield werden berücksichtigt, wenn sie gesetzt werden.
    end:
      cmds:
        winner: [ ]
        loser: [ ]
      shield:
        winner: 0
        loser: 0
    surrender:
      cmds:
        winner: [ ]
        loser: [ ]
      shield:
        winner: 0
        loser: 0

  # Das Unabhängigkeitsziel: Wird nur über '/land <vasall> war independence' angewendet – ein Vasall führt Krieg,
  # um sich von seinem Oberherrn zu lösen. Wenn der Vasall gewinnt, bleibt er frei; wenn der Oberherr gewinnt oder Unentschieden,
  # wird der Vasall erneut unterworfen und kann für diesen Cooldown keine Unabhängigkeit mehr erklären.
  independence:
    default: false
    cooldown: 7d
    end:
      cmds:
        winner: [ ]
        loser: [ ]
      shield:
        winner: 7d
        loser: 0
    surrender:
      cmds:
        winner: [ ]
        loser: [ ]
      shield:
        winner: 7d
        loser: 0
