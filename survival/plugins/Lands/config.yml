# Ressourcen-Seite: https://www.spigotmc.org/resources/53313
# Discord: https://discord.incredibleplugins.com

# Bei Problemen bitte im Discord-Support-Server oder per Privatnachricht melden.
# Fehler werden in der Regel beim nächsten Update behoben, wenn sie gemeldet werden.
# Die IDs in einigen Einstellungsnamen (_<Zahl>) können ignoriert werden.
#
# Wenn du ein Plugin suchst, das Chunks beim Entbeanspruchen oder in der Wildnis regeneriert,
# wird das WildRegeneration-Plugin empfohlen: https://polymart.org/resource/wildregeneration.2096


########################################
# BASISMODUS
########################################
# Wenn aktiviert, deaktiviert Lands erweiterte Funktionen wie Kriege, Nationen, Unterhalt und Steuern.
# Das Aktivieren dieser Option deaktiviert alle erweiterten Funktionen. Es werden nur die
# grundlegenden Funktionen aktiviert. Diese Option ist für Server gedacht, die ein sehr einfaches
# Setup wünschen und Spielern nur das Beanspruchen und Vertrauen ermöglichen wollen.
# Das Aktivieren erzwingt die Deaktivierung einiger Funktionen, die nicht wieder aktiviert werden können,
# solange der Basismodus aktiv ist.
# HINWEIS: Diese Einstellung erfordert einen Server-Neustart/-Neustart.
basic-mode: false


########################################
# HAUPTFUNKTIONEN
########################################
# Hier können wichtige Funktionen schnell ein-/ausgeschaltet werden.
# HINWEIS: Diese Einstellungen erfordern einen Server-Neustart/-Neustart.
features:
  # Der Unterhalt kann im Abschnitt "upkeep" (diese Datei) weiter konfiguriert werden.
  upkeep: true
  # Steuern können im Abschnitt "taxes" (diese Datei) weiter konfiguriert werden.
  # Für Steuern werden Vault und ein Economy-Plugin benötigt, das Vault unterstützt.
  taxes: false
  # Länder und Nationen können Beziehungen haben, z. B. Verbündete, Feinde und Neutrale.
  # Wenn diese Option deaktiviert wird, werden alle bestehenden Beziehungen gelöscht.
  # Nützlich in Kombination mit Kriegen, aber auch ohne Kriege verwendbar.
  relations: true


# Allgemeine Optionen
general:
  # Welten, in denen Spieler Gebiete beanspruchen können. Mit * werden alle Welten hinzugefügt.
  # Optional können Parameter gesetzt werden: ob normale Spieler (ohne Admin-Berechtigung) beanspruchen dürfen
  # und die minimale/maximale Beanspruchungshöhe. Format: <weltname>:<beanspruchen>:<min-höhe>:<max-höhe>
  # HINWEIS: Die Mindesthöhe kann nicht kleiner als die Server-Mindesthöhe sein, und die Maximalhöhe nicht größer als die Server-Maximalhöhe. Admin-Länder werden immer maximal hoch beansprucht.
  # HINWEIS: Diese Einstellung erfordert einen Server-Neustart.
  # Beispiele:
  #   'world' -> Maximale Beanspruchungshöhe, Beanspruchen für Spieler aktiviert.
  #   'world:true:30:319' -> Beanspruchungshöhe von 30 bis 319, Beanspruchen für Spieler aktiviert.
  #   'world:false' -> Nur Server-Admins können in dieser Welt beanspruchen (z. B. für Admin-Länder).
  claim-worlds_list:
    - 'world'
    - 'world_nether'
    - 'world_the_end'
    - 'town'

  # Standard: Englisch (en-US) – kein Download erforderlich.
  # Legt die Standardsprache fest. Mehrere Sprachdateien können im "Language"-Ordner des Plugins abgelegt werden,
  # um abhängig vom Spieler-Locale unterschiedliche Sprachen anzuzeigen.
  # Community-Übersetzungen sind im Discord verfügbar: https://discord.incredibleplugins.com
  # Zur Übersetzungssuche /translations im Discord-Server ausführen.
  # Der Übersetzungsname sollte dem offiziellen Sprachcode entsprechen (https://www.oracle.com/java/technologies/javase/jdk8-jre8-suported-locales.html).
  # Diese Option beeinflusst auch Trennzeichen für Währungsformatierungen.
  language: 'de_DE'
  # Standardsprache erzwingen? Änderungen an Sprachdateien werden ignoriert, es wird immer die Standardsprache verwendet.
  # Nützlich um immer Korrekturen (z. B. Rechtschreibfehler) der Standardsprache zu erhalten.
  # Nur verwenden, wenn die Sprache "en-US" ist – für andere Sprachen funktioniert dies nicht.
  force-default: false

  # Soll das Land bearbeitet werden, auf dem der Spieler steht, statt des Landes aus /lands edit?
  # Für /lands claim muss das Beanspruchungsland weiterhin mit /lands edit gesetzt werden.
  edit-by-loc: false

  # Veraltet: Stattdessen die neue Limits-Datei verwenden: https://wiki.incredibleplugins.com/general/locale-and-config/limits
  # Wenn aktiviert, werden Limit-Berechtigungen addiert statt den höchsten Wert zu nehmen.
  # Beispiel: Ein Spieler hat lands.chunks.5 und lands.chunks.2.
  #          Aktiviert: Ergibt ein Limit von 7 Chunks.
  #          Deaktiviert: Ergibt ein Limit von 5 Chunks.
  permission-stacking: false

  # Spielern beim ersten Beitreten Gegenstände geben.
  # Das Aussehen der Gegenstände kann in der GUI-Sprachdatei bearbeitet werden.
  first-join-items:
    # Das Auswahlwerkzeug ermöglicht das Beanspruchen.
    selection:
      # Slot oder Menge kleiner als 1 = kein Gegenstand beim ersten Beitreten.
      slot_4: 1
      amount: 1
      # Wenn deaktiviert, können Spieler diesen Gegenstand überhaupt nicht verwenden.
      usage: true
    # Das Info-Werkzeug zeigt Informationen über einen Anspruch beim Anklicken.
    info:
      slot_5: 2
      amount_2: 1
      usage_2: true
    # Der Lagerblock erstellt beim Platzieren einen temporären Anspruch.
    camp:
      slot_6: 3
      amount_3: 1
      usage_3: true
    # Anspruchsblöcke beanspruchen dauerhaft den Chunk, in dem sie platziert wurden, bis der Spieler den Chunk freigibt.
    claim_block:
      slot_7: 4
      # Beansprucht einen bestimmten Chunk-Radius.
      # 0 = nur der aktuelle Chunk
      # 1 = (radius+1)² = 9 Chunks
      claim-radius_2: 1
      amount_4: 1
      usage_4: true

  # Wenn false, werden Chat-Nachrichtenteile, die in [V]text[/T] eingeschlossen sind, nur an Spieler
  # mit der Berechtigung lands.admin.verbose gesendet. Diese Einstellung gilt nur für Chat-Nachrichten.
  verbose: false

  # Das Plugin ruft Spielerskins und -namen von Mojang ab.
  # Wenn deaktiviert, können Spielerskins nicht in Menüs angezeigt werden, und Namensänderungen
  # werden erst beim nächsten Beitritt des Spielers übernommen.
  fetch-skins-names: true

  # Datumsformat
  # MM: Monat
  # dd: Tag des Monats
  # yyyy: Jahr
  # hh: Stunden
  # mm: Minuten
  # ss: Sekunden
  # HINWEIS: Diese Einstellungen erfordern einen Server-Neustart.
  date-format:
    # Zeitzone für Datumsausgaben festlegen.
    # Beispiel: Europe/Berlin oder GMT+1:00
    # Zeitzonen-Liste: https://timezonedb.com/time-zones
    # Wenn leer, wird die Zeitzone des Servers verwendet.
    time-zone: ''
    # Allgemeines Format für Einladungen usw.
    # Beispiele:
    #   Amerikanisches 12-Stunden-Format (a = 12-Stunden): MM/dd/yyyy hh:mm a
    #   Deutsches 24-Stunden-Format: dd.MM.yyyy hh:mm
    general: 'dd.MM.yyyy HH:mm'
    # Format für Neuigkeiten im Land-Menü (Posteingang).
    inbox: 'dd.MM.'
    # Format, wenn nur eine Uhrzeit angezeigt wird.
    # Beispiele:
    #   Amerikanisches 12-Stunden-Format (a = 12-Stunden): hh:mm a
    #   Deutsches 24-Stunden-Format: hh:mm
    time_2: 'HH:mm'

  # Format aller wirtschaftsbezogenen Anzeigen festlegen.
  # Info: https://docs.oracle.com/javase/7/docs/api/java/text/DecimalFormat.html
  # HINWEIS: Diese Einstellung erfordert einen Server-Neustart.
  eco-format:
    # Empfohlenes Format für Gegenstands-Economy und Spieler-Erfahrung: "# Goldbarren" oder "# Erfahrung"
    normal: '#,##0.00€'
    # Das Kurzformat verwendet das normale Format, wenn der Wert kleiner als 1000 ist.
    # Dieses Format wird nur dort verwendet, wo wenig Platz ist, z. B. auf Schildern.
    # Konvertierung: 1000000000 = 1G, 1000000 = 1M, 1000 = 1k ({value} = Zahl, {unit} = Einheit)
    short-unit: '{value}{unit}€'

  # Sollen Spieler mit der Berechtigung (lands.admin) über neue Updates informiert werden?
  upd-notify: false
  # Bedrock-Formulare für Bedrock-Spieler anbieten statt der normalen GUI?
  bedrock-forms: true
  # Hologramm-Plugin festlegen. Das Plugin muss installiert sein. Wenn leer, entscheidet das Plugin.
  # Unterstützte Plugins: CMI, DecentHolograms, FancyHolograms, HolographicDisplays
  hologram-provider: ""

# Allgemeine Optionen für wirtschaftliche Aufgaben (Steuern, Unterhalt und Nationsunterhalt).
# Jede Aufgabe hat einen eigenen Abschnitt in dieser Datei und in nations.yml.
# Diese Optionen erfordern einen Server-Neustart.
economic:
  # Standardkonfiguration: Steuern, Unterhalt und Nationsunterhalt werden täglich um Mitternacht eingezogen.
  interval:
    # Anzahl der Tage zwischen den Zahlungen.
    # Beispiel:
    # 1 = täglich zur angegebenen Uhrzeit.
    # 2 = jeden zweiten Tag zur angegebenen Uhrzeit.
    days_2: 7
    # Tageszeit für den Einzug. Steuern, Unterhalt und Nationsunterhalt werden nach x Tagen zu dieser Zeit eingezogen.
    # Format: 24-Stunden-Format.
    time: '04:00:00'
    # Mindestzeit zwischen einem Änderungsversuch von Steuer/Unterhalt und der nächsten Einziehung.
    change-cooldown_time: 2d

  # Land oder Nation benachrichtigen, wenn die Mittel für den Unterhalt nicht ausreichen.
  # Die konfigurierte Zeit definiert einen Zeitraum vor der eigentlichen Unterhaltseinziehung.
  # Beispiel: 12h = Länder und Nationen frühestens 12 Stunden vor der Einziehung benachrichtigen.
  insufficient-altert_time: 2d


# Unterhalt kann im Abschnitt "features" umgeschaltet werden.
# Unterhalt = Länder zahlen einen definierten Betrag an den Server, um ihr beanspruchtes Land zu behalten.
# Steuern = Vertraute Spieler zahlen in einem definierten Intervall Steuern.
upkeep:
  # Wie viel soll ein Land pro Chunk zahlen?
  # HINWEIS: Gesamtzahlung = Landgröße (Chunks) * Kosten
  per-chunk: 3.0
  # Sollen die zuletzt beanspruchten Chunks, für die das Land nicht zahlen konnte, gelöscht werden?
  # Beispiel: Das Land hat 10 beanspruchte Chunks, kann aber nur für 6 zahlen. Die 4 zuletzt beanspruchten Chunks werden gelöscht.
  # Dies setzt sich jeden Unterhalts-Zyklus fort, bis keine Ansprüche mehr übrig sind.
  unclaim: false
  # Land vom Unterhalt ausschließen, wenn es kürzlich erstellt wurde?
  # Verhindert, dass kürzlich erstellte Länder einen Chunk verlieren, wenn der Besitzer/die Landbank nicht genug Geld hat (bei aktiviertem delete-chunk).
  # Nur Länder, die älter als x Sekunden sind, müssen zahlen.
  nopay_time: 2d
  # Landmitglieder, die Geld einzahlen können, an bevorstehende Unterhaltskosten erinnern, solange das Geld nicht ausreicht.
  # Verhilft Spielern, den Überblick zu behalten und keine Ansprüche oder Mitgliedschaft zu verlieren.
  # Sendet in der konfigurierten Zeit innerhalb des "insufficient-altert_time" eine Erinnerung.
  upkeep-reminder_time: 1h


# Steuern können im Abschnitt "features" umgeschaltet werden.
# Steuern = Vertraute Spieler zahlen in einem definierten Intervall Steuern.
# Miete = Spieler können einen Bereich ihrer Wahl mieten, ohne vertraut werden zu müssen. Sie entscheiden selbst wie lange.
# Das Intervall kann im Abschnitt "economic" konfiguriert werden.
taxes:
  # Minimalen Steuerwert festlegen.
  min_2: 0
  # Maximalen Steuerwert für einen einzelnen Bereich festlegen (ohne Teilbereiche = Standard-Bereich).
  max_3: 10.0
  # Landmitglied aus dem Bereich entfernen, wenn es die Steuern nicht zahlen kann?
  untrust-member: true
  # Spieler über bevorstehende Steuerzahlungen informieren.
  # Standard: Lands sendet alle zwei Stunden eine Benachrichtigung, wenn das Geld nicht ausreicht.
  # Deaktivieren: 0
  taxes-announcement_time: 2h


# Allgemeine Teleportationsoptionen.
# Befehlsspezifische Optionen befinden sich in den jeweiligen Abschnitten.
teleport:
  # Allgemeine Teleportationskosten. Bestimmte Funktionen können spezifische Optionen haben, die dies überschreiben.
  costs_9: 0
  # Teleportationskosten für Spieler, die dem Server zum ersten Mal beigetreten sind, auf 0 setzen.
  # Beispiel: 1d = Spieler, die vor 23 Stunden beigetreten sind, zahlen keine Teleportationskosten.
  first-join_time: 2h
  # Wartezeit
  # Zeiteinheit: Sekunden
  wait: 3


# Ein Land besteht aus Chunks, die mit dem Befehl /claim oder mit dem Anspruchswerkzeug beansprucht werden.
# Dieser Abschnitt und der "chunk"-Abschnitt enthalten Beanspruchungsoptionen.
land:
  # Landerstellung
  creation:
    # Die Erstellung eines Landes (/lands create) erzwingen, bevor Chunks beansprucht werden können.
    # Wenn false, erstellt Lands automatisch ein Land mit dem Spielernamen.
    # Der Name kann im Land-Menü oder mit /lands rename <name> geändert werden.
    force: false
    # Kosten für die Erstellung eines Landes (/lands create).
    # HINWEIS: Enthält auch einen Chunk-Anspruch, der beim Erstellen automatisch beansprucht wird.
    # HINWEIS: SPIELER MIT DER BERECHTIGUNG lands.free.lands.<zahl> KÖNNTEN DAS UMGEHEN.
    #   Mehr Infos: https://wiki.incredibleplugins.com/lands/permissions/permissions#numbered-permissions
    costs: 2500.0
    mainblock:
      # Platzierung neuer Hauptblöcke umschalten.
      # Bestehende werden nicht entfernt, können aber manuell gelöscht werden.
      enabled_3: true
      # Kosten für die Neupositionierung des Hauptblocks nach der Landerstellung.
      reposition-costs: 0

    # Einen Chunk-Radius bei der Landerstellung beanspruchen. Diese initialen Ansprüche kosten nichts.
    # HINWEIS: 0 = nur der Chunk, in dem der Spieler gerade steht.
    # HINWEIS: -1 = keine Chunks werden beansprucht.
    # HINWEIS: Dieser Wert kann nicht größer als die Server-Sichtweite sein.
    claim-radius: 0
    # Neuen Ländern eine zufällige Farbe für ihren Namen geben?
    # HINWEIS: Hat keine Wirkung, wenn land.name.color_2 auf false gesetzt ist.
    random-color: false

  # Land-Namensoptionen
  name:
    # Sollen Leerzeichen in Landnamen erlaubt sein?
    # Leerzeichen werden durch einen Unterstrich ersetzt, wenn der Name als Befehlsparameter angezeigt wird.
    # Wenn diese Option nachträglich deaktiviert wird, werden Leerzeichen aus bestehenden Ländern entfernt.
    # HINWEIS: Diese Einstellung erfordert einen Server-Neustart.
    spaces: false
    # Mindestlänge des Landnamens
    min-length: 5
    # Maximale Landnamenlänge
    # Maximale Länge: 80 bei MySQL, 32 bei SQLite (inkl. Farbcodes).
    # Namen filtern: https://wiki.incredibleplugins.com/general/locale-and-config/messages#filter-swear-words-and-forbidden-names
    max-length: 24
    # Sollen Farben in Landnamen erlaubt sein?
    # Wenn nachträglich deaktiviert, werden Farben aus bestehenden Ländern entfernt.
    color_2: true
    # Sollen Formatierungen wie Fett, Unterstrichen usw. in Landnamen erlaubt sein?
    format: true
    # Sollen Zahlen in Landnamen erlaubt sein?
    numbers: true
    # Nur lateinische Buchstaben für Landnamen erlauben?
    # Wenn aktiviert: Keine chinesischen Buchstaben usw.
    only-latin: false

    # Umbenennungseinstellungen
    # Befehl: /lands rename
    rename:
      # Kosten für jede Namensänderung.
      costs_5: 10000.0
      # Cooldown für die Umbenennung.
      # Bypass-Berechtigung: lands.bypass.cooldown.rename_land
      cooldown_rename_time: 1d

  # Land-Tag-Optionen
  tag:
    # Tags aktivieren?
    # HINWEIS: Diese Einstellung erfordert einen Server-Neustart.
    enabled_8: false
    # Mindestlänge des Land-Tags
    min-length_2: 1
    # Maximale Land-Tag-Länge
    # Maximale Länge: 80 bei MySQL, 32 bei SQLite (inkl. Farbcodes).
    max-length_2: 4
    # Farben in Land-Tags erlauben?
    # Wenn nachträglich deaktiviert, werden Farben aus bestehenden Ländern entfernt.
    color_6: false
    # Formatierungen wie Fett, Unterstrichen usw. in Land-Tags erlauben?
    format_2: false
    # Zahlen in Land-Tags erlauben?
    numbers_2: false
    # Nur lateinische Buchstaben für Land-Tags erlauben?
    # Wenn aktiviert: Keine chinesischen Buchstaben usw.
    only-latin_2: false

  # Optionen für den Land-Eingangstitel
  title:
    # Eine separate Nachricht (Aktionsleiste) mit dem aktuellen Land oder der Nation dauerhaft anzeigen, solange der Spieler im Land ist?
    # Die Nachricht verschwindet, wenn der Spieler in die Wildnis geht oder sich nicht mehr bewegt.
    # HINWEIS: Diese Einstellung erfordert einen Server-Neustart.
    permanent-msg: true
    # Sollen Spieler PlaceholderAPI-Platzhalter im Land-Titel verwenden können?
    placeholderapi:
      # Sollen Spieler PlaceholderAPI-Platzhalter von Lands verwenden können?
      # PlaceholderAPI muss nicht installiert sein.
      lands: true
      # Sollen Spieler PlaceholderAPI-Platzhalter von Drittanbieter-Plugins und Lands verwenden können?
      # Erfordert eine installierte PlaceholderAPI.
      3rd-party: false

  # Minimale euklidische Entfernung in Chunks (16 Blöcke). Spieler können in dieser Pufferzone nicht beanspruchen,
  # außer wenn ihre Rolle das LAND_CLAIM_BORDER-Flag im benachbarten Land hat.
  chunk-distance:
    # Verfügbare Distanzmodi: SQUARE, EUCLIDEAN, DIAMOND_SHAPE
    # SQUARE - prüft Chunks um den zu beanspruchenden Chunk in quadratischer Form
    # EUCLIDEAN - misst euklidischen Abstand vom zu beanspruchenden Chunk zu benachbarten Chunks
    # DIAMOND_SHAPE - erstellt eine rautenförmige Pufferzone um Ansprüche
    mode_3: "EUCLIDEAN"
    # Größe der Pufferzone um ein Land, das nicht zu einer Nation gehört.
    land_2: 1
    # Größe der Pufferzone um ein Land, das zu einer Nation gehört.
    # Dieser Wert gilt nur für umliegende Länder. Wenn eine Nation expandiert und der benachbarte Anspruch
    # nicht zu einer Nation gehört, wird stattdessen der Wert "land_2" verwendet.
    nation: 3

  # Länder müssen in der Nähe ihrer bestehenden Ansprüche beanspruchen.
  force-near:
    enabled_2: true
    # Sollen Beanspruchungsversuche, die die force-near-Einschränkungen verletzen würden, als neue Länder behandelt werden?
    treat-as-new: true

  # Dünne oder lineare Landformen verhindern. Verwendet das diskrete isoperimetrische Verhältnis:
  # Verhältnis = 16 * Chunks / Umfang². Ein perfektes Quadrat hat den Wert 1.0; eine 1-breite Linie ~0.
  shape:
    enabled_17: false
    # Minimales Kompaktheitsverhältnis (0.0 = keine Einschränkung, 1.0 = nur perfekte Quadrate erlaubt).
    # Beispiel: 0.5 blockiert 1x10-Linien (~0.33), erlaubt aber 3x10-Rechtecke (~0.83).
    min-compactness: 0.5
    # Mindestanzahl beanspruchter Chunks, bevor die Formprüfung greift.
    min-chunks: 5

  # Verhindert, dass Spieler ein anderes Land vollständig einkreisen, sodass es sich nicht mehr ausdehnen kann.
  # Ein Anspruch wird abgelehnt, wenn er dazu führen würde, dass das betroffene Land keine freien Nachbarn mehr hat.
  prevent-encirclement:
    enabled_9: false
    # Radius (in Chunks) um den neuen Anspruch, um potenziell eingekreiste Länder zu suchen.
    check-radius: 5

  # Sollen Chunks freigegeben werden, wenn der Spieler das Land verlässt und der Landbesitzer keine weiteren Chunks beanspruchen darf (player_chunks-Limit aus player-limits.yml)?
  leave-unclaim: false

  # Chunk-Beanspruchung durch Platzieren eines speziellen Anspruchsblocks.
  # Anspruchsblöcke können mit /lands admin player <spieler> give claimblock [menge] vergeben werden.
  # Wenn Spieler nicht per Befehl beanspruchen sollen, einfach keine lands.command.claim-Berechtigung geben.
  # Wenn Spieler keine Anspruchsblöcke nutzen sollen, einfach keine Anspruchsblöcke geben.
  claimblock:
    # Soll nur der Besitzer des Anspruchsblocks diesen verwenden können?
    # HINWEIS: Wenn deaktiviert, könnten Spieler Anspruchsblöcke weitergeben. Bei späterer Aktivierung könnten bereits
    # weitergegebene Blöcke noch von jedem genutzt werden.
    only-owner: true
    # Sollen Anspruchsblöcke nicht gegen das player_chunks-Limit zählen?
    ignore-max: true
    # Sollen Anspruchsblöcke zurückerstattet werden, wenn ein mit Anspruchsblock beanspruchter Chunk freigegeben wird?
    refund: true

  # Landspawn-Einstellungen
  spawn:
    # Erstellungseinstellungen (/lands setspawn)
    creation:
      # Landspawn automatisch bei der Landerstellung setzen (/lands create)?
      # HINWEIS: Der Spawnpunkt kann immer mit /lands setspawn geändert werden.
      auto: true
      # Kosten
      cost:
        # Kosten für die erstmalige Setzung
        set: 0.0
        # Kosten für das Ändern des Spawns
        change: 0.0

    # Teleportationseinstellungen
    teleport:
      # Kosten für die Teleportation zu einem Landspawn, wenn der Spieler dem Land nicht vertraut ist.
      costs:
        value_3: 0.0
        # Sollen die Teleportationskosten an das Land weitergegeben werden?
        give-land: false
        pay:
          # Sollen nicht vertraute Spieler die Teleportationskosten zahlen?
          untrusted: true
          # Sollen vertraute Spieler die Teleportationskosten zahlen?
          trusted: false
      # Cooldown für die Teleportation zu einem Landspawn für vertraute Spieler.
      # Gilt nicht für Spieler, die dem Land nicht vertraut sind.
      spawn-cooldown_time: 0s
      # Spieler nach dem Tod zum Landspawn teleportieren?
      re-spawn: true

  # Miet-/Verkaufsbereich-Einstellungen – Wiki: https://github.corent:m/Angeschossen/Lands/wiki/Rent-System
  # Miete = Spieler können einen Bereich ihrer Wahl mieten ohne vertraut werden zu müssen.
  # Steuern = Vertraute Spieler zahlen in einem definierten Intervall Steuern.
  # Wenn Miete oder Verkauf deaktiviert ist, können Spieler mit der Berechtigung "lands.admin.disabled-features" trotzdem Bereiche zur Miete anbieten.
  rent:
    # Sollen Spieler Teilbereiche zur Miete anbieten können?
    rent: true
    # Sollen Spieler Teilbereiche oder ihr ganzes Land verkaufen können?
    sell: true
    # Sollen Miet-Transaktionen an die Landbank gesendet werden?
    # HINWEIS: Gilt nur, wenn Banken generell aktiviert sind (Option: enabled_13).
    # Wenn deaktiviert, geht die Transaktion auf das persönliche Konto des Besitzers.
    bank: false
    # Hologramme statt Schilder verwenden? Nach dem Einrichten des Miet- oder Verkaufsschilds verschwindet es und ein klickbares Hologramm erscheint.
    # HINWEIS: Wird nur aktiviert, wenn das Hologramm-Plugin klickbare Hologramme über seine Entwickler-API unterstützt. Bekannte Plugins: CMI.
    holograms: false
    # Teleportation über den /lands rentlist-Befehl.
    teleport:
      # Kosten für die Teleportation zu einem mietbaren Bereich.
      costs_7: 0.0
      # Cooldown für die Teleportation zu einem mietbaren Bereich.
      rent-tp-cooldown_time: 0s

  # Einladungseinstellungen
  invite:
    # Wenn Einladungen deaktiviert sind, können Spieler andere direkt mit /lands trust vertrauen.
    # Diese Option erfordert einen Server-Neustart.
    enabled_16: true
    # Sollen Landbesitzer anderen Ländern vertraut werden können?
    # Wenn deaktiviert, können Landbesitzer (die mindestens ein Land besitzen) kein Mitglied in einem anderen Land sein.
    invite-owner: true

  # Einstellungen für temporäres Vertrauen. Ein Spieler kann für eine begrenzte Zeit vertraut werden via
  # /land <land> member add <spieler> <dauer> (z. B. 3d5h) oder über den "Spieler hinzufügen"-Dialog.
  # Ein temporär vertrauter Spieler ist von Steuern für den Bereich befreit und kann das Land nicht beanspruchen/freigeben,
  # es sei denn, er hat auch ein nicht-temporäres Vertrauen in einem anderen Bereich.
  # Nach Ablauf der Dauer wird das Vertrauen automatisch entzogen.
  temporary-trust:
    # Maximale Dauer in Tagen, für die ein Spieler temporär vertraut werden kann.
    # Begrenzt auch den Tages-Schieberegler im "Spieler hinzufügen"-Dialog.
    max-days: 30

  # Broadcast-Einstellungen
  broadcast:
    # Wenn jemand ein neues Land erstellt.
    # Nachricht: land.create.broadcast
    create: true
    # Wenn jemand sein Land löscht (nur wenn es Ansprüche hat, um Spam zu verhindern).
    # Nachricht: land.delete.broadcast
    delete: true

  # Einstellungen für /lands chat
  chat:
    # Sollen /lands chat-Nachrichten an die Konsole weitergeleitet werden?
    forward: false
    # Soll der globale Chat für Spieler mit aktiviertem /lands chat toggle stummgeschaltet werden?
    # HINWEIS: Diese Einstellung erfordert einen Server-Neustart.
    mute-global: false

  # Flug-Einstellungen (Flags befinden sich im Rollen-Abschnitt)
  fly:
    # Wenn Flugkontrolle deaktiviert ist, hat das FLY-Flag aus roles.yml keine Wirkung.
    # Um den Flug in der Wildnis zu verbieten, das Fly-Flag im Admin-Menü umschalten: /lands admin menu
    enabled_4: true
    # Diese Option betrifft nur Welten, die nicht in claim-worlds_list sind.
    # In Welten aus claim-worlds_list wird der Flug über das FLY-Flag gesteuert.
    # Um den Flug in der Wildnis von Beanspruchungs-Welten zu steuern, einfach /lands admin menu ausführen während man in der Welt steht.
    # Diese Liste erlaubt oder verbietet den Flug in Welten außerhalb von claim-worlds_list. Wichtig beim Weltenwechsel.
    # Wildcard (*) fügt alle Welten hinzu.
    # Eintragsformat: "weltName:flugErlaubt"
    # Beispiel:
    #   world:false -> Wenn world nicht in claim-worlds_list ist, wird der Flug in dieser Welt deaktiviert.
    #   world:true -> Wenn world nicht in claim-worlds_list ist, wird der Flug beim Betreten nicht deaktiviert.
    #   Wenn world in claim-worlds_list ist, wird der Flug über das FLY-Flag in /lands admin menu gesteuert.
    flight-control-worlds_list: [ ]
    # Verzögerung für die Flugdeaktivierung, wenn ein Spieler an dieser Position nicht fliegen darf.
    # Zeiteinheit: Sekunden
    disable-delay: 3
    # Berechtigung prüfen, bevor Lands den Flug für einen Spieler wieder aktiviert.
    # Lands reaktiviert den Flug nur, wenn es ihn zuvor deaktiviert hat und der Spieler jetzt wieder fliegen darf.
    # Diese Berechtigung ist eine zusätzliche Anforderung neben dem FLY-Rollen-Flag.
    reactivate-perm: ''

  # /lands setowner-Einstellungen
  setowner:
    # Wenn diese Option deaktiviert wird, werden die Befehle /lands accept und /lands deny entfernt, WENN auch Einladungen deaktiviert sind.
    enabled_12: true
    # Das Land (oder der Landbesitzer, wenn Banken deaktiviert sind) muss diesen Betrag zahlen, um einen neuen Besitzer zu setzen.
    # Verhindert den Missbrauch von Besitzerwechseln zur Umgehung von Einschränkungen.
    costs_6: 5000.0
    # Erlaubt dem Besitzer nur, wenn die letzte Besitzeränderung einige Zeit zurückliegt.
    owner-change-cooldown_time: 0s

  # Wenn aktiviert, können Landmitglieder Gegenstände mit /lands storage lagern.
  # Auf den Lager kann auch durch Klicken auf den Fass des Hauptblocks zugegriffen werden.
  # WARNUNG: Wenn diese Option deaktiviert wird, werden alle Gegenstände im Lager gelöscht.
  storage: true

  # Inaktive Länder löschen, wenn der Besitzer seit x Tagen offline ist. Diese Aufgabe wird alle 6 Stunden ausgeführt.
  # HINWEIS: Bei Änderungen an diesen Einstellungen wird ein Datenbank-Backup empfohlen, um versehentliche Fehler zu vermeiden.
  #           Andernfalls riskiert man eine unwiderrufliche Löschung von Ländern.
  # HINWEIS: Diese Einstellungen erfordern einen Server-Neustart.
  expiration:
    # Wie lange muss ein Besitzer offline sein, um als inaktiv zu gelten?
    # Ermöglicht verschiedene Kategorien inaktiver Spieler nach ihrer Spielzeit.
    # Format: 'spielzeit:offline-zeit'
    # Spielzeit = Zeit, die der Spieler auf dem Server gespielt hat (inkl. Zeit vor der Lands-Installation).
    #
    # Beispiel:
    # owner_list:
    #  - '15m:7d'
    #  - '30m:14d'
    #  - '12h:30d'
    #  - '1d:60d'
    #  - '15d:80d'
    #  - '30d:never' <- "never" im letzten Eintrag bedeutet, dass Spieler mit mehr als 15 Tagen Spielzeit nie als inaktiv gelten.
    #
    # '15m:7d' und '30m:14d' bedeutet: Besitzer mit höchstens 15 Minuten Spielzeit gelten als inaktiv, wenn sie seit 7 Tagen offline sind.
    # Besitzer mit mehr als 15 Minuten und weniger als 30 Minuten Spielzeit gelten als inaktiv nach 14 Tagen Offline-Zeit.
    # Hat ein Besitzer mehr Spielzeit als alle Einträge, wird der Eintrag mit der höchsten Spielzeit verwendet.
    # '30d:never' bedeutet, dass das Land nie gelöscht oder der Besitzer geändert wird.
    # Inaktive Besitzer werden je nach Konfiguration entweder durch ein Mitglied ersetzt oder ihr Land wird gelöscht.
    # Eine leere Liste deaktiviert diese Option.
    owner_list: [ ]

    # Wie lange muss ein Landmitglied offline sein, um als inaktiv zu gelten?
    # Inaktive Landmitglieder werden aus dem Land entfernt.
    # Folgt demselben Muster wie owner_list oben.
    member_list: [ ]

    # Soll ein inaktiver Besitzer durch ein Landmitglied ersetzt werden?
    # Lands setzt immer das Mitglied mit der höchsten Rolle als neuen Besitzer.
    # Wenn kein Mitglied mehr übrig ist, wird das Land gelöscht.
    replace-owner: true
    # Sollen Spieler, die aus dem Spielerdaten-Ordner der primären Welt gelöscht wurden, entfernt werden?
    # HINWEIS: Empfohlen ist diese Option deaktiviert zu lassen. Bei aktivierter Option und gelöschtem Spielerdaten-Ordner können JE NACH Ablaufeinstellungen ALLE betroffenen Länder gelöscht werden.
    delete-invalid: false
    # Sollen Länder ohne Ansprüche gelöscht werden, wenn sie mindestens x Tage alt sind?
    # Mit 0 deaktivieren. Nur aktiv, wenn "land.creation.claim-radius" größer als -1 ist.
    no-claims: 0

  # Sollen Spieler beim Tod in einem Land ihr Inventar behalten?
  # Diese Option wird zwangsweise aktiviert, wenn der Spieler in einem Bereich stirbt, in dem er keine Gegenstände aufheben kann.
  # Für Kriege in wars.yml konfigurieren.
  # HINWEIS: Wenn ein anderes Plugin keep-inventory ändert, diese Option deaktiviert lassen.
  keep-inventory:
    enabled_11: false
    mode_4: false

  # Spezifische Kampfeinstellungen, die keine Kriege betreffen.
  combat:
    # Kampfmarkierung
    tag:
      # Wenn ein Spieler einen anderen angreift, wird er für x (Zeiteinheit) markiert, sodass andere Spieler
      # ihn unabhängig von Land-Einstellungen angreifen können.
      # 0s = deaktiviert
      tag_time: 10s
      # Welten konfigurieren, in denen Kampfmarkierungen aktiv sein sollen.
      # HINWEIS: Wenn leer, in allen Beanspruchungs-Welten aus claim-worlds_list aktiv.
      tag-worlds_list: [ ]
      # Soll ein Spieler getötet werden, wenn er sich mit aktiver Kampfmarkierung ausloggt?
      quit-kill: false
      # Befehle ausführen, wenn ein Spieler sich mit aktiver Kampfmarkierung ausloggt.
      # Platzhalter für den Spielernamen: {player}
      quit-cmds_list: [ ]
      # Kampfmarkierung beim Tod entfernen?
      death-remove: true
      # Teleportation bei aktiver Kampfmarkierung verweigern?
      deny-teleport: true
      # Flug während des Kampfes deaktivieren?
      disable-fly: true

    # Sollen Spieler, die Mitglieder im gleichen Land sind, in der Wildnis kämpfen können?
    # HINWEIS: Diese Option erfordert einen Server-Neustart.
    ally-wilderness: true
    # Dorf-Überfälle blockieren, wenn der Initiator keine Spieler im Anspruch angreifen darf?
    block-raids: true

  # Anspruchslimits pro Welt festlegen.
  # Beispiel: Mit der Berechtigung lands.chunks.5 können Spieler 5 Chunks in jeder Beanspruchungs-Welt beanspruchen
  # statt 5 Chunks insgesamt.
  # HINWEIS: Gilt nur für Beanspruchungsberechtigungen: lands.chunks.<zahl>, lands.ownlands.<zahl>
  # Empfohlen: deaktiviert lassen.
  claim-limits-per-world: false

  # Landbank-Einstellungen (/lands balance)
  bank:
    # Wenn aktiviert, werden Landaktionen wie /lands claim vom Landkonto abgebucht statt direkt vom Spieler.
    # Wenn deaktiviert, werden auch /lands deposit und /lands withdraw deaktiviert.
    # HINWEIS: Vor dem Deaktivieren sicherstellen, dass das Economy-Plugin Transaktionen für Offline-Spieler unterstützt.
    # Sonst können Funktionen wie Steuern und Unterhalt zu unerwarteten Ergebnissen führen.
    # HINWEIS: Diese Einstellung erfordert einen Server-Neustart.
    enabled_13: true
    # Maximales Guthaben setzen. Spieler können nicht mehr einzahlen als diesen Betrag.
    # Wenn der Wert kleiner als der Unterhalt eines Landes ist, wird er automatisch angepasst.
    # 0 = Option komplett deaktivieren.
    max-balance: 0
    # Soll Geld vom persönlichen Guthaben des Spielers abgebucht werden, wenn z. B. beim Beanspruchen nicht genug in der Landbank ist?
    # Wenn deaktiviert und beim Unterhaltseinzug nicht genug in der Landbank ist, kann der Unterhalt nicht bezahlt werden.
    fallback-personal: true


# Jeder Chunk entspricht einem 16x16-Blöcke-Bereich.
chunk:
  # Kosten für das Beanspruchen von Chunks. In manchen Fällen ist das Beanspruchen kostenlos:
  # HINWEIS: Diese Kosten sind nur aktiv, wenn die Berechtigung lands.free.chunks.<zahl> des Spielers kleiner als
  # die aktuelle Chunk-Anzahl des Landes ist UND die aktuelle Chunk-Anzahl größer/gleich "claim-radius" ist.
  # Mehr Infos: https://wiki.incredibleplugins.com/lands/permissions/permissions#numbered-permissions
  costs_2: 0.0
  # Kostenerhöhung pro Chunk-Anspruch.
  cost-increase:
    # Verfügbare Modi:
    # PERCENTAGE: Z. B. 10% auf den normalen Anspruchspreis pro Anspruch aufschlagen.
    # ADD: Z. B. 10 Münzen zu den Beanspruchungskosten jedes Mal hinzufügen.
    # DEFAULT: Diese Option deaktivieren.
    mode: 'DEFAULT'
    value: 2
    # Maximale Beanspruchungskosten festlegen.
    # HINWEIS: 0 = Option deaktivieren.
    max_2: 0.0

  # Rückerstattungseinstellungen (Chunk freigeben: /lands unclaim)
  cashback:
    # Verfügbare Modi:
    # PERCENTAGE: Z. B. 10% des Kaufpreises zurückerstatten.
    # ADD: Z. B. einfach 10 Münzen zurückgeben.
    # DEFAULT: Diese Option deaktivieren.
    mode_2: 'PERCENTAGE'
    # Auf 0 setzen, um dies zu deaktivieren.
    # Bei Anspruchsblöcken (/lands admin player <spieler> give) reicht ein Wert > 0, um jeden Block bei Freigabe zurückzugeben.
    value_2: 15

  # Chunk-Teleportationsoptionen
  teleport:
    # Teleportations-Cooldown
    # Bypass-Berechtigung: lands.bypass.cooldown.teleport
    chunk-tp-cooldown_time: 3m
    # Kosten für eine Teleportation.
    costs_3: 0

  # Nur in der Ausgangswelt beanspruchen, in der das Land erstellt wurde?
  # Das bedeutet, dass ein Land nur Ansprüche in einer Welt haben kann.
  initial-world: false

  # Chunks automatisch beanspruchen, während man auf ihnen steht.
  auto-action:
    # HINWEIS: Diese Einstellung erfordert einen Server-Neustart.
    enabled_14: true
    # Nach wie viel Zeit soll die Auto-Aktion gestoppt werden?
    stop_time: 2m

  # Konfiguration natürlicher Flags. Rollen-Flags können in der roles.yml-Datei konfiguriert werden.
  # Liste verfügbarer landFlags: https://wiki.incredibleplugins.com/lands/configuration/natural-flags
  # HINWEIS: Diese Option erfordert einen Server-Neustart.
  land-flags:
    # Standard-Naturflags für neue Länder konfigurieren.
    default_list:
      - monster_spawn
      - phantom_spawn
      - animal_spawn
      - leaf_decay
      - plant_growth
      - snow_melt

    # Naturflags, die im Flags-Menü angezeigt werden sollen.
    # Standard: Alle spielerbezogenen Naturflags werden angezeigt.
    display_list:
      - 'all'

    monster_spawn:
      # Spawnen aus Spawner-Blöcken verhindern, wenn das Monster-Spawn-Flag nicht gesetzt ist?
      spawners: false
      # Monster entfernen, die ein Land oder die Wildnis betreten, wo Monster-Spawnen deaktiviert ist? Monster mit einem benutzerdefinierten Namen werden nicht entfernt.
      # HINWEIS: Entfernt auch Monster, die von Spawnern gespawnt wurden.
      # Diese Option erfordert einen Server-Neustart.
      remove_2: false

    animal_spawn:
      # Tiere entfernen, die ein Land oder die Wildnis betreten, wo Tier-Spawnen deaktiviert ist? Tiere mit einem benutzerdefinierten Namen werden nicht entfernt.
      # HINWEIS: Empfohlen ist diese Option deaktiviert zu lassen. Sie kann Inkompatibilitäten mit Drittanbieter-Mob-Plugins verursachen und könnte die Serverleistung beeinträchtigen.
      # HINWEIS: Entfernt auch Tiere, die von Spawnern gespawnt wurden.
      # Diese Option erfordert einen Server-Neustart.
      remove_3: false


# Spieler können blockgroße (keine Chunks) Teilbereiche in ihren Ländern erstellen.
sub-area:
  # Teilbereiche mit /lands selection in Ländern erstellen ermöglichen?
  enabled_22: true
  # Cooldown für die Teleportation zu einem Bereich innerhalb des eigenen Landes.
  teleport-cooldown_time: 0s


# Lager sind temporäre Länder, die nach einem definierten Zeitraum gelöscht werden.
# Lager-Gegenstände können beim ersten Beitreten oder mit /lands player <spieler> give vergeben werden.
camp:
  # HINWEIS: Diese Einstellung erfordert einen Server-Neustart.
  enabled_21: true
  # Wie viel soll es kosten? Inkl. der beanspruchten Chunks.
  costs_8: 0
  # Nach wie viel Zeit sollen Lager gelöscht werden?
  # 0 = niemals
  expire_time: 1d
  # Standard-Chunk-Radius konfigurieren.
  # Überschreibbar mit /lands player <spieler> give camp <radius> [silent]
  # 0 = nur der Chunk, in dem das Lager-Item platziert wird.
  radius: 1
  # Standard-Lagernamen setzen. Für Leerzeichen muss die Option "spaces" im Landerstellungs-Abschnitt aktiviert sein.
  default-name: "{player}-Lager"


# Optionen für /lands relations und /nations relations
relations:
  # Neue Beziehungen an alle Spieler auf dem Server senden?
  broadcast: true


# Spieler können persönliche Flags umschalten, um ihre Erfahrung anzupassen.
player:
  flags:
    # Standard-Flags-Liste konfigurieren, die aktiviert ist.
    # Gilt nur für neue Spieler oder solche, die noch keine Flags umgeschaltet haben.
    default_2_list:
      - 'receive_invites'
      - 'enter_messages'
      - 'show_inbox'

    # Flags konfigurieren, die im Menü angezeigt werden sollen.
    # ALL = alle Flags werden angezeigt.
    display_2_list:
      - 'all'


# Konfiguration des /lands unstuck-Befehls.
# Zweck: Spielern ermöglichen, aus Standorten in Ländern heraus zu teleportieren, wo sie gefangen sind.
# Z. B. ein Spieler findet einen Weg in ein Land, aber kann keinen Ausweg finden.
# Dieser Befehl teleportiert ihn zur nächsten Wildnis-Stelle.
unstuck:
  # Cooldown für diesen Befehl festlegen.
  unstuck-cooldown_time: 1h
  # Bewegung während der Unstuck-Teleportation erlauben?
  allow-movement: false


# Zufallsteleportation (/lands wild)
# Bei Verwendung den Spawn jeder Welt mit /setworldspawn setzen.
random-teleport:
  # Welten, in denen Spieler /lands wild verwenden können.
  # '*' als Eintrag erlaubt alle Welten.
  # Minimale und maximale Entfernung (außer Weltgrenze) können angegeben werden: weltName:minEntfernung:maxEntfernung
  # Die Entfernung wird vom Weltspawn (/setworldspawn) gemessen.
  # Die maximale Entfernung kann nicht größer als die Weltgrenze sein.
  wild-worlds_list:
    - "world:800:30000"

  # Sollen Berechtigungen für Zufallsteleportation weltbasiert statt nur lands.command.wild sein?
  # Beispiel: Welt 'A': lands.command.wild.a, Welt 'B': lands.command.wild.b
  world-perms: false

  # In diese Welt werden Spieler teleportiert, wenn sie nicht in einer oben definierten Welt sind.
  # HINWEIS: Der Weltname unterscheidet Groß-/Kleinschreibung.
  backup: 'world'
  # Befehlscooldown (/lands wild)
  rtp-cooldown_time: 10m
  # Teleportationskosten
  costs_4: 0.0
  # Erweiterte Biom-Prüfung: Wenn der benutzerdefinierte Weltgenerator oder heruntergeladene Karten keine Biom-Karten
  # korrekt implementiert haben, lädt diese Option den Ziel-Chunk vor der Teleportation, um das Biom zu prüfen.
  # Verhindert Teleportationen in Ozeane wegen fehlerhafter Biom-Karten.
  # HINWEIS: Diese Option kostet Performance und sollte deaktiviert werden, wenn nicht benötigt. Die meisten
  # Weltgeneratoren benötigen diese Option nicht.
  extensive-check: false


# Neue Spieler mit dem Beanspruchen vertraut machen.
introduction:
  # Spieler benachrichtigen, bis sie diese Spielzeit erreicht haben.
  # 0 deaktiviert diesen Abschnitt komplett.
  max-playtime_time: 30m
  # Erinnerungen können mehrfach gesendet werden, haben aber einen Cooldown gegen Spam.
  reminder:
    # Warnung senden, wenn ein platzierter Behälter in der Wildnis nicht geschützt ist.
    # Wird nur gesendet, wenn der Spieler noch kein Land-Mitglied ist.
    container-placement: true


# Sound-Konfiguration
# Sound-Namen können mit /playsound ingame gefunden werden.
# Format: sound,lautstärke,tonhöhe
# Lautstärke und Tonhöhe sind optional.
# Ton deaktivieren: Wert auf '' setzen
sounds:
  # Bei /lands create
  create-land_sound: 'block.anvil.use,0.25'
  # Ton bei /claim abspielen?
  # Gilt nicht für Radius- und Anspruchsblock-Claims.
  claim_sound: 'item.shovel.flatten'
  # Wird abgespielt, wenn ein Spieler eine Benachrichtigung erhält, z. B. bei einer Einladung via /trust.
  notification_sound: 'entity.experience_orb.pickup,0.25'
  # Wird für den Spieler abgespielt, der jemanden eingeladen oder vertraut hat.
  invite-sent_sound: 'item.armor.equip_elytra'
  # Wird für den Zielspieler bei /lands ban abgespielt.
  banned_sound: 'block.iron_door.close'

  # Ton, der abgespielt wird, wenn Lands einen Spieler teleportiert.
  # Töne können durch Setzen auf '' deaktiviert werden.
  teleport:
    teleported_sound: 'entity.enderman.teleport'
    countdown_sound: 'block.lever.click'

  # Ton abspielen, wenn der Flug eines Spielers nach Deaktivierung durch Lands wieder aktiviert wird.
  # Deaktivieren: Auf '' setzen
  fly-re-enable_sound: 'item.armor.equip_elytra'


# Bestenlisten für Länder und Nationen
# Umfasst /lands top, /nations top, Bestenlisten-Schilder und Hologramme
top-lands:
  # Soll Lands den Kontostand von Ländern durch 1000 teilen und "k" anhängen, wenn er größer/gleich 1000 ist?
  # HINWEIS: Beeinflusst auch die "[...]_balance" PAPI-Platzhalter.
  # Beispiel: 1400 = 1k
  divide: false
  # Schild-Bestenlisten-Einstellungen
  sign:
    head:
      enabled_5: true
      # Kopf des Landbesitzers auf dem Block über dem Bestenlisten-Schild platzieren?
      above: false
  # Hologramme (/lands admin hologram)
  hologram:
    # Einen Gegenstand festlegen, der über dem Hologramm erscheint.
    # AIR = Gegenstand deaktivieren.
    # HINWEIS: Es kann bis zu zwei Minuten dauern, bis der Gegenstand aktualisiert wird.
    item: 'DIAMOND_HELMET'
  # Länder von Bestenlisten ausschließen, Spieler mit diesen UUIDs.
  # UUID von Spielernamen: https://mcuuid.net/
  # HINWEIS: Änderungen können einige Minuten dauern bis sie wirksam sind.
  exclude-uids_list:
    - '8667ba71-b85a-4004-af54-457a9734eed7'


# Visualisierungsoptionen für /lands view usw.
visualization:
  type:
    # Wildnis
    wilderness:
      # Partikel: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Particle.html#enum.constant.summary
      particle: 'REDSTONE'
      # HINWEIS: Nur die Farbe des REDSTONE-Partikels kann geändert werden.
      # Hex-Werte: https://www.google.com/search?q=color+picker
      color: '#00bd0a'
      # Dauer in Sekunden
      duration: 20
      rows: 1
      # Blöcke statt Partikel für Teilbereiche (nicht Land-Grenzen) verwenden:
      # HINWEIS: Nicht empfohlen mit 'only-corners' (unten), da das Senden von Block-Änderungen an Spieler
      # zu Lag beim Client führen kann. Auch Partikel sind serverseitig performanter.
      # HINWEIS: Wenn leer oder AIR, wird der konfigurierte Partikel oben verwendet.
      block: ''
    # Wenn der Spieler Landbesitzer ist.
    own:
      particle_3: 'REDSTONE'
      # HINWEIS: Nur die Farbe des REDSTONE-Partikels kann geändert werden.
      # Hex-Werte: https://www.google.com/search?q=color+picker
      color_3: '#1eff00'
      duration_3: 4
      rows_3: 1
      # Blöcke statt Partikel für Teilbereiche (nicht Land-Grenzen) verwenden:
      # HINWEIS: Nicht empfohlen mit 'only-corners'.
      # HINWEIS: Wenn leer oder AIR, wird der konfigurierte Partikel verwendet.
      block_2: ''
    # Wenn der Spieler dem Land vertraut ist.
    trusted:
      particle_4: 'REDSTONE'
      # HINWEIS: Nur die Farbe des REDSTONE-Partikels kann geändert werden.
      # Hex-Werte: https://www.google.com/search?q=color+picker
      color_4: '#f2f200'
      duration_4: 4
      rows_4: 1
      # Blöcke statt Partikel für Teilbereiche (nicht Land-Grenzen) verwenden:
      # HINWEIS: Nicht empfohlen mit 'only-corners'.
      # HINWEIS: Wenn leer oder AIR, wird der konfigurierte Partikel verwendet.
      block_3: ''
    # Wenn der Spieler dem Land nicht vertraut ist.
    untrusted:
      particle_5: 'REDSTONE'
      # HINWEIS: Nur die Farbe des REDSTONE-Partikels kann geändert werden.
      # Hex-Werte: https://www.google.com/search?q=color+picker
      color_5: '#ff0000'
      duration_5: 4
      rows_5: 1
      # Blöcke statt Partikel für Teilbereiche (nicht Land-Grenzen) verwenden:
      # HINWEIS: Nicht empfohlen mit 'only-corners'.
      # HINWEIS: Wenn leer oder AIR, wird der konfigurierte Partikel verwendet.
      block_4: ''
    # Auswahlmodus visualisieren (/lands selection)
    selection:
      particle_8: 'REDSTONE'
      # HINWEIS: Nur die Farbe des REDSTONE-Partikels kann geändert werden.
      # Hex-Werte: https://www.google.com/search?q=color+picker
      color_8: '#ff9d00'
      # Bleibt dauerhaft, bis der Auswahlmodus deaktiviert wird.
      # Durch Bearbeiten dieses Werts änderbar.
      duration_8: -1
      rows_8: 1

  # /lands view-Visualisierung
  view:
    # Soll Lands Land-Grenzen automatisch anzeigen, sobald der Spieler beitritt?
    # HINWEIS: duration_9 (unten) auf -1 setzen, um die Visualisierung dauerhaft zu machen.
    join: false
    # Intervall der erscheinenden Partikel.
    # Minimum: eine Sekunde.
    view-interval_time: 1s
    # Dauer der Land-Ansicht.
    # Zeiteinheit: Sekunden. Dauerhaft: -1
    duration_9: 60
    # Soll die Grenzvisualisierung auf der anfänglichen Höhe (y-Block) bleiben?
    # Wenn false: Die Grenze folgt der Position des Spielers nach oben und unten.
    # HINWEIS: Dies ist ein Standard. Spieler können es mit /lands view stay umschalten.
    y-lock: false
    # Maximale Block-Entfernung vom Spieler, in der Teilbereiche visualisiert werden.
    # Empfohlen: 112
    area-radius: 112
    # Sichtweite in Chunks.
    # 0 = Sichtweite des Servers
    chunk-radius: 0

  # Sollen bei Teilbereichen nur die Ecken visualisiert werden?
  # HINWEIS: Betrifft nicht Land-Grenzen.
  only-corners: true
  # Y-Offset setzen (Höhe der Visualisierung anpassen)
  offset: 0

  # /lands map-Einstellungen
  map:
    # Sollen Spieler einen Chunk im /lands map-Menü durch Klicken beanspruchen können?
    claim: true
    # Maximale Chunk-Entfernung für den "Diesen Chunk beanspruchen"-Hinweis im Auswahlwerkzeug und bei Behälter-Platzierungswarnungen.
    # X-Länge (links nach rechts)
    length: 15
    # Y-Höhe (oben)
    height: 10


# Befehlsoptionen
command:
  # Separate Berechtigungen für bestimmte Unterbefehle hinzufügen.
  inherit-perm:
    # Standardmäßig gibt lands.command.claim auch Zugriff auf Anspruchs-Unterbefehle wie /lands claim auto usw.
    # Wenn diese Option deaktiviert wird, erhält jeder Unterbefehl seinen eigenen Berechtigungsknoten: lands.command.claim.auto usw.
    claim_2: true

  # Wird für Zeitbelohnungen und den Befehl "/lands player <spieler> give permission chunk" benötigt.
  permission-plugin:
    # Befehl des Berechtigungs-Plugins zum Hinzufügen von Berechtigungen.
    # {player} = Spielername
    # {uuid} = Spieler-UUID
    # {permission} = Die Lands-Berechtigung
    add: 'Luckperms user {player} permission set {permission}'
    # Befehl des Berechtigungs-Plugins zum Entfernen von Berechtigungen.
    remove: 'Luckperms user {player} permission unset {permission}'

  # Diese Optionen erfordern einen Server-Neustart.
  alias:
    # Aliase für den /lands-Befehl festlegen
    # HINWEIS: Diese Einstellung erfordert einen Server-Neustart.
    lands_list: [ ]

    # Aliase für den /wars-Befehl festlegen
    # Wird nur benötigt, wenn Kriege aktiviert sind.
    # HINWEIS: Diese Einstellung erfordert einen Server-Neustart.
    wars_list:
      - 'w'

    # Aliase für den /nations-Befehl festlegen
    # Wird nur benötigt, wenn Nationen aktiviert sind.
    # HINWEIS: Diese Einstellung erfordert einen Server-Neustart.
    nations_list:
      - 'n'

  # Befehle blockieren
  # Groß-/Kleinschreibung wird nicht unterschieden.
  blacklist:
    # Betrifft alle Spieler, die in einem Land stehen, in dem sie nicht vertraut sind.
    nottrusted_list:
      - sethome

    # Betrifft alle Spieler, die in einem Land stehen.
    general_list: [ ]


# Land-Menü-Optionen (/lands menu)
gui:
  # Eine zusätzliche Definitions-Datei erstellen, in der Slots, Elementtypen usw. konfiguriert werden.
  # Nützlich, wenn mehrere Sprachdateien gepflegt werden und Element-Slots, Modelldaten usw. gleich bleiben sollen.
  # In dieser Datei kann alles konfiguriert werden, was nicht sprachspezifisch ist.
  definitions-file: false
  # Soll Lands die Länge von Element-Lore-Zeilen automatisch anpassen?
  # Empfohlene Länge: 35.
  # HINWEIS: 0 = deaktiviert.
  max-lore-length: 0
  # Soll das /lands list-Menü nur Länder anzeigen, zu denen der Spieler teleportieren kann?
  # Spieler können es danach selbst umschalten. Dies ist nur ein Standardwert.
  list-only-public: false
  # Fortschrittsbalken anpassen, die an verschiedenen Stellen der Benutzeroberfläche angezeigt werden.
  progress:
    symbol:
      # Das anzuzeigende Symbol.
      symbol: "|"
      # 100% entspricht x Symbolen
      amount_5: 50
    color:
      # Farbe für den abgeschlossenen Teil.
      completed: "#00e617"
      # Farbe für den nicht abgeschlossenen Teil.
      uncompleted: "#4a4a4a"


# Datenbankoptionen
database:
  # MySQL-Datenbank
  # Verbindungslimits usw. müssen in der MySQL-Server-Konfiguration korrekt eingestellt sein.
  # Zur Synchronisierung von Ländern und Ansprüchen über Server hinweg: https://wiki.incredibleplugins.com/lands/configuration/database#synchronizing-claims-across-servers
  mysql-v2:
    enabled_19: false
    address_2: 'localhost'
    port_2: '3306'
    username_2: 'minecraft'
    password_2: 'password'
    database_2: 'lands'
    # Maximale Lebensdauer einer MySQL-Verbindung. Verbindungen, die älter als der definierte Zeitraum sind, werden vom Verbindungspool geschlossen.
    max-life_time: 10m

    # Empfehlung: Eindeutiges Tabellen-Präfix setzen, wenn das Plugin eine Datenbank mit anderen Plugins teilt.
    table-prefix_2: 'lands_'

  # Wird nur benötigt, um Länder, Nationen und Ansprüche über Server zu synchronisieren.
  redis:
    enabled_6: false
    # Redis-URL muss mit redis:// oder rediss:// (SSL-Verbindung) beginnen.
    address_3: "redis://127.0.0.1"
    port_3: 6379
    # Datenbankindex. Kein anderes Plugin sollte denselben Index verwenden.
    database-index: 1
    username_3: "default"
    password_3: "password"
    # Dieser Server-Name sollte dem Namen entsprechen, der in BungeeCord oder Velocity konfiguriert wurde.
    # HINWEIS: Bei Multipaper wird dieser Wert durch Multipapers eigene Namensgebung überschrieben.
    # HINWEIS: Diese Option kann in server-name.yml überschrieben werden, damit diese Datei (config.yml) auf andere Server kopiert werden kann.
    server-name: "server-1"
    # Diese Option sollte nur auf EINEM der Server aktiviert sein, die mit derselben Lands-Datenbank und Redis verbunden sind.
    # Wenn true: Dieser Server führt Aufgaben wie Unterhalt, Steuern usw. für alle Länder über alle verbundenen Server aus.
    # HINWEIS: Bei Multipaper den tatsächlichen Namen der Multipaper-Instanz angeben, die Master-Server sein soll (nicht der Multipaper-Master).
    # HINWEIS: Diese Option kann in server-name.yml überschrieben werden.
    master: false

  # Wenn Lands keine Verbindung zur MySQL-Datenbank herstellen kann (z. B. ungültige oder veraltete Anmeldedaten).
  # Sollen Spieler am Beitreten gehindert werden, wenn keine Datenbankverbindung möglich ist?
  # Kann passieren, wenn die Datenbank-Anmeldedaten geändert werden, aber nicht in dieser Konfiguration aktualisiert werden.
  error-disallow-join: true


# Drittanbieter-Plugin-Optionen
integration:
  # Management-Integrationen
  manager:
    WorldEdit:
      # Verwendung von WorldEdit in Ländern anderer Spieler, denen man nicht vertraut, verbieten?
      # Bei FAWE: Spieler können mit "fawe.lands"-Berechtigung Schutzmechanismen umgehen.
      # Bei FAWE muss "region-restrictions" in der FAWE-Konfiguration aktiviert sein.
      enabled_7: true

    # Lands-Claim-Flag auch auf globale Regionen in Welt-Manager-Plugins wie WorldGuard anwenden?
    # HINWEIS: Nur aktivieren, wenn das Beanspruchen in der Wildnis verboten werden soll.
    #       Für die Verwaltung von Wildnis-Flags wie Block-Brechen stattdessen /lands admin menu verwenden.
    # Diese Option erfordert einen Server-Neustart.
    global-regions: false

  # Optionen für das Drittanbieter-Plugin MythicMobs.
  mythicmobs:
    # Mob-IDs aus MythicMobs hinzufügen, die das Tier- und Monster-Spawn-Flag umgehen sollen.
    # Wildcard "*" fügt alle MythicMobs-Mobs hinzu.
    bypass-spawn-flags_list:
      - "*"

  # Sollen Skins vom Drittanbieter-Plugin SkinsRestorer abgerufen werden?
  # Erfordert, dass die Option "general.fetch-skins-names" aktiviert ist.
  skins-restorer: false

  # Optionen für Fahrzeuge des Vehicles-Plugins. Betrifft keine Minecraft-Vanilla-Fahrzeuge.
  # Wenn aktiviert:
  #   Verbietet die Platzierung von Fahrzeugen in einem Land, wenn der Spieler keine Fahrzeug-Nutzungsberechtigung hat.
  #   Erlaubt Landmitgliedern, Fahrzeuge anderer Spieler im Land aufzuheben, auch ohne Fahrzeugbesitz.
  # Wenn deaktiviert, können nicht vertraute Spieler Fahrzeuge platzieren, die Landmitglieder nicht entfernen können.
  vehicles: true

  # Soll Lands Luckperms-Kontext für das Setzen von Berechtigungen bereitstellen?
  luckperms-context: true

  # Economy-Einstellungen
  # Wenn alle Typen deaktiviert sind, wird stattdessen die gegenstandsbasierte Economy verwendet.
  # HINWEIS: Bei Änderungen dieser Option auch "eco-format" in dieser Konfiguration anpassen.
  economy:
    vault:
      # Es wird ein Economy-Plugin benötigt, das Vault unterstützt.
      enabled_10: true
      # Server-Bank-Kontoname. Unterhalt wird hierhin überwiesen. Leer = Funktion deaktiviert.
      server-bank: ''
    # Spieler-Erfahrung
    exp:
      enabled_15: false
    # Gegenstands-Währung wird verwendet, wenn alle anderen Economy-Optionen deaktiviert oder nicht verfügbar sind.
    # Die Währungs-Gegenstände können in der GUI-Sprachdatei geändert werden (nach "currency" suchen). Die Sprachdatei ist unter /plugins/Lands/Language/deinlocale_gui.yml zu finden.
    # Model-Data für die Währungs-Gegenstände kann auch in der GUI-Sprachdatei gesetzt werden: https://wiki.incredibleplugins.com/general/menus/gui-menus#set-custom-model-data
    # Bitte beachten: Steuern können nicht aktiviert werden, wenn keine Vault-Economy verwendet wird.
    items:
      # Wenn aktiviert, gehören nur Gegenstände mit demselben Namen, derselben Beschreibung usw. zur Währung.
      # Nicht nur Gegenstände desselben Typs oder mit denselben Model-Data.
      strict: false


# Dieser Abschnitt muss wahrscheinlich nicht bearbeitet werden.
entities:
  # Hier kann angegeben werden, welche Entitäten als Tier oder Monster gelten.
  # Betrifft alle Teile des Plugins, die diese Entitätsgruppen einbeziehen.
  # Enthält die Liste "default": Neue Entitäten zukünftiger Updates, die zu dieser Kategorie gehören, werden automatisch hinzugefügt.
  # Bestimmte Entitäten aus der "default"-Liste entfernen: Sowohl "default" als auch "-entitätstyp" zur Liste hinzufügen (beachte das Minus vor dem Entitätstyp).
  animals_list:
    - 'default'
  monsters_list:
    - 'default'


# Protokollierung konfigurieren
logging:
  # Kann bei der Fehlersuche hilfreich sein, wenn man uns einen Fehlerbericht einreicht.
  # Nützlich auch zum Debuggen von Variablen für events.yml.
  debug: false
  # Beim Herunterfahren alles zwangsweise speichern, auch wenn keine Datenänderungen vorliegen.
  force-save: false
  # Aufrufer von Events usw. identifizieren.
  # Verfügbar: land_balance_changed
  print-callstack_list: [ ]
