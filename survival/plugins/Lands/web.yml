# Web-Integration
# Unterstützt (Dynmap, BlueMap, squaremap)
# Alle drei können gleichzeitig verwendet werden.
# Änderungen in diesem Abschnitt erfordern einen Server-Neustart.
map:
  general:
    # Sollen Land-Markierungen standardmäßig ausgeblendet sein?
    hide: false
    # Name der Ebene, in der Spieler markierte Länder sehen können.
    layer: 'Länder'
    # Für mehr Anonymität der Spieleraktivität kann ein Aktualisierungsintervall angegeben werden.
    # Verhindert, dass Feinde Dynmap nutzen, um Spieleraktivität zu verfolgen.
    # Zeiteinheiten: d, h, m, s -> Beispiel: 1h
    # Standard: 0 = Standardverhalten von Lands verwenden (empfohlen)
    # Diese Option erfordert einen Server-Neustart.
    update_time: 0
    land:
      # Sollen Admin-Länder (/lands admin menu) angezeigt werden?
      show-admin: true
      # Sollen nur Länder, die Teil einer Nation sind, auf der Karte erscheinen?
      # Hinweis: Diese Option erfordert einen Server-Neustart.
      only-nation: false
      # Zur Bearbeitung der Farbe die Hex-Werte von hier verwenden:
      # https://www.google.com/search?q=color+picker
      color:
        from-name:
          # Farbe nach dem Land-Namen setzen?
          land: false
          # Farbe nach dem Nationsname setzen?
          nation: true
        # Standardfarben, wenn der Land-Name keine Farbe hat oder from-name deaktiviert ist.
        # Farbauswahl: https://www.google.com/search?q=color+picker
        land: '#00ff00'
        admin: '#ffff00'
    border:
      # Standard-Grenzfarbe:
      # Farbauswahl: https://www.google.com/search?q=color+picker
      color:
        from-name:
          # Farbe nach dem Land-Namen setzen?
          land_2: false
          # Farbe nach dem Nationsname setzen?
          nation_2: true
        # Standardfarben, wenn der Land-Name keine Farbe hat oder from-name deaktiviert ist.
        # Farbauswahl: https://www.google.com/search?q=color+picker
        land_2: '#009933'
        admin_2: '#ffcc00'

  dynmap:
    enabled: false
    # Link zur Karte für den Befehl /lands map link.
    # Den Platzhalter "{dynmap}" zur Nachricht "map.link" in der Sprachdatei hinzufügen, um den Link dort anzuzeigen.
    # Wenn für keinen aktiven Kartentyp ein Link gesetzt ist, wird der Befehl deaktiviert.
    link: "http://127.0.0.1:8123"
    # Spawn-Symbol setzen
    # Deaktivieren: icon auf '' setzen
    spawn:
      # Symbol festlegen. Wenn leer, wird kein Symbol angezeigt.
      icon: 'greenflag'
      # Symbol für die Hauptstadt einer Nation festlegen. Wenn leer, wird kein Symbol angezeigt.
      icon-capital: 'greenflag'
      # Mindestzoom festlegen. Das Symbol wird nicht angezeigt, wenn der Zoom im Browser größer ist (Mausrad).
      min-zoom: 0
    land:
      # Deckkraft des Landes. Muss zwischen 0 (niedrigste) und 1 (höchste) liegen.
      opacity: 0.35
    border:
      # Deckkraft der Landgrenze. Muss zwischen 0 (niedrigste) und 1 (höchste) liegen.
      opacity_2: 1
      # Dicke der Grenze.
      thickness: 2

  bluemap:
    enabled_2: true
    # Link zur Karte für den Befehl /lands map link.
    # Den Platzhalter "{bluemap}" zur Nachricht "map.link" in der Sprachdatei hinzufügen, um den Link dort anzuzeigen.
    # Wenn für keinen aktiven Kartentyp ein Link gesetzt ist, wird der Befehl deaktiviert.
    link_2: "http://127.0.0.1:8100"
    # Spawn-Symbol setzen
    # Deaktivieren: icon auf '' setzen
    spawn:
      # Symbol festlegen
      # HINWEIS: Dies muss die absolute Bildadresse sein. Empfohlene Bildgröße: 32 x 32 Pixel
      # Pfad ist relativ zum "bluemap"-Ordner auf dem Server.
      # Beispiel: 'assets\steve.png'
      icon_2: ''
      # Symbol zentrieren
      icon-anchor:
        # Für eine Zentrierung sollte hier die halbe Symbolbreite in Pixeln eingetragen werden.
        x: 25
        # Für eine Zentrierung sollte hier die halbe Symbolhöhe in Pixeln eingetragen werden.
        y: 25
      # Symbol für die Hauptstadt einer Nation festlegen.
      # HINWEIS: Dies muss die absolute Bildadresse sein. Empfohlene Bildgröße: 32 x 32 Pixel
      # Pfad ist relativ zum "bluemap"-Ordner auf dem Server.
      # Beispiel: 'assets\steve.png'
      icon-capital_2: ''
      # Symbol zentrieren
      icon-capital-anchor:
        # Für eine Zentrierung sollte hier die halbe Symbolbreite in Pixeln eingetragen werden.
        x_2: 25
        # Für eine Zentrierung sollte hier die halbe Symbolhöhe in Pixeln eingetragen werden.
        y_2: 25
      # Mindestzoom festlegen. Das Symbol wird nicht angezeigt, wenn der Zoom im Browser kleiner ist (Mausrad).
      min-zoom_2: 5
    # Marker-Höhe setzen.
    height: 62
    land:
      # Deckkraft des Landes. Muss zwischen 0 (niedrigste) und 1 (höchste) liegen.
      opacity_3: 0.35
      # Sollen 3D-Marker zur Visualisierung von Ansprüchen verwendet werden? Das bedeutet, sie erstrecken sich bis zur minimalen und maximalen Höhe des Anspruchs.
      3d: false

    border:
      # Deckkraft der Landgrenze. Muss zwischen 0 (niedrigste) und 1 (höchste) liegen.
      opacity_4: 1


  squaremap:
    enabled_3: false
    # Link zur Karte für den Befehl /lands map link.
    # Den Platzhalter "{squaremap}" zur Nachricht "map.link" in der Sprachdatei hinzufügen, um den Link dort anzuzeigen.
    # Wenn für keinen aktiven Kartentyp ein Link gesetzt ist, wird der Befehl deaktiviert.
    link_3: "http://127.0.0.1:8080"
    # Spawn-Symbol setzen
    # Deaktivieren: icon auf '' setzen
    spawn:
      # Symbol festlegen
      # HINWEIS: Dies muss die absolute Bildadresse sein. Empfohlene Bildgröße: 32 x 32 Pixel
      # Beispiel: 'pfad-zum-server\bluemap\web\assets\steve.png'
      icon_3: ''
      # Symbol für die Hauptstadt einer Nation festlegen.
      # HINWEIS: Dies muss die absolute Bildadresse sein. Empfohlene Bildgröße: 32 x 32 Pixel
      # Beispiel: 'pfad-zum-server\bluemap\web\assets\steve.png'
      icon-capital_3: ''
      # Mindestzoom festlegen. Das Symbol wird nicht angezeigt, wenn der Zoom im Browser kleiner ist (Mausrad).
      min-zoom_3: 126
    land:
      # Deckkraft des Landes. Muss zwischen 0 (transparent) und 255 (vollständig opak) liegen.
      opacity_5: 0.35
    border:
      # Deckkraft der Landgrenze. Muss zwischen 0 (transparent) und 255 (vollständig opak) liegen.
      opacity_6: 1
      # Dicke der Grenze.
      thickness_3: 2

  Pl3xMap:
    enabled_4: false
    # Link zur Karte für den Befehl /lands map link.
    # Den Platzhalter "{pl3xmap}" zur Nachricht "map.link" in der Sprachdatei hinzufügen, um den Link dort anzuzeigen.
    # Wenn für keinen aktiven Kartentyp ein Link gesetzt ist, wird der Befehl deaktiviert.
    link_4: "http://127.0.0.1:5555"
    # Spawn-Symbol setzen
    # Deaktivieren: icon auf '' setzen
    spawn:
      # Symbol festlegen
      # HINWEIS: Dies muss die absolute Bildadresse sein. Empfohlene Bildgröße: 32 x 32 Pixel
      # Beispiel: 'pfad-zum-server\bluemap\web\assets\steve.png'
      icon_4: ''
      # Symbol für die Hauptstadt einer Nation festlegen.
      # HINWEIS: Dies muss die absolute Bildadresse sein. Empfohlene Bildgröße: 32 x 32 Pixel
      # Beispiel: 'pfad-zum-server\bluemap\web\assets\steve.png'
      icon-capital_4: ''
    land:
      # Deckkraft des Landes. Muss zwischen 0 (niedrigste) und 1 (höchste) liegen.
      opacity_7: 0.6
    border:
      # Deckkraft der Landgrenze. Muss zwischen 0 (niedrigste) und 1 (höchste) liegen.
      opacity_8: 0.9
      # Dicke der Grenze.
      thickness_4: 2
