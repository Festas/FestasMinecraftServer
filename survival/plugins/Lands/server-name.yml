# Diese Datei ist nur relevant, wenn Redis in config.yml aktiviert ist.
# Hier können der Server-Name und die Master-Option für Redis überschrieben werden.
# Da das Kopieren der config.yml von einem Server auf einen anderen zu Problemen führen kann,
# wenn Server-Name und Master-Option für Redis nicht angepasst werden, können diese Werte in
# dieser Datei konfiguriert werden, sodass sie die Redis-Optionen in config.yml überschreiben.
# Einfach die Kommentare vor den gewünschten Optionszeilen entfernen und den Wert setzen.

# Dies sollte der Name sein, der für diesen Server in der BungeeCord- oder Velocity-Konfiguration eingetragen ist.
# HINWEIS: Bei Multipaper wird diese Option durch Multipapers eigene Namensgebung überschrieben.
#server-name: "server-1"

# Diese Option sollte nur auf EINEM der Server aktiviert sein, die mit derselben Lands-Datenbank und Redis verbunden sind.
# Wenn true: Dieser Server führt Aufgaben wie Unterhalt, Steuern usw. für alle Länder über alle verbundenen Server aus.
# HINWEIS: Bei Multipaper den tatsächlichen Namen der Multipaper-Instanz angeben, die Master-Server sein soll (nicht der Multipaper-Master).
#master: false
