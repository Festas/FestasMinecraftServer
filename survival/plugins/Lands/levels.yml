# In dieser Datei können Standard-Land- und Nationsstufen bearbeitet/hinzugefügt werden.
# Jeder Konfigurationsabschnitt (Stufenabschnitt) und jeder Stufenname muss eindeutig sein.
# Es muss gültiges YAML-Format verwendet werden. Zum Prüfen: https://yaml-online-parser.appspot.com

# Standard-Land- und Nationsstufen. Eigene Stufen können ebenfalls hinzugefügt werden.
# Die Reihenfolge der Stufen ist aufsteigend (niedrigste -> höchste).
# Diese Datei kann nicht per /lands reload neu geladen werden.

general:
  # Wenn aktiviert, werden Länder und Nationen nicht herabgestuft, wenn sie die Stufenvoraussetzungen nicht mehr erfüllen.
  keep-level: false

land:
  # Land-Stufen aktivieren?
  enabled: true
  # Hier können bestehende Stufen bearbeitet oder neue hinzugefügt werden.
  levels:
    1:
      # Namen der Stufe festlegen.
      title: 'Siedlung'
      # Diese Werte sind nur aktiv, wenn das Land kein Mitglied einer Nation ist.
      # Attribute einer Stufe werden zum aktuellen Wert des Landes oder der Nation addiert.
      attributes:
        # Das Chunks-Attribut fügt dem Land Chunks hinzu oder entfernt sie (= negativer Wert). Das Land kann dann mehr (oder weniger) Chunks mit /claim beanspruchen.
        chunks:
          description: '&7{value} Claims'
          value: 0
        members:
          description: '&7{value} Mitglieder'
          value: 0
        # Das Unterhalt-Attribut erhöht oder senkt (= negativer Wert) die Unterhaltskosten um einen bestimmten Wert.
        # Dieses Attribut ist nicht aktiv, wenn das Land Teil einer Nation ist.
        upkeep:
          description: '&7{value}% Unterhalt'
          # Die Erhöhung oder Senkung erfolgt in Prozent. Wert 5 erhöht den Unterhalt um insgesamt 5 Prozent (nicht pro Chunk).
          value: 0
    2:
      title: 'Dorf'
      requirements:
        # Erforderliche Mitglieder für diese Stufenzuweisung.
        members:
          required: 2
          title: 'Vertraue {req} Spielern'
          description:
            - '&7Vertraue {req} Spielern in diesem Land.'
            - '&7Befehl: &e/lands trust'
        # Erforderliche Chunks für diese Stufenzuweisung.
        chunks:
          required: 4
          title: 'Claime {req} Chunks'
          description:
            - '&7Claime {req} Chunks für dieses Land.'
            - '&7Befehl: &e/claim'
        # Erforderliches Kontoguthaben für diese Stufenzuweisung (/lands balance).
        balance:
          required: 5000
          title: 'Kontostand von {req}€'
          description:
            - '&7Lege {req}€ in die Landbank ein.'
            - '&7Befehl: &e/lands deposit'
      attributes:
        chunks:
          description: '&7{value} Claims'
          value: 1
        members:
          description: '&7{value} Mitglieder'
          value: 1
        upkeep:
          description: '&7{value}% Unterhalt'
          value: 5
      # Konsolen-Befehle ausführen, wenn das Land diese Stufe erreicht oder von dieser Stufe zur vorherigen herabgestuft wird.
      # Verfügbare Platzhalter:
      # {level}: Name der Stufe
      # {land}: Parametername des Landes = ohne Leerzeichen.
      # {land_name}: Name des Landes. Kann Leerzeichen enthalten.
      # {owner}: Spielername des Landbesitzers.
      # {member}: Spielername eines Landmitglieds.
      # Wenn der Befehl den Platzhalter {member} enthält, wird der Befehl für jeden dem Land vertrauten Spieler ausgeführt.
      commands:
        # Wenn ein Land diese Stufe erreicht.
        reached: [ ]
        # Wenn ein Land von der nächsten Stufe auf diese herabgestuft wird.
        down: [ ]
    3:
      title: 'Stadt'
      requirements:
        members:
          required: 4
          title: 'Vertraue {req} Spielern'
          description:
            - '&7Vertraue {req} Spielern in diesem Land.'
            - '&7Befehl: &e/lands trust'
        chunks:
          required: 12
          title: 'Claime {req} Chunks'
          description:
            - '&7Claime {req} Chunks für dieses Land.'
            - '&7Befehl: &e/claim'
        balance:
          required: 15000
          title: 'Kontostand von {req}€'
          description:
            - '&7Lege {req}€ in die Landbank ein.'
            - '&7Befehl: &e/lands deposit'
      attributes:
        chunks:
          description: '&7{value} Claims'
          value: 2
        members:
          description: '&7{value} Mitglieder'
          value: 2
        upkeep:
          description: '&7{value}% Unterhalt'
          value: 10
      commands:
        reached: [ ]
        down: [ ]
    4:
      title: 'Provinz'
      requirements:
        members:
          required: 8
          title: 'Vertraue {req} Spielern'
          description:
            - '&7Vertraue {req} Spielern in diesem Land.'
            - '&7Befehl: &e/lands trust'
        chunks:
          required: 24
          title: 'Claime {req} Chunks'
          description:
            - '&7Claime {req} Chunks für dieses Land.'
            - '&7Befehl: &e/claim'
        balance:
          required: 30000
          title: 'Kontostand von {req}€'
          description:
            - '&7Lege {req}€ in die Landbank ein.'
            - '&7Befehl: &e/lands deposit'
      attributes:
        chunks:
          description: '&7{value} Claims'
          value: 4
        members:
          description: '&7{value} Mitglieder'
          value: 3
        upkeep:
          description: '&7{value}% Unterhalt'
          value: 25
      commands:
        reached: [ ]
        down: [ ]
    5:
      title: 'Fürstentum'
      requirements:
        members:
          required: 12
          title: 'Vertraue {req} Spielern'
          description:
            - '&7Vertraue {req} Spielern in diesem Land.'
            - '&7Befehl: &e/lands trust'
        chunks:
          required: 48
          title: 'Claime {req} Chunks'
          description:
            - '&7Claime {req} Chunks für dieses Land.'
            - '&7Befehl: &e/claim'
        balance:
          required: 60000
          title: 'Kontostand von {req}€'
          description:
            - '&7Lege {req}€ in die Landbank ein.'
            - '&7Befehl: &e/lands deposit'
      attributes:
        chunks:
          description: '&7{value} Claims'
          value: 8
        members:
          description: '&7{value} Mitglieder'
          value: 4
        upkeep:
          description: '&7{value}% Unterhalt'
          value: 30
      commands:
        reached: [ ]
        down: [ ]


nation:
  # Nationsstufen aktivieren?
  enabled: true
  # Hier können bestehende Nationsstufen bearbeitet oder neue hinzugefügt werden.
  levels:
    1:
      # Namen der Stufe festlegen.
      title: 'Bund'
      # Für die Eingangsstufe sind keine Attribute gesetzt. Sie können aber trotzdem hinzugefügt werden.
      # Attribute einer Stufe werden zum aktuellen Wert des Landes oder der Nation addiert.
      attributes:
        chunks:
          description: '&7{value} Claims'
          value: 0
        lands:
          description: '&7{value} Länder'
          value: 0
        upkeep:
          description: '&7{value}% Unterhalt'
          value: 0
        effects:
          description: '&a+ Schaltet Effekte frei: {value}'
          value: [ ]
        effects_amount:
          description: '&a+ Gleichzeitig aktive Effekte: {value}'
          value: 0
    2:
      title: 'Nation'
      requirements:
        # Erforderliche Mindestanzahl eindeutiger Länder in der Nation.
        # Das Hauptstadtland ist nicht enthalten.
        lands:
          required: 3
          title: '{req} Länder'
          description:
            - '&7Lade {req} Länder in deine Nation ein'
            - '&7und lasse die Einladungen annehmen.'
            - '&7Befehl: &e/nation trust'
        # Erforderliche Mitglieder (einzigartige Spieler insgesamt) für diese Stufenzuweisung.
        members:
          required: 16
          title: '{req} einzigartige Spieler'
          description:
            - '&7Habe insgesamt {req} vertraute Spieler.'
            - '&7Befehl: &e/lands trust'
        # Erforderliche Gesamtanzahl an Chunks für diese Stufenzuweisung.
        chunks:
          required: 64
          title: 'Claime {req} Chunks'
          description:
            - '&7Habe insgesamt {req} Claims.'
            - '&7Befehl: &e/claim'
        # Erforderliches Gesamtguthaben (Guthaben aller Länder) für diese Stufenzuweisung.
        balance:
          required: 100000
          title: 'Kontostand von {req}€'
          description:
            - '&7Lege insgesamt {req}€ in den Landbanken an.'
            - '&7Befehl: &e/lands deposit'
      attributes:
        # Jedem Land der Nation x zusätzliche Chunks geben.
        chunks:
          description: '&7{value} Claims'
          value: 20
        lands:
          description: '&7{value} Länder'
          value: 1
        # Unterhalt um x Prozent ändern. Unterstützt auch negative Werte.
        # Die Nation zahlt den Unterhalt an den Server.
        upkeep:
          description: '&7{value}% Unterhalt'
          value: 20
        # Nationen erlauben, eine bestimmte Anzahl von Effekten in ihrer Nation zu aktivieren. Effekte können durch Stufenaufstieg freigeschaltet werden.
        effects:
          description: '&a+ Schaltet Effekte frei: {value}'
          # Liste freigeschalteter Effekte für diese Stufe konfigurieren. Gültige Effekte: https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/potion/PotionEffectType.html
          # Format: EFFEKT:VERSTÄRKER
          # Der Verstärker ist die Stärke (Stufe) des Effekts. Beispiel: JUMP:2 -> Sprung II
          value:
            - JUMP
            - SPEED
            - FAST_DIGGING
            - DOLPHINS_GRACE
        # Anzahl der gleichzeitig aktiven Effekte ändern.
        effects_amount:
          description: '&a+ Gleichzeitig aktive Effekte: {value}'
          value: 1
      # Konsolen-Befehle ausführen, wenn die Nation diese Stufe erreicht oder von dieser Stufe zur vorherigen herabgestuft wird.
      # Verfügbare Platzhalter:
      # {level}: Name der Stufe
      # {nation}: Name der Nation
      # {owner}: Spielername des Nationsbesitzers.
      # {land}: Parametername des Landes, das zur Nation gehört. Enthält keine Leerzeichen.
      # {land_name}: Name des Landes, das zur Nation gehört. Kann Leerzeichen enthalten.
      # Wenn der Befehl den Platzhalter {land} enthält, wird der Befehl für jedes Land ausgeführt, das zur Nation gehört.
      commands:
        # Wenn eine Nation diese Stufe erreicht.
        reached: [ ]
        # Wenn eine Nation von der nächsten Stufe auf diese herabgestuft wird.
        down: [ ]
    3:
      title: 'Imperium'
      requirements:
        lands:
          required: 5
          title: '{req} Länder'
          description:
            - '&7Lade {req} Länder in deine Nation ein'
            - '&7und lasse die Einladungen annehmen.'
            - '&7Befehl: &e/nations trust'
        members:
          required: 32
          title: '{req} einzigartige Spieler'
          description:
            - '&7Habe insgesamt {req} vertraute Spieler.'
            - '&7Befehl: &e/lands trust'
        chunks:
          required: 160
          title: 'Claime {req} Chunks'
          description:
            - '&7Habe insgesamt {req} Claims.'
            - '&7Befehl: &e/claim'
        balance:
          required: 250000
          title: 'Kontostand von {req}€'
          description:
            - '&7Lege insgesamt {req}€ in den Landbanken an.'
            - '&7Befehl: &e/lands deposit'
      attributes:
        chunks:
          description: '&7{value} Claims'
          value: 35
        lands:
          description: '&7{value} Länder'
          value: 3
        upkeep:
          description: '&7{value}% Unterhalt'
          value: 35
        effects:
          description: '&a+ Schaltet Effekte frei: {value}'
          value:
            - JUMP:2
            - SPEED:2
            - FAST_DIGGING:2
            - DOLPHINS_GRACE:2
            - ABSORPTION
            - NIGHT_VISION
            - LUCK
            - INCREASE_DAMAGE
            - HEALTH_BOOST
        effects_amount:
          description: '&a+ Gleichzeitig aktive Effekte: {value}'
          value: 3
      commands:
        reached: [ ]
        down: [ ]


# Töne können durch Setzen auf '' deaktiviert werden.
sound:
  # Wird bei Stufenaufstieg für jeden Spieler des Landes oder der Nation abgespielt.
  up: 'block.bell.use'
  # Wird bei Stufenabstieg für jeden Spieler des Landes oder der Nation abgespielt.
  down: 'block.anvil.destroy'
