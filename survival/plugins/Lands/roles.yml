# In dieser Datei können Standard-Rollen bearbeitet/hinzugefügt werden.
# Jeder Konfigurationsabschnitt (Rollenabschnitt) und jeder Rollenname muss eindeutig sein.
# Es muss gültiges YAML-Format verwendet werden. Zum Prüfen des Formats den Inhalt dieser Datei hier einfügen: https://yaml-online-parser.appspot.com
# Erklärung der Rollen und ihrer Flags: https://wiki.incredibleplugins.com/lands/configuration/roles-and-their-flags
# Bitte beachten: Änderungen an Optionen in dieser Datei erfordern möglicherweise einen Server-Neustart.

# Standard-Land-Rollen. Eigene Standard-Rollen können ebenfalls hinzugefügt werden.
# Die Priorität der Rollen ist absteigend (höchste Rolle -> niedrigste).
land:
  # Welche Flags sollen im Rollen-Einstellungs-Menü angezeigt werden?
  # Standardwerte können trotzdem gesetzt und ausgeblendet werden, indem sie aus dieser Liste entfernt werden.
  # Die Reihenfolge dieser Liste bestimmt auch die Sortierung in den Menüs.
  display:
    - BLOCK_PLACE
    - BLOCK_BREAK
    - BLOCK_IGNITE
    - PLANT
    - HARVEST
    - TRAMPLE_FARMLAND
    - SHEAR
    - ITEM_PICKUP
    - INTERACT_GENERAL
    - INTERACT_CONTAINER
    - INTERACT_DOOR
    - INTERACT_TRAPDOOR
    - INTERACT_MECHANISM
    - INTERACT_VILLAGER
    - VEHICLE_USE
    - ATTACK_PLAYER
    - ATTACK_ANIMAL
    - ATTACK_MONSTER
    - WIND_BURST
    - LAND_ENTER
    - FLY
    - ELYTRA
    - SPAWN_TELEPORT
    - ENDER_PEARL
    - PLAYER_TRUST
    - PLAYER_SETROLE
    - PLAYER_UNTRUST
    - PLAYER_BAN
    - LAND_CLAIM
    - LAND_CLAIM_BORDER
    - SPAWN_SET
    - BALANCE_WITHDRAW
    - AREA_ASSIGN
    - WAR_MANAGE
    - SETTING_EDIT_LAND
    - SETTING_EDIT_ROLE
    - SETTING_EDIT_TAXES
    - SETTING_EDIT_VARIOUS

  # Hier können eigene Standard-Rollen hinzugefügt oder bestehende bearbeitet werden. Spieler können weiterhin neue Rollen in ihrem Land-Menü erstellen, wenn sie die erforderliche Berechtigung haben.
  # HINWEIS: Die Reihenfolge der Rollen beeinflusst die anfängliche Priorität. Rollen oben haben die höchste Priorität, Rollen unten die niedrigste.
  ################################################################################################################################
  # Wenn ein neues Flag zu Lands hinzugefügt wird, wird es automatisch auf alle bestehenden Länder angewendet,                  #
  # wenn vom Flag-Autor so vorgesehen. Für zukünftige Land-Erstellungen muss es hier korrekt konfiguriert werden.               #
  # Lands zeigt immer eine Benachrichtigung in der Konsole und bei Admin-Accounts ingame,                                        #
  # wenn ein neues Flag verfügbar ist.                                                                                           #
  # Flags können mit /lands admin land <land | *> resetFlag <flag | all> synchronisiert/zurückgesetzt werden.                   #
  ################################################################################################################################
  roles:
    # HINWEIS: Die Besitzer-Rolle kann nicht gelöscht werden.
    owner:
      name: '&4&lBesitzer'
      # Das Symbol unterstützt Minecraft-URL-Werte (Beispiel: https://minecraft-heads.com/) und normale Material-Werte.
      icon: 'skin:83f642814fa2551e7763d04060c532adea51015cbfe030cbb78e82c92092a6fb'
      # Standard-Flag-Werte. Gilt nur für neue Land-Erstellungen. Die Flags der Besitzer-Rolle können nur von Server-Administratoren umgeschaltet werden.
      # ALL statt einer Liste gibt dieser Rolle alle Spieler-Flags. Flags, die nur für Admin-Länder gelten, werden nicht gesetzt.
      default: 'ALL'

    # Diese Rolle kann nicht gelöscht werden, ist aber nur sichtbar, wenn ein Bereich vermietet wird oder in Admin-Ländern.
    tenant:
      name: '&6&lMieter'
      # Das Symbol unterstützt Minecraft-URL-Werte (Beispiel: https://minecraft-heads.com/) und normale Material-Werte.
      icon: 'skin:d831830a7bd3b1ab05beb98dc2f9fc5ea550b3cf649fd94d483da7cd39f7c063'
      # Sollen Länder bestimmte Flags für diese Rolle umschalten können? Das ist nur möglich, solange der Bereich NICHT vermietet ist.
      # WARNUNG: Dies könnte Ländern erlauben, Bereiche zu vermieten, in denen Mieter kaum oder gar keine Berechtigungen haben,
      # je nach "allow-edit"-Liste. "all" zur Liste hinzufügen erlaubt alle Flags für diese Rolle.
      # HINWEIS: Für das Umschalten werden trotzdem die allgemeinen Umschalt-Berechtigungen benötigt. Diese befinden sich im Wiki: https://wiki.incredibleplugins.com/lands/configuration/roles-and-their-flags#flags
      allow-toggle-flags: []
      # Standard-Flag-Werte. Gilt nur für neue Vermietungen.
      # Nur Admin-Länder können diese Flags ingame ändern. Verhindert, dass Länder Bereiche vermieten, in denen Mieter keine Berechtigungen haben.
      default:
        - BLOCK_PLACE
        - BLOCK_BREAK
        - PLANT
        - HARVEST
        - SHEAR
        - INTERACT_GENERAL
        - INTERACT_DOOR
        - INTERACT_TRAPDOOR
        - INTERACT_CONTAINER
        - INTERACT_MECHANISM
        - INTERACT_VILLAGER
        - BLOCK_IGNITE
        - ATTACK_PLAYER
        - ATTACK_ANIMAL
        - ATTACK_MONSTER
        - WIND_BURST
        - FLY
        - ELYTRA
        - LAND_ENTER
        - SPAWN_TELEPORT
        - ENDER_PEARL
        - VEHICLE_USE
        - ITEM_PICKUP
        - TRAMPLE_FARMLAND
        - PLAYER_TRUST
        - PLAYER_SETROLE
        - PLAYER_UNTRUST
        - PLAYER_BAN

    # Diese Rolle kann gelöscht werden, falls sie nicht benötigt wird.
    admin:
      name: '&c&lVerwalter'
      # Das Symbol unterstützt Textur-Werte (Beispiel: https://minecraft-heads.com/) und normale Material-Werte.
      icon: 'skin:548e2397834b1a16b15b71a52175ed8ae6919366dfecd3882a85f8236ff5d1d4'
      # Sollen Mitglieder dieser Rolle automatisch zu neuen Teilbereichen hinzugefügt werden?
      parent: true
      # Standard-Flag-Werte. Gilt nur für neue Land-Erstellungen. Spieler können sie später im Land-Menü ändern, wenn das Flag unter 'display' aufgelistet ist.
      default:
        - BLOCK_PLACE
        - BLOCK_BREAK
        - PLANT
        - HARVEST
        - SHEAR
        - INTERACT_GENERAL
        - INTERACT_DOOR
        - INTERACT_TRAPDOOR
        - INTERACT_CONTAINER
        - INTERACT_MECHANISM
        - INTERACT_VILLAGER
        - BLOCK_IGNITE
        - ATTACK_PLAYER
        - ATTACK_ANIMAL
        - ATTACK_MONSTER
        - WIND_BURST
        - FLY
        - ELYTRA
        - LAND_ENTER
        - SPAWN_TELEPORT
        - ENDER_PEARL
        - VEHICLE_USE
        - ITEM_PICKUP
        - TRAMPLE_FARMLAND
        - PLAYER_TRUST
        - PLAYER_SETROLE
        - PLAYER_UNTRUST
        - PLAYER_BAN
        - SETTING_EDIT_LAND
        - SETTING_EDIT_ROLE

    # HINWEIS: Die Mitglieder-Rolle kann nicht gelöscht werden.
    member:
      name: '&e&lMitglied'
      # Das Symbol unterstützt Textur-Werte (Beispiel: https://minecraft-heads.com/) und normale Material-Werte.
      icon: 'skin:e8b8c6a46d87cf86a55df214cf84bf45cca25edb9a676e96364dd6a6eea235b3'
      # Standard-Flag-Werte. Gilt nur für neue Land-Erstellungen. Spieler können sie später im Land-Menü ändern, wenn das Flag unter 'display' aufgelistet ist.
      default:
        - BLOCK_PLACE
        - BLOCK_BREAK
        - PLANT
        - HARVEST
        - SHEAR
        - INTERACT_GENERAL
        - INTERACT_DOOR
        - INTERACT_TRAPDOOR
        - INTERACT_CONTAINER
        - INTERACT_MECHANISM
        - INTERACT_VILLAGER
        - BLOCK_IGNITE
        - ATTACK_PLAYER
        - ATTACK_ANIMAL
        - ATTACK_MONSTER
        - WIND_BURST
        - FLY
        - ELYTRA
        - LAND_ENTER
        - SPAWN_TELEPORT
        - ENDER_PEARL
        - TRAMPLE_FARMLAND
        - VEHICLE_USE
        - ITEM_PICKUP

    # Diese Rolle kann gelöscht werden, falls sie nicht benötigt wird.
    # Empfohlen zu behalten, wenn Nationen aktiviert sind und Spieler derselben Nation Zugriff auf bestimmte Flags erhalten sollen.
    nation:
      name: '&9&lNation'
      # Das Symbol unterstützt Textur-Werte (Beispiel: https://minecraft-heads.com/) und normale Material-Werte.
      icon: 'skin:45587da7fe7336e8ab9f791ea5e2cfc8a827ca959567eb9d53a647babf948d5'
      # Standard-Flag-Werte. Gilt nur für neue Land-Erstellungen. Spieler können sie später im Land-Menü ändern, wenn das Flag unter 'display' aufgelistet ist.
      default:
        - INTERACT_GENERAL
        - INTERACT_DOOR
        - INTERACT_TRAPDOOR
        - INTERACT_MECHANISM
        - INTERACT_VILLAGER
        - ATTACK_PLAYER
        - ATTACK_ANIMAL
        - ATTACK_MONSTER
        - WIND_BURST
        - FLY
        - ELYTRA
        - SPAWN_TELEPORT
        - ENDER_PEARL
        - LAND_ENTER
        - VEHICLE_USE
        - ITEM_PICKUP
        - LAND_CLAIM_BORDER

      # Eine Nation hat die Kontrolle über die Nationsrolle ihrer Länder.
      # Hier können Flags angegeben werden, die die Nation für die Nationsrolle ihrer Länder umschalten kann.
      # Die Nationsrolle kann im Nationsmenü bearbeitet werden -> /nations menu
      toggleable-by-nation:
        - INTERACT_GENERAL
        - INTERACT_DOOR
        - INTERACT_TRAPDOOR
        - INTERACT_MECHANISM
        - INTERACT_VILLAGER
        - ATTACK_PLAYER
        - ATTACK_ANIMAL
        - ATTACK_MONSTER
        - WIND_BURST
        - FLY
        - SPAWN_TELEPORT
        - ENDER_PEARL
        - LAND_ENTER
        - VEHICLE_USE
        - ITEM_PICKUP
        - LAND_CLAIM_BORDER

    # Diese Rolle kann gelöscht werden, falls sie nicht benötigt wird.
    ally:
      name: '&a&lVerbündete'
      # Das Symbol unterstützt Textur-Werte (Beispiel: https://minecraft-heads.com/) und normale Material-Werte.
      icon: 'skin:2567251d71b6f3a4dc03fa01e441de7edf9354794e74aec16c04f141ddf31c70'
      # Standard-Flag-Werte. Gilt nur für neue Land-Erstellungen. Spieler können sie später im Land-Menü ändern, wenn das Flag unter 'display' aufgelistet ist.
      default:
        - INTERACT_GENERAL
        - INTERACT_DOOR
        - INTERACT_TRAPDOOR
        - INTERACT_MECHANISM
        - INTERACT_VILLAGER
        - ATTACK_PLAYER
        - ATTACK_ANIMAL
        - ATTACK_MONSTER
        - WIND_BURST
        - FLY
        - SPAWN_TELEPORT
        - ENDER_PEARL
        - LAND_ENTER
        - VEHICLE_USE
        - ITEM_PICKUP
        - LAND_CLAIM_BORDER

    # HINWEIS: Die Besucher-Rolle kann nicht gelöscht werden.
    visitor:
      name: '&8&lBesucher'
      # Das Symbol unterstützt Textur-Werte (Beispiel: https://minecraft-heads.com/) und normale Material-Werte.
      icon: 'skin:126ec1ca185b47aad39f931db8b0a8500ded86a127a204886ed4b3783ad1775c'
      # Standard-Flag-Werte. Gilt nur für neue Land-Erstellungen. Spieler können sie später im Land-Menü ändern, wenn das Flag unter 'display' aufgelistet ist.
      default:
        - LAND_ENTER
        - ITEM_PICKUP
        - ATTACK_MONSTER
        - ATTACK_PLAYER
