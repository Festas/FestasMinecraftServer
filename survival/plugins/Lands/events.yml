  ChunkDeleteEvent:
    cancel: ''
    commands:
      # Es wird empfohlen, für Land-Löschung, Auswahl-Freigabe usw. spezifischere Events zu verwenden.
      # Daher werden hier nur Freigaben abgehört, die einen einzelnen Chunk betreffen. Außerdem kann
      # dieses Event nicht abgebrochen werden, wenn der Freigabe-Typ nicht DEFAULT ist.
      # Liste dedizierter Freigabe-Events, die auch abgebrochen werden können:
      # LAND_DELETION: LandDeleteEvent
      # SELECTION: LandUnclaimSelectionEvent
      # ALL: LandUnclaimAllEvent
      condition: 'type == "DEFAULT"'
      groups:
        player_self:
          1:
            condition: ''
            commands: [ ]
        land_trusted:
          1:
            condition: ''
            commands: [ ]
        land_online:
          1:
            condition: ''
            commands: [ ]
