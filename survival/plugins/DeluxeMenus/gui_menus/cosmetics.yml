      - '&7Hinterlasse brennende Partikel!'
      - ''
      - '&7Preis: &e500.000€'
      - ''
      - '&e► Linksklick zum Kaufen'
    left_click_commands:
      - '[console] cmi money take %player% 500000'
      - '[console] lp user %player% permission set playerparticles.effect.flame true'
      - '[console] pp fixed create %player% ~0 ~1 ~0 feet flame'
      - '[message] &8[&d✨&8] &aFlammen-Spur freigeschaltet!'
      - '[sound] ENTITY_PLAYER_LEVELUP'
      - '[close]'
    left_click_requirement:
      requirements:
        money:
          type: has money
          amount: 500000
      deny_commands:
        - '[message] &8[&d✨&8] &cDu brauchst 500.000€!'
