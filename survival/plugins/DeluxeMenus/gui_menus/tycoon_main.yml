    slot: 12
    priority: 1
    display_name: '&6&lAlles Verkaufen'
    lore:
      - '&7Verkauft dein ganzes Inventar.'
      # PAPI Placeholder für ShopGUI+ Multiplikator
      - '&7Dein Multiplikator: &e%shopguiplus_modifier_group%'
