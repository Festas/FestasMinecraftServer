menu_title: '&8» &6Tycoon Manager'
open_command: tycoon_menu
size: 36

items:
  # ==============================================================
  # FILLER (Hintergrund)
  # ==============================================================
  'filler':
    material: BLACK_STAINED_GLASS_PANE
    slots:
      - '0-35'
    display_name: '&f'
    priority: 2

  # ==============================================================
  # 1. GENERATOR SHOP
  # ==============================================================
  'gens_shop':
    material: EMERALD_BLOCK
    slot: 10
    priority: 1
    display_name: '&a&lGeneratoren Markt'
    lore:
      - '&7Kaufe neue Generatoren.'
      - '&7Limit: &f10 Stück'
      - ''
      - '&e► Linksklick zum Öffnen'
    left_click_commands:
      - '[openguimenu] generators'
      - '[sound] UI_BUTTON_CLICK'

  # ==============================================================
  # 2. VERKAUFEN
  # ==============================================================
  'sell_all':
