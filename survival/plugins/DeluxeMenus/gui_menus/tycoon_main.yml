menu_title: '&8» &6Tycoon Manager'
open_command: tycoon_menu
size: 36

items:
  # ==============================================================
  # FILLER (Hintergrund)
  # ==============================================================
  'filler':
    material: BLACK_STAINED_GLASS_PANE
    slots:
      - '0-35'
    display_name: '&f'
    priority: 2

  # ==============================================================
  # 1. GENERATOR SHOP
  # ==============================================================
  'gens_shop':
    material: EMERALD_BLOCK
    slot: 10
    priority: 1
    display_name: '&a&lGeneratoren Markt'
    lore:
      - '&7Kaufe neue Generatoren.'
      - '&7Limit: &f10 Stück'
      - ''
      - '&e► Linksklick zum Öffnen'
    left_click_commands:
      - '[openguimenu] generators'
      - '[sound] UI_BUTTON_CLICK'

  # ==============================================================
  # 2. VERKAUFEN
  # ==============================================================
  'sell_all':
    material: HOPPER
    slot: 12
    priority: 1
    display_name: '&6&lAlles Verkaufen'
    lore:
      - '&7Verkauft dein ganzes Inventar.'
      # PAPI Placeholder für ShopGUI+ Multiplikator
      - '&7Dein Multiplikator: &e%shopguiplus_modifier_group%'
      - ''
      - '&6► Linksklick zum Verkaufen'
    left_click_commands:
      - '[player] sell'
      - '[sound] ENTITY_EXPERIENCE_ORB_PICKUP'
      - '[close]'

  # ==============================================================
  # 3. RANGAUFSTIEG
  # ==============================================================
  'rankup':
    material: DIAMOND_BLOCK
    slot: 14
    priority: 1
    display_name: '&b&lRang Aufstieg'
    lore:
      - '&7Steige auf, um neue Generatoren'
      - '&7freizuschalten.'
      - '&c&oAchtung: Haupt-Plot wird zurückgesetzt!'
      - '&7&oZusätzliche Plots bleiben erhalten.'
      - ''
      - '&7Aktueller Rang: &f%rankup_current_rank%'
      - '&7Nächster Rang: &f%rankup_next_rank%'
      - '&7fehlt noch: &a%rankup_money_left_formatted%'
    left_click_commands:
      - '[player] rankup'
      - '[close]'

  # ==============================================================
  # 4. ZUR BASIS
  # ==============================================================
  'plot_home':
    material: IRON_DOOR
    slot: 16
    priority: 1
    display_name: '&e&lZur Basis'
    lore:
      - '&7Teleportiert dich zu'
      - '&7deinem Tycoon Plot.'
    left_click_commands:
      - '[player] plot home tycoon'
      - '[close]'

  # ==============================================================
  # 4b. PLOT MANAGEMENT
  # ==============================================================
  'plot_manage':
    material: GRASS_BLOCK
    slot: 26
    priority: 1
    display_name: '&2&lPlot Verwaltung'
    lore:
      - '&7Kaufe zusätzliche Plots oder'
      - '&7merge benachbarte Plots.'
      - ''
      - '&7Zusätzlicher Plot: &e$1.000.000'
      - '&7Plot Merge: &e$5.000.000'
      - ''
      - '&7Max. Plots je nach Rang:'
      - '&7 Erde–Kupfer: &f1 Plot'
      - '&7 Gold–Diamant: &f2 Plots'
      - '&7 Obsidian–Diorit: &f3 Plots'
      - '&7 Andesit–Purpur: &f4 Plots'
      - '&7 Endstein–Bedrock: &f5 Plots'
      - ''
      - '&a► Linksklick: Neuen Plot claimen'
      - '&e► Rechtsklick: Plots mergen'
    left_click_commands:
      - '[player] plot auto'
      - '[close]'
    right_click_commands:
      - '[player] plot merge'
      - '[close]'

  # ==============================================================
  # 5. WARPS MENÜ (Öffnet Untermenü)
  # ==============================================================
  'warps_menu':
    material: COMPASS
    slot: 22
    priority: 1
    display_name: '&9&lWarps'
    lore:
      - '&e► Öffne Warp-Liste'
    left_click_commands:
      - '[openguimenu] tycoon_warps'
      - '[sound] UI_BUTTON_CLICK'

  # ==============================================================
  # 6. KOSMETIK SHOP
  # ==============================================================
  'cosmetics':
    material: AMETHYST_SHARD
    slot: 20
    priority: 1
    display_name: '&d&l✨ Kosmetik Shop'
    lore:
      - '&7Partikel, Chat-Farben &'
      - '&7Verkleidungen kaufen!'
      - ''
      - '&d► Linksklick zum Öffnen'
    left_click_commands:
      - '[openguimenu] cosmetics'
      - '[sound] UI_BUTTON_CLICK'

  # ==============================================================
  # 7. PRESTIGE
  # ==============================================================
  'prestige':
    material: NETHER_STAR
    slot: 24
    priority: 1
    display_name: '&5&l✦ Prestige'
    lore:
      - '&7Prestige-Info & Aufstieg'
      - '&7nach Bedrock-Rang.'
      - ''
      - '&5► Linksklick für Info'
    left_click_commands:
      - '[player] prestige'
      - '[close]'

  # ==============================================================
  # 8. ACHIEVEMENTS
  # ==============================================================
  'achievements':
    material: GOLDEN_APPLE
    slot: 4
    priority: 1
    display_name: '&6&l🏆 Achievements'
    lore:
      - '&7Zeige deine Fortschritte'
      - '&7und freigeschalteten Badges!'
      - ''
      - '&6► Linksklick zum Anzeigen'
    left_click_commands:
      - '[player] achievements'
      - '[close]'

  # ==============================================================
  # 9. BÖRSE
  # ==============================================================
  'boerse':
    material: SUNFLOWER
    slot: 18
    priority: 1
    display_name: '&e&l📈 Börse'
    lore:
      - '&7Aktuelle Marktpreise'
      - '&7Dynamisch basierend auf'
      - '&7Angebot & Nachfrage!'
      - ''
      - '&e► Linksklick für Preise'
    left_click_commands:
      - '[player] boerse'
      - '[close]'

