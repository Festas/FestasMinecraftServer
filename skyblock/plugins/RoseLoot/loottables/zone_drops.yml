# ============================================================
# Zonen-spezifische Loot-Tabellen — RPG Server
# Seltene Drops werden serverweit angekündigt
# ============================================================

loottables:
  waldland_drops:
    conditions:
      world: rpg
      region: waldland
    items:
      - material: OAK_LOG
        amount: 1-3
        chance: 30
      - material: APPLE
        amount: 1
        chance: 10
      - material: SWEET_BERRIES
        amount: 1-2
        chance: 8
      - material: MUSHROOM_STEW
        amount: 1
        chance: 5
      # Seltene Drops
      - material: mmoitems:SWORD:WALDKLINGE
        chance: 0.5
        broadcast: "&6&l✦ SELTENER DROP! &e%player% &7hat &6Waldklinge &7erhalten!"
      - material: mmoitems:HELMET:WALDKRONE
        chance: 0.3
        broadcast: "&6&l✦ SELTENER DROP! &e%player% &7hat &6Waldkrone &7erhalten!"

