# ============================================================
# Slayer-spezifische Loot-Tabellen — Skyblock Server
# Bad-Luck Protection: Drop-Chance erhöht sich nach jedem
# erfolglosen Kill um einen Bruchteil bis zum Drop.
# ============================================================

loottables:
  # --------------------------------------------------------
  # Revenant Horror (Zombie Slayer)
  # --------------------------------------------------------
  revenant_horror_t1:
    conditions:
      mythicmob: RevenantHorror_T1
    # Bad-Luck Protection: Basis 5%, +0.5% pro Kill ohne Drop
    items:
      - material: ROTTEN_FLESH
        amount: 16-32
        chance: 100
      - material: mmoitems:MATERIAL:UNTOTE_ESSENZ
        amount: 1
        chance: 20
      - material: mmoitems:MATERIAL:REVENANT_FLEISCH
        amount: 1
        chance: 5
        broadcast: "&6&l✦ SLAYER DROP! &e%player% &7hat &aRevenant-Fleisch &7erhalten!"

  revenant_horror_t2:
    conditions:
      mythicmob: RevenantHorror_T2
    # Bad-Luck Protection: Basis 3%, +0.3% pro Kill ohne Drop
