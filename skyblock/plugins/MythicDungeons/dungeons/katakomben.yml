    player-lives: 3
    gamemode: SURVIVAL
    keep-inventory: true
    loot-cooldown:
      enabled: true
      type: DAILY
    rooms:
      entrance:
        display-name: "&7Eingang zur Gruft"
        type: START
      corridor_1:
        display-name: "&7Dunkler Korridor"
        type: COMBAT
        mobs:
          zombie:
            type: ZOMBIE
            amount: 8
            level-range: "15-18"
          skeleton:
            type: SKELETON
            amount: 5
            level-range: "15-18"
      corridor_2:
