# Katakomben - Skyblock Dungeon System
# 5 Etagen mit steigender Schwierigkeit
#
# Dieses Konfigurationspaket definiert die Katakomben,
# den Hauptdungeon des Skyblock-Servers.
# Jede Etage steigert Schwierigkeit und Belohnungen.

floors:
