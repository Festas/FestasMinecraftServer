# Pfad: plugins/DeluxeMenus/gui_menus/help_menu.yml
# Skyblock Help-Menü – geöffnet über /help
menu_title: '&8» &b❓ Skyblock Hilfe'
open_command: help_menu
size: 45

items:

  # ==============================================================
  # FILLER
  # ==============================================================
  'filler':
    material: LIGHT_BLUE_STAINED_GLASS_PANE
    slots:
      - '0-8'
      - '36-44'
    display_name: '&f'
    priority: 2

  'filler2':
    material: BLACK_STAINED_GLASS_PANE
    slots:
      - '9'
      - '17'
      - '18'
      - '26'
      - '27'
      - '35'
    display_name: '&f'
    priority: 2

  # ==============================================================
  # HEADER
  # ==============================================================
  'header':
    material: OAK_SAPLING
    slot: 4
    priority: 1
    display_name: '&b&l❓ Skyblock Hilfe'
    lore:
      - '&7Willkommen auf dem Skyblock Server!'
      - '&7Baue deine Insel und lade Freunde ein.'

  # ==============================================================
  # DEINE INSEL
  # ==============================================================
  'island':
    material: GRASS_BLOCK
    slot: 10
    priority: 1
    display_name: '&a&l🏝 Deine Insel'
    lore:
      - '&7Starte mit einer kleinen Insel und'
      - '&7baue sie Stück für Stück aus!'
      - ''
      - '&8» &fErstelle &7deine eigene Insel'
      - '&8» &fSammle Ressourcen &7und erweitere sie'
      - '&8» &fInsel-Menü &7für alle Einstellungen'
      - ''
      - '&eBefehle:'
      - '&e/is &8– &7Insel-Menü öffnen'
      - '&e/is create &8– &7Neue Insel erstellen'
      - '&e/is tp &8– &7Zur Insel teleportieren'

  # ==============================================================
  # FREUNDE & KOOP
  # ==============================================================
  'coop':
    material: PLAYER_HEAD
    slot: 12
    priority: 1
    display_name: '&d&l🤝 Freunde & Koop'
    lore:
      - '&7Baue gemeinsam mit deinen Freunden'
      - '&7an einer Insel – ganz ohne Gilden!'
      - ''
      - '&8» &fLade Freunde &7auf deine Insel ein'
      - '&8» &fKoop-Mitglieder &7bauen zusammen'
      - '&8» &fVerwalte &7deine Insel-Mitglieder'
      - ''
      - '&eBefehle:'
      - '&e/is invite <Spieler> &8– &7Freund einladen'
      - '&e/is accept <Spieler> &8– &7Einladung annehmen'
      - '&e/is members &8– &7Mitglieder anzeigen'
      - '&e/is coop <Spieler> &8– &7Als Koop hinzufügen'

  # ==============================================================
  # INSEL-AUSBAU
  # ==============================================================
  'upgrades':
    material: EXPERIENCE_BOTTLE
    slot: 14
    priority: 1
    display_name: '&b&l⬆ Insel-Ausbau'
    lore:
      - '&7Werte deine Insel auf und steige'
      - '&7im Insel-Level!'
      - ''
      - '&8» &fUpgrades &7für Größe, Grenzen & mehr'
      - '&8» &fInsel-Level &7durch wertvolle Blöcke'
      - '&8» &fBlockwert &7prüfen bevor du platzierst'
      - ''
      - '&eBefehle:'
      - '&e/is upgrade &8– &7Upgrade-Menü öffnen'
      - '&e/is value &8– &7Wert eines Blocks anzeigen'

  # ==============================================================
  # WIRTSCHAFT & HANDEL
  # ==============================================================
  'economy':
    material: GOLD_INGOT
    slot: 16
    priority: 1
    display_name: '&e&l💰 Wirtschaft & Handel'
    lore:
      - '&7Verdiene Coins und handle mit'
      - '&7anderen Spielern!'
      - ''
      - '&8» &fBazaar &7– Sofort kaufen & verkaufen'
      - '&8» &fMarktplatz &7– Handel mit Spielern'
      - '&8» &fAuktionshaus &7– Items versteigern'
      - ''
      - '&eBefehle:'
      - '&e/bazaar &8– &7Bazaar öffnen'
      - '&e/market &8– &7Marktplatz öffnen'
      - '&e/auction &8– &7Auktionshaus öffnen'
      - '&e/money &8– &7Kontostand anzeigen'

  # ==============================================================
  # ALLE BEFEHLE
  # ==============================================================
  'commands':
    material: COMMAND_BLOCK
    slot: 28
    priority: 1
    display_name: '&e&l⌨ Alle Befehle'
    lore:
      - '&7Die wichtigsten Befehle:'
      - ''
      - '&e/is &8– &7Insel-Menü'
      - '&e/is invite <Spieler> &8– &7Freund einladen'
      - '&e/is warp &8– &7Insel-Warps'
      - '&e/is visit <Spieler> &8– &7Insel besuchen'
      - '&e/is upgrade &8– &7Insel aufwerten'
      - '&e/bazaar &8– &7Bazaar'
      - '&e/market &8– &7Marktplatz'
      - '&e/auction &8– &7Auktionshaus'
      - '&e/money &8– &7Kontostand'

  # ==============================================================
  # WARPS & BESUCHEN
  # ==============================================================
  'warps':
    material: ENDER_PEARL
    slot: 30
    priority: 1
    display_name: '&5&l🌀 Warps & Besuchen'
    lore:
      - '&7Besuche die Inseln anderer Spieler!'
      - ''
      - '&eBefehle:'
      - '&e/is warps &8– &7Öffentliche Insel-Warps'
      - '&e/is visit <Spieler> &8– &7Insel besuchen'
      - '&e/is warp &8– &7Eigene Warps verwalten'

  # ==============================================================
  # SUPPORT
  # ==============================================================
  'support':
    material: ENDER_EYE
    slot: 32
    priority: 1
    display_name: '&c&l❓ Hilfe & Support'
    lore:
      - '&7Brauchst du Hilfe? So erreichst du uns:'
      - ''
      - '&8» &fDiscord: &7discord.gg/festasbuilds'
      - '&8» &fIn-Game: &7/report <Spieler> <Grund>'
      - ''
      - '&7Erstelle ein Ticket auf Discord'
      - '&7für schnelle Hilfe!'

  # ==============================================================
  # ZURÜCK ZUR LOBBY
  # ==============================================================
  'lobby':
    material: ARROW
    slot: 40
    priority: 1
    display_name: '&7&l← Zurück zur Lobby'
    lore:
      - '&7Verbinde dich zur Lobby'
    left_click_commands:
      - '[close]'
      - '[connect] lobby'
    right_click_commands:
      - '[close]'
      - '[connect] lobby'
