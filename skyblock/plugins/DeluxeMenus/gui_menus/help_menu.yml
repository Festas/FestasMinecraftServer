# Pfad: plugins/DeluxeMenus/gui_menus/help_menu.yml
# Skyblock Help-Menü – geöffnet über /help oder den Netzwerk-Kompass
menu_title: '&8» &3❓ Skyblock Hilfe'
open_command: help_menu
size: 45

items:

  # ==============================================================
  # FILLER
  # ==============================================================
  'filler':
    material: CYAN_STAINED_GLASS_PANE
    slots:
      - '0-8'
      - '36-44'
    display_name: '&f'
    priority: 2

  'filler2':
    material: BLACK_STAINED_GLASS_PANE
    slots:
      - '9'
      - '17'
      - '18'
      - '26'
      - '27'
      - '35'
    display_name: '&f'
    priority: 2

  # ==============================================================
  # HEADER
  # ==============================================================
  'header':
    material: GRASS_BLOCK
    slot: 4
    priority: 1
    display_name: '&3&l❓ Skyblock Hilfe'
    lore:
      - '&7Willkommen auf dem Skyblock Server!'
      - '&7Baue deine eigene Insel im Himmel auf.'

  # ==============================================================
  # INSEL
  # ==============================================================
  'island':
    material: OAK_SAPLING
    slot: 10
    priority: 1
    display_name: '&a&l🌴 Deine Insel'
    lore:
      - '&7Alles beginnt mit deiner eigenen Insel!'
      - ''
      - '&8» &fErstelle deine Insel mit &e/is create'
      - '&8» &fSetze deinen Spawn mit &e/is sethome'
      - '&8» &fErweitere die Grenze mit &e/is border'
      - ''
      - '&eBefehle:'
      - '&e/is &8– &7Insel-Menü öffnen'
      - '&e/is create &8– &7Neue Insel erstellen'
      - '&e/is home &8– &7Zur Insel teleportieren'
    left_click_commands:
      - '[close]'
      - '[player] /is'
    right_click_commands:
      - '[close]'
      - '[player] /is'

  # ==============================================================
  # TEAM / COOP
  # ==============================================================
  'coop':
    material: PLAYER_HEAD
    slot: 12
    priority: 1
    display_name: '&b&l🤝 Team & Coop'
    lore:
      - '&7Spiele gemeinsam mit Freunden auf'
      - '&7einer Insel – kein Gilden-System nötig!'
      - ''
      - '&8» &fLade Freunde mit &e/is invite <Spieler> &7ein'
      - '&8» &fSieh dein Team mit &e/is members'
      - '&8» &fRollen & Rechte mit &e/is permissions'
      - ''
      - '&eBefehle:'
      - '&e/is invite <Spieler> &8– &7Freund einladen'
      - '&e/is members &8– &7Team anzeigen'
      - '&e/is kick <Spieler> &8– &7Mitglied entfernen'

  # ==============================================================
  # INSEL-LEVEL & MISSIONEN
  # ==============================================================
  'level':
    material: EXPERIENCE_BOTTLE
    slot: 14
    priority: 1
    display_name: '&e&l⭐ Level & Missionen'
    lore:
      - '&7Steigere dein Insel-Level und'
      - '&7schließe Missionen für Belohnungen ab!'
      - ''
      - '&8» &fWertvolle Blöcke &7erhöhen dein Level'
      - '&8» &fMissionen &7geben Geld & Boni'
      - '&8» &fKlettere in der &e/is top &7Rangliste'
      - ''
      - '&eBefehle:'
      - '&e/is level &8– &7Insel-Level anzeigen'
      - '&e/is missions &8– &7Missionen anzeigen'
      - '&e/is top &8– &7Beste Inseln anzeigen'

  # ==============================================================
  # WIRTSCHAFT / BAZAAR
  # ==============================================================
  'economy':
    material: GOLD_INGOT
    slot: 16
    priority: 1
    display_name: '&6&l💰 Wirtschaft & Bazaar'
    lore:
      - '&7Verkaufe deine Ressourcen und'
      - '&7werde reich!'
      - ''
      - '&8» &fBazaar &7– Sofort kaufen & verkaufen'
      - '&8» &fMarktplatz &7– Handel mit Spielern'
      - ''
      - '&eBefehle:'
      - '&e/bazaar &8– &7Bazaar öffnen'
      - '&e/market &8– &7Spieler-Marktplatz'
      - '&e/bal &8– &7Kontostand anzeigen'
    left_click_commands:
      - '[close]'
      - '[player] /bazaar'
    right_click_commands:
      - '[close]'
      - '[player] /bazaar'

  # ==============================================================
  # TIPPS
  # ==============================================================
  'tips':
    material: BOOK
    slot: 22
    priority: 1
    display_name: '&d&l💡 Skyblock-Tipps'
    lore:
      - '&7Brauchst du einen guten Rat?'
      - ''
      - '&8» &fKlicke für einen zufälligen Tipp!'
      - '&8» &fOder nutze jederzeit &e/tips'
      - ''
      - '&7Der &bNetzwerk-Kompass &7in deinem'
      - '&7Inventar öffnet dieses Menü.'
    left_click_commands:
      - '[player] /tips'
    right_click_commands:
      - '[player] /tips'

  # ==============================================================
  # ALLE BEFEHLE
  # ==============================================================
  'commands':
    material: COMMAND_BLOCK
    slot: 28
    priority: 1
    display_name: '&e&l⌨ Alle Befehle'
    lore:
      - '&7Die wichtigsten Befehle:'
      - ''
      - '&e/is &8– &7Insel-Menü'
      - '&e/is create &8– &7Insel erstellen'
      - '&e/is invite &8– &7Freund einladen'
      - '&e/is level &8– &7Insel-Level'
      - '&e/bazaar &8– &7Bazaar öffnen'
      - '&e/market &8– &7Spieler-Marktplatz'
      - '&e/daily &8– &7Tägliche Belohnung'
      - '&e/tips &8– &7Zufälliger Tipp'
      - '&e/lobby &8– &7Zurück zur Lobby'

  # ==============================================================
  # BESUCHEN / WARPS
  # ==============================================================
  'visit':
    material: ENDER_PEARL
    slot: 30
    priority: 1
    display_name: '&5&l🌀 Inseln besuchen'
    lore:
      - '&7Besuche die Inseln anderer Spieler!'
      - ''
      - '&8» &fÖffentliche Warps &7mit &e/is warps'
      - '&8» &fBesuche direkt mit &e/is visit <Spieler>'
      - ''
      - '&eBefehle:'
      - '&e/is warps &8– &7Öffentliche Warps'
      - '&e/is visit <Spieler> &8– &7Insel besuchen'
      - '&e/is setwarp &8– &7Eigenen Warp setzen'

  # ==============================================================
  # SUPPORT
  # ==============================================================
  'support':
    material: ENDER_EYE
    slot: 32
    priority: 1
    display_name: '&c&l❓ Hilfe & Support'
    lore:
      - '&7Brauchst du Hilfe? So erreichst du uns:'
      - ''
      - '&8» &fDiscord: &7discord.gg/festasbuilds'
      - '&8» &fIn-Game: &7/report <Spieler> <Grund>'
      - ''
      - '&7Erstelle ein Ticket auf Discord'
      - '&7für schnelle Hilfe!'

  # ==============================================================
  # ZURÜCK ZUR LOBBY
  # ==============================================================
  'lobby':
    material: ARROW
    slot: 40
    priority: 1
    display_name: '&7&l← Zurück zur Lobby'
    lore:
      - '&7Verbinde dich zur Lobby'
    left_click_commands:
      - '[close]'
      - '[player] /lobby'
    right_click_commands:
      - '[close]'
      - '[player] /lobby'
