# Here you can set all the level values for your blocks.
# To set specific spawner types, use 'MOB_SPAWNER:<ENTITY>': <AMOUNT>
# If no level is found, the formula from config will be used (worth / 20).
#
# Ziel-Skala (Festas Skyblock):
#   - Frische Insel  < 25 Level
#   - Ausgebaute Insel  100+ Level
#   - Top-Inseln  1000+ Level
# Massen-/Generator-Bloecke sind bewusst sehr niedrig, damit Insel-Level
# durch echten Ausbau (Erze, Mineralbloecke, Spawner) und nicht durch
# stumpfes Cobble-Stapeln steigt.

