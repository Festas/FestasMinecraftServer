# The mission file to use
mission-file: IslandMissions

# Whether the mission should be given when completing all requirements.
auto-reward: true

# Rewards given when completing the mission.
rewards:
  commands:
    - 'cmi money give %player% 15000'
    - 'is admin msg %player% &e&lEntdecker | &7Mission Entdecker II abgeschlossen!'
    - 'is admin msg %player% &e&lEntdecker | &7&oDu hast deine Insel auf ein neues Level gebracht!'

# List of events that will trigger the mission.
events:
  - IslandUpgradeEvent

# Requirement of the event to complete the mission.
success-check: 'event.getUpgradeName() != null'

# List of required missions that must be completed before completing this one.
required-missions:
  - 'explorer_1'

# Icons used in the menus.
icons:
  locked:
    type: PAPER
    name: '&aEntdecker II'
    lore:
      - '&7Verbessere deine Insel mit einem Upgrade.'
      - ''
      - '&6Belohnungen:'
      - '&8 - &715.000 €'
      - ''
      - '&c&l ✘ &7Gesperrt'
  not-completed:
    type: PAPER
    name: '&aEntdecker II'
    lore:
      - '&7Verbessere deine Insel mit einem Upgrade.'
      - ''
      - '&6Belohnungen:'
      - '&8 - &715.000 €'
      - ''
      - '&c&l ✘ &7Nicht abgeschlossen'
  can-complete:
    type: PAPER
    name: '&aEntdecker II'
    lore:
      - '&7Verbessere deine Insel mit einem Upgrade.'
      - ''
      - '&6Belohnungen:'
      - '&8 - &715.000 €'
      - ''
      - '&a&l ✔ &7Klicke, um deine Belohnung abzuholen.'
    glow: true
  completed:
    type: MAP
    name: '&aEntdecker II'
    lore:
      - '&7Verbessere deine Insel mit einem Upgrade.'
      - ''
      - '&6Belohnungen:'
      - '&8 - &715.000 €'
      - ''
      - '&a&l ✔ &7Bereits abgeholt.'
