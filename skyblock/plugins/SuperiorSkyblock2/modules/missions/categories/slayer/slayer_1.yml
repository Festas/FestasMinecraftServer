# The mission file to use
mission-file: KillsMissions

# Whether the mission should be given when completing all requirements.
auto-reward: true

# Should entity counts of players get reset when completing the mission?
reset-after-finish: true

# Rewards given when completing the mission.
rewards:
  commands:
    - 'cmi money give %player% 1000'
    - 'is admin msg %player% &e&lKämpfer | &7Mission Kämpfer I abgeschlossen!'
    - 'is admin msg %player% &e&lKämpfer | &7Dein Schwert hat noch kein Blut gesehen... Töte mehr Monster!'
    - 'is admin msg %player% &e&lKämpfer | &7&oInfos zur nächsten Mission gibt es unter /is missions'

# List of all required entities must be gathered in order to complete the mission.
required-entities:
  '1':
    types:
      - 'SKELETON'
      - 'CREEPER'
      - 'ZOMBIE'
      - 'SPIDER'
    amount: 5

# Icons used in the menus.
icons:
  not-completed:
    type: PAPER
    name: '&aKämpfer I'
    lore:
      - '&7Töte 5 feindliche Monster.'
      - ''
      - '&6Benötigte Kills:'
      - '&8 - &7x5 Skelette/Creeper/Zombies/Spinnen'
      - ''
      - '&6Belohnungen:'
      - '&8 - &71.000 €'
      - ''
      - '&6Monster getötet: &7{1}/5'
      - '&6Fortschritt: &7{0}%'
      - '&c&l ✘ &7Nicht abgeschlossen'
  can-complete:
    type: PAPER
    name: '&aKämpfer I'
    lore:
      - '&7Töte 5 feindliche Monster.'
      - ''
      - '&6Benötigte Kills:'
      - '&8 - &7x5 Skelette/Creeper/Zombies/Spinnen'
      - ''
      - '&6Belohnungen:'
      - '&8 - &71.000 €'
      - ''
      - '&6Monster getötet: &75/5'
      - '&6Fortschritt: &7100%'
      - '&a&l ✔ &7Klicke, um deine Belohnung abzuholen.'
    glow: true
  completed:
    type: MAP
    name: '&aKämpfer I'
    lore:
      - '&7Töte 5 feindliche Monster.'
      - ''
      - '&6Belohnungen:'
      - '&8 - &71.000 €'
      - ''
      - '&6Monster getötet: &75/5'
      - '&6Fortschritt: &7100%'
      - '&a&l ✔ &7Bereits abgeholt.'
