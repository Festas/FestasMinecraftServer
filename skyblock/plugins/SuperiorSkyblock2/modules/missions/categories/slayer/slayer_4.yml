  locked:
    type: PAPER
    name: '&aKämpfer IV'
    lore:
      - '&7Vor dem Ende bleibt noch eine Mission.'
      - '&7Töte den Wither.'
      - ''
      - '&6Benötigte Kills:'
      - '&8 - &7x1 Wither'
      - ''
      - '&6Belohnungen:'
