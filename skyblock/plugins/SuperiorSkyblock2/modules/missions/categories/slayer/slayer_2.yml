# The mission file to use
mission-file: KillsMissions

# Whether the mission should be given when completing all requirements.
auto-reward: true

# Should entity counts of players get reset when completing the mission?
reset-after-finish: true

# Rewards given when completing the mission.
rewards:
  commands:
    - 'cmi money give %player% 5000'
    - 'is admin unlockworld %player% nether true'
    - 'is admin msg %player% &e&lKämpfer | &7Mission Kämpfer II abgeschlossen!'
    - 'is admin msg %player% &e&lKämpfer | &7Erkunde den Nether und bring ein paar Schätze mit.'
    - 'is admin msg %player% &e&lKämpfer | &7&oInfos zur nächsten Mission gibt es unter /is missions'

# List of required missions that must be completed before completing this one.
required-missions:
  - 'slayer_1'

# List of all required entities must be gathered in order to complete the mission.
required-entities:
  '1':
    types:
      - 'SKELETON'
    amount: 32
  '2':
    types:
      - 'ZOMBIE'
    amount: 32
  '3':
    types:
      - 'SPIDER'
    amount: 32
  '4':
    types:
      - 'CREEPER'
    amount: 24

# Icons used in the menus.
