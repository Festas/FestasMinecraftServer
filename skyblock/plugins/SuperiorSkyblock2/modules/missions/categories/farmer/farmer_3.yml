# The mission file to use
mission-file: FarmingMissions

# Whether the mission should be given when completing all requirements.
auto-reward: true

# Should plant counts of players get reset when completing the mission?
reset-after-finish: true

# Rewards given when completing the mission.
rewards:
  commands:
    - 'cmi money give %player% 7000'
    - 'is admin rankup %player% crop-growth'
    - 'is admin msg %player% &e&lFarmer | &7Mission Farmer III abgeschlossen!'

# List of required missions that must be completed before completing this one.
required-missions:
  - 'farmer_1'
  - 'farmer_2'

# List of all required plants must be gathered in order to complete the mission.
required-plants:
  '1':
    types:
      - 'SUGAR_CANE'
    amount: 10
  '2':
    types:
      - 'CACTUS'
    amount: 10

# Icons used in the menus.
icons:
  locked:
    type: PAPER
    name: '&aFarmer III'
    lore:
      - '&7Erweitere deine Farm mit Zuckerrohr und Kaktus.'
      - ''
      - '&6Benötigte Pflanzen:'
      - '&8 - &7x10 Zuckerrohr'
      - '&8 - &7x10 Kaktus'
      - ''
      - '&6Belohnungen:'
      - '&8 - &7Ernte-Upgrade'
      - ''
      - '&6Zuckerrohr angebaut: &7{value_sugar_cane}/10'
      - '&6Kaktus angebaut: &7{value_cactus}/10'
      - '&c&l ✘ &7Gesperrt'
    amount: 3
  not-completed:
