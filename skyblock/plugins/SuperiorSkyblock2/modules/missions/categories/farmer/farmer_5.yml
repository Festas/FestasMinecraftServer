# The mission file to use
mission-file: FarmingMissions

# Whether the mission should be given when completing all requirements.
auto-reward: true

# Should plant counts of players get reset when completing the mission?
reset-after-finish: true

# Rewards given when completing the mission.
rewards:
  commands:
    - 'cmi money give %player% 25000'
    - 'is admin rankup %player% crop-growth'
    - 'is admin msg %player% &e&lFarmer | &7Mission Farmer V abgeschlossen!'
    - 'is admin msg %player% &e&lFarmer | &7Es gibt nichts, das du nicht anbauen kannst.'
    - 'is admin msg %player% &e&lFarmer | &7&oDu bist jetzt ein Profi-Farmer, Glückwunsch!'

# List of required missions that must be completed before completing this one.
required-missions:
  - 'farmer_1'
  - 'farmer_2'
  - 'farmer_3'
  - 'farmer_4'

# List of all required plants must be gathered in order to complete the mission.
required-plants:
  '1':
    types:
      - 'CARROT'
    amount: 320
  '2':
    types:
      - 'POTATO'
    amount: 320
  '3':
    types:
      - 'WHEAT'
    amount: 320
  '4':
    types:
      - 'BEETROOT'
    amount: 320
  '5':
    types:
      - 'PUMPKIN'
    amount: 320
  '6':
    types:
      - 'MELON'
    amount: 320
  '7':
    types:
      - 'SUGAR_CANE'
    amount: 320
  '8':
    types:
      - 'CACTUS'
    amount: 320

