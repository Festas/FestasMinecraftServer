# The mission file to use
mission-file: FishingMissions

# Whether the mission should be given when completing all requirements.
auto-reward: true

# Rewards given when completing the mission.
rewards:
  commands:
    - 'cmi money give %player% 25000'
    - 'is admin msg %player% &e&lFischer | &7Mission Fischer III abgeschlossen!'
    - 'is admin msg %player% &e&lFischer | &7Jetzt weißt du, wie Angeln funktioniert!'
    - 'is admin msg %player% &e&lFischer | &7&oDu bist jetzt ein Profi-Fischer, Glückwunsch!'

# List of required missions that must be completed before completing this one.
required-missions:
  - 'fisherman_1'
  - 'fisherman_2'

# List of all required caughts must be gathered in order to complete the mission.
required-caughts:
  '1':
    types:
      - 'BOW'
      - 'ENCHANTED_BOOK'
      - 'FISHING_ROD'
      - 'NAME_TAG'
      - 'SADDLE'
      - 'NAUTILUS_SHELL'
    amount: 3

# Icons used in the menus.
