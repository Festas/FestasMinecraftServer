# The mission file to use
mission-file: FishingMissions

# Whether the mission should be given when completing all requirements.
auto-reward: true

# Rewards given when completing the mission.
rewards:
  commands:
    - 'cmi money give %player% 8000'
    - 'is admin msg %player% &e&lFischer | &7Mission Fischer II abgeschlossen!'
    - 'is admin msg %player% &e&lFischer | &7Wie wäre es, unser Glück zu testen?'
    - 'is admin msg %player% &e&lFischer | &7&oInfos zur nächsten Mission gibt es unter /is missions'

# List of required missions that must be completed before completing this one.
required-missions:
  - 'fisherman_1'

# List of all required caughts must be gathered in order to complete the mission.
required-caughts:
  '1':
    types:
      - 'BOW'
      - 'ENCHANTED_BOOK'
      - 'FISHING_ROD'
      - 'NAME_TAG'
      - 'SADDLE'
      - 'NAUTILUS_SHELL'
      - 'LILY_PAD'
      - 'BOWL'
      - 'LEATHER'
      - 'LEATHER_BOOTS'
      - 'ROTTEN_FLESH'
      - 'STICK'
      - 'STRING'
      - 'GLASS_BOTTLE'
      - 'BONE'
      - 'INK_SAC'
      - 'TRIPWIRE_HOOK'
    amount: 5

# Icons used in the menus.
