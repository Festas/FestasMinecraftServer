# XP-Quellen für Juwelierskunst (MMOItems-basiert)
exp-sources:
  # Edelstein-Verarbeitung
  - 'craft{type=DIAMOND;amount=10-15}'
  - 'craft{type=EMERALD;amount=12-18}'
  - 'craft{type=LAPIS_LAZULI;amount=3-5}'
  - 'craft{type=AMETHYST_SHARD;amount=5-8}'
  - 'craft{type=QUARTZ;amount=4-6}'
  - 'craft{type=PRISMARINE_CRYSTALS;amount=6-10}'

  # Schmuck-Herstellung (Vanilla-Rezepte als Basis)
  - 'craft{type=GOLDEN_APPLE;amount=15-22}'
  - 'craft{type=CLOCK;amount=8-12}'
  - 'craft{type=COMPASS;amount=6-10}'
  - 'craft{type=RECOVERY_COMPASS;amount=20-30}'
  - 'craft{type=SPYGLASS;amount=10-15}'

  # Verzauberungs-Materialien
  - 'craft{type=ENCHANTED_BOOK;amount=15-25}'
  - 'craft{type=ENDER_EYE;amount=12-18}'
  - 'craft{type=END_CRYSTAL;amount=25-40}'

  # Netherite-Verarbeitung
  - 'smelt{type=NETHERITE_INGOT;amount=40-60}'
  - 'smelt{type=NETHERITE_SCRAP;amount=20-30}'

  # Kupfer-Verarbeitung
  - 'craft{type=COPPER_INGOT;amount=2-4}'
  - 'craft{type=LIGHTNING_ROD;amount=8-12}'
