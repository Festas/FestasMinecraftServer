# XP-Quellen für Waffenschmieden
exp-sources:
  # Schwerter
  - 'craft{type=WOODEN_SWORD;amount=3-5}'
  - 'craft{type=STONE_SWORD;amount=5-8}'
  - 'craft{type=IRON_SWORD;amount=10-15}'
  - 'craft{type=GOLDEN_SWORD;amount=8-12}'
  - 'craft{type=DIAMOND_SWORD;amount=20-30}'

  # Äxte (Kampf)
  - 'craft{type=WOODEN_AXE;amount=3-5}'
  - 'craft{type=STONE_AXE;amount=5-8}'
  - 'craft{type=IRON_AXE;amount=10-15}'
  - 'craft{type=GOLDEN_AXE;amount=8-12}'
  - 'craft{type=DIAMOND_AXE;amount=20-30}'

  # Fernkampfwaffen
  - 'craft{type=BOW;amount=8-12}'
  - 'craft{type=CROSSBOW;amount=15-20}'
  - 'craft{type=ARROW;amount=1-2}'
  - 'craft{type=SPECTRAL_ARROW;amount=3-5}'
  - 'craft{type=TIPPED_ARROW;amount=4-6}'

  # Andere Waffen
  - 'craft{type=SHIELD;amount=10-15}'
  - 'craft{type=TRIDENT;amount=25-40}'

  # Netherite-Upgrades (Smithing Table)
  - 'smelt{type=NETHERITE_SWORD;amount=50-75}'
  - 'smelt{type=NETHERITE_AXE;amount=50-75}'
