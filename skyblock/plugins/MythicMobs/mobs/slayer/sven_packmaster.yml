# ===================================================
# Sven Packmaster - Wolf Slayer (Tiers I-V)
# Wolf-Slayer mit Rudelbeschwörung und Kampfmechaniken
# ===================================================

# ---------------------------------------------------
# Tier I - Junger Rudelführer (Lv.10, 400 HP)
# ---------------------------------------------------
SvenPackmasterT1:
  Type: WOLF
  Display: '&b&lSven Packmaster &3[Tier I]'
  Health: 400
  Damage: 8
  Armor: 2
  Options:
    MovementSpeed: 0.35
    PreventOtherDrops: true
    AlwaysShowName: true
    FollowRange: 30
  Skills:
  - skill{s=WolfBite} @target ~onTimer:300
  - skill{s=PackHowl} @self ~onSpawn
  Drops:
  - mmoitems{type=MATERIAL;id=WOLF_TOOTH} 1-3 1.0
  - mmoitems{type=MATERIAL;id=GOLD_COIN} 10-25 1.0
  - exp 180
  BossBar:
    Enabled: true
    Title: '&b&lSven Packmaster &3[Tier I]'
    Color: BLUE
    Style: SOLID
    Range: 30

