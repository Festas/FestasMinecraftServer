# ---------------------------------------------------
# Tier IV - Rudel-Imperator (Lv.60, 22000 HP)
# ---------------------------------------------------
SvenPackmasterT4:
  Type: WOLF
  Display: '&b&lSven Packmaster &3&l[Tier IV]'
  Health: 22000
  Damage: 40
  Armor: 12
  Options:
    MovementSpeed: 0.40
    PreventOtherDrops: true
    AlwaysShowName: true
    FollowRange: 45
  Skills:
  # Phase 1 (100%-60% HP)
  - skill{s=WolfBite} @target ~onTimer:180
  - skill{s=PackHowl} @self ~onSpawn
  - skill{s=FeralCharge} @target ~onTimer:300
  - skill{s=SummonWolfPack} @self ~onTimer:350
  # Phase 2 (60%-30% HP)
  - skill{s=PackmasterPhase2} @self ~onHealthMod:<0.6 1
  - skill{s=AlphaRoar} @self ~onTimer:400 ~onHealthMod:0.3to0.6
  - skill{s=PackTactics} @self ~onTimer:350 ~onHealthMod:0.3to0.6
  - skill{s=SummonAlphaWolves} @self ~onTimer:400 ~onHealthMod:0.3to0.6
  - skill{s=FeralFrenzy} @target ~onTimer:300 ~onHealthMod:0.3to0.6
  # Phase 3 (30%-0% HP)
  - skill{s=PackmasterPhase3} @self ~onHealthMod:<0.3 1
  - skill{s=BloodMoon} @self ~onTimer:300 ~onHealthMod:<0.3
  - skill{s=SummonAlphaWolves} @self ~onTimer:250 ~onHealthMod:<0.3
  - skill{s=FeralFrenzy} @target ~onTimer:200 ~onHealthMod:<0.3
  # Death
  - skill{s=PackmasterDeathHowl} @self ~onDeath
  Drops:
  - mmoitems{type=MATERIAL;id=WOLF_TOOTH} 30-50 1.0
  - mmoitems{type=MATERIAL;id=HAMSTER_WHEEL} 3-5 1.0
  - mmoitems{type=MATERIAL;id=CRITICAL_ESSENCE} 1-2 0.6
  - mmoitems{type=MATERIAL;id=OVERFLUX_CAPACITOR_SHARD} 1 0.1
  - mmoitems{type=MATERIAL;id=GOLD_COIN} 500-1000 1.0
  - exp 7500
  BossBar:
    Enabled: true
    Title: '&b&lSven Packmaster &3&l[Tier IV]'
    Color: BLUE
    Style: SEGMENTED_12
    Range: 45

# ---------------------------------------------------
# Tier V - Rudel-Erzwolf (Lv.80, 65000 HP)
# ---------------------------------------------------
SvenPackmasterT5:
  Type: WOLF
  Display: '&3&l☠ Sven Packmaster &b&l[Tier V]'
  Health: 65000
  Damage: 60
  Armor: 18
  Options:
    MovementSpeed: 0.42
    PreventOtherDrops: true
    AlwaysShowName: true
    FollowRange: 50
    Silent: false
  Skills:
  # Spawn
  - skill{s=PackmasterT5Spawn} @self ~onSpawn
  # Phase 1 (100%-70% HP)
  - skill{s=WolfBite} @target ~onTimer:150
  - skill{s=FeralCharge} @target ~onTimer:250
  - skill{s=SummonWolfPack} @self ~onTimer:300
  - skill{s=AlphaRoar} @self ~onTimer:400
  # Phase 2 (70%-40% HP)
  - skill{s=PackmasterPhase2} @self ~onHealthMod:<0.7 1
  - skill{s=PackTactics} @self ~onTimer:300 ~onHealthMod:0.4to0.7
  - skill{s=SummonAlphaWolves} @self ~onTimer:300 ~onHealthMod:0.4to0.7
  - skill{s=FeralFrenzy} @target ~onTimer:250 ~onHealthMod:0.4to0.7
  - skill{s=ThunderPounce} @target ~onTimer:500 ~onHealthMod:0.4to0.7
  # Phase 3 (40%-15% HP)
  - skill{s=PackmasterPhase3} @self ~onHealthMod:<0.4 1
  - skill{s=BloodMoon} @self ~onTimer:300 ~onHealthMod:0.15to0.4
  - skill{s=SummonDireWolves} @self ~onTimer:350 ~onHealthMod:0.15to0.4
  - skill{s=FeralFrenzy} @target ~onTimer:200 ~onHealthMod:0.15to0.4
  - skill{s=ThunderPounce} @target ~onTimer:400 ~onHealthMod:0.15to0.4
  # Phase 4 (15%-0% HP) - Enrage
  - skill{s=PackmasterPhase4} @self ~onHealthMod:<0.15 1
  - skill{s=PackmasterEnrage} @self ~onHealthMod:<0.15 1
  - skill{s=WolfApocalypse} @self ~onTimer:200 ~onHealthMod:<0.15
  - skill{s=BloodMoon} @self ~onTimer:250 ~onHealthMod:<0.15
  - skill{s=SummonDireWolves} @self ~onTimer:200 ~onHealthMod:<0.15
  # Death
  - skill{s=PackmasterT5Death} @self ~onDeath
  Drops:
  - mmoitems{type=MATERIAL;id=WOLF_TOOTH} 64 1.0
  - mmoitems{type=MATERIAL;id=HAMSTER_WHEEL} 5-10 1.0
  - mmoitems{type=MATERIAL;id=CRITICAL_ESSENCE} 2-4 1.0
  - mmoitems{type=MATERIAL;id=OVERFLUX_CAPACITOR_SHARD} 1 0.3
  - mmoitems{type=MATERIAL;id=RED_CLAW_EGG} 1 0.05
  - mmoitems{type=MATERIAL;id=GOLD_COIN;amount=5000} 1.0
  - exp 22000
  BossBar:
    Enabled: true
    Title: '&3&l☠ Sven Packmaster &b[Tier V]'
    Color: BLUE
    Style: SEGMENTED_20
    Range: 50
