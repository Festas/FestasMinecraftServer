# ===================================================
# Voidgloom Seraph - Enderman Slayer (Tiers I-V)
# Enderman-Slayer mit Teleport- und Leere-Mechaniken
# ===================================================

# ---------------------------------------------------
# Tier I - Leere-Wanderer (Lv.10, 800 HP)
# ---------------------------------------------------
VoidgloomSeraphT1:
  Type: ENDERMAN
  Display: '&5&lVoidgloom Seraph &d[Tier I]'
  Health: 800
  Damage: 10
  Armor: 3
  Options:
    MovementSpeed: 0.30
    PreventOtherDrops: true
    AlwaysShowName: true
    FollowRange: 30
    PreventTeleport: false
  Skills:
  - skill{s=VoidStrike} @target ~onTimer:300
  - skill{s=SeraphAppear} @self ~onSpawn
  - skill{s=VoidBlink} @self ~onTimer:500
  Drops:
  - mmoitems{type=MATERIAL;id=NULL_SPHERE} 1-3 1.0
  - mmoitems{type=MATERIAL;id=GOLD_COIN} 15-30 1.0
  - exp 300
  BossBar:
    Enabled: true
    Title: '&5&lVoidgloom Seraph &d[Tier I]'
    Color: PURPLE
    Style: SOLID
    Range: 30

