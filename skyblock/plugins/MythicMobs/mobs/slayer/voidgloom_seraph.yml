# ---------------------------------------------------
# Tier IV - Leere-Erzengel (Lv.60, 40000 HP)
# ---------------------------------------------------
VoidgloomSeraphT4:
  Type: ENDERMAN
  Display: '&5&lVoidgloom Seraph &d&l[Tier IV]'
  Health: 40000
  Damage: 45
  Armor: 15
  Options:
    MovementSpeed: 0.35
    PreventOtherDrops: true
    AlwaysShowName: true
    FollowRange: 45
    PreventTeleport: false
  Skills:
  # Phase 1 (100%-60% HP)
  - skill{s=VoidStrike} @target ~onTimer:180
  - skill{s=SeraphAppear} @self ~onSpawn
  - skill{s=VoidBlink} @self ~onTimer:300
  - skill{s=VoidBeam} @target ~onTimer:350
  - skill{s=SummonEndermites} @self ~onTimer:400
  # Phase 2 (60%-30% HP)
  - skill{s=SeraphPhase2} @self ~onHealthMod:<0.6 1
  - skill{s=DimensionShift} @self ~onTimer:400 ~onHealthMod:0.3to0.6
  - skill{s=NullShield} @self ~onTimer:500 ~onHealthMod:0.3to0.6
  - skill{s=VoidTentacles} @target ~onTimer:350 ~onHealthMod:0.3to0.6
  - skill{s=SummonVoidWalkers} @self ~onTimer:450 ~onHealthMod:0.3to0.6
  # Phase 3 (30%-0% HP)
  - skill{s=SeraphPhase3} @self ~onHealthMod:<0.3 1
  - skill{s=VoidCollapse} @self ~onTimer:300 ~onHealthMod:<0.3
  - skill{s=DimensionShift} @self ~onTimer:300 ~onHealthMod:<0.3
  - skill{s=SummonVoidWalkers} @self ~onTimer:300 ~onHealthMod:<0.3
  - skill{s=NullPulse} @self ~onTimer:250 ~onHealthMod:<0.3
  # Death
  - skill{s=SeraphDeathImplosion} @self ~onDeath
  Drops:
  - mmoitems{type=MATERIAL;id=NULL_SPHERE} 30-50 1.0
  - mmoitems{type=MATERIAL;id=VOID_CONQUEROR_ENDERMAN_SKIN} 3-5 1.0
  - mmoitems{type=MATERIAL;id=SUMMONING_EYE_SHARD} 1-2 0.6
  - mmoitems{type=MATERIAL;id=JUDGEMENT_CORE} 1 0.1
  - mmoitems{type=MATERIAL;id=GOLD_COIN} 600-1200 1.0
  - exp 10000
  BossBar:
    Enabled: true
    Title: '&5&lVoidgloom Seraph &d&l[Tier IV]'
    Color: PURPLE
    Style: SEGMENTED_12
    Range: 45

# ---------------------------------------------------
# Tier V - Leere-Apokalypse (Lv.80, 120000 HP)
# ---------------------------------------------------
VoidgloomSeraphT5:
  Type: ENDERMAN
  Display: '&d&l☠ Voidgloom Seraph &5&l[Tier V]'
  Health: 120000
  Damage: 65
  Armor: 22
  Options:
    MovementSpeed: 0.36
    PreventOtherDrops: true
    AlwaysShowName: true
    FollowRange: 50
    PreventTeleport: false
    Silent: false
  Skills:
  # Spawn
  - skill{s=SeraphT5Spawn} @self ~onSpawn
  # Phase 1 (100%-70% HP)
  - skill{s=VoidStrike} @target ~onTimer:150
  - skill{s=VoidBlink} @self ~onTimer:250
  - skill{s=VoidBeam} @target ~onTimer:300
  - skill{s=SummonEndermites} @self ~onTimer:350
  # Phase 2 (70%-40% HP)
  - skill{s=SeraphPhase2} @self ~onHealthMod:<0.7 1
  - skill{s=DimensionShift} @self ~onTimer:350 ~onHealthMod:0.4to0.7
  - skill{s=VoidTentacles} @target ~onTimer:300 ~onHealthMod:0.4to0.7
  - skill{s=SummonVoidWalkers} @self ~onTimer:350 ~onHealthMod:0.4to0.7
  - skill{s=NullShield} @self ~onTimer:400 ~onHealthMod:0.4to0.7
  - skill{s=VoidRift} @target ~onTimer:500 ~onHealthMod:0.4to0.7
  # Phase 3 (40%-15% HP)
  - skill{s=SeraphPhase3} @self ~onHealthMod:<0.4 1
  - skill{s=VoidCollapse} @self ~onTimer:300 ~onHealthMod:0.15to0.4
  - skill{s=DimensionShift} @self ~onTimer:250 ~onHealthMod:0.15to0.4
  - skill{s=SummonVoidSeraphs} @self ~onTimer:400 ~onHealthMod:0.15to0.4
  - skill{s=NullPulse} @self ~onTimer:200 ~onHealthMod:0.15to0.4
  - skill{s=VoidRift} @target ~onTimer:400 ~onHealthMod:0.15to0.4
  # Phase 4 (15%-0% HP) - Enrage
  - skill{s=SeraphPhase4} @self ~onHealthMod:<0.15 1
  - skill{s=SeraphEnrage} @self ~onHealthMod:<0.15 1
  - skill{s=VoidApocalypse} @self ~onTimer:200 ~onHealthMod:<0.15
  - skill{s=VoidCollapse} @self ~onTimer:250 ~onHealthMod:<0.15
  - skill{s=SummonVoidSeraphs} @self ~onTimer:300 ~onHealthMod:<0.15
  - skill{s=NullPulse} @self ~onTimer:150 ~onHealthMod:<0.15
  # Death
  - skill{s=SeraphT5Death} @self ~onDeath
  Drops:
  - mmoitems{type=MATERIAL;id=NULL_SPHERE} 64 1.0
  - mmoitems{type=MATERIAL;id=VOID_CONQUEROR_ENDERMAN_SKIN} 5-10 1.0
  - mmoitems{type=MATERIAL;id=SUMMONING_EYE_SHARD} 2-4 1.0
  - mmoitems{type=MATERIAL;id=JUDGEMENT_CORE} 1 0.3
  - mmoitems{type=MATERIAL;id=SINFUL_HOWL} 1 0.05
  - mmoitems{type=MATERIAL;id=GOLD_COIN;amount=7500} 1.0
  - exp 35000
  BossBar:
    Enabled: true
    Title: '&d&l☠ Voidgloom Seraph &5[Tier V]'
    Color: PURPLE
    Style: SEGMENTED_20
    Range: 50
