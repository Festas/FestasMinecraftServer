# ==============================================================================
#  ExcellentEnchants — Konfiguration
#  MinecraftMMO Netzwerk — Skyblock Server
#  30+ benutzerdefinierte Verzauberungen mit deutschen Beschreibungen
# ==============================================================================

general:
  # Sprache und Lokalisierung
  lang: de
  # Ob Verzauberungstyp-Präfixe in Lore angezeigt werden
  show-type-prefix: true
  # Ob Level als römische Zahlen dargestellt werden
  roman-numerals: true
  # Ob Verzauberungen im Amboss kombiniert werden können
  anvil-combine: true
  # Ob Verzauberungen von Villager-Händlern angeboten werden
  villager-trades: true
  # Ob Verzauberungen über den Enchantment Table erhältlich sind
  enchant-table: true
  # Ob Verzauberungen in Loot-Truhen erscheinen
  loot-generation: true

# Seltenheitsstufen mit Gewichtung für Enchantment Table
rarity:
  GEWÖHNLICH:
    weight: 30
    color: "&7"
  UNGEWÖHNLICH:
    weight: 20
    color: "&a"
  SELTEN:
    weight: 10
    color: "&9"
  EPISCH:
    weight: 5
    color: "&5"
  LEGENDÄR:
    weight: 2
    color: "&6"
  MYTHISCH:
    weight: 1
    color: "&c&l"

# ==============================================================================
#  Waffen-Verzauberungen
# ==============================================================================

enchantments:
  # ---------- Waffen ----------

  donnerschlag:
    enabled: true
    name: "Donnerschlag"
    description: "&7Schlägt Blitze auf getroffene Gegner ein."
    category: WEAPON
    rarity: EPISCH
    max-level: 3
    applicable-items:
      - SWORD
      - AXE
    conflicts:
      - feuersturm
    settings:
      lightning-damage: true
      fire-on-strike: false
      chance-per-level: 15.0
      # Chance in % pro Level (Lv1=15%, Lv2=30%, Lv3=45%)

  lebensraub:
    enabled: true
    name: "Lebensraub"
    description: "&7Heilt dich für einen Teil des verursachten Schadens."
