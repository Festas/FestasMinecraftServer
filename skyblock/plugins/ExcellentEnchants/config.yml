    format: "%rarity_color%%name% %level%"
    description-enabled: true
    description-format: "  &8▸ &7%description%"
  categories:
    WEAPON: "&c⚔"
    ARMOR: "&9🛡"
    TOOL: "&e⛏"
    BOW: "&a🏹"
    UNIVERSAL: "&d✦"

# ==============================================================================
#  Erhalts-Chancen
# ==============================================================================

obtain:
  enchanting-table:
    enabled: true
    chance-multiplier: 1.0
  anvil:
    enabled: true
    combine-same-level: true
    max-cost: 39
  villager:
    enabled: true
