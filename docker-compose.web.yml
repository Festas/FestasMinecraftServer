# Docker Compose configuration for festas_builds Minecraft Server Website
# This file defines the web service that serves the static website
# The service binds to localhost:8101 so the host nginx reverse proxy can reach it

services:
  minecraft-web:
    # Use pre-built image from GitHub Container Registry
    # The image is built and pushed by the GitHub Actions workflow
    image: ghcr.io/festas/minecraft-server-web:latest

    # Container name for easy identification
    container_name: minecraft-web

    # Restart policy
    restart: unless-stopped

    # Bind to localhost only so nginx on the host can proxy to 127.0.0.1:8101
    ports:
      - "127.0.0.1:8101:80"

    # Mount the shared data directory (written by the Velocity FestasPlayerList plugin)
    # read-only so the website can serve /api/players.json. Relative ./data resolves next to
    # this compose file (in production: /home/deploy/minecraft-website/data).
    volumes:
      - ./data:/usr/share/nginx/html/api:ro

    # Health check to ensure the website is responding
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Resource limits (optional but recommended)
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M

# Notes:
# 1. The container binds to 127.0.0.1:8101 on the host.
#    The nginx reverse proxy (managed in the Link-in-Bio repo) proxies
#    mc.festas-builds.com → http://127.0.0.1:8101
#    Config: Festas/Link-in-Bio/nginx/sites-available/mc.festas-builds.com.conf
#
# 2. To deploy:
#    docker-compose -f docker-compose.web.yml up -d
#
# 3. To view logs:
#    docker-compose -f docker-compose.web.yml logs -f
#
# 4. To pull latest image and restart:
#    docker-compose -f docker-compose.web.yml pull && docker-compose -f docker-compose.web.yml up -d
#
# 5. To stop:
#    docker-compose -f docker-compose.web.yml down
