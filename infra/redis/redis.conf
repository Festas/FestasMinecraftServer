# Redis configuration for the Festas Minecraft network.
#
# Purpose: LuckPerms messaging (live push of rank/permission changes across all
# servers) and the HuskSync session cache. See docs/infrastructure/DATENBANKEN.md.
#
# This file is deployed by .github/workflows/deploy-redis.yml. The placeholder
# __REDIS_PASSWORD__ is replaced with the REDIS_PASSWORD GitHub secret at deploy
# time. NEVER commit the real password here.

# Listen on all interfaces *inside the container*. Public exposure is prevented
# on the host side: the compose file publishes the port only on the internal
# bridge IP (default 172.18.0.1), and access additionally requires the password
# below. Do not set "bind 127.0.0.1" here or Docker port publishing breaks.
bind 0.0.0.0
protected-mode yes
port 6379

# Authentication. Injected from the REDIS_PASSWORD secret at deploy time.
requirepass __REDIS_PASSWORD__

# Persistence: RDB snapshots to /data/dump.rdb. This matches the backup and
# disaster-recovery procedures (docs/infrastructure/BACKUPS.md uses BGSAVE and
# copies dump.rdb).
dir /data
dbfilename dump.rdb
save 900 1
save 300 10
save 60 10000
rdbcompression yes

# LuckPerms/HuskSync data must not be silently dropped, so do not evict keys.
maxmemory-policy noeviction

loglevel notice
