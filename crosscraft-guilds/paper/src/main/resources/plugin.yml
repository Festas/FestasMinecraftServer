name: CrossCraftGuilds
version: '1.0.0'
main: com.festas.guilds.paper.GuildsPaperPlugin
api-version: '1.21'
description: Cross-Server Gilden-System für MinecraftMMO
author: Festas
website: https://github.com/Festas/MinecraftMMO
depend: []
softdepend:
  - MMOCore
  - MythicMobs
  - MythicDungeons
  - CoinsEngine
  - PlaceholderAPI
  - DecentHolograms
commands:
  guild:
    description: Gilden-Befehle
    aliases: [gilde, g]
    usage: /guild <create|invite|info|chat|bank|leave|disband|list|kick|promote|demote|menu>
  gc:
    description: Gilden-Chat Kurzbefehl
    usage: /gc <nachricht>
