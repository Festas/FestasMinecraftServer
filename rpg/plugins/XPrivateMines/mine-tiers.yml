# ===========================================================================
# XPRIVATEMINES  -  TIER-LADDER  (Mining-Server "rpg")
# ===========================================================================
# Die private Mine ist ein Money-Sink / Komfort-Loop PARALLEL zu den oeffentlichen
# X-Prison-Zonen (mine_a..mine_j). Sie darf die oeffentlichen Zonen NICHT entwerten:
# der Ertrag pro Block (EV) jedes Tiers liegt <= der thematisch vergleichbaren
# oeffentlichen Zone, und die oeffentlichen Endgame-Zonen (mine_i/mine_j) bleiben
# strikt die beste Einnahmequelle im Spiel.
#
# 'upgrade-cost' = money (CMI/Vault; currency: money laut config.yml), das der Spieler
# zahlt, um IN dieses Tier aufzusteigen. Tier 1 ist die kostenlose Einstiegsstufe.
# Die Kostenkurve folgt der Rang-/Prestige-Kurve (Raenge 5k..10M money, Prestige ab 25M):
# der volle Ausbau (Summe aller Upgrades = 21.45M money) liegt zwischen Rang J (10M)
# und dem ersten Prestige (25M) - plus optionale Expansion (schematic-settings.yml).
#
# 'blocks' = prozentuale Zusammensetzung (Summe je Tier = 100). Es werden nur die in
# config.yml (gui.blocks) erlaubten UND in autosell.yml bepreisten Block-Typen genutzt
# (STONE als Fueller, plus eskalierende Erze).
#
# EV/Block (Preise aus autosell.yml) je Tier vs. vergleichbare oeffentliche Zone:
#   T1  1.35  (<= mine_a  1.35)     T5  36.25 (<= mine_e  39.30)
#   T2  4.06  (<= mine_b  4.75)     T6  50.70 (<= mine_f  56.75)
#   T3  6.96  (<= mine_c  8.05)     T7 100.25 (<= mine_g 105.45)
#   T4 20.82  (<= mine_d 24.65)     T8 304.63 (<= mine_i 467.30, << mine_j 1511.00)
# ===========================================================================
