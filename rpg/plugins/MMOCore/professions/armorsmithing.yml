# XP-Quellen für Rüstungsschmieden
exp-sources:
  # Lederrüstung
  - 'craft{type=LEATHER_HELMET;amount=5-8}'
  - 'craft{type=LEATHER_CHESTPLATE;amount=8-12}'
  - 'craft{type=LEATHER_LEGGINGS;amount=7-10}'
  - 'craft{type=LEATHER_BOOTS;amount=4-6}'

  # Eisenrüstung
  - 'craft{type=IRON_HELMET;amount=10-15}'
  - 'craft{type=IRON_CHESTPLATE;amount=15-22}'
  - 'craft{type=IRON_LEGGINGS;amount=12-18}'
  - 'craft{type=IRON_BOOTS;amount=8-12}'

  # Goldrüstung
  - 'craft{type=GOLDEN_HELMET;amount=8-12}'
  - 'craft{type=GOLDEN_CHESTPLATE;amount=12-18}'
  - 'craft{type=GOLDEN_LEGGINGS;amount=10-15}'
  - 'craft{type=GOLDEN_BOOTS;amount=6-10}'

  # Diamantrüstung
  - 'craft{type=DIAMOND_HELMET;amount=20-30}'
  - 'craft{type=DIAMOND_CHESTPLATE;amount=30-45}'
  - 'craft{type=DIAMOND_LEGGINGS;amount=25-38}'
  - 'craft{type=DIAMOND_BOOTS;amount=18-25}'

  # Netherite-Upgrades
  - 'smelt{type=NETHERITE_HELMET;amount=50-75}'
  - 'smelt{type=NETHERITE_CHESTPLATE;amount=60-90}'
  - 'smelt{type=NETHERITE_LEGGINGS;amount=55-80}'
  - 'smelt{type=NETHERITE_BOOTS;amount=45-65}'

  # Sonstiges
  - 'craft{type=TURTLE_HELMET;amount=15-22}'
  - 'craft{type=SHIELD;amount=10-15}'
