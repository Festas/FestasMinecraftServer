# Pfad: plugins/DeluxeMenus/gui_menus/help_menu.yml
# RPG/Mining Help-Menü – geöffnet über /help
menu_title: '&8» &b❓ Mining Hilfe'
open_command: help_menu
size: 45

items:

  # ==============================================================
  # FILLER
  # ==============================================================
  'filler':
    material: BLUE_STAINED_GLASS_PANE
    slots:
      - '0-8'
      - '36-44'
    display_name: '&f'
    priority: 2

  'filler2':
    material: BLACK_STAINED_GLASS_PANE
    slots:
      - '9'
      - '17'
      - '18'
      - '26'
      - '27'
      - '35'
    display_name: '&f'
    priority: 2

  # ==============================================================
  # HEADER
  # ==============================================================
  'header':
    material: NETHERITE_PICKAXE
    slot: 4
    priority: 1
    display_name: '&b&l❓ Mining Server Hilfe'
    lore:
      - '&7Willkommen auf dem Mining Server!'
      - '&7Hier erfährst du alles über das Abbauen.'

  # ==============================================================
  # ABBAU-ZONEN
  # ==============================================================
  'zones':
    material: STONE
    slot: 10
    priority: 1
    display_name: '&7&l⛏ Abbau-Zonen'
    lore:
      - '&7Baue in Zonen ab und schalte'
      - '&7nach und nach neue frei!'
      - ''
      - '&8» &fJede Zone enthält andere Blöcke'
      - '&8» &fZonen &7reset sich automatisch'
      - '&8» &fAutosell &7verkauft Blöcke direkt'
      - '&8» &fHöhere Zonen = &fwertvollere Blöcke'
      - ''
      - '&eBefehle:'
      - '&e/mine &8– &7Zur Mine teleportieren'
      - '&e/mines &8– &7Alle Minen anzeigen'

  # ==============================================================
  # RANKUP
  # ==============================================================
  'rankup':
    material: EXPERIENCE_BOTTLE
    slot: 12
    priority: 1
    display_name: '&a&l⬆ Rankup'
    lore:
      - '&7Verdiene Geld beim Abbauen'
      - '&7und steige im Rang auf!'
      - ''
      - '&8» &fBlöcke abbauen = Geld'
      - '&8» &fGeld ausgeben = Rang aufsteigen'
      - '&8» &fHöhere Ränge &7schalten neue Zonen frei'
      - ''
      - '&eBefehle:'
      - '&e/rankup &8– &7Nächsten Rang kaufen'
      - '&e/ranks &8– &7Alle Ränge anzeigen'
      - '&e/bal &8– &7Kontostand anzeigen'

  # ==============================================================
  # PRESTIGE
  # ==============================================================
  'prestige':
    material: NETHER_STAR
    slot: 14
    priority: 1
    display_name: '&6&l✦ Prestige'
    lore:
      - '&7Nach dem höchsten Rang kannst du'
      - '&7Prestige aufsteigen!'
      - ''
      - '&8» &fPrestige &7setzt deinen Rang zurück'
      - '&8» &fDafür erhältst du &fMultiplikatoren'
      - '&8» &fMehr Prestige = &fmehr Geld pro Block'
      - ''
      - '&eBefehle:'
      - '&e/prestige &8– &7Prestige aufsteigen'

  # ==============================================================
  # SPITZHACKEN
  # ==============================================================
  'pickaxes':
    material: DIAMOND_PICKAXE
    slot: 16
    priority: 1
    display_name: '&b&l⛏ Spitzhacken'
    lore:
      - '&7Deine Spitzhacke ist dein wichtigstes Tool!'
      - ''
      - '&8» &fAufwerten &7für mehr Blöcke pro Schlag'
      - '&8» &fEnchants &7für Speed, Bonus und Extras'
      - '&8» &fSeltene Enchants &7aus Kisten und Events'
      - ''
      - '&7Je besser die Spitzhacke,'
      - '&7desto schneller wirst du reich!'

  # ==============================================================
  # PRIVATE MINES
  # ==============================================================
  'private_mine':
    material: DIAMOND_ORE
    slot: 28
    priority: 1
    display_name: '&d&l💎 Private Mine'
    lore:
      - '&7Schalte deine eigene private Mine frei!'
      - ''
      - '&8» &fNur du &7kannst darin abbauen'
      - '&8» &fUpgraden &7für bessere Blöcke'
      - '&8» &fReset &7füllt sie wieder auf'
      - ''
      - '&eBefehle:'
      - '&e/pmine &8– &7Private Mine öffnen'
      - '&e/pmine tp &8– &7Zur Mine teleportieren'

  # ==============================================================
  # ALLE BEFEHLE
  # ==============================================================
  'commands':
    material: COMMAND_BLOCK
    slot: 30
    priority: 1
    display_name: '&e&l⌨ Alle Befehle'
    lore:
      - '&7Die wichtigsten Befehle:'
      - ''
      - '&e/mine &8– &7Zur Mine teleportieren'
      - '&e/mines &8– &7Alle Minen anzeigen'
      - '&e/rankup &8– &7Rang aufsteigen'
      - '&e/ranks &8– &7Ränge anzeigen'
      - '&e/prestige &8– &7Prestige aufsteigen'
      - '&e/pmine &8– &7Private Mine'
      - '&e/bal &8– &7Kontostand'
      - '&e/friend &8– &7Freundesliste'
      - '&e/lobby &8– &7Zurück zur Lobby'

  # ==============================================================
  # SUPPORT
  # ==============================================================
  'support':
    material: ENDER_EYE
    slot: 32
    priority: 1
    display_name: '&c&l❓ Hilfe & Support'
    lore:
      - '&7Brauchst du Hilfe? So erreichst du uns:'
      - ''
      - '&8» &fDiscord: &7discord.gg/festasbuilds'
      - '&8» &fIn-Game: &7/report <Spieler> <Grund>'
      - ''
      - '&7Erstelle ein Ticket auf Discord'
      - '&7für schnelle Hilfe!'

  # ==============================================================
  # ZURÜCK ZUR LOBBY
  # ==============================================================
  'lobby':
    material: ARROW
    slot: 40
    priority: 1
    display_name: '&7&l← Zurück zur Lobby'
    lore:
      - '&7Verbinde dich zur Lobby'
    left_click_commands:
      - '[close]'
      - '[player] /lobby'
    right_click_commands:
      - '[close]'
      - '[player] /lobby'
