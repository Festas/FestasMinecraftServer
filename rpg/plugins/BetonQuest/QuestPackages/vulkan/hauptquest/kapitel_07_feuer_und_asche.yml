# Hauptquest Kapitel 7: Feuer und Asche
# Main Quest Chapter 7: Fire and Ash
# 5 Quests führen durch den Vulkan (Level 60-70)

# ============================================================================
# QUEST 1: Vulkan-Aufstieg
# Der Spieler erreicht den Fuß des Vulkans
# ============================================================================

events:
  quest1_start: "run ^tag add quest1_aktiv ^journal add quest1_start ^_core.sound_quest_start"
  quest1_vulkan_erreicht: "run ^tag add quest1_complete ^tag del quest1_aktiv ^tag add quest2_aktiv ^experience 800 ^point playerpoints 1000 ^_core.sound_quest_complete ^journal add quest1_done"

objectives:
  quest1_vulkan: "location 4000;80;4000;world range:25 events:quest1_vulkan_erreicht notify"

journal:
  quest1_start: "&6Vulkan-Aufstieg|&7Das Eiskristall-Artefakt|&7weist nach Süden. Erreiche|&7den Fuß des Vulkans|&7und finde die Feuerschmiede."
  quest1_done: "&6Vulkan erreicht!|&7Feuerschmied Ignis arbeitet|&7am Fuß des Vulkans.|&7Die Hitze ist unerträglich."

# ============================================================================
# QUEST 2: Lava-Höhlen
# Ancient Debris in den Lavahöhlen abbauen
# ============================================================================

events:
  quest2_start: "run ^tag add quest2_aktiv ^journal add quest2_start"
  quest2_erze_done: "tag add quest2_erze_complete"
  quest2_complete: "run ^tag add quest2_complete ^tag del quest2_aktiv ^tag add quest3_aktiv ^experience 1000 ^point playerpoints 1200 ^_core.sound_quest_complete ^journal add quest2_done"

objectives:
  quest2_debris: "block ANCIENT_DEBRIS 15 events:quest2_erze_done notify"

conditions:
  quest2_erze_erledigt: "tag quest2_erze_complete"

journal:
  quest2_start: "&6Lava-Höhlen|&7Ignis benötigt seltenes|&7Ancient Debris aus den|&7Lavahöhlen. Baue 15 Blöcke|&7ab, um die Schmiede zu speisen."
  quest2_done: "&6Ancient Debris gesammelt!|&7Ignis ist beeindruckt.|&7Doch die Lohe-Wächter des|&7Vulkans sind aufgewacht."

# ============================================================================
# QUEST 3: Feuerprobe
# Lohen im Vulkan besiegen
# ============================================================================

events:
  quest3_start: "run ^tag add quest3_aktiv ^journal add quest3_start"
  quest3_lohen_done: "tag add quest3_lohen_complete"
  quest3_complete: "run ^tag add quest3_complete ^tag del quest3_aktiv ^tag add quest4_aktiv ^experience 1200 ^point playerpoints 1500 ^_core.sound_quest_complete ^journal add quest3_done"

objectives:
  quest3_lohen: "mobkill BLAZE 15 events:quest3_lohen_done notify"

conditions:
  quest3_lohen_erledigt: "tag quest3_lohen_complete"

journal:
  quest3_start: "&6Feuerprobe|&7Die Lohen des Vulkans|&7greifen jeden an, der sich|&7nähert! Töte 15 Lohen,|&7um den Aufstieg zu sichern."
  quest3_done: "&6Lohen besiegt!|&7Der Weg in die Tiefe|&7des Vulkans ist frei.|&7Vulkanologin Pyra wartet."

# ============================================================================
# QUEST 4: Schmiede des Feuers
# Netherit-Schrott für die Schmiede sammeln
# ============================================================================

events:
  quest4_start: "run ^tag add quest4_aktiv ^journal add quest4_start"
  quest4_schrott_done: "tag add quest4_schrott_complete"
  quest4_complete: "run ^tag add quest4_complete ^tag del quest4_aktiv ^tag add quest5_aktiv ^experience 1500 ^point playerpoints 2000 ^_core.sound_quest_complete ^journal add quest4_done"

objectives:
  quest4_netherit: "block NETHERITE_SCRAP 10 events:quest4_schrott_done notify"

conditions:
  quest4_schrott_erledigt: "tag quest4_schrott_complete"

journal:
  quest4_start: "&6Schmiede des Feuers|&7Pyra enthüllt das Geheimnis|&7der Vulkanschmiede. Sammle|&710 Netherit-Schrott, um eine|&7göttliche Waffe zu schmieden."
  quest4_done: "&6Netherit-Schrott gesammelt!|&7Die Schmiede glüht vor|&7Hitze. Doch der Vulkantitan|&7erwacht in den Tiefen!"

# ============================================================================
# QUEST 5: Vulkantitan
# Bossfight - Abschluss von Kapitel 7
# ============================================================================

events:
  quest5_start: "run ^tag add quest5_aktiv ^journal add quest5_start"
  quest5_boss_done: "tag add quest5_boss_complete"
  quest5_complete: "run ^tag add quest5_complete ^tag del quest5_aktiv ^tag add kapitel7_complete ^experience 2000 ^point playerpoints 3000 ^_core.sound_quest_complete ^journal add quest5_done ^journal add kapitel7_done"

objectives:
  quest5_titan: "mobkill WITHER 1 events:quest5_boss_done notify"

conditions:
  quest5_boss_erledigt: "tag quest5_boss_complete"

journal:
  quest5_start: "&6Vulkantitan|&cDer Vulkantitan erhebt|&csich aus der Lava!|&7Besiege den Titan und|&7sichere das Feuer-Artefakt."
  quest5_done: "&6Vulkantitan besiegt!|&aDas Feuer-Artefakt|&aist in deinem Besitz!|&7Seine Glut vereint sich|&7mit dem Eiskristall."
  kapitel7_done: "&6&lFeuer und Asche - Komplett|&7Du hast das siebte Kapitel|&7der Hauptquest abgeschlossen.|&7Das Feuer-Artefakt enthüllt|&7den Weg zu den Tempelruinen."

# ============================================================================
# Conversation Extensions für NPCs
# Diese erweitern die existierenden NPC-Conversations
# ============================================================================

conversations:
  feuerschmied_ignis:
    quester: "Feuerschmied Ignis"
    first: "begruessung"
    NPC_options:
      begruessung:
        text: "&6Halt! Nur die Stärksten überleben die Hitze des Vulkans. Du trägst Artefakte der Leere? Dann bist du hier richtig."
        pointer: "hoehlen_frage"
      hoehlen_auftrag:
        text: "&7Die Lavahöhlen bergen Ancient Debris. Bringe mir 15 Blöcke, damit ich die Vulkanschmiede befeuern kann."
        events: "quest2_start"
      lohen_warnung:
        text: "&cDie Lohen des Vulkans sind rasend! Sie greifen alles an. Töte 15 von ihnen, damit wir sicher arbeiten können."
        events: "quest3_start"
      abschluss:
        text: "&aDas Feuer-Artefakt! Seine Macht ist gewaltig. Nimm es, Held. Die Tempelruinen im Osten warten auf dich."
    player_options:
      hoehlen_frage:
        text: "&eWas braucht Ihr für die Schmiede?"
        pointer: "hoehlen_auftrag"
      lohen_frage:
        text: "&eWas ist mit den Lohen?"
        pointer: "lohen_warnung"

  vulkanologin_pyra:
    quester: "Vulkanologin Pyra"
    first: "begruessung"
    NPC_options:
      begruessung:
        text: "&5Faszinierend! Du hast die Lohen besiegt. Ich bin Pyra, ich erforsche die Geheimnisse des Vulkans seit Jahrzehnten."
        pointer: "schmiede_frage"
      schmiede_auftrag:
        text: "&7Die Vulkanschmiede kann göttliche Waffen erschaffen. Sammle 10 Netherit-Schrott, damit wir beginnen können."
        events: "quest4_start"
      titan_warnung:
        text: "&cDas Schmieden hat den Vulkantitan geweckt! Er ist der Hüter des Feuer-Artefakts. Stelle dich ihm in der Lavakammer!"
        events: "quest5_start"
      abschluss:
        text: "&aDer Titan ist gefallen! Das Feuer-Artefakt gehört dir. Möge seine Flamme dich auf deinem Weg beschützen."
        events: "quest5_complete"
    player_options:
      schmiede_frage:
        text: "&eWas kann die Vulkanschmiede?"
        pointer: "schmiede_auftrag"
      titan_bereit:
        text: "&eIch bin bereit für den Titan."
        pointer: "titan_warnung"
      sieg_melden:
        text: "&eDer Vulkantitan ist besiegt, Pyra."
        pointer: "abschluss"
