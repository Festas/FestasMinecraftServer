# Hauptquest Kapitel 6: Ewiges Eis
# Main Quest Chapter 6: Eternal Ice
# 5 Quests führen durch das Eisland (Level 50-60)

# ============================================================================
# QUEST 1: Eisland-Durchquerung
# Der Spieler erreicht die gefrorenen Ebenen
# ============================================================================

events:
  quest1_start: "run ^tag add quest1_aktiv ^journal add quest1_start ^_core.sound_quest_start"
  quest1_ebene_erreicht: "run ^tag add quest1_complete ^tag del quest1_aktiv ^tag add quest2_aktiv ^experience 600 ^point playerpoints 800 ^_core.sound_quest_complete ^journal add quest1_done"

objectives:
  quest1_ebene: "location 3000;72;3000;world range:25 events:quest1_ebene_erreicht notify"

journal:
  quest1_start: "&6Eisland-Durchquerung|&7Die Spur führt in die|&7eisigen Weiten des Nordens.|&7Durchquere das Eisland|&7und erreiche die gefrorenen Ebenen."
  quest1_done: "&6Gefrorene Ebenen erreicht!|&7Frostmagier Kalthar erwartet|&7dich bereits. Die Kälte|&7birgt uralte Mächte."

# ============================================================================
# QUEST 2: Gefrorene Höhlen
# Gepacktes Eis in den Eishöhlen abbauen
# ============================================================================

events:
  quest2_start: "run ^tag add quest2_aktiv ^journal add quest2_start"
  quest2_eis_done: "tag add quest2_eis_complete"
  quest2_complete: "run ^tag add quest2_complete ^tag del quest2_aktiv ^tag add quest3_aktiv ^experience 700 ^point playerpoints 900 ^_core.sound_quest_complete ^journal add quest2_done"

objectives:
  quest2_eis: "block PACKED_ICE 20 events:quest2_eis_done notify"

conditions:
  quest2_eis_erledigt: "tag quest2_eis_complete"

journal:
  quest2_start: "&6Gefrorene Höhlen|&7Kalthar benötigt gepacktes|&7Eis aus den tiefen Höhlen.|&7Baue 20 Blöcke ab|&7für seine Rituale."
  quest2_done: "&6Eis gesammelt!|&7Kalthar ist zufrieden.|&7Doch er warnt vor den Yetis,|&7die in den Bergen lauern."

# ============================================================================
# QUEST 3: Yeti-Jagd
# Yetis in den Eisbergen besiegen
# ============================================================================

events:
  quest3_start: "run ^tag add quest3_aktiv ^journal add quest3_start"
  quest3_yetis_done: "tag add quest3_yetis_complete"
  quest3_complete: "run ^tag add quest3_complete ^tag del quest3_aktiv ^tag add quest4_aktiv ^experience 900 ^point playerpoints 1200 ^_core.sound_quest_complete ^journal add quest3_done"

objectives:
  quest3_yetis: "mobkill POLAR_BEAR 12 events:quest3_yetis_done notify"

conditions:
  quest3_yetis_erledigt: "tag quest3_yetis_complete"

journal:
  quest3_start: "&6Yeti-Jagd|&7Riesige Yetis terrorisieren|&7die Eisberge! Töte 12 der|&7Bestien, um den Weg|&7zum Kristallaltar zu sichern."
  quest3_done: "&6Yetis besiegt!|&7Die Eisberge sind nun|&7sicherer. Eisjägerin Svea|&7kennt den Weg zum Altar."

# ============================================================================
# QUEST 4: Eiskristall-Ritual
# Den Kristallaltar erreichen und Prismarin-Scherben sammeln
# ============================================================================

events:
  quest4_start: "run ^tag add quest4_aktiv ^journal add quest4_start"
  quest4_altar_erreicht: "run ^tag add quest4_location_complete ^journal add quest4_gefunden"
  quest4_scherben_done: "tag add quest4_scherben_complete"
  quest4_complete: "run ^tag add quest4_complete ^tag del quest4_aktiv ^tag add quest5_aktiv ^experience 1100 ^point playerpoints 1500 ^_core.sound_quest_complete ^journal add quest4_done"

objectives:
  quest4_altar: "location 3200;90;3100;world range:15 events:quest4_altar_erreicht notify"
  quest4_prismarin: "block PRISMARINE_SHARD 10 events:quest4_scherben_done notify"

conditions:
  quest4_scherben_erledigt: "tag quest4_scherben_complete"

journal:
  quest4_start: "&6Eiskristall-Ritual|&7Svea führt dich zum|&7Kristallaltar. Sammle dort|&710 Prismarin-Scherben|&7für das uralte Frostitual."
  quest4_gefunden: "&6Kristallaltar entdeckt!|&7Der Altar strahlt kaltes|&7Licht aus. Prismarin-Scherben|&7funkeln in den Wänden."
  quest4_done: "&6Ritual vorbereitet!|&7Die Scherben pulsieren|&7mit Frostenergie. Doch|&7das Ritual hat den|&7Frostdrachen geweckt!"

# ============================================================================
# QUEST 5: Frostdrache
# Bossfight - Abschluss von Kapitel 6
# ============================================================================

events:
  quest5_start: "run ^tag add quest5_aktiv ^journal add quest5_start"
  quest5_boss_done: "tag add quest5_boss_complete"
  quest5_complete: "run ^tag add quest5_complete ^tag del quest5_aktiv ^tag add kapitel6_complete ^experience 1500 ^point playerpoints 2000 ^_core.sound_quest_complete ^journal add quest5_done ^journal add kapitel6_done"

objectives:
  quest5_frostdrache: "mobkill ENDER_DRAGON 1 events:quest5_boss_done notify"

conditions:
  quest5_boss_erledigt: "tag quest5_boss_complete"

journal:
  quest5_start: "&6Frostdrache|&cDer uralte Frostdrache|&cerhebt sich aus dem Eis!|&7Besiege die Bestie und|&7sichere das Eiskristall-Artefakt."
  quest5_done: "&6Frostdrache besiegt!|&aDas Eiskristall-Artefakt|&aist in deinem Besitz!|&7Seine Kälte durchströmt|&7dich mit neuer Macht."
  kapitel6_done: "&6&lEwiges Eis - Komplett|&7Du hast das sechste Kapitel|&7der Hauptquest abgeschlossen.|&7Das Eiskristall-Artefakt|&7weist den Weg nach Süden."

# ============================================================================
# Conversation Extensions für NPCs
# Diese erweitern die existierenden NPC-Conversations
# ============================================================================

conversations:
  frostmagier_kalthar:
    quester: "Frostmagier Kalthar"
    first: "begruessung"
    NPC_options:
      begruessung:
        text: "&5Willkommen im Eisland, Wanderer. Die Kälte prüft jeden, der hierher kommt. Doch ich spüre das Mal der Leere an dir."
        pointer: "hoehlen_frage"
      hoehlen_auftrag:
        text: "&7Die gefrorenen Höhlen bergen uraltes Eis. Bringe mir 20 Blöcke gepacktes Eis, damit ich das Frostitual vorbereiten kann."
        events: "quest2_start"
      yeti_warnung:
        text: "&cDie Yetis in den Bergen sind rasend geworden. Jemand muss sie aufhalten, bevor sie das Eisland überrennen."
        events: "quest3_start"
      abschluss:
        text: "&aDas Eiskristall pulsiert mit unvorstellbarer Macht. Nimm es mit dir. Der Vulkan im Süden birgt das nächste Fragment."
    player_options:
      hoehlen_frage:
        text: "&eWas benötigt Ihr für das Ritual?"
        pointer: "hoehlen_auftrag"
      yeti_frage:
        text: "&eWas ist mit den Yetis geschehen?"
        pointer: "yeti_warnung"

  eisjaegerin_svea:
    quester: "Eisjägerin Svea"
    first: "begruessung"
    NPC_options:
      begruessung:
        text: "&aIch bin Svea, Jägerin des Eislandes. Ich kenne jeden Pfad durch die Gletscher. Du suchst den Kristallaltar, nicht wahr?"
        pointer: "altar_frage"
      altar_auftrag:
        text: "&7Der Kristallaltar liegt hoch in den Bergen. Sammle dort 10 Prismarin-Scherben für das Ritual. Ich zeige dir den Weg."
        events: "quest4_start"
      drache_warnung:
        text: "&cDas Ritual hat den Frostdrachen erweckt! Er ist uralt und mächtig. Sei auf den Kampf deines Lebens vorbereitet!"
        events: "quest5_start"
      abschluss:
        text: "&aDu hast den Frostdrachen bezwungen! Das Eisland wird deine Tat nie vergessen. Reise weiter, Held."
        events: "quest5_complete"
    player_options:
      altar_frage:
        text: "&eWo finde ich den Kristallaltar?"
        pointer: "altar_auftrag"
      drache_bereit:
        text: "&eIch bin bereit für den Drachen."
        pointer: "drache_warnung"
      sieg_melden:
        text: "&eDer Frostdrache ist gefallen, Svea."
        pointer: "abschluss"
