# Hauptquest Kapitel 9: Ins Dunkel
# Main Quest Chapter 9: Into Darkness
# 5 Quests führen durch die Schattenburg (Level 80-90)

# ============================================================================
# QUEST 1: Schattenburg-Einbruch
# Der Spieler erreicht die Schattenfestung
# ============================================================================

events:
  quest1_start: "run ^tag add quest1_aktiv ^journal add quest1_start ^_core.sound_quest_start"
  quest1_festung_erreicht: "run ^tag add quest1_complete ^tag del quest1_aktiv ^tag add quest2_aktiv ^experience 1500 ^point playerpoints 2000 ^_core.sound_quest_complete ^journal add quest1_done"

objectives:
  quest1_festung: "location 6000;70;6000;world range:25 events:quest1_festung_erreicht notify"

journal:
  quest1_start: "&6Schattenburg-Einbruch|&7Die göttliche Waffe weist|&7den Weg zur Schattenburg.|&7Dringe in die Festung ein|&7und triff Schattenritter Darius."
  quest1_done: "&6Schattenburg erreicht!|&7Schattenritter Darius|&7erwartet dich im Schatten.|&7Die Festung birgt das|&7ultimative Dunkel."

# ============================================================================
# QUEST 2: Geisterjagd
# Phantome in der Schattenburg besiegen
# ============================================================================

events:
  quest2_start: "run ^tag add quest2_aktiv ^journal add quest2_start"
  quest2_phantome_done: "tag add quest2_phantome_complete"
  quest2_complete: "run ^tag add quest2_complete ^tag del quest2_aktiv ^tag add quest3_aktiv ^experience 1800 ^point playerpoints 2500 ^_core.sound_quest_complete ^journal add quest2_done"

objectives:
  quest2_phantome: "mobkill PHANTOM 20 events:quest2_phantome_done notify"

conditions:
  quest2_phantome_erledigt: "tag quest2_phantome_complete"

journal:
  quest2_start: "&6Geisterjagd|&7Phantome schwärmen durch|&7die Hallen der Festung!|&7Töte 20 der Geister,|&7um den Weg frei zu machen."
  quest2_done: "&6Phantome vertrieben!|&7Die Hallen sind stiller.|&7Doch aus dem Kerker dringen|&7bedrohliche Geräusche."

# ============================================================================
# QUEST 3: Kerkermeister
# Witherskelette besiegen und den Kerker erreichen
# ============================================================================

events:
  quest3_start: "run ^tag add quest3_aktiv ^journal add quest3_start"
  quest3_skelette_done: "tag add quest3_skelette_complete"
  quest3_kerker_erreicht: "run ^tag add quest3_location_complete ^journal add quest3_gefunden"
  quest3_complete: "run ^tag add quest3_complete ^tag del quest3_aktiv ^tag add quest4_aktiv ^experience 2000 ^point playerpoints 3000 ^_core.sound_quest_complete ^journal add quest3_done"

objectives:
  quest3_skelette: "mobkill WITHER_SKELETON 15 events:quest3_skelette_done notify"
  quest3_kerker: "location 6100;30;6050;world range:10 events:quest3_kerker_erreicht notify"

conditions:
  quest3_skelette_erledigt: "tag quest3_skelette_complete"

journal:
  quest3_start: "&6Kerkermeister|&7Witherskelette bewachen den|&7Kerker! Töte 15 von ihnen|&7und finde den Kerkerschlüssel|&7in den Tiefen der Festung."
  quest3_gefunden: "&6Kerker entdeckt!|&7Der Schlüssel öffnet das|&7massive Tor. Gefangene|&7flüstern von einem Thronraum."
  quest3_done: "&6Kerker befreit!|&7Die Gefangenen sind frei.|&7Seherin Lyra enthüllt|&7den Weg zum Thronraum|&7des Schattenlords."

# ============================================================================
# QUEST 4: Thronraum
# Den Thronraum erreichen und Elitegarden besiegen
# ============================================================================

events:
  quest4_start: "run ^tag add quest4_aktiv ^journal add quest4_start"
  quest4_thron_erreicht: "run ^tag add quest4_location_complete ^journal add quest4_gefunden"
  quest4_garden_done: "tag add quest4_garden_complete"
  quest4_complete: "run ^tag add quest4_complete ^tag del quest4_aktiv ^tag add quest5_aktiv ^experience 2500 ^point playerpoints 4000 ^_core.sound_quest_complete ^journal add quest4_done"

objectives:
  quest4_thronraum: "location 6200;50;6100;world range:15 events:quest4_thron_erreicht notify"
  quest4_garden: "mobkill VINDICATOR 10 events:quest4_garden_done notify"

conditions:
  quest4_garden_erledigt: "tag quest4_garden_complete"

journal:
  quest4_start: "&6Thronraum|&7Lyra kennt den Weg zum|&7Thronraum. Besiege die|&710 Elitegarden des|&7Schattenlords auf dem Weg."
  quest4_gefunden: "&6Thronraum erreicht!|&7Der Thron aus Obsidian|&7pulsiert mit dunkler Energie.|&7Die Elitegarden stellen|&7sich dir entgegen."
  quest4_done: "&6Elitegarden besiegt!|&7Der Thronraum ist gesichert.|&7Doch der Schattenlord|&7erhebt sich aus dem Dunkel.|&cDer finale Kampf beginnt!"

# ============================================================================
# QUEST 5: Finaler Kampf
# Bossfight - Abschluss von Kapitel 9 und der gesamten Hauptquest
# ============================================================================

events:
  quest5_start: "run ^tag add quest5_aktiv ^journal add quest5_start"
  quest5_boss_done: "tag add quest5_boss_complete"
  quest5_complete: "run ^tag add quest5_complete ^tag del quest5_aktiv ^tag add kapitel9_complete ^tag add hauptquest_complete ^experience 3000 ^point playerpoints 5000 ^_core.sound_quest_complete ^journal add quest5_done ^journal add kapitel9_done ^journal add hauptquest_done"

objectives:
  quest5_schattenlord: "mobkill WITHER 1 events:quest5_boss_done notify"

conditions:
  quest5_boss_erledigt: "tag quest5_boss_complete"

journal:
  quest5_start: "&6Finaler Kampf|&cDer Schattenlord erhebt|&csich in seiner vollen Macht!|&7Dies ist der finale Kampf.|&7Alles hat dich hierher geführt."
  quest5_done: "&6Schattenlord besiegt!|&aDas Dunkel ist gebannt!|&aDie Artefakte vereinen sich|&aund die Welt ist gerettet.|&7Du bist ein wahrer Held!"
  kapitel9_done: "&6&lIns Dunkel - Komplett|&7Du hast das neunte und|&7letzte Kapitel der Hauptquest|&7abgeschlossen. Die Schattenburg|&7ist befreit vom Dunkel."
  hauptquest_done: "&6&l&aHauptquest Abgeschlossen!|&7Du hast alle Kapitel der|&7Hauptquest gemeistert!|&7Die Welt ist gerettet|&7und dein Name wird auf ewig|&7in den Legenden bestehen."

# ============================================================================
# Conversation Extensions für NPCs
# Diese erweitern die existierenden NPC-Conversations
# ============================================================================

conversations:
  schattenritter_darius:
    quester: "Schattenritter Darius"
    first: "begruessung"
    NPC_options:
      begruessung:
        text: "&7Endlich bist du hier, Held. Ich bin Darius, der letzte Schattenritter. Die Festung ist vom Dunkel durchdrungen."
        pointer: "geister_frage"
      geister_auftrag:
        text: "&cPhantome schwärmen durch die Hallen. Töte 20 von ihnen, damit wir zum Kerker vordringen können."
        events: "quest2_start"
      kerker_auftrag:
        text: "&7Im Kerker bewachen Witherskelette die Gefangenen. Töte 15 von ihnen und finde den Kerkerschlüssel."
        events: "quest3_start"
      abschluss:
        text: "&aDer Schattenlord ist gefallen! Du hast es geschafft, Held. Die Welt ist dir auf ewig dankbar."
    player_options:
      geister_frage:
        text: "&eWas erwartet mich in der Festung?"
        pointer: "geister_auftrag"
      kerker_frage:
        text: "&eWie erreiche ich den Kerker?"
        pointer: "kerker_auftrag"

  seherin_lyra:
    quester: "Seherin Lyra"
    first: "begruessung"
    NPC_options:
      begruessung:
        text: "&5Ich habe dich in meinen Visionen gesehen, Held. Du bist der Auserwählte, der das Dunkel besiegen wird."
        pointer: "thron_frage"
      thron_auftrag:
        text: "&7Der Thronraum liegt im Herzen der Festung. 10 Elitegarden bewachen den Weg. Besiege sie, um zum Schattenlord zu gelangen."
        events: "quest4_start"
      boss_warnung:
        text: "&cDer Schattenlord ist die Quelle allen Dunkels! Nutze die göttliche Waffe und alle Artefakte. Dies ist dein Schicksal!"
        events: "quest5_start"
      abschluss:
        text: "&a&lDas Dunkel ist gebannt! Die Artefakte der Leere vereinen sich und heilen die Welt. Du bist der größte Held aller Zeiten!"
        events: "quest5_complete"
    player_options:
      thron_frage:
        text: "&eWo finde ich den Schattenlord?"
        pointer: "thron_auftrag"
      boss_bereit:
        text: "&eIch bin bereit für den finalen Kampf."
        pointer: "boss_warnung"
      sieg_melden:
        text: "&eDer Schattenlord ist besiegt, Lyra!"
        pointer: "abschluss"
