# Hauptquest Kapitel 5: Sandstürme
# Main Quest Chapter 5: Sandstorms
# 5 Quests führen durch die Wüste (Level 40-50)

# ============================================================================
# QUEST 1: Wüstenkarawane
# Der Spieler erreicht den Wüsten-Außenposten
# ============================================================================

events:
  quest1_start: "run ^tag add quest1_aktiv ^journal add quest1_start ^_core.sound_quest_start"
  quest1_aussenposten_erreicht: "run ^tag add quest1_complete ^tag del quest1_aktiv ^tag add quest2_aktiv ^experience 400 ^point playerpoints 500 ^_core.sound_quest_complete ^journal add quest1_done"

objectives:
  quest1_aussenposten: "location 2000;74;2000;world range:25 events:quest1_aussenposten_erreicht notify"

journal:
  quest1_start: "&6Wüstenkarawane|&7Die Spur der Korruption|&7führt in die endlose Wüste.|&7Schließe dich einer Karawane|&7zum Außenposten an."
  quest1_done: "&6Außenposten erreicht!|&7Der Karawanenmeister Hassan|&7begrüßt dich. Die Wüste|&7birgt uralte Geheimnisse."

# ============================================================================
# QUEST 2: Oase finden
# Eine verborgene Oase in der Wüste erreichen
# ============================================================================

events:
  quest2_start: "run ^tag add quest2_aktiv ^journal add quest2_start"
  quest2_oase_erreicht: "run ^tag add quest2_complete ^tag del quest2_aktiv ^tag add quest3_aktiv ^experience 500 ^point playerpoints 600 ^_core.sound_quest_complete ^journal add quest2_done"

objectives:
  quest2_oase: "location 2100;68;2050;world range:20 events:quest2_oase_erreicht notify"

journal:
  quest2_start: "&6Oase finden|&7Hassan spricht von einer|&7verborgenen Oase im Süden.|&7Dort lebt eine Gelehrte,|&7die mehr über die Ruinen weiß."
  quest2_done: "&6Oase gefunden!|&7Die Gelehrte Amira lebt|&7hier seit Jahren. Sie|&7studiert die antiken Ruinen."

# ============================================================================
# QUEST 3: Skorpion-Nest
# Skorpione im Wüstental besiegen
# ============================================================================

events:
  quest3_start: "run ^tag add quest3_aktiv ^journal add quest3_start"
  quest3_skorpione_done: "tag add quest3_skorpione_complete"
  quest3_complete: "run ^tag add quest3_complete ^tag del quest3_aktiv ^tag add quest4_aktiv ^experience 600 ^point playerpoints 800 ^_core.sound_quest_complete ^journal add quest3_done"

objectives:
  quest3_skorpione: "mobkill CAVE_SPIDER 15 events:quest3_skorpione_done notify"

conditions:
  quest3_skorpione_erledigt: "tag quest3_skorpione_complete"

journal:
  quest3_start: "&6Skorpion-Nest|&7Riesige Skorpione blockieren|&7den Weg zu den Ruinen!|&7Töte 15 der Kreaturen|&7um den Pfad zu räumen."
  quest3_done: "&6Skorpione besiegt!|&7Der Weg zu den antiken|&7Ruinen ist nun frei.|&7Amira will dich begleiten."

# ============================================================================
# QUEST 4: Antike Ruinen
# Die Ruinen erkunden und Golderz sammeln
# ============================================================================

events:
  quest4_start: "run ^tag add quest4_aktiv ^journal add quest4_start"
  quest4_ruinen_erreicht: "run ^tag add quest4_location_complete ^journal add quest4_gefunden"
  quest4_erze_done: "tag add quest4_erze_complete"
  quest4_complete: "run ^tag add quest4_complete ^tag del quest4_aktiv ^tag add quest5_aktiv ^experience 800 ^point playerpoints 1000 ^_core.sound_quest_complete ^journal add quest4_done"

objectives:
  quest4_ruinen: "location 2200;60;2100;world range:20 events:quest4_ruinen_erreicht notify"
  quest4_golderze: "block GOLD_ORE 10 events:quest4_erze_done notify"

conditions:
  quest4_erze_erledigt: "tag quest4_erze_complete"

journal:
  quest4_start: "&6Antike Ruinen|&7Amira führt dich zu den|&7antiken Ruinen. Sammle dort|&710 Golderze aus den|&7verborgenen Kammern."
  quest4_gefunden: "&6Ruinen entdeckt!|&7Die antiken Mauern ragen|&7aus dem Sand. Golderz|&7schimmert in den Wänden."
  quest4_done: "&6Golderz gesammelt!|&7Amira entschlüsselt die|&7Inschriften. Sie sprechen|&7von Pharaos Grab tief|&7unter dem Sand."

# ============================================================================
# QUEST 5: Pharaos Grab
# Bossfight - Abschluss von Kapitel 5
# ============================================================================

events:
  quest5_start: "run ^tag add quest5_aktiv ^journal add quest5_start"
  quest5_boss_done: "tag add quest5_boss_complete"
  quest5_complete: "run ^tag add quest5_complete ^tag del quest5_aktiv ^tag add kapitel5_complete ^experience 1000 ^point playerpoints 1500 ^_core.sound_quest_complete ^journal add quest5_done ^journal add kapitel5_done"

objectives:
  quest5_pharao: "mobkill WARDEN 1 events:quest5_boss_done notify"

conditions:
  quest5_boss_erledigt: "tag quest5_boss_complete"

journal:
  quest5_start: "&6Pharaos Grab|&cIn der tiefsten Kammer|&cerwacht der Pharao!|&7Besiege den uralten Herrscher|&7und entreiße ihm das|&7Artefakt der Leere."
  quest5_done: "&6Pharao besiegt!|&aDas Artefakt der Leere|&aist in deinem Besitz!|&7Amira warnt: Dies ist|&7nur ein Teil des Ganzen."
  kapitel5_done: "&6&lSandstürme - Komplett|&7Du hast das fünfte Kapitel|&7der Hauptquest abgeschlossen.|&7Das Artefakt der Leere|&7enthüllt neue Wahrheiten."

# ============================================================================
# Conversation Extensions für NPCs
# Diese erweitern die existierenden NPC-Conversations
# ============================================================================

conversations:
  karawanenmeister_hassan:
    quester: "Karawanenmeister Hassan"
    first: "begruessung"
    NPC_options:
      begruessung:
        text: "&eSalam, Reisender! Die Wüste ist gnadenlos, aber die Karawane bringt dich sicher zum Außenposten."
        pointer: "oase_frage"
      oase_hinweis:
        text: "&7Es gibt eine verborgene Oase im Süden. Dort lebt eine Gelehrte namens Amira. Sie weiß viel über die alten Ruinen."
        events: "quest2_start"
      skorpion_warnung:
        text: "&cVorsicht! Riesige Skorpione haben sich im Tal eingenistet. Kein Händler kommt mehr durch. Kannst du helfen?"
        events: "quest3_start"
      abschluss:
        text: "&aDu bist ein wahrer Held der Wüste! Die Karawanen können wieder sicher reisen. Möge der Sand dich stets tragen."
    player_options:
      oase_frage:
        text: "&eWo finde ich diese Gelehrte?"
        pointer: "oase_hinweis"
      skorpione_frage:
        text: "&eWas ist mit den Skorpionen?"
        pointer: "skorpion_warnung"

  gelehrte_amira:
    quester: "Gelehrte Amira"
    first: "begruessung"
    NPC_options:
      begruessung:
        text: "&5Faszinierend! Du trägst das Mal der Leere. Ich studiere diese Energie seit Jahren. Komm, wir haben viel zu besprechen."
        pointer: "ruinen_frage"
      ruinen_auftrag:
        text: "&7Die antiken Ruinen bergen Golderz und uralte Inschriften. Sammle 10 Golderze, damit ich die Siegel entschlüsseln kann."
        events: "quest4_start"
      pharao_warnung:
        text: "&cDie Inschriften sprechen von einem Pharao, der die Leere kontrollierte. Sein Grab liegt tief unter dem Sand. Sei vorbereitet!"
        events: "quest5_start"
      abschluss:
        text: "&aDas Artefakt... es pulsiert mit dunkler Energie. Dies ist nur ein Fragment eines größeren Ganzen. Wir müssen weiter forschen."
        events: "quest5_complete"
    player_options:
      ruinen_frage:
        text: "&eWas wisst Ihr über die Ruinen?"
        pointer: "ruinen_auftrag"
      pharao_bereit:
        text: "&eIch bin bereit für das Grab."
        pointer: "pharao_warnung"
      artefakt_zeigen:
        text: "&eIch habe das Artefakt, Amira."
        pointer: "abschluss"
