# Hauptquest Kapitel 2: Der dunkle Wald
# Main Quest Chapter 2: The Dark Forest
# 5 Quests führen durch den Wald von Waldland (Level 10-20)

# ============================================================================
# QUEST 1: Waldland erkunden
# Der Spieler erkundet die Waldregion und erreicht den Waldwächter-Posten
# ============================================================================

events:
  quest1_start: "run ^tag add quest1_aktiv ^journal add quest1_start ^_core.sound_quest_start"
  quest1_waldland_erreicht: "run ^tag add quest1_complete ^tag del quest1_aktiv ^tag add quest2_aktiv ^experience 100 ^point playerpoints 100 ^_core.sound_quest_complete ^journal add quest1_done"

objectives:
  quest1_waldland: "location 500;72;500;world range:25 events:quest1_waldland_erreicht notify"

journal:
  quest1_start: "&6Waldland erkunden|&7Der Waldwächter Elorin|&7erwartet dich im Wald.|&7Reise zum Waldwächter-Posten|&7im Herzen des Waldes."
  quest1_done: "&6Waldland erreicht!|&7Du hast den Waldwächter-Posten|&7gefunden. Elorin begrüßt|&7dich wachsam."

# ============================================================================
# QUEST 2: Wölfe jagen
# Die Wolfspopulation dezimieren
# ============================================================================

events:
  quest2_start: "run ^tag add quest2_aktiv ^journal add quest2_start"
  quest2_woelfe_done: "tag add quest2_woelfe_complete"
  quest2_complete: "run ^tag add quest2_complete ^tag del quest2_aktiv ^tag add quest3_aktiv ^experience 150 ^point playerpoints 150 ^_core.sound_quest_complete ^journal add quest2_done"

objectives:
  quest2_woelfe: "mobkill WOLF 10 events:quest2_woelfe_done notify"

conditions:
  quest2_woelfe_erledigt: "tag quest2_woelfe_complete"

journal:
  quest2_start: "&6Wölfe jagen|&7Die Wölfe im Wald sind|&7aggressiv geworden.|&7Elorin bittet dich,|&710 Wölfe zu erlegen."
  quest2_done: "&6Wolfsjagd abgeschlossen!|&7Du hast die aggressive|&7Wolfspopulation eingedämmt.|&7Elorin ist beeindruckt."

# ============================================================================
# QUEST 3: Ent-Bedrohung
# Einen korrumpierten Ent-Boss besiegen
# ============================================================================

events:
  quest3_start: "run ^tag add quest3_aktiv ^journal add quest3_start"
  quest3_ent_done: "tag add quest3_ent_complete"
  quest3_complete: "run ^tag add quest3_complete ^tag del quest3_aktiv ^tag add quest4_aktiv ^experience 200 ^point playerpoints 250 ^_core.sound_quest_complete ^journal add quest3_done"

objectives:
  quest3_ent_boss: "mobkill WITHER_SKELETON 1 events:quest3_ent_done notify"

conditions:
  quest3_ent_erledigt: "tag quest3_ent_complete"

journal:
  quest3_start: "&6Ent-Bedrohung|&7Ein korrumpierter Ent|&7terrorisiert den Wald.|&7Finde und besiege die|&7uralte Kreatur!"
  quest3_done: "&6Ent besiegt!|&7Der korrumpierte Ent ist|&7gefallen. Der Wald kann|&7wieder aufatmen."

# ============================================================================
# QUEST 4: Verborgener Schrein
# Einen versteckten Waldschrein finden
# ============================================================================

events:
  quest4_start: "run ^tag add quest4_aktiv ^journal add quest4_start"
  quest4_schrein_erreicht: "run ^tag add quest4_complete ^tag del quest4_aktiv ^tag add quest5_aktiv ^experience 250 ^point playerpoints 350 ^give _core.korruptes_fragment ^_core.sound_quest_complete ^journal add quest4_done"

objectives:
  quest4_schrein: "location 600;55;620;world range:10 events:quest4_schrein_erreicht notify"

journal:
  quest4_start: "&6Verborgener Schrein|&7Elorin spricht von einem|&7uralten Waldschrein, verborgen|&7tief im Dickicht.|&7Finde den heiligen Ort."
  quest4_done: "&6Schrein gefunden!|&7Du hast den verborgenen|&7Waldschrein entdeckt.|&7Ein korruptes Fragment|&7lag auf dem Altar."

# ============================================================================
# QUEST 5: Der Pakt des Waldes
# Abschluss von Kapitel 2 - Gespräch mit dem Waldwächter
# ============================================================================

events:
  quest5_start: "run ^tag add quest5_aktiv ^journal add quest5_start"
  quest5_complete: "run ^tag add quest5_complete ^tag del quest5_aktiv ^tag add kapitel2_complete ^experience 300 ^point playerpoints 500 ^_core.sound_quest_complete ^journal add quest5_done ^journal add kapitel2_done"

journal:
  quest5_start: "&6Der Pakt des Waldes|&7Kehre zu Elorin zurück|&7und berichte von deinen|&7Entdeckungen im Wald."
  quest5_done: "&6Pakt geschlossen!|&7Elorin hat dich als|&7Freund des Waldes anerkannt.|&7Du trägst nun den Segen|&7der alten Bäume."
  kapitel2_done: "&6&lDer dunkle Wald - Komplett|&7Du hast das zweite Kapitel|&7der Hauptquest abgeschlossen.|&7Der Wald birgt noch|&7viele Geheimnisse."

# ============================================================================
# Conversation Extensions für NPCs
# Diese erweitern die existierenden NPC-Conversations
# ============================================================================

conversations:
  waldwaechter_elorin:
    quester: "Waldwächter Elorin"
    first: "begruessung"
    NPC_options:
      begruessung:
        text: "&aWillkommen im Waldland, Wanderer. Die Bäume flüstern von einer neuen Bedrohung..."
        pointer: "was_passiert"
      woelfe_auftrag:
        text: "&7Die Wölfe sind von der Dunkelheit korrumpiert. Eliminiere 10 von ihnen, bevor sie die Waldwege unsicher machen."
        events: "quest2_start"
      ent_warnung:
        text: "&cIm tiefsten Dickicht haust ein uralter Ent, verdorben durch die Leere. Sei vorsichtig, Wanderer!"
        events: "quest3_start"
      schrein_hinweis:
        text: "&5Es gibt einen verborgenen Schrein, tief im Wald. Die alten Geister bewachen ihn noch immer."
        events: "quest4_start"
      pakt_abschluss:
        text: "&aDu hast dem Wald einen großen Dienst erwiesen. Ich erkenne dich als Freund des Waldes an. Möge der Segen der alten Bäume dich begleiten."
        events: "quest5_complete"
    player_options:
      was_passiert:
        text: "&eWas passiert hier im Wald?"
        pointer: "woelfe_auftrag"
      bereit_fuer_kampf:
        text: "&eIch bin bereit zu kämpfen."
        pointer: "ent_warnung"
      schrein_suchen:
        text: "&eIch werde den Schrein suchen."
        pointer: "schrein_hinweis"
      bericht_erstatten:
        text: "&eIch habe alles erledigt, Elorin."
        pointer: "pakt_abschluss"

  jaeger_wolfhart:
    quester: "Jäger Wolfhart"
    first: "begruessung"
    NPC_options:
      begruessung:
        text: "&7Still! Die Wölfe sind heute Nacht besonders unruhig. Irgendetwas stimmt nicht im Wald..."
      wolf_tipp:
        text: "&7Die Wölfe sammeln sich im Norden. Geh vorsichtig vor, sie greifen in Rudeln an."
    player_options:
      wolf_frage:
        text: "&eWo finde ich die Wölfe?"
        pointer: "wolf_tipp"
