# Hauptquest Kapitel 8: Vergessene Götter
# Main Quest Chapter 8: Forgotten Gods
# 5 Quests führen durch die Tempelruinen (Level 70-80)

# ============================================================================
# QUEST 1: Tempel-Expedition
# Der Spieler erreicht den Tempeleingang
# ============================================================================

events:
  quest1_start: "run ^tag add quest1_aktiv ^journal add quest1_start ^_core.sound_quest_start"
  quest1_tempel_erreicht: "run ^tag add quest1_complete ^tag del quest1_aktiv ^tag add quest2_aktiv ^experience 1000 ^point playerpoints 1500 ^_core.sound_quest_complete ^journal add quest1_done"

objectives:
  quest1_tempel: "location 5000;65;5000;world range:25 events:quest1_tempel_erreicht notify"

journal:
  quest1_start: "&6Tempel-Expedition|&7Die Artefakte weisen den|&7Weg zu uralten Tempelruinen.|&7Erreiche den Eingang und|&7triff den Archäologen Theodor."
  quest1_done: "&6Tempel erreicht!|&7Archäologe Theodor gräbt|&7hier seit Monaten. Die|&7Ruinen bergen Geheimnisse|&7vergessener Götter."

# ============================================================================
# QUEST 2: Rätsel der Alten
# Gemeißelte Steinziegel als Rätselteile abbauen
# ============================================================================

events:
  quest2_start: "run ^tag add quest2_aktiv ^journal add quest2_start"
  quest2_ziegel_done: "tag add quest2_ziegel_complete"
  quest2_complete: "run ^tag add quest2_complete ^tag del quest2_aktiv ^tag add quest3_aktiv ^experience 1200 ^point playerpoints 1800 ^_core.sound_quest_complete ^journal add quest2_done"

objectives:
  quest2_ziegel: "block CHISELED_STONE_BRICKS 20 events:quest2_ziegel_done notify"

conditions:
  quest2_ziegel_erledigt: "tag quest2_ziegel_complete"

journal:
  quest2_start: "&6Rätsel der Alten|&7Theodor benötigt gemeißelte|&7Steinziegel aus den Ruinen.|&7Sammle 20 Stück, um die|&7uralten Rätsel zu lösen."
  quest2_done: "&6Rätsel gelöst!|&7Die Steinziegel enthüllen|&7eine Karte zu den inneren|&7Kammern. Doch Wächter|&7beschützen den Weg."

# ============================================================================
# QUEST 3: Wächter-Prüfung
# Wächter im Tempel besiegen
# ============================================================================

events:
  quest3_start: "run ^tag add quest3_aktiv ^journal add quest3_start"
  quest3_waechter_done: "tag add quest3_waechter_complete"
  quest3_complete: "run ^tag add quest3_complete ^tag del quest3_aktiv ^tag add quest4_aktiv ^experience 1500 ^point playerpoints 2500 ^_core.sound_quest_complete ^journal add quest3_done"

objectives:
  quest3_waechter: "mobkill GUARDIAN 20 events:quest3_waechter_done notify"

conditions:
  quest3_waechter_erledigt: "tag quest3_waechter_complete"

journal:
  quest3_start: "&6Wächter-Prüfung|&7Uralte Wächter beschützen|&7die inneren Kammern!|&7Besiege 20 von ihnen,|&7um zur göttlichen Schmiede|&7vorzudringen."
  quest3_done: "&6Wächter besiegt!|&7Der Weg zur göttlichen|&7Schmiede ist frei.|&7Tempelwächter Seraph|&7erwartet dich dort."

# ============================================================================
# QUEST 4: Göttliche Waffe
# Die göttliche Schmiede erreichen und Nethersterne sammeln
# ============================================================================

events:
  quest4_start: "run ^tag add quest4_aktiv ^journal add quest4_start"
  quest4_schmiede_erreicht: "run ^tag add quest4_location_complete ^journal add quest4_gefunden"
  quest4_sterne_done: "tag add quest4_sterne_complete"
  quest4_complete: "run ^tag add quest4_complete ^tag del quest4_aktiv ^tag add quest5_aktiv ^experience 2000 ^point playerpoints 3000 ^_core.sound_quest_complete ^journal add quest4_done"

objectives:
  quest4_schmiede: "location 5200;40;5100;world range:15 events:quest4_schmiede_erreicht notify"
  quest4_nethersterne: "block NETHER_STAR 5 events:quest4_sterne_done notify"

conditions:
  quest4_sterne_erledigt: "tag quest4_sterne_complete"

journal:
  quest4_start: "&6Göttliche Waffe|&7Seraph kennt das Geheimnis|&7der göttlichen Schmiede.|&7Erreiche sie und sammle|&75 Nethersterne für die Waffe."
  quest4_gefunden: "&6Göttliche Schmiede entdeckt!|&7Ein Ort unvorstellbarer|&7Macht. Nethersterne schweben|&7in der Luft."
  quest4_done: "&6Nethersterne gesammelt!|&7Die göttliche Waffe nimmt|&7Gestalt an. Doch das|&7Schmieden hat den uralten|&7Hüter erweckt!"

# ============================================================================
# QUEST 5: Erwachen
# Bossfight - Abschluss von Kapitel 8
# ============================================================================

events:
  quest5_start: "run ^tag add quest5_aktiv ^journal add quest5_start"
  quest5_boss_done: "tag add quest5_boss_complete"
  quest5_complete: "run ^tag add quest5_complete ^tag del quest5_aktiv ^tag add kapitel8_complete ^experience 2500 ^point playerpoints 4000 ^_core.sound_quest_complete ^journal add quest5_done ^journal add kapitel8_done"

objectives:
  quest5_hueter: "mobkill WARDEN 1 events:quest5_boss_done notify"

conditions:
  quest5_boss_erledigt: "tag quest5_boss_complete"

journal:
  quest5_start: "&6Erwachen|&cDer uralte Hüter der|&cGötter erwacht aus seinem|&cSchlaf! Besiege ihn und|&7erlange die göttliche Waffe."
  quest5_done: "&6Hüter besiegt!|&aDie göttliche Waffe|&aist geschmiedet!|&7Ihre Macht durchströmt|&7dich. Die Schattenburg ruft."
  kapitel8_done: "&6&lVergessene Götter - Komplett|&7Du hast das achte Kapitel|&7der Hauptquest abgeschlossen.|&7Die göttliche Waffe weist|&7den Weg zur Schattenburg."

# ============================================================================
# Conversation Extensions für NPCs
# Diese erweitern die existierenden NPC-Conversations
# ============================================================================

conversations:
  archäologe_theodor:
    quester: "Archäologe Theodor"
    first: "begruessung"
    NPC_options:
      begruessung:
        text: "&eUnglaublich! Du trägst gleich mehrere Artefakte der Leere! Ich grabe hier seit Monaten nach Antworten."
        pointer: "raetsel_frage"
      raetsel_auftrag:
        text: "&7Die Wände sind voller gemeißelter Steinziegel mit Inschriften. Bringe mir 20 Stück, damit ich die Rätsel entschlüsseln kann."
        events: "quest2_start"
      waechter_warnung:
        text: "&cDie inneren Kammern werden von uralten Wächtern bewacht! 20 dieser Kreaturen stehen zwischen uns und der göttlichen Schmiede."
        events: "quest3_start"
      abschluss:
        text: "&aDie göttliche Waffe! Eine Legende wird wahr. Nimm sie, Held. Die Schattenburg im Norden ist dein letztes Ziel."
    player_options:
      raetsel_frage:
        text: "&eWas habt Ihr hier entdeckt?"
        pointer: "raetsel_auftrag"
      waechter_frage:
        text: "&eWas steht uns noch bevor?"
        pointer: "waechter_warnung"

  tempelwaechter_seraph:
    quester: "Tempelwächter Seraph"
    first: "begruessung"
    NPC_options:
      begruessung:
        text: "&5Ich bin Seraph, der letzte Wächter dieses Tempels. Die Götter haben mich erwählt, die Schmiede zu hüten."
        pointer: "schmiede_frage"
      schmiede_auftrag:
        text: "&7Die göttliche Schmiede erfordert 5 Nethersterne. Nur damit kann die Waffe geschmiedet werden, die das Dunkel besiegt."
        events: "quest4_start"
      hueter_warnung:
        text: "&cDas Schmieden hat den uralten Hüter erweckt! Er ist die letzte Prüfung der Götter. Bestehe sie und die Waffe gehört dir!"
        events: "quest5_start"
      abschluss:
        text: "&aDu hast die Prüfung der Götter bestanden. Die göttliche Waffe ist dein. Nun geh und stelle dich dem Dunkel der Schattenburg."
        events: "quest5_complete"
    player_options:
      schmiede_frage:
        text: "&eWie funktioniert die göttliche Schmiede?"
        pointer: "schmiede_auftrag"
      hueter_bereit:
        text: "&eIch stelle mich dem Hüter."
        pointer: "hueter_warnung"
      sieg_melden:
        text: "&eDer Hüter ist besiegt, Seraph."
        pointer: "abschluss"
