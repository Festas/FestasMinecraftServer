use-minimessage: true
# Enables using of minimessage in titles / texts / messages
enable-debug: false
# Enables extra debug logging (useful for developers)
enable-metrics: false
# Enables bStats plugin metrics (anonymous usage data)
soulbound: false
# Should armors be soulbound?
give-armor-on-join: true
# Should armors be given to players on join when they have required permissions?
give-armor-on-join-once: true
# Should each tier be given only once per player?
# Keep this true. With it false, a player can take their set off, stash it, relog to get
# a fresh one and repeat that without limit. Granted tiers are recorded in granted-armors.yml;
# use /xarmors resetgrants <player> to let someone receive their set again.
main-command:
- xarmors
- armors
- xprisonarmors
# Main command aliases
sounds:
  click: UI_BUTTON_CLICK
  success: ENTITY_PLAYER_LEVELUP
  info: BLOCK_NOTE_BLOCK_PLING
  error: BLOCK_NOTE_BLOCK_BASS
# Sound effects used by various plugin features for feedback.
