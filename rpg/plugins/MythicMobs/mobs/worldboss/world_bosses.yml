# ---------------------------------------------------
# 10. Weltenbrecher Ragnarok (Lv.100, 2000000 HP) - Endboss
# ---------------------------------------------------
WeltenbrecherRagnarok:
  Type: WITHER
  Display: '&4&l☠ Weltenbrecher Ragnarok &c&l[Lv.100]'
  Health: 2000000
  Damage: 200
  Armor: 40
  Options:
    MovementSpeed: 0.25
    PreventOtherDrops: true
    AlwaysShowName: true
    FollowRange: 80
    Silent: false
  Skills:
  # Spawn
  - skill{s=RagnarokSpawn} @self ~onSpawn
  # Phase 1 (100%-75% HP)
  - skill{s=WeltenSchlag} @target ~onTimer:200
  - skill{s=WitherSturm} @self ~onTimer:300
  - skill{s=ChaosKugel} @target ~onTimer:350
  - skill{s=VernichtungsWelle} @self ~onTimer:500
  # Phase 2 (75%-50% HP)
  - skill{s=RagnarokPhase2} @self ~onHealthMod:<0.75 1
  - skill{s=DimensionsRiss} @self ~onTimer:400 ~onHealthMod:0.5to0.75
  - skill{s=SeelenEntzug} @target ~onTimer:300 ~onHealthMod:0.5to0.75
  - skill{s=ChaosExplosion} @self ~onTimer:350 ~onHealthMod:0.5to0.75
  - skill{s=BeschwoereHerold} @self ~onTimer:500 ~onHealthMod:0.5to0.75
  # Phase 3 (50%-25% HP)
  - skill{s=RagnarokPhase3} @self ~onHealthMod:<0.5 1
  - skill{s=WeltenBeben} @self ~onTimer:300 ~onHealthMod:0.25to0.5
  - skill{s=VoidStorm} @self ~onTimer:350 ~onHealthMod:0.25to0.5
  - skill{s=BeschwoereHerold} @self ~onTimer:400 ~onHealthMod:0.25to0.5
  - skill{s=WeltenRiss} @self ~onTimer:400 ~onHealthMod:0.25to0.5
  # Phase 4 (25%-0% HP) - Enrage
  - skill{s=RagnarokPhase4} @self ~onHealthMod:<0.25 1
  - skill{s=RagnarokEnrage} @self ~onHealthMod:<0.25 1
  - skill{s=Apokalypse} @self ~onTimer:250 ~onHealthMod:<0.25
  - skill{s=WeltenBeben} @self ~onTimer:200 ~onHealthMod:<0.25
  - skill{s=VoidStorm} @self ~onTimer:250 ~onHealthMod:<0.25
  - skill{s=BeschwoereHerold} @self ~onTimer:300 ~onHealthMod:<0.25
  - skill{s=EndgueltigeVernichtung} @self ~onTimer:350 ~onHealthMod:<0.25
  # Death
  - skill{s=RagnarokTod} @self ~onDeath
  Drops:
  - mmoitems{type=MATERIAL;id=WELTEN_ESSENZ} 10-15 1.0
  - mmoitems{type=MATERIAL;id=GOLD_COIN;amount=10000} 1.0
  - mmoitems{type=MATERIAL;id=BOSS_ESSENZ} 15 1.0
  - mmoitems{type=SWORD;id=RAGNAROK_SCHWERT} 1 0.1
  - mmoitems{type=ARMOR;id=RAGNAROK_HELM} 1 0.05
  - mmoitems{type=ARMOR;id=RAGNAROK_BRUSTPLATTE} 1 0.05
  - mmoitems{type=ARMOR;id=RAGNAROK_BEINSCHUTZ} 1 0.05
  - mmoitems{type=ARMOR;id=RAGNAROK_STIEFEL} 1 0.05
  - mmoitems{type=ACCESSORY;id=WELTENBRECHER_AMULETT} 1 0.02
  - exp 200000
  BossBar:
    Enabled: true
    Title: '&4&l☠ Weltenbrecher Ragnarok'
    Color: RED
    Style: SEGMENTED_20
    Range: 80
