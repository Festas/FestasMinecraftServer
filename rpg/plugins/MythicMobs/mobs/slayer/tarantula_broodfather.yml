# ---------------------------------------------------
# Tier IV - Brut-Imperatrix (Lv.60, 30000 HP)
# ---------------------------------------------------
TarantulaBroodfatherT4:
  Type: SPIDER
  Display: '&a&lTarantula Broodfather &2&l[Tier IV]'
  Health: 30000
  Damage: 40
  Armor: 12
  Options:
    MovementSpeed: 0.35
    PreventOtherDrops: true
    AlwaysShowName: true
    FollowRange: 45
  Skills:
  # Phase 1 (100%-60% HP)
  - skill{s=WebTrap} @target ~onTimer:250
  - skill{s=SpiderHiss} @self ~onSpawn
  - skill{s=PoisonSpit} @target ~onTimer:200
  - skill{s=SummonSpiderlings} @self ~onTimer:400
  # Phase 2 (60%-30% HP)
  - skill{s=BroodfatherPhase2} @self ~onHealthMod:<0.6 1
  - skill{s=WebLabyrinth} @self ~onTimer:500 ~onHealthMod:0.3to0.6
  - skill{s=VenomCloud} @self ~onTimer:350 ~onHealthMod:0.3to0.6
  - skill{s=SummonBroodGuardians} @self ~onTimer:400 ~onHealthMod:0.3to0.6
  # Phase 3 (30%-0% HP)
  - skill{s=BroodfatherPhase3} @self ~onHealthMod:<0.3 1
  - skill{s=ToxicNova} @self ~onTimer:300 ~onHealthMod:<0.3
  - skill{s=WebLabyrinth} @self ~onTimer:400 ~onHealthMod:<0.3
  - skill{s=SummonBroodGuardians} @self ~onTimer:300 ~onHealthMod:<0.3
  # Death
  - skill{s=BroodfatherDeathBurst} @self ~onDeath
  Drops:
  - mmoitems{type=MATERIAL;id=TARANTULA_WEB} 30-50 1.0
  - mmoitems{type=MATERIAL;id=TOXIC_ARROW_POISON} 3-5 1.0
  - mmoitems{type=MATERIAL;id=SPIDER_CATALYST} 1-2 0.6
  - mmoitems{type=MATERIAL;id=FLY_SWATTER_MATERIAL} 1 0.1
  - mmoitems{type=MATERIAL;id=GOLD_COIN} 500-1000 1.0
  - exp 9000
  BossBar:
    Enabled: true
    Title: '&a&lTarantula Broodfather &2&l[Tier IV]'
    Color: GREEN
    Style: SEGMENTED_12
    Range: 45

# ---------------------------------------------------
# Tier V - Spinnenkönigin (Lv.80, 90000 HP)
# ---------------------------------------------------
TarantulaBroodfatherT5:
  Type: SPIDER
  Display: '&2&l☠ Tarantula Broodfather &a&l[Tier V]'
  Health: 90000
  Damage: 60
  Armor: 18
  Options:
    MovementSpeed: 0.36
    PreventOtherDrops: true
    AlwaysShowName: true
    FollowRange: 50
    Silent: false
  Skills:
  # Spawn
  - skill{s=BroodfatherT5Spawn} @self ~onSpawn
  # Phase 1 (100%-70% HP)
  - skill{s=WebTrap} @target ~onTimer:200
  - skill{s=PoisonSpit} @target ~onTimer:180
  - skill{s=SummonSpiderlings} @self ~onTimer:350
  - skill{s=VenomCloud} @self ~onTimer:400
  # Phase 2 (70%-40% HP)
  - skill{s=BroodfatherPhase2} @self ~onHealthMod:<0.7 1
  - skill{s=WebLabyrinth} @self ~onTimer:400 ~onHealthMod:0.4to0.7
  - skill{s=SummonBroodGuardians} @self ~onTimer:300 ~onHealthMod:0.4to0.7
  - skill{s=ToxicNova} @self ~onTimer:350 ~onHealthMod:0.4to0.7
  - skill{s=ArachnidAmbush} @target ~onTimer:500 ~onHealthMod:0.4to0.7
  # Phase 3 (40%-15% HP)
  - skill{s=BroodfatherPhase3} @self ~onHealthMod:<0.4 1
  - skill{s=WebStorm} @self ~onTimer:300 ~onHealthMod:0.15to0.4
  - skill{s=SummonBroodQueen} @self ~onTimer:400 ~onHealthMod:0.15to0.4
  - skill{s=PoisonSpit} @target ~onTimer:150 ~onHealthMod:0.15to0.4
  - skill{s=VenomCloud} @self ~onTimer:250 ~onHealthMod:0.15to0.4
  # Phase 4 (15%-0% HP) - Enrage
  - skill{s=BroodfatherPhase4} @self ~onHealthMod:<0.15 1
  - skill{s=BroodfatherEnrage} @self ~onHealthMod:<0.15 1
  - skill{s=WebApocalypse} @self ~onTimer:200 ~onHealthMod:<0.15
  - skill{s=ToxicNova} @self ~onTimer:250 ~onHealthMod:<0.15
  - skill{s=SummonBroodQueen} @self ~onTimer:300 ~onHealthMod:<0.15
  # Death
  - skill{s=BroodfatherT5Death} @self ~onDeath
  Drops:
  - mmoitems{type=MATERIAL;id=TARANTULA_WEB} 64 1.0
  - mmoitems{type=MATERIAL;id=TOXIC_ARROW_POISON} 5-10 1.0
  - mmoitems{type=MATERIAL;id=SPIDER_CATALYST} 2-4 1.0
  - mmoitems{type=MATERIAL;id=FLY_SWATTER_MATERIAL} 1 0.3
  - mmoitems{type=MATERIAL;id=DIGESTED_MOSQUITO} 1 0.05
  - mmoitems{type=MATERIAL;id=GOLD_COIN;amount=5000} 1.0
  - exp 28000
  BossBar:
    Enabled: true
    Title: '&2&l☠ Tarantula Broodfather &a[Tier V]'
    Color: GREEN
    Style: SEGMENTED_20
    Range: 50
