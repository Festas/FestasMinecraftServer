# ===================================================
# Tarantula Broodfather - Spider Slayer (Tiers I-V)
# Spinnen-Slayer mit Netz- und Giftmechaniken
# ===================================================

# ---------------------------------------------------
# Tier I - Kleine Brutmutter (Lv.10, 600 HP)
# ---------------------------------------------------
TarantulaBroodfatherT1:
  Type: CAVE_SPIDER
  Display: '&a&lTarantula Broodfather &2[Tier I]'
  Health: 600
  Damage: 8
  Armor: 2
  Options:
    MovementSpeed: 0.30
    PreventOtherDrops: true
    AlwaysShowName: true
    FollowRange: 30
  Skills:
  - skill{s=WebTrap} @target ~onTimer:400
  - skill{s=SpiderHiss} @self ~onSpawn
  Drops:
  - mmoitems{type=MATERIAL;id=TARANTULA_WEB} 1-3 1.0
  - mmoitems{type=MATERIAL;id=GOLD_COIN} 10-25 1.0
  - exp 250
  BossBar:
    Enabled: true
    Title: '&a&lTarantula Broodfather &2[Tier I]'
    Color: GREEN
    Style: SOLID
    Range: 30

