# ---------------------------------------------------
# Tier IV - Mehrphasen-Verweser (Lv.60, 25000 HP)
# ---------------------------------------------------
RevenantHorrorT4:
  Type: ZOMBIE
  Display: '&c&lRevenant Horror &4&l[Tier IV]'
  Health: 25000
  Damage: 40
  Armor: 15
  Options:
    MovementSpeed: 0.30
    PreventOtherDrops: true
    AlwaysShowName: true
    FollowRange: 45
    PreventSunburn: true
  Equipment:
  - NETHERITE_SWORD{Enchantments:[sharpness:5],Unbreakable:true} HAND
  - NETHERITE_HELMET{Unbreakable:true} HEAD
  - NETHERITE_CHESTPLATE{Unbreakable:true} CHEST
  - NETHERITE_LEGGINGS{Unbreakable:true} LEGS
  - NETHERITE_BOOTS{Unbreakable:true} FEET
  Skills:
  # Phase 1 (100%-60% HP)
  - skill{s=RevenantSlam} @target ~onTimer:180
  - skill{s=RevenantRoar} @self ~onSpawn
  - skill{s=RevenantFrenzy} @target ~onTimer:300
  # Phase 2 (60%-30% HP)
  - skill{s=RevenantPhase2} @self ~onHealthMod:<0.6 1
  - skill{s=SummonRevenantMinions} @self ~onTimer:400 ~onHealthMod:0.3to0.6
  - skill{s=CorpseExplosion} @target ~onTimer:350 ~onHealthMod:0.3to0.6
  - skill{s=UndeadShield} @self ~onTimer:500 ~onHealthMod:0.3to0.6
  # Phase 3 (30%-0% HP)
  - skill{s=RevenantPhase3} @self ~onHealthMod:<0.3 1
  - skill{s=DeathWave} @self ~onTimer:300 ~onHealthMod:<0.3
  - skill{s=SummonRevenantMinions} @self ~onTimer:250 ~onHealthMod:<0.3
  - skill{s=RevenantEnrage} @self ~onHealthMod:<0.15 1
  # Death
  - skill{s=RevenantDeathExplosion} @self ~onDeath
  Drops:
  - mmoitems{type=MATERIAL;id=REVENANT_FLESH} 30-50 1.0
  - mmoitems{type=MATERIAL;id=UNDEAD_CATALYST} 3-5 1.0
  - mmoitems{type=MATERIAL;id=REVENANT_VISCERA} 1-2 0.6
  - mmoitems{type=MATERIAL;id=SCYTHE_BLADE} 1 0.1
  - mmoitems{type=MATERIAL;id=GOLD_COIN} 500-1000 1.0
  - exp 8000
  BossBar:
    Enabled: true
    Title: '&c&lRevenant Horror &4&l[Tier IV]'
    Color: RED
    Style: SEGMENTED_12
    Range: 45

# ---------------------------------------------------
# Tier V - Raid-Boss Verweser (Lv.80, 75000 HP)
# ---------------------------------------------------
RevenantHorrorT5:
  Type: ZOMBIE
  Display: '&4&l☠ Revenant Horror &c&l[Tier V]'
  Health: 75000
  Damage: 60
  Armor: 20
  Options:
    MovementSpeed: 0.32
    PreventOtherDrops: true
    AlwaysShowName: true
    FollowRange: 50
    PreventSunburn: true
    Silent: false
  Equipment:
  - 'NETHERITE_SWORD{Enchantments:[sharpness:7,fire_aspect:2],Unbreakable:true,display:{Lore:["&4Sense des Todes"]}} HAND'
  - NETHERITE_HELMET{Enchantments:[protection:5],Unbreakable:true} HEAD
  - NETHERITE_CHESTPLATE{Enchantments:[protection:5],Unbreakable:true} CHEST
  - NETHERITE_LEGGINGS{Enchantments:[protection:5],Unbreakable:true} LEGS
  - NETHERITE_BOOTS{Enchantments:[protection:5],Unbreakable:true} FEET
  Skills:
  # Spawn
  - skill{s=RevenantT5Spawn} @self ~onSpawn
  # Phase 1 (100%-70% HP)
  - skill{s=RevenantSlam} @target ~onTimer:150
  - skill{s=RevenantFrenzy} @target ~onTimer:250
  - skill{s=CorpseExplosion} @target ~onTimer:400
  # Phase 2 (70%-40% HP)
  - skill{s=RevenantPhase2} @self ~onHealthMod:<0.7 1
  - skill{s=SummonRevenantMinions} @self ~onTimer:300 ~onHealthMod:0.4to0.7
  - skill{s=DeathWave} @self ~onTimer:350 ~onHealthMod:0.4to0.7
  - skill{s=UndeadShield} @self ~onTimer:450 ~onHealthMod:0.4to0.7
  - skill{s=GraveDigger} @target ~onTimer:500 ~onHealthMod:0.4to0.7
  # Phase 3 (40%-15% HP)
  - skill{s=RevenantPhase3} @self ~onHealthMod:<0.4 1
  - skill{s=NecroticStorm} @self ~onTimer:300 ~onHealthMod:0.15to0.4
  - skill{s=SummonRevenantChampions} @self ~onTimer:400 ~onHealthMod:0.15to0.4
  - skill{s=CorpseExplosion} @target ~onTimer:250 ~onHealthMod:0.15to0.4
  # Phase 4 (15%-0% HP) - Enrage
  - skill{s=RevenantPhase4} @self ~onHealthMod:<0.15 1
  - skill{s=RevenantEnrage} @self ~onHealthMod:<0.15 1
  - skill{s=ApocalypseWave} @self ~onTimer:200 ~onHealthMod:<0.15
  - skill{s=NecroticStorm} @self ~onTimer:250 ~onHealthMod:<0.15
  - skill{s=SummonRevenantChampions} @self ~onTimer:300 ~onHealthMod:<0.15
  # Death
  - skill{s=RevenantT5Death} @self ~onDeath
  Drops:
  - mmoitems{type=MATERIAL;id=REVENANT_FLESH} 64 1.0
  - mmoitems{type=MATERIAL;id=UNDEAD_CATALYST} 5-10 1.0
  - mmoitems{type=MATERIAL;id=REVENANT_VISCERA} 2-4 1.0
  - mmoitems{type=MATERIAL;id=SCYTHE_BLADE} 1 0.3
  - mmoitems{type=MATERIAL;id=REVENANT_HEART} 1 0.05
  - mmoitems{type=MATERIAL;id=GOLD_COIN;amount=5000} 1.0
  - exp 25000
  BossBar:
    Enabled: true
    Title: '&4&l☠ Revenant Horror &c[Tier V]'
    Color: RED
    Style: SEGMENTED_20
    Range: 50
