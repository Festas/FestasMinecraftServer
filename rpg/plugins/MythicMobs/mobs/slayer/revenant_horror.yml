# ===================================================
# Revenant Horror - Zombie Slayer (Tiers I-V)
# Untoten-Slayer mit aufsteigenden Schwierigkeitsstufen
# ===================================================

# ---------------------------------------------------
# Tier I - Verweser (Lv.10, 500 HP)
# ---------------------------------------------------
RevenantHorrorT1:
  Type: ZOMBIE
  Display: '&c&lRevenant Horror &4[Tier I]'
  Health: 500
  Damage: 8
  Armor: 2
  Options:
    MovementSpeed: 0.25
    PreventOtherDrops: true
    AlwaysShowName: true
    FollowRange: 30
    PreventSunburn: true
  Equipment:
  - IRON_SWORD HAND
  - LEATHER_HELMET{color=50,0,0,Unbreakable:true} HEAD
  - LEATHER_CHESTPLATE{color=50,0,0,Unbreakable:true} CHEST
  Skills:
  - skill{s=RevenantSlam} @target ~onTimer:300
  - skill{s=RevenantRoar} @self ~onSpawn
  Drops:
  - mmoitems{type=MATERIAL;id=REVENANT_FLESH} 1-3 1.0
  - mmoitems{type=MATERIAL;id=GOLD_COIN} 10-25 1.0
  - exp 200
  BossBar:
    Enabled: true
    Title: '&c&lRevenant Horror &4[Tier I]'
    Color: RED
    Style: SOLID
    Range: 30

# ---------------------------------------------------
# Tier II - Gepanzerter Verweser (Lv.25, 2000 HP)
# ---------------------------------------------------
RevenantHorrorT2:
  Type: ZOMBIE
  Display: '&c&lRevenant Horror &4[Tier II]'
  Health: 2000
  Damage: 15
  Armor: 6
  Options:
    MovementSpeed: 0.27
    PreventOtherDrops: true
    AlwaysShowName: true
    FollowRange: 35
    PreventSunburn: true
  Equipment:
  - IRON_SWORD{Enchantments:[sharpness:3],Unbreakable:true} HAND
  - IRON_HELMET{Unbreakable:true} HEAD
  - IRON_CHESTPLATE{Unbreakable:true} CHEST
  - IRON_LEGGINGS{Unbreakable:true} LEGS
  - IRON_BOOTS{Unbreakable:true} FEET
  Skills:
  - skill{s=RevenantSlam} @target ~onTimer:250
  - skill{s=RevenantRoar} @self ~onSpawn
  - skill{s=RevenantFrenzy} @target ~onTimer:400
  - skill{s=UndeadShield} @self ~onHealthMod:<0.5 1
  Drops:
  - mmoitems{type=MATERIAL;id=REVENANT_FLESH} 5-10 1.0
  - mmoitems{type=MATERIAL;id=UNDEAD_CATALYST} 1 0.5
  - mmoitems{type=MATERIAL;id=GOLD_COIN} 50-100 1.0
  - exp 800
  BossBar:
    Enabled: true
    Title: '&c&lRevenant Horror &4[Tier II]'
    Color: RED
    Style: SEGMENTED_10
    Range: 35

