# ===================================================
# Inferno Demonlord - Blaze Slayer (Tiers I-V)
# Lohen-Slayer mit Feuer- und Lavamechaniken
# ===================================================

# ---------------------------------------------------
# Tier I - Kleiner Feuerdämon (Lv.10, 700 HP)
# ---------------------------------------------------
InfernoDemonlordT1:
  Type: BLAZE
  Display: '&6&lInferno Demonlord &e[Tier I]'
  Health: 700
  Damage: 9
  Armor: 3
  Options:
    MovementSpeed: 0.25
    PreventOtherDrops: true
    AlwaysShowName: true
    FollowRange: 30
  Skills:
  - skill{s=InfernoFireball} @target ~onTimer:300
  - skill{s=DemonRise} @self ~onSpawn
  - skill{s=FlameAura} @self ~onTimer:500
  Drops:
  - mmoitems{type=MATERIAL;id=DERELICT_ASHE} 1-3 1.0
  - mmoitems{type=MATERIAL;id=GOLD_COIN} 12-28 1.0
  - exp 280
  BossBar:
    Enabled: true
    Title: '&6&lInferno Demonlord &e[Tier I]'
    Color: YELLOW
    Style: SOLID
    Range: 30

