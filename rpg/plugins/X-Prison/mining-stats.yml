mining-summary:
  enabled: true
  duration: 60
  message:
  - ' '
  - <yellow><strikethrough>--------------------------------------------------
  - <gold>⛏️ <yellow><bold>Deine Mining-Zusammenfassung
  - '<yellow>➤ <gray>Abgebaute Blöcke: <white>%blocks_mined%'
  - ' '
  - '<gold><bold>⬥ Verdiente Währungen:'
  - '%currencies%'
  - ' '
  - '<gold><bold>⬥ Verzauberungs-Procs:'
  - '%enchants%'
  - <yellow><strikethrough>--------------------------------------------------
  - ' '
  currency-format: '<green>  ➤ <white>%currency%: <yellow>%amount%'
  enchant-format: <aqua>  • <white>%enchant% <gray>x<yellow>%count%
mining-hud:
  enabled: true
  refresh-ticks: 20
  window-seconds: 60
  bps-window-seconds: 1
  show-while-mining-seconds: 5
  parse-papi: true
  format: <light_purple>✦ P%xprison_prestige_id%  <green>%money_per_min%<gray>/Min  <gold>%tokens_per_min%<gray>/Min  <aqua>%gems_per_min%<gray>/Min  <dark_aqua>%blocks_per_sec% <gray>BPS
