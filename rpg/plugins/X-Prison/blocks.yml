lucky-blocks:
  EMERALD_ORE:
    chance: 4.0
    pick-one: true
    rewards:
    - chance: 60.0
      commands:
      - tokens give %player% 750
      messages:
      - <aqua>Lucky Block! <white>+ 750 Token
    - chance: 30.0
      commands:
      - gems give %player% 5
      messages:
      - <green>Lucky Block! <white>+ 5 Edelsteine
    - chance: 10.0
      commands:
      - money give %player% 25000
      messages:
      - <gold>Jackpot! <white>+ $25.000
  DIAMOND_ORE:
    chance: 3.0
    pick-one: true
    rewards:
    - chance: 55.0
      commands:
      - tokens give %player% 1500
      messages:
      - <aqua>Lucky Block! <white>+ 1.500 Token
    - chance: 35.0
      commands:
      - gems give %player% 10
      messages:
      - <green>Lucky Block! <white>+ 10 Edelsteine
    - chance: 10.0
      commands:
      - money give %player% 75000
      messages:
      - <gold>Jackpot! <white>+ $75.000
