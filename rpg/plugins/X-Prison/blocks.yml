messages:
  cooldown: '<yellow>Please wait %time% seconds before executing this command again.'
  no_permission: '<gradient:#FFFF00:#FFD700:#FFA500><bold>BLOCKS</bold></gradient> <dark_gray>»</dark_gray> <red>You do not have permission to view other players'' blocks!'
  your_blocks: '<gradient:#FFFF00:#FFD700:#FFA500><bold>BLOCKS</bold></gradient> <dark_gray>»</dark_gray> <white>You mined <yellow>%blocks%</yellow> <white>Blocks'
  other_blocks: '<gradient:#FFFF00:#FFD700:#FFA500><bold>BLOCKS</bold></gradient> <dark_gray>»</dark_gray> <yellow>%player%</yellow> <white>mined <yellow>%blocks%</yellow> <white>Blocks'
  admin_set_blocks: '<gradient:#FFFF00:#FFD700:#FFA500><bold>BLOCKS</bold></gradient> <dark_gray>»</dark_gray> <white>Successfully set <yellow>%blocks%</yellow>''s <white>blocks to <yellow>%blocks%</yellow>.'
  admin_give_blocks: '<gradient:#FFFF00:#FFD700:#FFA500><bold>BLOCKS</bold></gradient> <dark_gray>»</dark_gray> <white>Successfully given <yellow>%blocks%</yellow> <white>blocks to <yellow>%player%</yellow>.'
  admin_remove_blocks: '<gradient:#FFFF00:#FFD700:#FFA500><bold>BLOCKS</bold></gradient> <dark_gray>»</dark_gray> <white>Successfully removed <yellow>%blocks%</yellow> <white>blocks from <yellow>%player%</yellow>.'
  # Sent when a Lucky Block triggers and the reward that fired has no 'messages' of its own.
  # Placeholders: %player%, %block%
  lucky_block_reward: '<gradient:#FFFF00:#FFD700:#FFA500><bold>LUCKY BLOCK</bold></gradient> <dark_gray>»</dark_gray> <white>You have mined a <yellow><bold>LUCKY BLOCK</bold></yellow> <white>and received a reward!'
# LuckyBlocks - block types that hand out rewards when mined.
#
# A key is either a Bukkit material name (SPONGE, DIAMOND_BLOCK) or a custom block id:
#   nexo:ruby_block      Nexo
#   oraxen:ruby_block    Oraxen
#   myitems:ruby_block   ItemsAdder (its own namespace:id, no plugin prefix)
#
# Per block type:
#   chance    % chance (0-100) that mining the block is lucky at all. Default 100 (every block).
#   pick-one  true  = exactly one reward is granted, drawn at random and weighted by its chance.
#             false = every reward rolls its own chance independently. Default false.
#   rewards   Each entry is either a plain command line (always granted) or a block of:
#               chance    % chance for this reward. Acts as the weight when pick-one is true.
#                         Default 100.
#               commands  Console commands to run. Placeholders: %player%, %block%
#               messages  Lines sent to the player instead of the 'lucky_block_reward' message.
#               sound     Sound played to the player, e.g. ENTITY_PLAYER_LEVELUP
#
# Example - 5% of mined Emerald Blocks are lucky, and each lucky one rolls a single drop:
#
#   EMERALD_BLOCK:
#     chance: 5.0
#     pick-one: true
#     rewards:
#       - chance: 70.0
#         commands:
#           - 'tokens give %player% 1000'
#       - chance: 29.0
#         messages:
#           - '<green>Lucky! <white>You found <green>10 Gems<white>!'
#         commands:
#           - 'gems give %player% 10'
#       - chance: 1.0
#         sound: ENTITY_PLAYER_LEVELUP
#         messages:
#           - '<gold><bold>JACKPOT! <white>A Legendary Key dropped out of that <gold>%block%<white>!'
#         commands:
#           - 'crate give %player% legendary 1'
lucky-blocks:
  SPONGE:
    chance: 100.0
    pick-one: false
    rewards:
      - chance: 100.0
        commands:
          - 'tokens give %player% 1000'
# Interval in minutes for saving player data into database
player_data_save_interval: 10
# Cooldown in seconds to check other player's blocks (/blocks <player>)
blocks-command-cooldown: 5
# Amount of players displayed in top lists
top_players_amount: 10
blocks-top-format:
  - '<yellow><strikethrough>-------<white><strikethrough>-------<yellow><strikethrough>--------<white><strikethrough>--------<yellow><strikethrough>--------<white><strikethrough>-------<yellow><strikethrough>-------'
  - '<yellow><bold>BLOCKS TOP</bold>'
  - '{FOR_EACH_PLAYER} <white><bold>#%position%.</bold> <yellow>%player% <dark_gray>»</dark_gray> <white>%blocks% Blocks'
  - '<yellow><strikethrough>-------<white><strikethrough>-------<yellow><strikethrough>--------<white><strikethrough>--------<yellow><strikethrough>--------<white><strikethrough>-------<yellow><strikethrough>-------'
# Aliases for /blockstop command
blocks-top-command-aliases:
  - blockstop
  - blocktop