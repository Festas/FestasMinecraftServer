      - 2
      - 3
      - 5
      - 6
      - 7
      - 8
    free-label:
      material: LIME_STAINED_GLASS_PANE
      name: <green><bold>KOSTENLOS</bold></green>
      slot: 9
    free-end:
      material: GREEN_STAINED_GLASS_PANE
      name: ' '
      slot: 17
    divider:
      material: BLUE_STAINED_GLASS_PANE
      name: ' '
      slots:
      - 18
      - 26
    premium-label:
      material: MAGENTA_STAINED_GLASS_PANE
      name: <light_purple><bold>PREMIUM</bold></light_purple>
      slot: 27
    premium-end:
      material: PURPLE_STAINED_GLASS_PANE
      name: ' '
      slot: 35
    bottom:
      material: LIGHT_BLUE_STAINED_GLASS_PANE
      name: ' '
      slots:
      - 45
      - 46
      - 47
      - 51
      - 52
      - 53
  tier-item:
    name: <gold>Stufe %level% %status%
    reward-line: <gold>| </gold>%reward%
    lore:
    - '%status_desc%'
    - ''
    - <gold>Informationen
    - '<gold>| </gold><yellow>Spur: <aqua>%type%'
    - ''
    - <gold>Belohnungen
    - '%rewards%'
  status:
    claimed:
      material: MINECART
      label: <aqua>(Abgeholt)
      description: <gray>Diese Belohnung hast du bereits abgeholt.
    claimable:
      material: CHEST_MINECART
      label: <green>(Freigeschaltet)
      description: <yellow>Klicke, um deine Belohnung abzuholen!
    locked:
      material: CHEST_MINECART
      label: <red>(Gesperrt)
      description: <gray>Erreiche diese Stufe, um die Belohnung freizuschalten.
    premium-locked:
      material: CHEST_MINECART
      label: <light_purple>(Premium)
      description: <gray>Schalte den Premium-Pass frei, um diese Belohnung abzuholen.
  progress:
    slots:
    - 19
    - 20
    - 21
    - 22
    - 23
    - 24
    - 25
    reached:
      material: LIME_STAINED_GLASS_PANE
      name: <green>Stufe %level% <dark_gray>- <green>Erreicht
    current:
      material: RED_STAINED_GLASS_PANE
      name: <red>Stufe %level% <dark_gray>- <yellow>In Arbeit
    locked:
      material: GRAY_STAINED_GLASS_PANE
      name: <gray>Stufe %level% <dark_gray>- <gray>Gesperrt
  info:
    slot: 4
    material: KNOWLEDGE_BOOK
    name: '%season%'
    lore:
    - '<gray>Stufe: <yellow>%tier%<gray>/<yellow>%max_tier%'
    - '<gray>Gesamt-XP: <yellow>%xp%'
    - '<gray>XP bis zur nächsten Stufe: <yellow>%xp_next%'
    - '<gray>Premium: <yellow>%premium%'
    - '<gray>XP-Booster: <yellow>%booster%'
  items:
