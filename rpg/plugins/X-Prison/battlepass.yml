gui:
  title: "<gradient:#ff512f:#dd2476><bold>Battle Pass</bold></gradient> <aqua>(Rewards)</aqua>"
  rows: 6
  filler: "BLACK_STAINED_GLASS_PANE"
  # The free track renders across these slots, the premium track across the
  # parallel slots below it. Both lists must be the same length; tiers paginate.
  free-slots: [10, 11, 12, 13, 14, 15, 16]
  premium-slots: [28, 29, 30, 31, 32, 33, 34]
  # Optional, purely cosmetic items: a frame, the track labels and a divider.
  # Each entry is a normal item (material/name/lore/glow) placed at a single 'slot'
  # or a list of 'slots'. Drawn under the tier items, so they never block clicks.
  decorations:
    top:
      material: LIGHT_BLUE_STAINED_GLASS_PANE
      name: " "
      slots: [0, 1, 2, 3, 5, 6, 7, 8]
    free-label:
      material: LIME_STAINED_GLASS_PANE
      name: "<green><bold>FREE TRACK"
      slot: 9
    free-end:
      material: GREEN_STAINED_GLASS_PANE
      name: " "
      slot: 17
    divider:
      material: BLUE_STAINED_GLASS_PANE
      name: " "
      slots: [18, 26]
    premium-label:
      material: MAGENTA_STAINED_GLASS_PANE
      name: "<light_purple><bold>PREMIUM TRACK"
      slot: 27
    premium-end:
      material: PURPLE_STAINED_GLASS_PANE
      name: " "
      slot: 35
    bottom:
      material: LIGHT_BLUE_STAINED_GLASS_PANE
      name: " "
      slots: [45, 46, 47, 51, 52, 53]
  # Every tier tile's NAME and LORE come from this shared template, so all levels look
  # identical; the tile icon (material/glow/model) still comes from each tier's own
  # 'display'. Placeholders: %level%, %type% (Free Reward/Premium Reward), %status%,
  # %status_desc%, %tier%, %required_xp%, %cumulative_xp%. The %rewards% line expands
  # into one line per reward (from that tier's rewards.messages), each wrapped with
  # 'reward-line' (%reward%). Remove this whole 'tier-item' block to fall back to the
  # per-tier display name/lore instead.
  tier-item:
    name: "<gold>Level %level% %status%"
    reward-line: "<gold>| </gold>%reward%"
    lore:
      - "%status_desc%"
      - ""
      - "<gold>Information"
      - "<gold>| </gold><yellow>Type: <aqua>%type%"
      - ""
      - "<gold>Rewards"
      - "%rewards%"
  # %status% is the short label shown in the tile name; %status_desc% is the description
  # line in the lore. One entry per tier state. The optional 'material' overrides each tier's
  # display icon for tiles in this state (omit it to keep the tier's own artwork) - here it
  # shows a Minecart with Chest while a reward is unclaimed and an empty Minecart once claimed.
  status:
    claimed:
      material: MINECART
      label: "<aqua>(Claimed)"
      description: "<gray>You have already claimed this reward."
    claimable:
      material: CHEST_MINECART
      label: "<green>(Unlocked)"
      description: "<yellow>Click to claim your reward!"
    locked:
      material: CHEST_MINECART
      label: "<red>(Locked)"
      description: "<gray>Reach this level to unlock this reward."
    premium-locked:
      material: CHEST_MINECART
      label: "<light_purple>(Premium)"
      description: "<gray>Unlock the premium pass to claim this reward."
  # Dynamic progress track: one pane per tier column on the current page. 'reached' = the
  # player has passed that tier, 'current' = the very next tier to reach, 'locked' =
  # further away. Keep 'slots' aligned under the tier columns. %level% is available.
  progress:
    slots: [19, 20, 21, 22, 23, 24, 25]
    reached:
      material: LIME_STAINED_GLASS_PANE
      name: "<green>Level %level% <dark_gray>- <green>Reached"
    current:
      material: RED_STAINED_GLASS_PANE
      name: "<red>Level %level% <dark_gray>- <yellow>In progress"
    locked:
      material: GRAY_STAINED_GLASS_PANE
      name: "<gray>Level %level% <dark_gray>- <gray>Locked"
  info:
    slot: 4
    material: KNOWLEDGE_BOOK
    name: "%season%"
    lore:
      - "<gray>Tier: <yellow>%tier%<gray>/<yellow>%max_tier%"
      - "<gray>Total XP: <yellow>%xp%"
      - "<gray>XP to next tier: <yellow>%xp_next%"
      - "<gray>Premium: <yellow>%premium%"
      - "<gray>XP Booster: <yellow>%booster%"
  items:
    close:
      slot: 49
      material: BARRIER
      name: "<red>Close"
    prev-page:
      slot: 48
      material: ARROW
      name: "<yellow>Previous Page"
    next-page:
      slot: 50
      material: ARROW
      name: "<yellow>Next Page"
