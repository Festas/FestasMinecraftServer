levels:
  '1':
    display_name: '&8[&6&lSpitzhacke von &f&l%player%&8]'
  '25':
    rewards:
    - tokens give %player% 1000
  '50':
    rewards:
    - tokens give %player% 2500
    - gems give %player% 5
  '75':
    rewards:
    - tokens give %player% 5000
    - gems give %player% 10
  '100':
    rewards:
    - tokens give %player% 10000
    - gems give %player% 20
  '150':
    rewards:
    - tokens give %player% 20000
    - gems give %player% 35
  '200':
    rewards:
    - tokens give %player% 35000
    - gems give %player% 50
  '250':
    rewards:
    - tokens give %player% 50000
    - gems give %player% 75
  '300':
    rewards:
    - tokens give %player% 100000
    - gems give %player% 150
    - broadcast &6%player% &7hat die maximale Spitzhacken-Stufe erreicht!
levels-formula:
  formula: 40 * (level - 1)^2
  max-level: 300
  display-name: '&8[&6&lSpitzhacke von &f&l%player%&8]'
exp-sources:
  manual: 1.0
  area-enchants: 1.0
  autominer: 1.0
  api: 1.0
exp-per-block:
  default: 1
  COAL_ORE: 2
  COPPER_ORE: 2
  IRON_ORE: 3
  GOLD_ORE: 4
  REDSTONE_ORE: 5
  LAPIS_ORE: 5
  EMERALD_ORE: 8
  DIAMOND_ORE: 10
  ANCIENT_DEBRIS: 18
progress-bar-delimiter: ':'
progress-bar-length: 20
show-pickaxe-level-progress-on-exp-bar: true
messages:
  pickaxe-level-up: <yellow><bold>SPITZHACKE</bold></yellow> <dark_gray>»</dark_gray> <white>Deine Spitzhacke hat gerade <yellow>Stufe %level%</yellow> erreicht!
  pickaxe-progress: '<yellow><bold>SPITZHACKE</bold></yellow> <dark_gray>»</dark_gray> <gray>Fortschritt: <yellow>%exp%</yellow><gray>/<yellow>%exp_required%</yellow> XP'
  no-permission: <yellow><bold>SPITZHACKE</bold></yellow> <dark_gray>»</dark_gray> <red>Dafür hast du keine Berechtigung.
  admin-usage: '<yellow><bold>SPITZHACKE</bold></yellow> <dark_gray>»</dark_gray> <gray>Nutzung: <yellow>/pickaxelevel set <spieler> <stufe></yellow>'
  admin-set: <yellow><bold>SPITZHACKE</bold></yellow> <dark_gray>»</dark_gray> <white>Die Spitzhacke von <yellow>%player%</yellow> <white>wurde auf <yellow>Stufe %level%</yellow> gesetzt.
  player-not-online: <yellow><bold>SPITZHACKE</bold></yellow> <dark_gray>»</dark_gray> <red>Der Spieler <yellow>%player%</yellow> <red>ist nicht online.
  invalid-level: <yellow><bold>SPITZHACKE</bold></yellow> <dark_gray>»</dark_gray> <red>Die Spitzhacken-Stufe <yellow>%level%</yellow> existiert nicht.
  no-pickaxe-found: <yellow><bold>SPITZHACKE</bold></yellow> <dark_gray>»</dark_gray> <red>Der Spieler <yellow>%player%</yellow> <red>hat keine Spitzhacke im Inventar.
