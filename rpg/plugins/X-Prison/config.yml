# Should plugin show debug messages?
debug-mode: false
# Should plugin log all SQL queries?
debug-sql-queries: false
# Should plugin use MiniMessage for all messages/texts/prefixes ?
#
# You normally do not need to touch this. All configs are written in MiniMessage and are rendered
# correctly on every server:
#   - Paper / Folia : rendered with the server's Adventure library - gradients, hover and click all work.
#   - Spigot / Bukkit : automatically rendered down to classic colour codes. Colours, gradients, hex
#     and formatting still display; only hover and click text cannot be shown.
#
# Set this to false to force the classic colour-code renderer even on Paper - useful only if a proxy
# or client-side mod mangles the modern chat format.
use-minimessage: true
# Player feedback sounds played on command outcomes (rankup, prestige, purchases,
# admin actions, errors, etc.). Set command-sounds to false to disable all of them.
feedback:
  command-sounds: true
  sounds:
    # Played on successful actions (rankup, prestige, purchase, admin success, ...)
    success: ENTITY_PLAYER_LEVELUP
    # Played on failures (not enough currency, invalid input, no permission, ...)
    error: BLOCK_NOTE_BLOCK_BASS
    # Played on neutral/informational actions (toggles, listings, ...)
    info: BLOCK_NOTE_BLOCK_PLING
    # Played when turning a menu page with the previous/next arrows.
    click: UI_BUTTON_CLICK
# How large numbers are abbreviated in short-format displays and parsed from command input
# (e.g. /<currency> give <player> 10Q). One suffix per 10^3 tier, smallest first.
# Case-sensitive - note q and Q are different tiers:
#   k = 10^3, M = 10^6, B = 10^9, T = 10^12, q = 10^15, Q = 10^18,
#   QT = 10^21, S = 10^24, SP = 10^27, O = 10^30, N = 10^33, D = 10^36
number-format:
  suffixes:
  - k
  - M
  - B
  - T
  - q
  - Q
  - QT
  - S
  - SP
  - O
  - N
  - D
# Should plugin send your server data to bStats ? (https://bstats.org/)
enable-metrics: false
# Database type (H2, SQLite, MySQL)
database_type: H2
# MySQL connection details
mysql:
  host: localhost
  port: 3306
  database: dbName
  username: dbUser
  password: dbPass
  # Connect using SSL/TLS. Leave false for a local/trusted database.
  use-ssl: false
  # Server timezone used by the JDBC driver. Use a valid tz id (e.g. UTC, Europe/Berlin).
  timezone: UTC
# Connection properties
# HikariCP database connection properties, please refer to https://github.com/brettwooldridge/HikariCP#gear-configuration-knobs-baby for more information
connection_properties:
  connection_timeout: 60000
  idle_timeout: 600000
  keep_alive_time: 0
  max_life_time: 1800000
  # Connections kept warm when idle. Note: SQLite always uses a single connection regardless of these values.
  minimum_idle: 2
  maximum_pool_size: 10
  # Log a warning if a connection is held longer than this many ms (0 disables). Helps catch leaks.
  leak_detection_threshold: 30000
  connection_test_query: SELECT 1
  character_encoding: utf8
# Enabling / Disabling of specific modules
modules:
  currencies: true
  blocks: true
  ranks: true
  prestiges: true
  rebirths: true
  multipliers: true
  enchants: true
  autosell: true
  autominer: true
  pickaxe_levels: true
  pickaxe_skins: true
  pickaxe_quality: true
  gangs: true
  mines: true
  bombs: true
  history: true
  mining_stats: true
  battlepass: true
  quests: true
  dailyrewards: true
# List of supported pickaxes by UPC Enchants
supported-pickaxes:
- DIAMOND_PICKAXE
# Aliases for main command
main-command-aliases:
- xprison
- prison
# Plugin prefix, usable via PAPI %xprison_prefix%, can be used across all messages
prefix: '<dark_gray>[</dark_gray><gradient:#f7b733:#fc4a1a><bold>X-PRISON</bold></gradient><dark_gray>]</dark_gray> <gray>»</gray> '
# How often (in minutes) all online player data is saved to the database as a safety checkpoint.
# Set to 0 to disable the periodic save entirely.
player-data-save-interval: 5
# Set to true once initial setup has been completed via /xprison setup
setup-completed: true
# Lets a menu be opened on another player's screen, which is how NPC plugins (Citizens, ZNPCs, ...)
# hook into X-Prison menus - point the NPC at a console command such as 'blackmarket open %player%'.
# Commands without sub-commands take the player directly:  /rankgui <player>, /daily <player>
# Commands with sub-commands use the 'open' keyword:        /battlepass open <player>, /gang open <player>
# The menu opens for the named player using their own data, and stays fully interactive for them.
# Requires the 'xprison.menu.other' permission - the console always has it, so NPCs work out of the box.
# Setting open-for-others to false disables the feature and answers with the no_permission message.
menus:
  open-for-others: true
  messages:
    # Sent when the console runs a menu command without naming a player.
    players_only: <gradient:#FFFF00:#FFD700:#FFA500><bold>PRISON</bold></gradient> <dark_gray>»</dark_gray> <white>This command can only be used by a player - name a player to open the menu for them.
    # Sent when the sender may not open menus for other players.
    no_permission: <gradient:#FFFF00:#FFD700:#FFA500><bold>PRISON</bold></gradient> <dark_gray>»</dark_gray> <white>You do not have permission to open menus for other players!
    # Sent when the named player is not online. Placeholders: %player%
    player_not_online: <gradient:#FFFF00:#FFD700:#FFA500><bold>PRISON</bold></gradient> <dark_gray>»</dark_gray> <white>Player <yellow>%player% <white>is not online!
    # Confirmation sent to a player who opened a menu for somebody else. Placeholders: %player%, %menu%
    # The console never receives this, so NPC clicks do not spam the log. Leave empty to disable.
    opened_for: <gradient:#FFFF00:#FFD700:#FFA500><bold>PRISON</bold></gradient> <dark_gray>»</dark_gray> <white>Opened the <yellow>%menu% <white>menu for <yellow>%player%<white>.
