debug-mode: false
debug-sql-queries: false
use-minimessage: true
feedback:
  command-sounds: true
  sounds:
    success: ENTITY_PLAYER_LEVELUP
    error: BLOCK_NOTE_BLOCK_BASS
    info: BLOCK_NOTE_BLOCK_PLING
    click: UI_BUTTON_CLICK
number-format:
  suffixes:
  - k
  - M
  - B
  - T
  - q
  - Q
  - QT
  - S
  - SP
  - O
  - N
  - D
enable-metrics: false
database_type: H2
mysql:
  host: localhost
  port: 3306
  database: dbName
  username: dbUser
  password: dbPass
  use-ssl: false
  timezone: UTC
connection_properties:
  connection_timeout: 60000
  idle_timeout: 600000
  keep_alive_time: 0
  max_life_time: 1800000
  minimum_idle: 2
  maximum_pool_size: 10
  leak_detection_threshold: 30000
  connection_test_query: SELECT 1
  character_encoding: utf8
modules:
  currencies: true
  blocks: true
  ranks: true
  prestiges: true
  rebirths: true
  multipliers: true
  enchants: true
  autosell: true
  autominer: true
  pickaxe_levels: true
  pickaxe_skins: true
  pickaxe_quality: true
  gangs: true
  mines: true
  bombs: true
  history: true
  mining_stats: true
  battlepass: true
  quests: true
  dailyrewards: true
supported-pickaxes:
- DIAMOND_PICKAXE
main-command-aliases:
- xprison
- prison
prefix: '<dark_gray>[</dark_gray><gradient:#f7b733:#fc4a1a><bold>PRISON</bold></gradient><dark_gray>]</dark_gray> <gray>»</gray> '
player-data-save-interval: 5
setup-completed: true
menus:
  open-for-others: true
  messages:
    players_only: <gradient:#FFFF00:#FFD700:#FFA500><bold>PRISON</bold></gradient> <dark_gray>»</dark_gray> <white>Dieser Befehl kann nur von einem Spieler genutzt werden – gib einen Spielernamen an, um das Menü für ihn zu öffnen.
    no_permission: <gradient:#FFFF00:#FFD700:#FFA500><bold>PRISON</bold></gradient> <dark_gray>»</dark_gray> <white>Du darfst keine Menüs für andere Spieler öffnen!
    player_not_online: <gradient:#FFFF00:#FFD700:#FFA500><bold>PRISON</bold></gradient> <dark_gray>»</dark_gray> <white>Der Spieler <yellow>%player%</yellow> <white>ist nicht online!
    opened_for: <gradient:#FFFF00:#FFD700:#FFA500><bold>PRISON</bold></gradient> <dark_gray>»</dark_gray> <white>Das Menü <yellow>%menu%</yellow> <white>wurde für <yellow>%player%</yellow> geöffnet.
