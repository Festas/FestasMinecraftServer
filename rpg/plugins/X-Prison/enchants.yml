      - ' '
      - '<italic:false><gray><italic>(( Click to go forward ))</italic></gray>'
  # How many levels each click adds in the ADMIN /createpickaxe menu.
  # Keys are click types (LEFT, RIGHT, MIDDLE, SHIFT_RIGHT); values are the number of levels to add.
  admin-click-amounts:
    LEFT: 1
