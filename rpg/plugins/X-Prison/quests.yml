daily:
  count: 3
weekly:
  count: 2
rotation:
  timezone: ''
  daily-reset-hour: 0
  weekly-reset-day: MONDAY
  weekly-reset-hour: 0
auto-claim: false
notifications:
  actionbar: true
reroll:
  enabled: false
  cost-currency: gems
  cost: 50
  cooldown-seconds: 3600
  allow-weekly: false
scaling:
  enabled: false
  source: RANK
  permission-weights:
    xprison.quests.scale.1: 1
    xprison.quests.scale.2: 2
    xprison.quests.scale.3: 3
messages:
  prefix: '<gradient:#f7971e:#ffd200><bold>QUESTS</bold> <dark_gray>»</dark_gray></gradient> '
  quest-completed: <green>Du hast die Quest <yellow>%quest%</yellow><green> abgeschlossen! Hole die Belohnung mit <yellow>/quests</yellow> ab.
  reward-claimed: <green>Du hast die Belohnung für <yellow>%quest%</yellow><green> abgeholt!
  reward-not-completed: <red>Du hast <yellow>%quest%</yellow> <red>noch nicht abgeschlossen.
  reward-already-claimed: <red>Diese Quest-Belohnung hast du bereits abgeholt.
  rerolled: <green>Deine <yellow>%category%</yellow><green>-Quests wurden neu gewürfelt.
  no-permission: <red>Dafür hast du keine Berechtigung.
  reroll-cost-fail: <red>Du brauchst <white>%cost% %currency%</white><red>, um deine Quests neu zu würfeln.
  reroll-cooldown: <red>Du kannst erst in <white>%time%</white><red> erneut würfeln.
effects:
  quest-complete:
    title:
      enabled: true
      title: <gradient:#f7971e:#ffd200><bold>QUEST ABGESCHLOSSEN</bold></gradient>
      subtitle: <white>%quest%</white> <gray>- hole die Belohnung mit <yellow>/quests</yellow> ab
      fade-in: 1
      stay: 3
      fade-out: 1
    sound:
      enabled: true
      sound: ENTITY_PLAYER_LEVELUP
      volume: 1.0
      pitch: 1.0
  claim:
    sound:
      enabled: true
      sound: ENTITY_EXPERIENCE_ORB_PICKUP
      volume: 1.0
      pitch: 1.0
  milestone:
    title:
      enabled: false
      title: ''
      subtitle: ''
      fade-in: 1
      stay: 2
      fade-out: 1
    sound:
      enabled: false
      sound: BLOCK_NOTE_BLOCK_PLING
      volume: 0.5
      pitch: 1.5
quests:
  daily_mine_blocks:
    type: MINE_BLOCKS
    category: DAILY
    display-name: Täglicher Bergmann
    target: 2500
    weight: 10
    pass-xp: 150
    scaling:
      target-formula: target * (1 + 0.25 * scale)
      reward-multiplier-formula: 1 + 0.25 * scale
    display:
      material: IRON_PICKAXE
      name: <yellow>Täglicher Bergmann
      lore:
      - <gray>Baue <white>%target%</white> <gray>Blöcke ab.
      - ''
      - '<gray>Fortschritt: <white>%progress%</white><gray>/<white>%target%</white> <gray>(<white>%percent%</white><gray>)'
      - '%bar%'
      - ''
      - '%status%'
    rewards:
      commands:
      - money give %player% 25000
      messages:
      - <green>+ $25,000 <gray>(goal scaled x%multiplier% for your rank)
      sound: ENTITY_PLAYER_LEVELUP
  daily_earn_tokens:
