gui:
  title: <gradient:#2ecc71:#27ae60><bold>PRESTIGE</bold></gradient>
  rows: 6
  filler: BLACK_STAINED_GLASS_PANE
  prestige-slots:
  - 10
  - 11
  - 12
  - 13
  - 14
  - 15
  - 16
  - 19
  - 20
  - 21
  - 22
  - 23
  - 24
  - 25
  - 28
  - 29
  - 30
  - 31
  - 32
  - 33
  - 34
  prestige:
    owned:
      material: LIME_STAINED_GLASS_PANE
      name: '%prefix% <dark_gray>(<green>Erreicht</green>)'
      lore:
      - <gray>Prestige <white>#%id%
      - <green>✔ Dieses Prestige hast du bereits erreicht.
    current:
      material: NETHER_STAR
      glow: true
      name: '%prefix% <dark_gray>(<yellow>Aktuell</yellow>)'
      lore:
      - <gray>Prestige <white>#%id%
      - <yellow>➤ Das ist dein aktuelles Prestige.
    next:
      material: EMERALD
      name: '%prefix% <dark_gray>(<green>Nächstes</green>)'
      lore:
      - <gray>Prestige <white>#%id%
      - '<gray>Kosten: <gold>%cost% <gray>%currency%'
      - ' '
      - <yellow>Klicke zum Prestigen!
    locked:
      material: RED_STAINED_GLASS_PANE
      name: '%prefix% <dark_gray>(<red>Gesperrt</red>)'
      lore:
      - <gray>Prestige <white>#%id%
      - '<gray>Kosten: <gold>%cost% <gray>%currency%'
      - <red>🔒 Prestige zum Freischalten erforderlich.
  unlimited:
    current:
      slot: 11
      material: NETHER_STAR
      glow: true
      name: <yellow><bold>Aktuelles Prestige</bold></yellow>
      lore:
      - <gray>Du bist aktuell <white>%prefix%
      - '<gray>Prestige-Stufe: <white>%id%'
    next:
      slot: 13
      material: EMERALD
      name: <green><bold>Nächstes Prestige</bold></green>
      lore:
      - '<gray>Nächstes: <white>%prefix%'
      - '<gray>Kosten: <gold>%cost% <gray>%currency%'
      - ' '
      - <yellow>Klicke zum Prestigen!
    max:
      slot: 13
      material: BARRIER
      name: <red><bold>Maximales Prestige</bold></red>
      lore:
      - <gray>Du hast bereits das höchste Prestige erreicht!
    progress:
      slot: 15
      bar-length: 20
      bar-delimiter: '|'
      material: EXPERIENCE_BOTTLE
      name: <aqua><bold>Fortschritt</bold></aqua>
      lore:
      - '<gray>Fortschritt bis zum nächsten Prestige:'
      - '%bar%'
      - <white>%progress%%
  items:
    info:
      slot: 4
      material: BOOK
      name: <green><bold>Prestige</bold></green>
      lore:
      - <gray>Prestige setzt deinen Rang zurück,
      - <gray>gibt dir aber starke Dauerboni
      - <gray>und bessere Belohnungen.
    close:
      slot: 49
      material: BARRIER
      name: <red><bold>Schließen</bold></red>
      lore: []
    prev-page:
      slot: 48
      material: ARROW
      name: <yellow>« Vorherige Seite</yellow>
      lore: []
    next-page:
      slot: 50
      material: ARROW
      name: <yellow>Nächste Seite »</yellow>
      lore: []
