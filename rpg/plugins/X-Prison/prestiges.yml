player_data_save_interval: 10
reset_rank_after_prestige: true
top_players_amount: 10
currency: money
auto-prestige: false
auto-prestige-interval: 2
prestige-title:
  enabled: true
  title: '&6&lPRESTIGE'
  subtitle: '&aNeues Prestige: &e%prestige%'
  fade-in: 1
  stay: 3
  fade-out: 1
prestige-sound:
  enabled: true
  sound: UI_TOAST_CHALLENGE_COMPLETE
  volume: 1.0
  pitch: 1.0
prestige-top-format:
- <yellow><strikethrough>-------<white><strikethrough>-------<yellow><strikethrough>--------<white><strikethrough>--------<yellow><strikethrough>--------<white><strikethrough>-------<yellow><strikethrough>-------
- <yellow><bold>PRESTIGE TOP
- '{FOR_EACH_PLAYER} <white><bold>#%position%. <yellow>%player% <dark_gray>» <white>%prestige% Prestige'
- <yellow><strikethrough>-------<white><strikethrough>-------<yellow><strikethrough>--------<white><strikethrough>--------<yellow><strikethrough>--------<white><strikethrough>-------<yellow><strikethrough>-------
unlimited_prestiges:
  # Endloses Prestige nach P10 aktiviert (Ascension-Loop). P0-P10 behalten ihre definierten Kosten/Prefixe/Rewards.
  enabled: true
  max_prestige: 1000000
  # Startkosten des ersten Ascension-Prestiges (setzt die Kurve jenseits P10=18B geometrisch fort, ~1.6x).
  prestige_cost: 28800000000
  increase_cost:
    enabled: true
    # Geometrische Kostenskalierung pro Ascension-Stufe: cost(n) = prestige_cost * 1.6^(n-11).
    increase_cost_by: 1.6
  prefix: <gradient:#8E2DE2:#4A00E0><bold>P%prestige%</bold></gradient>
  # Steter Ertrag bei JEDEM Ascension-Prestige (> P10) - haelt das Endgame endlos investierbar.
  rewards-per-prestige:
    enabled: true
    rewards:
    - tokens give %player% 250000
    - gems give %player% 100
  # Ascension-Meilensteine: dauerhafte Multiplier-Freischaltung (xprison.multiplier.ascN) + Bonus-Currency.
  rewards:
    25:
      - lp user %player% permission set xprison.multiplier.asc1 true
      - tokens give %player% 2500000
      - gems give %player% 1500
      - broadcast &d%player% &7hat &5Ascension I &7(Prestige 25) erreicht!
    50:
      - lp user %player% permission set xprison.multiplier.asc2 true
      - tokens give %player% 6000000
      - gems give %player% 3500
      - broadcast &d%player% &7hat &5Ascension II &7(Prestige 50) erreicht!
    100:
      - lp user %player% permission set xprison.multiplier.asc3 true
      - tokens give %player% 15000000
      - gems give %player% 8000
      - broadcast &d%player% &7hat &5Ascension III &7(Prestige 100) erreicht!
    250:
      - lp user %player% permission set xprison.multiplier.asc4 true
      - tokens give %player% 40000000
      - gems give %player% 20000
      - broadcast &d%player% &7hat &5Ascension IV &7(Prestige 250) erreicht!
    500:
      - lp user %player% permission set xprison.multiplier.asc5 true
      - tokens give %player% 100000000
      - gems give %player% 50000
      - broadcast &d%player% &7hat &5Ascension V &7(Prestige 500) erreicht!
    1000:
      - lp user %player% permission set xprison.multiplier.asc6 true
      - tokens give %player% 250000000
      - gems give %player% 125000
      - broadcast &d%player% &7hat &5Ascension VI &7(Prestige 1000) erreicht!
