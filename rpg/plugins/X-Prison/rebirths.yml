# Title shown to player on rebirth. Supports MiniMessage. Placeholders: %rebirth% (new rebirth ID), %rebirth_prefix% (new rebirth prefix)
rebirth-title:
  enabled: true
  title: '&c&lREBIRTH'
  subtitle: '&aDu bist jetzt &eRebirth %rebirth%'
  fade-in: 1
  stay: 3
  fade-out: 1
# Sound played to player on rebirth. sound must be a valid Bukkit Sound enum name.
rebirth-sound:
  enabled: true
  sound: UI_TOAST_CHALLENGE_COMPLETE
  volume: 1.0
  pitch: 1.0
rebirths:
  '0':
    prefix: <gradient:#FFFF00:#FFD700:#FFA500><bold>R0</bold></gradient>
    requirements:
      - type: rank
        enabled: false
        value: 1
      - type: prestige
        enabled: false
        value: 0
      - type: currency
        enabled: false
        currency: money
        value: 10000000.0
      - type: currency
        enabled: false
        currency: tokens
        value: 10000000.0
    rewards:
      commands:
        - lp user %player% permission set xprison.rebirth0 true
  # The current rank and prestige caps are both 10, so higher rebirths keep the
  # same cap gate and scale difficulty through much steeper currency requirements.
  '1':
    prefix: <gradient:#FFFF00:#FFD700:#FFA500><bold>R1</bold></gradient>
    requirements:
      - type: rank
        enabled: true
        value: 10
      - type: prestige
        enabled: true
        value: 10
      - type: currency
        enabled: true
        currency: money
        value: 25000000000
      - type: currency
        enabled: true
        currency: tokens
        value: 1500000
    rewards:
      commands:
        - lp user %player% permission set xprison.rebirth1 true
        - lp user %player% permission set xprison.multiplier.r1 true
        - tokens give %player% 250000
        - gems give %player% 250
  '2':
    prefix: <gradient:#ffefba:#ffffff><bold>R2</bold></gradient>
    requirements:
      - type: rank
        enabled: true
        value: 10
      - type: prestige
        enabled: true
        value: 10
      - type: currency
        enabled: true
        currency: money
        value: 50000000000
      - type: currency
        enabled: true
        currency: tokens
        value: 3000000
    rewards:
      commands:
        - lp user %player% permission set xprison.rebirth2 true
        - lp user %player% permission set xprison.multiplier.r2 true
        - tokens give %player% 400000
        - gems give %player% 400
  '3':
    prefix: <gradient:#f7971e:#ffd200><bold>R3</bold></gradient>
    requirements:
      - type: rank
        enabled: true
        value: 10
      - type: prestige
        enabled: true
        value: 10
      - type: currency
        enabled: true
        currency: money
        value: 100000000000
      - type: currency
        enabled: true
        currency: tokens
        value: 6000000
    rewards:
      commands:
        - lp user %player% permission set xprison.rebirth3 true
        - lp user %player% permission set xprison.multiplier.r3 true
        - tokens give %player% 600000
        - gems give %player% 600
  '4':
    prefix: <gradient:#12c2e9:#c471ed><bold>R4</bold></gradient>
    requirements:
      - type: rank
        enabled: true
        value: 10
      - type: prestige
        enabled: true
        value: 10
      - type: currency
        enabled: true
        currency: money
        value: 250000000000
      - type: currency
        enabled: true
        currency: tokens
        value: 12000000
    rewards:
      commands:
        - lp user %player% permission set xprison.rebirth4 true
        - lp user %player% permission set xprison.multiplier.r4 true
