# ---------------------------------------------------------------------------
# Rebirths GUI (opened with /rebirths). Fully configurable.
# Each rebirth is drawn using one of the four state templates under gui.rebirth
# (owned/current/next/locked). The next/locked templates may include a
# '%requirements%' lore line which expands into one line per enabled
# requirement, coloured met/unmet.
# Item placeholders: %id%, %prefix% / %rebirth%
# ---------------------------------------------------------------------------
gui:
  title: '<gradient:#FFD700:#FFA500><bold>REBIRTHS</bold></gradient>'
  rows: 6
  filler: BLACK_STAINED_GLASS_PANE
  rebirth-slots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34]
  # Wrappers applied to each requirement line in the %requirements% expansion.
  requirement-met: '<green>✔ <gray>%requirement%'
  requirement-unmet: '<red>✖ <gray>%requirement%'
  # How each requirement type is described. %value% is the rank/prestige prefix
  # or required amount; %currency% is the currency name (currency type only).
  requirement-format:
    rank: 'Rang %value%'
    prestige: 'Prestige %value%'
    currency: '%value% %currency%'
  rebirth:
    owned:
      material: LIME_STAINED_GLASS_PANE
      name: '%prefix% <dark_gray>(<green>Erreicht</green>)'
      lore:
        - '<gray>Rebirth <white>#%id%'
        - '<green>✔ Diesen Rebirth hast du bereits abgeschlossen.'
    current:
      material: NETHER_STAR
      glow: true
      name: '%prefix% <dark_gray>(<yellow>Aktuell</yellow>)'
      lore:
        - '<gray>Rebirth <white>#%id%'
        - '<yellow>➤ Das ist dein aktueller Rebirth.'
    next:
      material: BEACON
      name: '%prefix% <dark_gray>(<gold>Nächster</gold>)'
      lore:
        - '<gray>Rebirth <white>#%id%'
        - ' '
        - '<gray>Voraussetzungen:'
        - '%requirements%'
        - ' '
        - '<yellow>Klicke für den Rebirth!'
    locked:
      material: RED_STAINED_GLASS_PANE
      name: '%prefix% <dark_gray>(<red>Gesperrt</red>)'
      lore:
        - '<gray>Rebirth <white>#%id%'
        - ' '
        - '<gray>Voraussetzungen:'
        - '%requirements%'
        - '<red>🔒 Rebirth zum Freischalten nötig.'
  items:
    info:
      slot: 4
      material: BOOK
      name: '<gold><bold>Rebirths'
      lore:
        - '<gray>Ein Rebirth setzt Rang und Prestige'
        - '<gray>zurück und gibt dir dauerhafte Belohnungen.'
        - ' '
        - '<gray>Nutze <yellow>/rebirth <gray>oder klicke'
        - '<gray>unten auf den nächsten Rebirth.'
    close:
      slot: 49
      material: BARRIER
      name: '<red><bold>Schließen'
      lore: []
    prev-page:
      slot: 48
      material: ARROW
      name: '<yellow>« Vorherige Seite'
      lore: []
    next-page:
      slot: 50
      material: ARROW
      name: '<yellow>Nächste Seite »'
      lore: []