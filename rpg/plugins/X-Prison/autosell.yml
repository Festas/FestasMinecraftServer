# Should be autosell enabled automatically on player join?
enable-autosell-automatically: true

# Should blocks be smelted when mined? Example: STONE -> COBBLESTONE, IRON_ORE -> IRON_INGOT
# Applies to every drop that lands in the player's inventory, including blocks broken by area
# enchants (Explosive, Jackhammer, Nuke, Layer, ...) and by Bombs.
# It does not change AutoSell earnings: sold blocks are priced by block type and never become items,
# so a player with AutoSell on is unaffected.
auto-smelt:
  enabled: false
  map:
    STONE: COBBLESTONE
# IRON_ORE: IRON_INGOT

# Notification when player has full inventory
inventory_full_notification:
  # Should players be notified if they have full inventory?
  enabled: true
  title:
    # Set enabled: false to fall back to the chat message below instead
    enabled: true
    text: '&e&lInventar voll!'
    subtitle: '&7Nutze /sellall zum Verkaufen'
    fade-in: 1
    stay: 3
    fade-out: 1
  chat: <red><bold>(!)</bold> <yellow>Dein Inventar ist voll! Nutze /sellall zum Verkaufen.
# Live action bar showing earnings while auto-selling / using /sellall.
# Earnings are batched and shown once every flush-ticks to avoid spam while mining.
earnings-actionbar:
  enabled: false
  # %price% = total earned this mining session, %currency% = currency display name
  format: <green>+ %price% %currency%
  # How often (in server ticks, 20 = 1s) the action bar is refreshed
  flush-ticks: 15
  # The action bar shows a running total for the current mining "session". When the player
  # stops mining for this many seconds, the session resets back to 0.
  reset-after-seconds: 3
# GOLD_ORE: 250.0
# Per region sell prices defined here
per-region-sell-prices: {}
# Currency this module works with (eg. Money, Tokens, Gems)
currency: money
