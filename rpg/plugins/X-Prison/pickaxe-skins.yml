main-command-aliases:
- skins
- pickskin
- skin
messages:
  no-permission: <yellow><bold>SKINS</bold></yellow> <dark_gray>»</dark_gray> <red>Du darfst diesen Skin nicht aktivieren!
  no-pickaxe: <yellow><bold>SKINS</bold></yellow> <dark_gray>»</dark_gray> <red>Du musst eine Spitzhacke in der Hand halten.
  skin-activated: <yellow><bold>SKINS</bold></yellow> <dark_gray>»</dark_gray> <gray>Du hast den Skin <#ffdd00>%skin%</#ffdd00> <gray>aktiviert!
  skin-reset: <yellow><bold>SKINS</bold></yellow> <dark_gray>»</dark_gray> <gray>Du hast deinen Skin zurückgesetzt.
sounds:
  click: UI_BUTTON_CLICK
  success: ENTITY_PLAYER_LEVELUP
  info: BLOCK_NOTE_BLOCK_PLING
  error: BLOCK_NOTE_BLOCK_BASS
skins:
  plasma:
    name: <gradient:#00ffff:#008b8b><bold>Plasma-Schub</bold></gradient>
    description:
    - <gray>Dieser Skin verstärkt deine Einnahmen
    - <gray>beim Minen auf allen Hauptwährungen.
    - ' '
    - <gold>Geld <white>1.8x
    - <gold>Token <white>2.2x
    - <gold>Edelsteine <white>1.5x
    custom-model-data: 110
    multipliers:
      money: 1.8
      tokens: 2.2
      gems: 1.5
    permission: pickaxeskins.skin.plasma
skins-gui:
  rows: 4
  title: <gradient:#9b59b6:#8e44ad><bold>SPITZHACKEN-SKINS</bold></gradient>
  filler: BLACK_STAINED_GLASS_PANE
  skins-slots:
  - 12
  - 13
  - 14
  - 21
  - 22
  - 23
  items:
    info-item:
      slot: 4
      name: <light_purple><bold>Information</bold></light_purple>
      material: ENCHANTED_BOOK
      custom_model_data: 0
      lore:
      - ' '
      - <gray>Spitzhacken-Skins geben dir starke Boni,
      - <gray>die während der gesamten Saison aktiv bleiben.
      - ' '
      - <gray>Sieh sie dir <light_purple><bold>unten</bold></light_purple> an.
    reset-skin-item:
      slot: 31
      name: <red><bold>Skin zurücksetzen</bold></red>
      material: BARRIER
      custom_model_data: 0
      lore:
      - ' '
      - <gray>Entfernt deinen aktiven Spitzhacken-Skin
      - <gray>und setzt das Standard-Aussehen zurück.
      - ' '
      - <red>Klicken zum Zurücksetzen</red>
