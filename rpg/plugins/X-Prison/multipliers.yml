# Rank Multipliers settings
rank-multipliers: {}
  #small: #Permission node / LuckPerms group
    #tokens: 1.25 #Currency name + multiplier
    #gems: 1.25
    #money: 1.25
# Should the plugins check for LuckPerms groups instead of Xprison permissions?
