messages:
 multi_received: "<gradient:#FFD700:#FFAA00><bold>MULTIPLIER</bold> <dark_gray>»</dark_gray></gradient> <gray>You've <gradient:#FFD700:#FFAA00><bold>ENABLED</bold></gradient> <gray>%currency% Multiplier x%multiplier% for %time%."
 multi_reset: "<gradient:#FFD700:#FFAA00><bold>MULTIPLIER</bold> <dark_gray>»</dark_gray></gradient> <red>Your %currency% Multiplier was reset."
# Rank Multipliers settings
# Permanente, monotone Multiplier-Leiter (der STAERKSTE passende Key gewinnt, es wird NICHT addiert).
# Werte sind Faktoren: 1.25 = x1.25 (+25%). Stacking: final = base x global x player x rank (multiplikativ).
# Keys werden als Permission xprison.multiplier.<key> geprueft (use-luckperms-groups: false).
# Vergabe der Keys: Prestige P1-P10 -> p1..p10 | Rebirth R1-R5 -> r1..r5 | Ascension (unlimited Prestige) -> asc1..asc6.
# Die Leiter steigt streng monoton (money bestimmt die Staerke) -> jeder Reset/Meilenstein lohnt sich dauerhaft.
rank-multipliers:
  # --- Prestige-Rampe (P1-P10) ---
  p1:
    money: 1.1
    tokens: 1.05
    gems: 1.0
  p2:
    money: 1.2
    tokens: 1.1
    gems: 1.05
  p3:
    money: 1.3
    tokens: 1.15
    gems: 1.1
  p4:
    money: 1.4
    tokens: 1.2
    gems: 1.15
  p5:
    money: 1.5
    tokens: 1.25
    gems: 1.2
  p6:
    money: 1.65
    tokens: 1.3
    gems: 1.25
  p7:
    money: 1.8
    tokens: 1.35
    gems: 1.3
  p8:
    money: 1.95
    tokens: 1.4
    gems: 1.35
  p9:
    money: 2.1
    tokens: 1.45
    gems: 1.4
  p10:
    money: 2.25
    tokens: 1.5
    gems: 1.45
  # --- Rebirth-Spruenge (R1-R5, dauerhaft) ---
  r1:
    money: 3.0
    tokens: 2.0
    gems: 1.8
  r2:
    money: 4.5
    tokens: 2.75
    gems: 2.4
  r3:
    money: 6.5
    tokens: 3.75
    gems: 3.2
  r4:
    money: 9.0
    tokens: 5.0
    gems: 4.2
  r5:
    money: 12.0
    tokens: 6.5
    gems: 5.5
  # --- Ascension-Meilensteine (unlimited Prestige nach R5, endlos bis zum Deckel) ---
  asc1:
    money: 13.5
    tokens: 7.0
    gems: 6.0
  asc2:
    money: 15.5
    tokens: 8.5
    gems: 7.5
  asc3:
    money: 18.0
    tokens: 10.0
    gems: 9.0
  asc4:
    money: 21.0
    tokens: 12.0
    gems: 11.0
  asc5:
    money: 23.5
    tokens: 13.5
    gems: 13.0
  asc6:
    money: 25.0
    tokens: 15.0
    gems: 15.0
# Should the plugins check for LuckPerms groups instead of Xprison permissions?
# false = Keys oben werden als Permission xprison.multiplier.<key> geprueft (keine externen LP-Gruppen noetig).
use-luckperms-groups: false
# Interval for refreshing online players rank mulipliers in seconds
rank-multiplier-update-time: 60
currency-multipliers:
  money:
    global-max: 25.0
    player-max: 25.0
  tokens:
    global-max: 15.0
    player-max: 15.0
  gems:
    global-max: 15.0
    player-max: 15.0

