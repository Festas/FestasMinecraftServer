# Pickaxe Frenzy - doubles all pickaxe XP earned while the event runs.
# NOTE: requires X-Prison 2026.2.9.0+ (the pickaxe XP system) and the Pickaxe Levels module.
id: pickaxe-frenzy
display-name: "<gold>Pickaxe Frenzy"
enabled: true
duration: 1800            # seconds (30 minutes)
weight: 8

bossbar:
  color: YELLOW
  style: SOLID
  title: "<gradient:#f7971e:#ffd200><bold>Pickaxe Frenzy</bold></gradient> <white>(%multiplier%x Pickaxe XP) <gray>(%time%)"

effects:
  - type: PICKAXE_EXP_MULTIPLIER
    multiplier: 2.0
    # Restrict to specific pickaxe XP sources. Empty = every source.
    # Built-in: MANUAL, AREA_ENCHANTS, AUTOMINER, API (addons may add their own)
    sources: []

notifications:
  start:
    title:
      enabled: true
      title: "<gold><bold>PICKAXE FRENZY!"
      subtitle: "<white>Earn <gold>2x Pickaxe XP <white>for 30 minutes"
      fade-in: 1
      stay: 3
      fade-out: 1
    sound:
      enabled: true
      sound: ENTITY_PLAYER_LEVELUP
      volume: 1.0
      pitch: 1.2
    broadcast: "<gold>Pickaxe Frenzy has begun! <white>Earn <gold>2x Pickaxe XP <white>for the next 30 minutes!"
  end:
    title:
      enabled: true
      title: "<gray>Pickaxe Frenzy ended"
      subtitle: ""
      fade-in: 1
      stay: 2
      fade-out: 1
    sound:
      enabled: true
      sound: BLOCK_NOTE_BLOCK_BASS
      volume: 1.0
      pitch: 1.0
    broadcast: "<gray>Pickaxe Frenzy has ended. Thanks for playing!"
