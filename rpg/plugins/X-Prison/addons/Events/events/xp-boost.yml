# XP Boost - doubles Battle Pass XP (from quests, daily rewards, mining, ...).
# NOTE: requires the Battle Pass module to be enabled in X-Prison.
id: xp-boost
display-name: "<green>XP Boost"
enabled: true
duration: 1800            # seconds (30 minutes)
weight: 8

bossbar:
  color: GREEN
  style: SOLID
  title: "<gradient:#11998e:#38ef7d><bold>XP Boost</bold></gradient> <white>(%multiplier%x Battle Pass XP) <gray>(%time%)"

effects:
  - type: XP_MULTIPLIER
    multiplier: 2.0
    # Restrict to specific Battle Pass XP sources. Empty = every source.
    # Valid: QUEST, DAILY_REWARD, MINING, PRESTIGE, REBIRTH, ADMIN, OTHER
    sources: []

notifications:
  start:
    title:
      enabled: true
      title: "<green><bold>XP BOOST!"
      subtitle: "<white>Earn <green>2x Battle Pass XP <white>for 30 minutes"
      fade-in: 1
      stay: 3
      fade-out: 1
    sound:
      enabled: true
      sound: ENTITY_PLAYER_LEVELUP
      volume: 1.0
      pitch: 0.8
    broadcast: "<green>XP Boost has begun! <white>Earn <green>2x Battle Pass XP <white>for the next 30 minutes!"
  end:
    title:
      enabled: true
      title: "<gray>XP Boost ended"
      subtitle: ""
      fade-in: 1
      stay: 2
      fade-out: 1
    sound:
      enabled: true
      sound: BLOCK_NOTE_BLOCK_BASS
      volume: 1.0
      pitch: 1.0
    broadcast: "<gray>XP Boost has ended. Thanks for playing!"
