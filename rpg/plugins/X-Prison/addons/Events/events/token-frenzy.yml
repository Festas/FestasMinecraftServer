# Token Frenzy - double tokens from mining.
id: token-frenzy
display-name: "<light_purple>Token Frenzy"
enabled: true
duration: 1800            # seconds (30 minutes)
weight: 10

bossbar:
  color: PINK
  style: SOLID
  title: "<gradient:#da22ff:#9733ee><bold>Token Frenzy</bold></gradient> <white>(%multiplier%x Tokens) <gray>(%time%)"

effects:
  - type: CURRENCY_MULTIPLIER
    currency: tokens
    multiplier: 2.0
    apply-to-causes: [MINING, MINING_OTHERS]

notifications:
  start:
    title:
      enabled: true
      title: "<light_purple><bold>TOKEN FRENZY!"
      subtitle: "<white>Earn <light_purple>2x Tokens <white>for 30 minutes"
      fade-in: 1
      stay: 3
      fade-out: 1
    sound:
      enabled: true
      sound: ENTITY_PLAYER_LEVELUP
      volume: 1.0
      pitch: 1.2
    broadcast: "<light_purple>Token Frenzy has begun! <white>Earn <light_purple>2x Tokens <white>for the next 30 minutes!"
  end:
    title:
      enabled: true
      title: "<gray>Token Frenzy ended"
      subtitle: ""
      fade-in: 1
      stay: 2
      fade-out: 1
    sound:
      enabled: true
      sound: BLOCK_NOTE_BLOCK_BASS
      volume: 1.0
      pitch: 1.0
    broadcast: "<gray>Token Frenzy has ended. Thanks for playing!"
