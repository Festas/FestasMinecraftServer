messages:
  no_permission: <red><bold>(!)</bold> <white>Dafür hast du keine Berechtigung!
  rank_up: <gradient:#FFD700:#FFEA00><bold>RANGUP</bold> <dark_gray>»</dark_gray></gradient> <white>Glückwunsch! Du bist von <yellow>%Rank-1%</yellow> <white>zu <yellow>%Rank-2%</yellow> <white>aufgestiegen.
  not_enough_currency: <gradient:#FFD700:#FFEA00><bold>RANGUP</bold> <dark_gray>»</dark_gray></gradient> <white>Dir fehlen <yellow>%cost% %currency%</yellow> <white>für den nächsten Rang.
  prestige_needed: <gradient:#FFD700:#FFEA00><bold>RANGUP</bold> <dark_gray>»</dark_gray></gradient> <white>Du hast den letzten Rang erreicht – nutze <yellow>/prestige</yellow>.
  rank_set: <gradient:#FFD700:#FFEA00><bold>RANGUP</bold> <dark_gray>»</dark_gray></gradient> <white>Der Rang von <yellow>%player%</yellow> <white>wurde auf <yellow>%rank%</yellow> gesetzt.
progress-bar-delimiter: ':'
progress-bar-length: 20
currency: money
auto-rank-up: false
auto-rank-up-interval: 2
rankup-title:
  enabled: true
  title: '&6&lRANGUP'
  subtitle: '&aNeuer Rang: &e%rank%'
  fade-in: 1
  stay: 3
  fade-out: 1
rankup-sound:
  enabled: true
  sound: UI_TOAST_CHALLENGE_COMPLETE
  volume: 1.0
  pitch: 1.0
Ranks:
  '1':
    Prefix: <green><bold>A</bold></green>
    Cost: 0
    CMD: []
  '2':
    Prefix: <green><bold>B</bold></green>
    Cost: 5000
    CMD:
    - tokens give %player% 250
  '3':
    Prefix: <yellow><bold>C</bold></yellow>
    Cost: 15000
    CMD:
    - tokens give %player% 500
  '4':
    Prefix: <gold><bold>D</bold></gold>
    Cost: 50000
    CMD:
    - tokens give %player% 1000
  '5':
    Prefix: <red><bold>E</bold></red>
    Cost: 125000
    CMD:
    - tokens give %player% 2000
    - gems give %player% 5
  '6':
    Prefix: <red><bold>F</bold></red>
    Cost: 300000
    CMD:
    - tokens give %player% 3500
    - gems give %player% 10
  '7':
    Prefix: <light_purple><bold>G</bold></light_purple>
    Cost: 750000
    CMD:
    - tokens give %player% 6000
    - gems give %player% 15
  '8':
    Prefix: <blue><bold>H</bold></blue>
    Cost: 1800000
    CMD:
    - tokens give %player% 10000
    - gems give %player% 20
  '9':
    Prefix: <aqua><bold>I</bold></aqua>
    Cost: 4500000
    CMD:
    - tokens give %player% 15000
    - gems give %player% 35
  '10':
    Prefix: <gradient:#f7971e:#ffd200><bold>J</bold></gradient>
    Cost: 10000000
    CMD:
    - tokens give %player% 25000
    - gems give %player% 50
    - money give %player% 250000
gui:
  title: <gradient:#FFD700:#FFA500><bold>RÄNGE</bold></gradient>
  rows: 6
  filler: BLACK_STAINED_GLASS_PANE
  rank-slots:
  - 10
  - 11
  - 12
  - 13
  - 14
  - 15
  - 16
  - 19
  - 20
  - 21
  - 22
  - 23
  - 24
  - 25
  - 28
  - 29
  - 30
  - 31
  - 32
  - 33
  - 34
  rank:
    owned:
      material: LIME_STAINED_GLASS_PANE
      glow: false
      name: '%prefix% <dark_gray>(<green>Freigeschaltet</green>)'
      lore:
      - <gray>Rang <white>#%id%
      - <green>✔ Diesen Rang besitzt du bereits.
    current:
      material: NETHER_STAR
      glow: true
      name: '%prefix% <dark_gray>(<yellow>Dein Rang</yellow>)'
      lore:
      - <gray>Rang <white>#%id%
      - <yellow>➤ Das ist dein aktueller Rang.
    next:
      material: GOLD_INGOT
      glow: false
      name: '%prefix% <dark_gray>(<gold>Nächster Rang</gold>)'
      lore:
      - <gray>Rang <white>#%id%
      - '<gray>Kosten: <gold>%cost% <gray>%currency%'
      - ' '
      - <yellow>Klicke zum Aufsteigen!
    locked:
      material: RED_STAINED_GLASS_PANE
      glow: false
      name: '%prefix% <dark_gray>(<red>Gesperrt</red>)'
      lore:
      - <gray>Rang <white>#%id%
      - '<gray>Kosten: <gold>%cost% <gray>%currency%'
      - <red>🔒 Rangaufstieg zum Freischalten nötig.
  items:
    info:
      slot: 4
      material: BOOK
      name: <yellow><bold>Ränge</bold></yellow>
      lore:
      - <gray>Steige auf, um bessere Minen,
      - <gray>mehr Belohnungen und neue Ziele
      - <gray>freizuschalten.
      - ' '
      - <gray>Nutze <yellow>/rankup <gray>oder klicke
      - <gray>auf den nächsten Rang.
    close:
      slot: 49
      material: BARRIER
      name: <red><bold>Schließen</bold></red>
      lore: []
    prev-page:
      slot: 48
      material: ARROW
      name: <yellow>« Vorherige Seite</yellow>
      lore: []
    next-page:
      slot: 50
      material: ARROW
      name: <yellow>Nächste Seite »</yellow>
      lore: []
