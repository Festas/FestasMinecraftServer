# What words should not a gang name contain
restricted-names:
  - shit
# Command aliases for /gangs command
gangs-command-aliases:
  - gang
  - gangs

# ---------------------------------------------------------------------------
# Gangs GUIs. All of the menus below are fully configurable.
#  - panel:    the main /gang panel (buttons are only shown if the player has
#              permission, regardless of being configured here).
#  - members:  the "Manage Members" list (right-click a head to kick).
#  - invites:  the "Pending Invites" list (right-click a head to cancel).
#  - disband:  the disband confirmation (player + admin).
# Placeholders:
#  panel info item: %gang%, %owner%, %members%, %value%, %top%
#  member item:     %player%, %status%, %status_color%, %role%
#  invite item:     %player%, %status%, %status_color%, %inviter%, %date%
# ---------------------------------------------------------------------------
gui:
  panel:
    title: 'Gang Panel'
    rows: 3
    filler: BLACK_STAINED_GLASS_PANE
    items:
      info:
        slot: 11
        material: BOOK
        name: '<yellow>Gang Info'
        lore:
          - ' '
          - '<dark_gray>» <yellow>%gang% <gray>Gang'
          - '<dark_gray>» <gray>Owner: <yellow>%owner%'
          - '<dark_gray>» <gray>Members: <yellow>%members%'
          - '<dark_gray>» <gray>Value: <yellow>%value%'
          - '<dark_gray>» <gray>Top Placement: <yellow>%top%'
          - ' '
      rename:
        slot: 12
        material: OAK_SIGN
        name: '<yellow>Rename Gang'
        lore:
          - '<gray>Click to rename your gang.'
      members:
        slot: 13
        material: PLAYER_HEAD
        name: '<yellow>Manage Members'
        lore:
          - '<gray>Click to manage your gang members.'
      invites:
        slot: 14
        material: PLAYER_HEAD
        name: '<yellow>Manage Invites'
        lore:
          - '<gray>Click to manage pending invites.'
      disband:
        slot: 15
        material: BARRIER
        name: '<red>Disband Gang'
        lore:
          - '<gray>Click to disband your gang.'
  members:
    title: 'Gang Members'
    rows: 6
    filler: BLACK_STAINED_GLASS_PANE
    slots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34, 37, 38, 39, 40, 41, 42, 43]
    member-item:
      material: PLAYER_HEAD
      name: '%status_color%%player%'
      lore:
        - ' '
        - '<dark_gray>» <gray>Online Status: %status_color%%status%'
        - '<dark_gray>» <gray>Role: <yellow>%role%'
        - ' '
        - '<gray>Right-Click to <red>KICK'
  invites:
    title: 'Pending Invites'
    rows: 6
    filler: BLACK_STAINED_GLASS_PANE
    slots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34, 37, 38, 39, 40, 41, 42, 43]
    invite-item:
      material: PLAYER_HEAD
      name: '%status_color%%player%'
      lore:
        - ' '
        - '<dark_gray>» <gray>Online Status: %status_color%%status%'
        - '<dark_gray>» <gray>Invited By: <yellow>%inviter%'
        - '<dark_gray>» <gray>Invited At: <yellow>%date%'
        - ' '
        - '<gray>Right-Click to <red>Cancel'
  disband:
    title: 'Disband your gang?'
    rows: 6
    filler: BLACK_STAINED_GLASS_PANE
    info:
      slot: 13
      material: BOOK
      name: '<red><bold>Disband Gang'
      lore:
        - '<red><bold>WARNING!'
        - '<gray>This action cannot be undone.'
    confirm:
      slots: [19, 20, 21, 28, 29, 30, 37, 38, 39]
      material: LIME_STAINED_GLASS_PANE
      name: '<green><bold>YES'
      lore: []
    cancel:
      slots: [23, 24, 25, 32, 33, 34, 41, 42, 43]
      material: RED_STAINED_GLASS_PANE
      name: '<red><bold>NO'
      lore: []