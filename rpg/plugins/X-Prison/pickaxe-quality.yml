main-command-aliases:
- pickaxequality
- pquality
- pq
apply-to:
  currencies: true
  pickaxe-exp: true
  battlepass-xp: true
base-tier-display-name: <gray>Stufe 0</gray>
tier-formula:
  max-tier: 10
  cost-currency: tokens
  cost: 25000 * pow(2.35, tier - 1)
  display-name: <gradient:#00E5FF:#00838F><bold>Qualität %tier%</bold></gradient>
  multipliers:
    tokens: 1 + 0.08 * tier
    gems: 1 + 0.08 * tier
    money: 1 + 0.08 * tier
  pickaxe-exp-multiplier: 1 + 0.04 * tier
  battlepass-xp-multiplier: 1 + 0.04 * tier
tiers:
  '10':
    rewards:
    - broadcast &b%player% &7hat die maximale Spitzhacken-Qualität erreicht!
quality_menu:
  title: <gradient:#00E5FF:#00838F>Spitzhacken-Qualität</gradient>
  lines: 5
  empty_slots: GRAY_STAINED_GLASS_PANE
  multiplier-line: ' <italic:false><aqua>▎</aqua> <white>%currency%: </white><aqua>x%multiplier%</aqua>'
  no-multipliers-lore:
  - ' <italic:false><gray>Noch keine Boni.</gray>'
  decorations:
    border:
      material: CYAN_STAINED_GLASS_PANE
      name: ' '
      slots:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      - 8
      - 36
      - 37
      - 38
      - 39
      - 40
      - 41
      - 42
      - 43
      - 44
  pickaxe_item:
    enabled: true
    slot: 20
  display:
    enabled: true
    slot: 22
    material: NETHER_STAR
    custom_model_data: 0
    glow: true
    name: <gradient:#00E5FF:#00838F><bold>Spitzhacken-Qualität</bold></gradient>
    lore:
    - ' '
    - <italic:false><gray>Die Qualität deiner Spitzhacke gibt dir</gray>
    - <italic:false><gray>dauerhafte Multiplikatoren beim Minen.</gray>
    - ' '
    - '<italic:false><white>Aktuell: </white>%tier_name% <dark_gray>(%tier%/%max_tier%)</dark_gray>'
    - '%multipliers%'
    - ' '
    - '<italic:false><white>Dein Guthaben: </white><aqua>%balance%</aqua>'
  upgrade_buttons:
    one:
      enabled: true
      slot: 24
      amount: 1
      material: LIME_DYE
      custom_model_data: 0
      name: <green><bold>VERBESSERN</bold></green>
      lore:
      - ' '
      - '<italic:false><white>Nächste Stufe: </white>%next_tier_name%'
      - '%next_multipliers%'
      - ' '
      - '<italic:false><white>Preis: </white><aqua>%cost% %currency%</aqua>'
      - ' '
      - <italic:false><gray><italic>(( Klicke zum Verbessern ))</italic></gray>
    max:
      enabled: false
      slot: 25
      amount: max
      material: EMERALD_BLOCK
      custom_model_data: 0
      name: <green><bold>MAXIMAL VERBESSERN</bold></green>
      lore:
      - ' '
      - '<italic:false><white>Bezahlbare Stufen: </white><aqua>%amount%</aqua>'
      - '<italic:false><white>Gesamtpreis: </white><aqua>%cost% %currency%</aqua>'
      - ' '
      - <italic:false><gray><italic>(( Klicke für die maximale Verbesserung ))</italic></gray>
  maxed_item:
    enabled: true
    slot: 24
    material: NETHER_STAR
    custom_model_data: 0
    glow: true
    name: <green><bold>QUALITÄT MAXIMAL</bold></green>
    lore:
    - ' '
    - <italic:false><gray>Deine Spitzhacken-Qualität ist</gray>
    - '<italic:false><gray>bereits am Maximum: </gray>%tier_name%<gray>.</gray>'
    - '%multipliers%'
  back_item:
    enabled: true
    slot: 40
    material: ARROW
    custom_model_data: 0
    name: <red><bold>ZURÜCK</bold></red>
    lore:
    - <italic:false><gray>Zurück zum Spitzhacken-Menü.</gray>
messages:
  upgraded: <gradient:#00E5FF:#00838F><bold>QUALITÄT</bold></gradient> <dark_gray>»</dark_gray> <white>Deine Spitzhacke ist jetzt <aqua>%tier_name%</aqua><white>!
  already-max: <gradient:#00E5FF:#00838F><bold>QUALITÄT</bold></gradient> <dark_gray>»</dark_gray> <white>Deine Spitzhacke hat bereits die höchste Qualitätsstufe.
  not-enough-currency: <gradient:#00E5FF:#00838F><bold>QUALITÄT</bold></gradient> <dark_gray>»</dark_gray> <red>Du kannst dir die nächste Qualitätsstufe nicht leisten.
