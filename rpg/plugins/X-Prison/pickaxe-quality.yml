  player-not-online: <gradient:#00E5FF:#00838F><bold>QUALITÄT</bold></gradient> <dark_gray>»</dark_gray> <red>Der Spieler <white>%player%</white> <red>ist nicht online.
  invalid-tier: <gradient:#00E5FF:#00838F><bold>QUALITÄT</bold></gradient> <dark_gray>»</dark_gray> <red>Die Qualitätsstufe <white>%tier%</white> existiert nicht.
  admin-usage: '<gradient:#00E5FF:#00838F><bold>QUALITÄT</bold></gradient> <dark_gray>»</dark_gray> <gray>Nutzung: <white>/pickaxequality set <spieler> <stufe></white>'
  admin-set: <gradient:#00E5FF:#00838F><bold>QUALITÄT</bold></gradient> <dark_gray>»</dark_gray> <white>Die Spitzhacken-Qualität von <aqua>%player%</aqua> <white>wurde auf <aqua>Stufe %tier%</aqua> gesetzt.
