# Zone Dungeons - RPG Server Dungeon-Konfiguration
# 9 Zonen-Dungeons mit Normal/Schwer/Mythisch Schwierigkeitsgraden
#
# Jede Zone hat einen eigenen Dungeon, der zur Hauptquest passt.
# Dungeons werden nach Abschluss des jeweiligen Zonen-Kapitels freigeschaltet.

