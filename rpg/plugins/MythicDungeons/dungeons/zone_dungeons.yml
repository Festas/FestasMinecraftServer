  # Freigeschaltet nach: Kapitel 1 (Das Erwachen)
  # ============================================================================
  duesterwall_katakomben:
    display-name: "&8⚔ Die Verlorenen Katakomben"
    zone: duesterwall
    required-quest: "kapitel1_complete"
    min-level: 10
    min-players: 2
    max-players: 4
    difficulties:
      normal:
        display-name: "&aNormal"
        mob-health: 1.0
        mob-damage: 1.0
        mob-amount: 1.0
        bonus-mythic-levels: 0
        time-limit: 900
        player-lives: 3
        rewards:
          experience: 300
          gold: 500
          loot-table: "duesterwall_normal"
      hard:
        display-name: "&cSchwer"
        mob-health: 1.5
        mob-damage: 1.3
        mob-amount: 1.2
        bonus-mythic-levels: 2
        time-limit: 1200
        player-lives: 2
        rewards:
          experience: 600
          gold: 1000
          loot-table: "duesterwall_hard"
      mythic:
        display-name: "&5Mythisch"
        mob-health: 2.5
        mob-damage: 1.8
        mob-amount: 1.5
        bonus-mythic-levels: 5
        time-limit: 1500
        player-lives: 1
        rewards:
          experience: 1200
          gold: 2500
          loot-table: "duesterwall_mythic"
    mobs:
